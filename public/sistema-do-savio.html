/* --- Eventos --------------------------------------------------------------- */

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  const btAjudaAba = app.querySelector('#btAjudaAba');
  if(btAjudaAba) btAjudaAba.onclick = () => { estado.mostrarAjuda = !estado.mostrarAjuda; render(); };

  // Ajuste rápido de PV/PE/Sanidade (decisão #117) — stepper de correção,
  // dano/gasto e cura/recuperação que calculam o total sozinhos, e Descanso
  // Curto/Longo. MAXIMOS_RECURSO mapeia cada chave pra sua função de teto;
  // "não diminui, só sobe até o alvo" no Descanso usa Math.max com o valor
  // atual, pra nunca curar pra baixo quem já está acima do alvo.
  const MAXIMOS_RECURSO = {pv: pvMaximo, pe: peMaximo, sanidade: sanidadeMaxima};
  app.querySelectorAll('[data-recurso-ajuste]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [chave, delta] = b.dataset.recursoAjuste.split('|');
      const max = MAXIMOS_RECURSO[chave](p);
      p.atual[chave] = Math.max(0, Math.min(max, (p.atual[chave] ?? max) + Number(delta)));
    }));
  app.querySelectorAll('[data-recurso-perda]').forEach(b =>
    b.onclick = () => mudar(p => {
      const chave = b.dataset.recursoPerda;
      const max = MAXIMOS_RECURSO[chave](p);
      const perda = Math.max(0, Number(app.querySelector(`#c-perda-${chave}`).value) || 0);
      p.atual[chave] = Math.max(0, (p.atual[chave] ?? max) - perda);
    }));
  app.querySelectorAll('[data-recurso-ganho]').forEach(b =>
    b.onclick = () => mudar(p => {
      const chave = b.dataset.recursoGanho;
      const max = MAXIMOS_RECURSO[chave](p);
      const ganho = Math.max(0, Number(app.querySelector(`#c-ganho-${chave}`).value) || 0);
      p.atual[chave] = Math.min(max, (p.atual[chave] ?? max) + ganho);
    }));
  const btDescansoCurto = app.querySelector('#btDescansoCurto');
  if(btDescansoCurto) btDescansoCurto.onclick = () => mudar(p => {
    Object.entries(MAXIMOS_RECURSO).forEach(([chave, fnMax]) => {
      const max = fnMax(p);
      p.atual[chave] = Math.max(p.atual[chave] ?? max, Math.ceil(max * 0.5));
    });
  });
  const btDescansoLongo = app.querySelector('#btDescansoLongo');
  if(btDescansoLongo) btDescansoLongo.onclick = () => mudar(p => {
    Object.entries(MAXIMOS_RECURSO).forEach(([chave, fnMax]) => { p.atual[chave] = fnMax(p); });
  });

  const btGuiadoProximo = app.querySelector('#btGuiadoProximo');
  if(btGuiadoProximo) btGuiadoProximo.onclick = () => { estado.passoGuiado += 1; render(); };
  const btGuiadoAnterior = app.querySelector('#btGuiadoAnterior');
  if(btGuiadoAnterior) btGuiadoAnterior.onclick = () => { estado.passoGuiado -= 1; render(); };
  const btGuiadoConcluir = app.querySelector('#btGuiadoConcluir');
  if(btGuiadoConcluir) btGuiadoConcluir.onclick = () => {
    estado.modoGuiado = false;
    estado.aba = 'perfil';
    render();
  };

  const btnLevelUp = document.getElementById('btnLevelUp');
  if(btnLevelUp) btnLevelUp.onclick = () => {
    const p = atual(); if(!p) return;
    if(MODO_HUB && !estado.ehDono) return;
    subirNivel(p);
    p.atualizadoEm = Date.now();
    salvar(); render();
  };
  const btFecharResumoNivel = document.getElementById('btFecharResumoNivel');
  if(btFecharResumoNivel) btFecharResumoNivel.onclick = () => { estado.nivelUpResumo = null; render(); };

  const temaCorInput = app.querySelector('[data-tema-cor]');
  if(temaCorInput) temaCorInput.onchange = () => mudar(p => p.temaCor = temaCorInput.value);
  app.querySelectorAll('[data-tema-preset]').forEach(b =>
    b.onclick = () => mudar(p => p.temaCor = b.dataset.temaPreset));

  app.querySelectorAll('[data-perfil]').forEach(el =>
    (el.tagName==='TEXTAREA' ? el.oninput = () => mudarSemRedesenhar(p => p.perfil ? p.perfil[el.dataset.perfil]!==undefined ? (p.perfil[el.dataset.perfil]=el.value) : (p[el.dataset.perfil]=el.value) : null, el)
      : el.oninput = () => mudarSemRedesenhar(p => {
          if(el.dataset.perfil in p.perfil) p.perfil[el.dataset.perfil] = el.value;
          else p[el.dataset.perfil] = el.value;
        }, el)));

  app.querySelectorAll('[data-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.num] = Number(el.value) || 0, el));

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Math.max(0, Math.min(atributoCap(p), Number(el.value) || 0))));

  app.querySelectorAll('[data-especializacao]').forEach(el =>
    el.onchange = () => mudar(p => p.especializacaoId = el.dataset.especializacao));

  app.querySelectorAll('[data-pericia]').forEach(el =>
    el.onchange = () => mudar(p => p.pericias[el.dataset.pericia] = el.checked));
  app.querySelectorAll('[data-oficio]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.oficios[el.dataset.oficio] = el.value, el));
  const lutaAtributo = app.querySelector('[data-luta-atributo]');
  if(lutaAtributo) lutaAtributo.onchange = () => mudar(p => p.lutaAtributo = lutaAtributo.value);

  app.querySelectorAll('[data-arma]').forEach(el =>
    el[el.tagName==='SELECT'?'onchange':'oninput'] = () => {
      const mutador = p => p.arma[el.dataset.arma] = el.value;
      el.tagName==='SELECT' ? mudar(mutador) : mudarSemRedesenhar(mutador, el);
    });
  const armaNome = document.getElementById('c-arma-nome');
  if(armaNome) armaNome.oninput = () => mudarSemRedesenhar(p => p.arma.nome = armaNome.value, armaNome);

  app.querySelectorAll('[data-check]').forEach(el =>
    el.onchange = () => mudar(p => p[el.dataset.check] = el.checked));

  // Ascensão
  app.querySelectorAll('[data-asc-check]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.ascensao[el.dataset.ascCheck] = el.checked;
      // Desligar a Primeira Ascensão sem querer não pode deixar a Segunda
      // (e a Imersão que ela libera) num estado impossível.
      if(el.dataset.ascCheck === 'primeira' && !el.checked) p.ascensao.segunda = false;
    }));
  app.querySelectorAll('[data-asc-arquetipo]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.ascensao.arquetipoId = el.dataset.ascArquetipo;
      p.ascensao.bonusAtributo1 = '';
      p.ascensao.bonusAtributo2 = '';
    }));
  app.querySelectorAll('[data-asc-bonus]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.ascensao['bonusAtributo' + el.dataset.ascBonus] = el.value;
    }));
  const ascHabAscendidas = document.getElementById('c-asc-habascendidas');
  if(ascHabAscendidas) ascHabAscendidas.onchange = () => mudar(p => p.ascensao.habilidadesAscendidas = Math.max(0, Number(ascHabAscendidas.value) || 0));

  // Imersão Espiritual
  app.querySelectorAll('[data-ime-check]').forEach(el =>
    el.onchange = () => mudar(p => p.imersao[el.dataset.imeCheck] = el.checked));
  app.querySelectorAll('[data-ime-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.imersao[el.dataset.imeCampo] = el.value, el));
  app.querySelectorAll('[data-ime-select]').forEach(el =>
    el.onchange = () => mudar(p => p.imersao[el.dataset.imeSelect] = el.value));
  const imeTiers = document.getElementById('c-ime-tiers');
  if(imeTiers) imeTiers.onchange = () => mudar(p => p.imersao.tiers = Math.max(-3, Math.min(3, Number(imeTiers.value) || 0)));

  // Habilidades
  app.querySelectorAll('[data-hab-campo]:not(select)').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.habCampo.split('|');
      p.habilidades[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-hab-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.habNum.split('|');
      p.habilidades[Number(i)][chave] = Number(el.value) || 0;
    }, el));
  // Tipo usa onchange (redesenha a tela inteira) — o texto de "sobre", o
  // custo padrão e o aviso de Sustentada (sem Dano/Cura, +2 de Nível
  // efetivo) dependem do Tipo escolhido.
  app.querySelectorAll('select[data-hab-campo]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.habCampo.split('|');
      p.habilidades[Number(i)][chave] = el.value;
    }));
  // Nível usa onchange (redesenha a tela inteira) e não oninput — o texto de
  // "custo padrão" logo abaixo depende do Nível, e mudarSemRedesenhar() não
  // redesenha nada (existe pra não perder o foco de campo de texto).
  app.querySelectorAll('[data-hab-nivel]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.habilidades[Number(el.dataset.habNivel)].nivel = Math.max(1, Math.min(5, Number(el.value) || 1));
    }));
  app.querySelectorAll('[data-hab-flag]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.habFlag.split('|');
      p.habilidades[Number(i)][chave] = el.checked;
    }));
  // Efeitos usam onchange (redesenha a tela) porque o bônus calculado
  // logo abaixo depende de quais estão marcados agora.
  app.querySelectorAll('[data-hab-efeito]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.habEfeito.split('|');
      const h = p.habilidades[Number(i)];
      if(!h.efeitos) h.efeitos = {};
      h.efeitos[chave] = el.checked;
    }));
  app.querySelectorAll('[data-hab-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.habilidades.splice(Number(b.dataset.habRemover), 1)));
  const addHab = document.getElementById('btAddHabilidade');
  if(addHab) addHab.onclick = () => mudar(p => p.habilidades.push({nome:'', nivel:1, tipo:'imediata', custoPe:CUSTO_PE_HABILIDADE[1], efeito:'', efeitos:{}, ascendida:false, habilidadeMaxima:false, reacao:false, ativa:false, duracaoRestante:null}));
  app.querySelectorAll('[data-hab-ativar]').forEach(b =>
    b.onclick = () => mudar(p => ativarHabilidade(p, p.habilidades[Number(b.dataset.habAtivar)])));
  const btnPassarRound = document.getElementById('btnPassarRound');
  if(btnPassarRound) btnPassarRound.onclick = () => mudar(p => passarRound(p));

  // Invocações
  app.querySelectorAll('[data-inv-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.invCampo.split('|');
      p.invocacoes[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-inv-nivel]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.invocacoes[Number(el.dataset.invNivel)].nivel = Math.max(1, Math.min(5, Number(el.value) || 1));
    }));
  app.querySelectorAll('[data-inv-num]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.invNum.split('|');
      p.invocacoes[Number(i)][chave] = Math.max(1, Number(el.value) || 1);
    }));
  app.querySelectorAll('[data-inv-atributo]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, atrId] = el.dataset.invAtributo.split('|');
      p.invocacoes[Number(i)].atributos[atrId] = Math.max(0, Number(el.value) || 0);
    }));
  app.querySelectorAll('[data-inv-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.invocacoes.splice(Number(b.dataset.invRemover), 1)));
  const addInv = document.getElementById('btAddInvocacao');
  if(addInv) addInv.onclick = () => mudar(p => p.invocacoes.push({
    id: uid(), nome:'', nivel:1, enxameCopias:1,
    atributos:{forca:0,destreza:0,constituicao:0,inteligencia:0,sabedoria:0,carisma:0},
    periciasTreinadas: [], notas:'',
  }));
  app.querySelectorAll('[data-invper-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [invIndex, perIndex] = el.dataset.invperCampo.split('|');
      p.invocacoes[Number(invIndex)].periciasTreinadas[Number(perIndex)].nome = el.value;
    }, el));
  app.querySelectorAll('[data-invper-remover]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [invIndex, perIndex] = b.dataset.invperRemover.split('|');
      p.invocacoes[Number(invIndex)].periciasTreinadas.splice(Number(perIndex), 1);
    }));
  app.querySelectorAll('[data-invper-add]').forEach(b =>
    b.onclick = () => mudar(p => p.invocacoes[Number(b.dataset.invperAdd)].periciasTreinadas.push({nome:''})));

  // Elemental
  app.querySelectorAll('[data-ele-check]').forEach(el =>
    el.onchange = () => mudar(p => p.elemental[el.dataset.eleCheck] = el.checked));
  app.querySelectorAll('[data-ele-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.elemental[el.dataset.eleCampo] = el.value, el));
  app.querySelectorAll('[data-ele-select]').forEach(el =>
    el.onchange = () => mudar(p => p.elemental[el.dataset.eleSelect] = el.value));
  app.querySelectorAll('[data-ele-num]').forEach(el =>
    el.onchange = () => mudar(p => p.elemental[el.dataset.eleNum] = Math.max(0, Number(el.value) || 0)));
  app.querySelectorAll('[data-ele-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.elemental.atributos[el.dataset.eleAtributo] = Math.max(0, Math.min(10, Number(el.value) || 0))));
  app.querySelectorAll('[data-ele-pericia]').forEach(el =>
    el.onchange = () => mudar(p => p.elemental.pericias[el.dataset.elePericia] = el.checked));
  app.querySelectorAll('[data-ele-oficio]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      if(!p.elemental.oficios) p.elemental.oficios = {};
      p.elemental.oficios[el.dataset.eleOficio] = el.value;
    }, el));
  const eleLutaAtributo = app.querySelector('[data-ele-luta-atributo]');
  if(eleLutaAtributo) eleLutaAtributo.onchange = () => mudar(p => p.elemental.lutaAtributo = eleLutaAtributo.value);

  // Passivas
  app.querySelectorAll('[data-pas-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.pasCampo.split('|');
      p.passivas[Number(i)][chave] = el.value;
    }, el));
  // Nível interno usa onchange (redesenha a tela) — o bônus calculado
  // logo abaixo depende dele, e mudarSemRedesenhar() não redesenha nada.
  app.querySelectorAll('[data-pas-num]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.pasNum.split('|');
      p.passivas[Number(i)][chave] = Math.max(0, Math.min(2, Number(el.value) || 0));
    }));
  app.querySelectorAll('[data-pas-efeito]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.pasEfeito.split('|');
      const h = p.passivas[Number(i)];
      if(!h.efeitos) h.efeitos = {};
      h.efeitos[chave] = el.checked;
    }));
  app.querySelectorAll('[data-pas-select]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.pasSelect.split('|');
      p.passivas[Number(i)][chave] = el.value;
    }));
  app.querySelectorAll('[data-pas-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.passivas.splice(Number(b.dataset.pasRemover), 1)));
  const addPas = document.getElementById('btAddPassiva');
  if(addPas) addPas.onclick = () => mudar(p => p.passivas.push({nome:'', nivelInterno:0, efeito:'', efeitos:{}, periciaAlvo:''}));
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('chkCompartilhar').onchange = e => {
  alternarCompartilhado(e.target.checked);
};

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value;
  estado.modoGuiado = false;
  estado.nivelUpResumo = null;
  render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'perfil';
  estado.modoGuiado = true;
  estado.passoGuiado = 1;
  estado.nivelUpResumo = null;
  salvar(); render();
};

document.getElementById('btModoGuiado').onclick = () => {
  estado.modoGuiado = !estado.modoGuiado;
  estado.passoGuiado = 1;
  render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  estado.modoGuiado = false;
  estado.nivelUpResumo = null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      if(MODO_HUB){
        lido.id = MODO_HUB;
        estado.fichas = [lido];
        estado.atualId = MODO_HUB;
      }else{
        lido.id = uid();
        estado.fichas.push(lido);
        estado.atualId = lido.id;
      }
      estado.modoGuiado = false;
      estado.nivelUpResumo = null;
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

montarPainelAparencia();
render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
