<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Sistema do Sávio</title>
<style>
/* Mesma paleta-base do Hub RPG, com destaque em violeta pra diferenciar
   visualmente este sistema dos outros três (âmbar). */
:root{
  /* --fundo/--superficie/--superficie-alta/--borda/--roxo/--roxo-forte/
     --roxo-rgb são a cor de tema — trocadas em tempo real por
     aplicarTema(), a partir da escolha livre ou de um preset (aba
     Perfil). Os valores abaixo são só o ponto de partida (tema Violeta),
     usados até o JS rodar pela primeira vez. --roxo-rgb existe pra dar
     transparência (rgba) numa cor que muda: não dá pra fazer isso com
     var(--roxo) sozinho. --texto/--suave ficam sempre neutros (não
     seguem o tema), pra garantir contraste com qualquer cor escolhida. */
  --fundo:#0a0910; --superficie:#131022; --superficie-alta:#1c1830;
  --borda:#2c2547; --texto:#f0eef8; --suave:#a099bd;
  --roxo:#8b6ee0; --roxo-forte:#ac93f5; --roxo-rgb:139,110,224;
  --alerta:#c4506b;
  --verde:#4c8c5b; --laranja:#c97a2e; --vermelho:#c4506b;
  /* Fonte de título (decisão #116) — trocada por aplicarFonteTitulo(), preferência de navegador (não do personagem, igual a escala de fonte). */
  --fonte-titulo:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  transition:background-color .25s ease, color .25s ease;
}
h1,h2,h3{font-family:var(--fonte-titulo); font-weight:600; margin:0}
a{color:var(--roxo-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
  transition:background-color .25s ease, border-color .25s ease;
}
.marca{font-family:var(--fonte-titulo); font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--roxo)}
.cresce{flex:1}

/* Indicador de salvamento — atualizado direto no DOM (mostrarStatusSalvo),
   sem passar por render(), pra não interromper quem está digitando. */
.status-salvo{font-size:12px; color:var(--suave); transition:color .2s ease; white-space:nowrap}
.status-salvo.salvando{color:var(--roxo-forte)}
.status-salvo.ok{color:var(--verde)}
.status-salvo.erro{color:var(--alerta); font-weight:600}

/* Painel de Aparência (tema + tamanho de fonte) — fica FORA de #app de
   propósito, pra ficar acessível em qualquer aba sem precisar ir no
   Perfil, e pra sobreviver aos render() (que só redesenham #app). */
.painel-aparencia{
  background:var(--superficie);
  border-bottom:1px solid var(--borda); padding:14px 16px;
  transition:background-color .25s ease, border-color .25s ease;
}
.painel-aparencia .linha{flex-wrap:wrap; gap:18px}
.grupo-escala{display:inline-flex; gap:4px}
.grupo-escala button{padding:5px 10px; font-size:12px}
.grupo-escala button[aria-current="true"]{border-color:rgba(var(--roxo-rgb),.6); color:var(--roxo-forte); background:rgba(var(--roxo-rgb),.12)}

/* Gerenciador de abas (decisão #116) — reordenar/esconder, dentro do painel de Aparência. */
.abas-gerenciar{display:flex; flex-direction:column; gap:4px; max-width:320px}
.abas-gerenciar .linha-aba{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 6px; border-radius:6px}
.abas-gerenciar .linha-aba.oculta{opacity:.45}
.abas-gerenciar .linha-aba .nome-aba{flex:1}
.abas-gerenciar .linha-aba button{padding:2px 7px; font-size:11px}
.abas-gerenciar input[type="checkbox"]{width:auto}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s,transform .12s;
}
button:hover{border-color:var(--suave); transform:translateY(-1px)}
button:not(:disabled):active{transform:scale(.95)}
button.destaque{border-color:rgba(var(--roxo-rgb),.4); background:rgba(var(--roxo-rgb),.12); color:var(--roxo-forte)}
button.destaque:hover{background:rgba(var(--roxo-rgb),.22)}
button.perigo{border-color:rgba(196,80,107,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
  transition:background-color .25s ease, border-color .25s ease;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(var(--roxo-rgb),.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:var(--fonte-titulo)}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(var(--roxo-rgb),.5); color:var(--roxo-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px;
  transition:box-shadow .18s ease, transform .18s ease, background-color .25s ease, border-color .25s ease, padding .15s ease, margin .15s ease}
.cartao:hover{box-shadow:0 4px 16px rgba(0,0,0,.35); transform:translateY(-2px)}
.grade{display:grid; gap:14px; transition:gap .15s ease}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)} }

/* Layout compacto (decisão #116) — preferência de navegador, reduz respiro
   sem esconder informação nenhuma; some com "espaçoso" (padrão). */
body.compacto main{padding:14px 16px 60px}
body.compacto .cartao{padding:10px 12px; margin-bottom:8px}
body.compacto .grade{gap:8px}
body.compacto .abas{margin-bottom:14px}

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px;
  transition:background-color .25s ease, border-color .25s ease}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:var(--fonte-titulo); font-size:26px; color:var(--roxo-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.risco .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(196,80,107,.5); background:rgba(196,80,107,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.resumo-nivel{border:1px solid rgba(var(--roxo-rgb),.5); background:rgba(var(--roxo-rgb),.1);
  border-radius:8px; padding:12px 14px; font-size:13px; margin-top:14px}
.resumo-nivel h3{margin:0 0 6px; font-size:15px; color:var(--roxo-forte); font-family:var(--fonte-titulo)}
@keyframes brilhoNivel{0%{text-shadow:0 0 0 transparent} 35%{text-shadow:0 0 14px var(--roxo)} 100%{text-shadow:0 0 0 transparent}}
#app.entra .resumo-nivel h3{animation:brilhoNivel 1.2s ease-out}

/* Entrada em cascata: cada filho direto de #app anima com um atraso um
   pouco maior que o anterior, então a tela inteira parece "se montar"
   em vez de piscar de uma vez — só quando a tela muda de verdade (troca
   de aba, Modo Guiado, Level Up), nunca a cada tecla digitada. */
@keyframes fadeSlideIn{from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)}}
#app.entra > *{animation:fadeSlideIn .42s cubic-bezier(.16,1,.3,1) backwards}
#app.entra > *:nth-child(1){animation-delay:0s}
#app.entra > *:nth-child(2){animation-delay:.035s}
#app.entra > *:nth-child(3){animation-delay:.07s}
#app.entra > *:nth-child(4){animation-delay:.105s}
#app.entra > *:nth-child(5){animation-delay:.14s}
#app.entra > *:nth-child(n+6){animation-delay:.17s}
@media (prefers-reduced-motion: reduce){
  #app.entra > *{animation:none}
}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.linha-lista{border:1px solid var(--borda); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--superficie-alta)}
.linha-lista .topo{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.tabela-ref{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
.tabela-ref th,.tabela-ref td{border:1px solid var(--borda); padding:6px 8px; text-align:center}
.tabela-ref th{color:var(--suave); font-weight:600; background:var(--superficie-alta)}
.selo{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--borda); color:var(--suave); margin-right:4px}
.checagem{display:flex; align-items:center; gap:7px; font-size:13px; margin:0}
.checagem input{width:auto}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Sistema do Sávio</span>
  <a id="linkFichas" href="/fichas" hidden style="color:var(--roxo);text-decoration:none;font-size:13px">← Fichas</a>
  <button id="btModoGuiado" style="font-size:13px">🧭 Modo Guiado</button>
  <label id="labelCompartilhar" style="display:none;align-items:center;gap:6px;font-size:12px;color:var(--suave);text-transform:none;letter-spacing:normal">
    <input type="checkbox" id="chkCompartilhar" style="width:auto">
    Compartilhar (link de leitura)
  </label>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <span id="statusSalvo" class="status-salvo"></span>
  <button id="btAparencia" title="Cor do tema e tamanho da fonte">🎨 Aparência</button>
  <button id="btExportar">Exportar</button>
  <button id="btImportar">Importar</button>
  <input type="file" id="arquivo" accept="application/json" hidden>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>
<div id="painelAparencia" class="painel-aparencia" hidden>
  <div class="linha">
    <div>
      <label style="margin-bottom:6px">Cor do tema</label>
      <input id="pa-tema-cor" type="color" style="width:60px;padding:2px;height:38px">
    </div>
    <div>
      <label style="margin-bottom:6px">Presets</label>
      <div class="linha" id="pa-presets" style="flex-wrap:wrap;gap:8px"></div>
    </div>
    <div>
      <label style="margin-bottom:6px">Tamanho da fonte</label>
      <div class="grupo-escala" id="pa-escala">
        <button type="button" data-escala="p">P</button>
        <button type="button" data-escala="m">M</button>
        <button type="button" data-escala="g">G</button>
        <button type="button" data-escala="gg">GG</button>
      </div>
    </div>
    <div>
      <label style="margin-bottom:6px">Fonte do título</label>
      <div class="grupo-escala" id="pa-fonte-titulo">
        <button type="button" data-fonte-titulo="classica">Clássica</button>
        <button type="button" data-fonte-titulo="moderna">Moderna</button>
        <button type="button" data-fonte-titulo="elegante">Elegante</button>
      </div>
    </div>
    <div>
      <label style="margin-bottom:6px">Layout</label>
      <div class="grupo-escala" id="pa-layout">
        <button type="button" data-layout="espacoso">Espaçoso</button>
        <button type="button" data-layout="compacto">Compacto</button>
      </div>
    </div>
  </div>
  <div class="linha" style="margin-top:14px;align-items:flex-start">
    <div>
      <label style="margin-bottom:6px">Abas — reordenar e esconder</label>
      <div class="abas-gerenciar" id="pa-abas"></div>
      <p class="mini" style="margin-top:6px">Precisa deixar pelo menos uma visível. Só afeta este navegador, não o personagem.</p>
    </div>
  </div>
</div>
<main id="app"></main>
<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — SISTEMA DO SÁVIO (homebrew de um amigo do Zé)

   Este é o CHASSI + ficha jogável básica do sistema (decisão #17 do Hub:
   cada sistema de regras é um módulo próprio, respondendo as sete perguntas
   de ARQUITETURA.md). O sistema original é bem maior que isto — Invocações,
   Elementais, Ascensão (Arquétipos) e Imersão Espiritual ficam de fora desta
   fatia (decisão #26: uma fatia por vez) e entram como fatias futuras,
   quando esta estiver no ar e usável numa mesa de verdade.

   Traço central do sistema: Habilidades são LIVRES — cada jogador desenha a
   própria (nome, tipo, o que ela faz), usando uma tabela de bônus por Nível
   (1 a 5) como referência de quanto ela pode fazer. Por isso a aba
   Habilidades/Passivas aqui é uma FICHA + TABELA DE CONSULTA, não uma lista
   fechada de poderes pra comprar (diferente do catálogo fixo que Fabula
   Ultima e SAO usam) — o Hub não pode travar uma habilidade que o mestre e
   o jogador inventaram juntos na mesa.

   Os personagens ficam no navegador (localStorage) ou na conta (Modo Hub via
   ?id=), igual os outros três sistemas — mesmo mecanismo de sempre.
   =========================================================================== */

/* --- Regras do sistema, em forma de dados -------------------------------- */

const ATRIBUTOS = [
  {id:'forca',        nome:'Força',        abrev:'FOR', sobre:'dano corpo a corpo, capacidade física'},
  {id:'destreza',     nome:'Destreza',     abrev:'DEX', sobre:'iniciativa, esquiva, ações extras'},
  {id:'constituicao', nome:'Constituição', abrev:'CON', sobre:'Pontos de Vida, resistência'},
  {id:'inteligencia', nome:'Inteligência', abrev:'INT', sobre:'Pontos de Energia, perícias treinadas'},
  {id:'sabedoria',    nome:'Sabedoria',    abrev:'SAB', sobre:'percepção, Passivas extras'},
  {id:'carisma',      nome:'Carisma',      abrev:'CAR', sobre:'Sanidade, presença social'},
];

// Limiares de atributo (5 e 10) — bônus fixo que "liga" ao alcançar o
// número, sem precisar de fórmula contínua. Cada sistema costuma ter o seu
// (aqui não existe cálculo por grau, só esses dois degraus).
const LIMIARES = {
  destreza:     [{v:5, txt:'+1 Ação Bônus por turno'}, {v:10, txt:'+1 Ação Principal extra por turno'}],
  constituicao: [{v:5, txt:'+20 PV temporário permanente'}, {v:10, txt:'+40 PV temporário permanente'}],
  carisma:      [{v:5, txt:'+30 Sanidade máxima'}, {v:10, txt:'+60 Sanidade máxima'}],
  forca:        [{v:5, txt:'+4d4 de dano em qualquer ataque'}, {v:10, txt:'+4d8 de dano em qualquer ataque'}],
  inteligencia: [{v:5, txt:'+25 PE máximo'}, {v:10, txt:'+50 PE máximo'}],
  sabedoria:    [{v:5, txt:'+1 Passiva extra'}, {v:10, txt:'+3 Passivas extras'}],
};
function limiaresAtivos(valor, id){
  return (LIMIARES[id]||[]).filter(l => valor >= l.v);
}
function bonusNumericoLimiar(p, id, tabelaFlat){
  // Soma só os limiares cujo texto é um número puro de PV/PE/Sanidade (os de
  // dado, como o de Força, ficam só como referência de texto na tela).
  return limiaresAtivos(atributoEfetivo(p, id), id).reduce((t,l) => {
    const m = l.txt.match(new RegExp('\\+(\\d+) ' + tabelaFlat));
    return t + (m ? Number(m[1]) : 0);
  }, 0);
}

// As duas tabelas de Perícia do documento original, cada uma ligada a um
// Atributo. Treinar = marcar a caixa (+5); sem marcar fica em +0. O jogador
// treina "2 + Inteligência" perícias — a ficha só avisa se passar disso,
// não trava (o mestre decide se libera exceção).
const PERICIAS = [
  {id:'atletismo',      nome:'Atletismo',      atributo:'forca'},
  {id:'luta',           nome:'Luta',           atributo:'forca', obs:'ou Destreza, desarmado ou com arma leve/marcial'},
  {id:'acrobacia',      nome:'Acrobacia',      atributo:'destreza'},
  {id:'furtividade',    nome:'Furtividade',    atributo:'destreza'},
  {id:'pontaria',       nome:'Pontaria',       atributo:'destreza'},
  {id:'prestidigitacao',nome:'Prestidigitação',atributo:'destreza'},
  {id:'reflexos',       nome:'Reflexos',       atributo:'destreza'},
  {id:'fortitude',      nome:'Fortitude',      atributo:'constituicao'},
  {id:'integridade',    nome:'Integridade',    atributo:'constituicao'},
  {id:'intuicao',       nome:'Intuição',       atributo:'sabedoria'},
  {id:'medicina',       nome:'Medicina',       atributo:'sabedoria'},
  {id:'percepcao',      nome:'Percepção',      atributo:'sabedoria'},
  {id:'vontade',        nome:'Vontade',        atributo:'sabedoria'},
  {id:'astucia',        nome:'Astúcia',        atributo:'inteligencia'},
  {id:'fluxo',          nome:'Fluxo',          atributo:'inteligencia'},
  {id:'investigacao',   nome:'Investigação',   atributo:'inteligencia'},
  {id:'historia',       nome:'História',       atributo:'inteligencia'},
  {id:'oficio1',        nome:'Ofício (1)',     atributo:'inteligencia', livre:true},
  {id:'oficio2',        nome:'Ofício (2)',     atributo:'inteligencia', livre:true},
  {id:'oficio3',        nome:'Ofício (3)',     atributo:'inteligencia', livre:true},
  {id:'religiao',       nome:'Religião',       atributo:'inteligencia'},
  {id:'tecnologia',     nome:'Tecnologia',     atributo:'inteligencia'},
  {id:'persuasao',      nome:'Persuasão',      atributo:'carisma'},
  {id:'enganacao',      nome:'Enganação',      atributo:'carisma'},
  {id:'intimidacao',    nome:'Intimidação',    atributo:'carisma'},
  {id:'performance',    nome:'Performance',    atributo:'carisma'},
];

// As quatro Especializações (classes) do documento — cada uma já vem com um
// pacote fixo de traços (não é lista de poderes pra comprar aos poucos,
// porque no livro do Sávio elas nascem prontas ao escolher a classe).
const ESPECIALIZACOES = [
  {id:'suporte', nome:'Suporte', pvInicial:20, pvPorNivel:'5 + CON', peInicial:20, pePorNivel:10,
    resumo:'Cura e apoio — mantém o grupo de pé.',
    tracos:[
      'Ação bônus grátis: cura 1d6 + maior atributo num aliado, algumas vezes por sessão.',
      'Pode estabilizar sozinho um aliado morrendo com Medicina (DT 25, +1 a cada 5 PV negativos).',
      'Nível/4 vezes por cena: reduz à metade o custo de PE de uma Habilidade usada num aliado.',
      '"Apoiar" vira ação bônus por 2 PE (normalmente é ação completa).',
      'Toda Habilidade de cura/efeito ganha +2×Nível da Habilidade + maior atributo (a cura grátis acima não conta esse bônus).',
      'Ao despertar (pós-Ascensão): a cura grátis vira ação livre, e o bônus de +2×Nível dobra.',
    ]},
  {id:'combatente', nome:'Combatente', pvInicial:40, pvPorNivel:'10 + CON', peInicial:20, pePorNivel:8,
    resumo:'Luta corpo a corpo pura — golpe, resistência e adrenalina.',
    tracos:[
      'Ataques desarmados causam dano de arma pequena + xd4 (x = Nível/4) em qualquer dano.',
      'Nível/2 (da maior entre Força/Constituição) vezes por cena: reduz à metade o custo de PE pra "aprimorar" uma Habilidade.',
      'Escolhe Reflexos ou Fortitude pra somar xd4 (x = Nível/5, começando em 1d4) — pode transferir esse dado pra Luta por 2 PE no turno.',
      'Ao despertar: a cada 10 de dano sofrido num round, ganha +1 dado de dano no próximo ataque.',
    ]},
  {id:'mestre-das-armas', nome:'Mestre das Armas', pvInicial:20, pvPorNivel:'5 + CON', peInicial:15, pePorNivel:8,
    resumo:'Vive de equipamento — arma, engenhoca e Gadgets.',
    tracos:[
      'Pode disparar/atacar três vezes com o mesmo item numa única ação (os dois tiros extras com desvantagem).',
      'Troca de arma como ação livre.',
      'Soma o maior atributo a todo dano causado enquanto empunha uma arma; pode gastar 2 PE pra reforçar um teste de ataque/defesa com ela.',
      'Único que pode ocupar TODOS os encaixes de arma/equipamento (o normal é 1 arma + 1 item especial).',
      'Todo item que fabrica ganha Gadgets (mods, máx. 5 por item; começa com 2 no Nível 1, +1 por Nível). Cada Gadget usado dá +3 num teste, no máx. 4 Gadgets empilhados por rolagem.',
      'Em tempo de descanso, fabrica/aprimora armas — item dado de presente ganha Gadgets = Nível/4.',
      'Ao despertar: soma a perícia Fluxo em toda rolagem de efeito (dano, cura etc).',
    ]},
  {id:'guerreiro-magico', nome:'Guerreiro Mágico', pvInicial:25, pvPorNivel:'5 + CON', peInicial:20, pePorNivel:10,
    resumo:'Equilíbrio entre Fluxo e Habilidades — versátil.',
    tracos:[
      'Nível/4 vezes por cena: reduz à metade o custo de PE de uma Habilidade.',
      'Toda Habilidade de dano ou cura ganha +2×Nível da Habilidade + maior atributo.',
      'Por 5 PE, pode rolar Fluxo no lugar de qualquer perícia que não seja Luta/Pontaria.',
      'Ao despertar: Habilidades passam a custar Ação Bônus em vez de Ação Principal.',
    ]},
];

// Converte "#8b6ee0" em "139,110,224" (formato que rgba() aceita) — é o
// que dá transparência a uma cor de tema que muda em tempo real.
function hexParaRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  if(!m) return '139,110,224';
  return [1,2,3].map(i => parseInt(m[i],16)).join(',');
}
// Clareia uma cor misturando com branco — usada pra derivar o "-forte"
// (texto/destaque) a partir da cor de tema escolhida, sem pedir uma
// segunda cor pro jogador.
function corMaisClara(hex, proporcao){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  if(!m) return hex;
  const canais = [1,2,3].map(i => {
    const c = parseInt(m[i],16);
    return Math.round(c + (255-c)*proporcao);
  });
  return '#' + canais.map(c => c.toString(16).padStart(2,'0')).join('');
}
// Extrai só o matiz (hue, 0-360) de uma cor — usado pra "pintar" fundo,
// superfícies e bordas com a MESMA família de cor do destaque, só que bem
// mais escura/discreta (a claridade e saturação ficam fixas, só o matiz
// muda com o tema).
function matizDoHex(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  if(!m) return 255;
  const [r,g,b] = [1,2,3].map(i => parseInt(m[i],16)/255);
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  if(d === 0) return 0;
  let h;
  if(max === r) h = ((g-b)/d) % 6;
  else if(max === g) h = (b-r)/d + 2;
  else h = (r-g)/d + 4;
  h *= 60;
  return h < 0 ? h+360 : h;
}
// Monta uma cor a partir de matiz/saturação/luminosidade (0-100%) — o
// jeito mais direto de gerar tons escuros discretos numa família de cor.
function corHsl(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s*Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const canal = n => Math.round(255*f(n));
  return '#' + [0,8,4].map(n => canal(n).toString(16).padStart(2,'0')).join('');
}
// Aplica a cor de tema nas variáveis CSS que toda a ficha usa — chamado a
// cada render() com a cor do personagem atual (ou o padrão, sem ficha).
// Além do destaque (--roxo), agora também tinge fundo/superfícies/bordas
// com o mesmo matiz — bem mais escuro, pra continuar fácil de ler com
// qualquer cor escolhida.
function aplicarTema(hexCor){
  const cor = /^#[a-f\d]{6}$/i.test(hexCor||'') ? hexCor : TEMA_PADRAO;
  const h = matizDoHex(cor);
  document.documentElement.style.setProperty('--roxo', cor);
  document.documentElement.style.setProperty('--roxo-forte', corMaisClara(cor, .22));
  document.documentElement.style.setProperty('--roxo-rgb', hexParaRgb(cor));
  document.documentElement.style.setProperty('--fundo', corHsl(h, 35, 5));
  document.documentElement.style.setProperty('--superficie', corHsl(h, 32, 9));
  document.documentElement.style.setProperty('--superficie-alta', corHsl(h, 28, 13));
  document.documentElement.style.setProperty('--borda', corHsl(h, 24, 20));
  atualizarPainelAparencia(cor);
}

// Reordenar/esconder abas (decisão #116) — preferência de navegador, mas por
// SISTEMA (as abas de cada ficha são diferentes) — chave própria do Sávio.
// Guarda {id, oculta} na ordem escolhida; abas novas que a ficha ganhar
// depois entram no fim, visíveis; abas removidas do sistema somem sozinhas
// (não ficam "fantasmas" na lista).
const CHAVE_ABAS = 'hub_abas_savio';
function carregarPreferenciaAbas(){
  let salvas = [];
  try{ salvas = JSON.parse(localStorage.getItem(CHAVE_ABAS) || '[]'); }catch(e){ salvas = []; }
  const porId = new Map(salvas.map(s => [s.id, s]));
  const lista = salvas.filter(s => ABAS.some(a => a.id === s.id));
  ABAS.forEach(a => { if(!porId.has(a.id)) lista.push({id:a.id, oculta:false}); });
  return lista.length ? lista : ABAS.map(a => ({id:a.id, oculta:false}));
}
function salvarPreferenciaAbas(lista){
  try{ localStorage.setItem(CHAVE_ABAS, JSON.stringify(lista)); }catch(e){ /* aba anônima etc. */ }
}
// Lista de abas de verdade a desenhar — na ordem escolhida, sem as ocultas.
function abasVisiveis(){
  const pref = carregarPreferenciaAbas();
  return pref.filter(s => !s.oculta).map(s => ABAS.find(a => a.id === s.id)).filter(Boolean);
}
function renderGerenciadorAbas(){
  const host = document.getElementById('pa-abas');
  if(!host) return;
  const pref = carregarPreferenciaAbas();
  const visiveis = pref.filter(s => !s.oculta).length;
  host.innerHTML = pref.map((s, i) => {
    const aba = ABAS.find(a => a.id === s.id);
    if(!aba) return '';
    return `<div class="linha-aba ${s.oculta ? 'oculta' : ''}">
      <input type="checkbox" data-pa-aba-mostrar="${s.id}" ${s.oculta ? '' : 'checked'} ${(!s.oculta && visiveis <= 1) ? 'disabled title="Precisa de ao menos uma aba visível"' : ''}>
      <span class="nome-aba">${aba.nome}</span>
      <button type="button" data-pa-aba-subir="${s.id}" ${i === 0 ? 'disabled' : ''} title="Mover pra cima">↑</button>
      <button type="button" data-pa-aba-descer="${s.id}" ${i === pref.length - 1 ? 'disabled' : ''} title="Mover pra baixo">↓</button>
    </div>`;
  }).join('');
  host.querySelectorAll('[data-pa-aba-mostrar]').forEach(chk => chk.onchange = () => {
    const id = chk.dataset.paAbaMostrar;
    const nova = carregarPreferenciaAbas().map(s => s.id === id ? {...s, oculta:!chk.checked} : s);
    if(nova.filter(s => !s.oculta).length === 0) return; // nunca deixa tudo oculto
    salvarPreferenciaAbas(nova);
    if(id === estado.aba && !chk.checked){
      const primeiraVisivel = nova.find(s => !s.oculta);
      if(primeiraVisivel) estado.aba = primeiraVisivel.id;
    }
    renderGerenciadorAbas();
    render();
  });
  host.querySelectorAll('[data-pa-aba-subir]').forEach(b => b.onclick = () => moverAba(b.dataset.paAbaSubir, -1));
  host.querySelectorAll('[data-pa-aba-descer]').forEach(b => b.onclick = () => moverAba(b.dataset.paAbaDescer, 1));
}
function moverAba(id, delta){
  const lista = carregarPreferenciaAbas();
  const i = lista.findIndex(s => s.id === id);
  const j = i + delta;
  if(i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  salvarPreferenciaAbas(lista);
  renderGerenciadorAbas();
  render();
}

/* --- Cálculos -------------------------------------------------------------- */

// Valor "de verdade" de um Atributo pra qualquer cálculo — soma o bônus fixo
// de Atributo que o Arquétipo Esforçado/Estudioso concede na Primeira
// Ascensão (fora do teto normal) ao valor bruto que o jogador distribuiu.
function atributoEfetivo(p, id){
  let bonus = 0;
  if(p.ascensao.bonusAtributo1 === id) bonus += 2;
  if(p.ascensao.bonusAtributo2 === id) bonus += 1;
  return (p.atributos[id]||0) + bonus;
}

// Teto normal de Atributo: 10, sobe pra 15 depois da Segunda Ascensão.
function atributoCap(p){ return p.ascensao.segunda ? 15 : 10; }

// Pontos de Atributo disponíveis pra distribuir: começa em 6 e sobe +2 a
// cada 2 Níveis (Nível 1 = 6, Nível 2-3 = 8, Nível 4-5 = 10, ...), até um
// teto de 40. Não conta o bônus fixo de Atributo dos Arquétipos
// Esforçado/Estudioso (esse é "fora do teto", nem entra nem sai do pool).
function pontosAtributosBase(nivel){
  return Math.min(40, 2*Math.ceil(Math.max(0, nivel-1)/2)) + 6;
}
function pontosAtributosGastos(p){
  return ATRIBUTOS.reduce((t,a) => t + (p.atributos[a.id]||0), 0);
}
function pontosAtributosDisponiveis(p){
  return pontosAtributosBase(p.nivel) - pontosAtributosGastos(p);
}

function maiorAtributo(p){
  return Math.max(0, ...ATRIBUTOS.map(a => atributoEfetivo(p, a.id)));
}

function periciasTreinadasContagem(p){
  return PERICIAS.filter(per => p.pericias[per.id]).length;
}
function periciasTreinadasLimite(p){ return 2 + atributoEfetivo(p,'inteligencia') + Math.ceil(p.nivel/4); }

// Qual Atributo uma Perícia usa de verdade — Luta é a única que troca
// livremente entre Força e Destreza, à escolha do jogador.
function periciaAtributoId(p, per){
  return per.id === 'luta' ? p.lutaAtributo : per.atributo;
}
// Extrai só o número fixo de um texto "+3 ou 1d6" / "+1d12 ou +6" — o
// "+N" que NÃO está colado num "d" de dado. É esse fixo que uma Passiva
// aplicada a uma Perícia específica soma automaticamente no Total dela
// (o valor em dado continua sendo escolha da mesa na hora de rolar).
function bonusFixoDoTexto(texto){
  const m = texto.match(/\+(\d+)(?!d)/);
  return m ? Number(m[1]) : 0;
}
// Soma dos bônus fixos de todas as Passivas que o jogador apontou pra
// essa Perícia específica (efeito Dano/Cura/Movimento/RD/Vantagem).
function bonusPassivasPericia(p, periciaId){
  return (p.passivas||[]).reduce((total, pas) => {
    if(pas.periciaAlvo !== periciaId) return total;
    if(!pas.efeitos || !pas.efeitos.danoCuraMovRDVant) return total;
    return total + bonusFixoDoTexto(passivaEvolucaoInfo(pas).danoCuraMovRDVant);
  }, 0);
}
// Total de uma Perícia: Atributo + (Nível ÷ 4, arredondado pra cima) +
// (5 se for treinada, senão 0) + bônus fixo de Passivas apontadas pra
// ela — mesma fórmula do limite de treináveis, só que perícia a perícia.
function periciaTotal(p, per){
  const atributo = atributoEfetivo(p, periciaAtributoId(p, per));
  const bonusTreino = p.pericias[per.id] ? 5 : 0;
  return atributo + bonusTreino + Math.ceil(p.nivel/4) + bonusPassivasPericia(p, per.id);
}

function especializacao(p){ return ESPECIALIZACOES.find(e => e.id === p.especializacaoId) || null; }
function arquetipo(p){ return p.ascensao.primeira ? ARQUETIPOS.find(a => a.id === p.ascensao.arquetipoId) || null : null; }

// PV/PE máximos dependem inteiramente da Especialização escolhida — sem
// classe ainda, usa só CON/INT + limiares, pra não deixar a ficha vazia
// antes da escolha (decisão da conversa: nunca travar até um Wizard
// obrigatório terminar, como os outros três sistemas já fazem).
function pvMaximo(p){
  const esp = especializacao(p);
  const con = atributoEfetivo(p,'constituicao');
  const base = esp ? esp.pvInicial + con : 10 + con;
  const porNivel = esp ? (Number(esp.pvPorNivel.match(/\d+/)[0]) + con) : con;
  return base + porNivel*Math.max(0, p.nivel-1) + bonusNumericoLimiar(p,'constituicao','PV temporário permanente') + (p.bonus.pv||0);
}
function peMaximo(p){
  const esp = especializacao(p);
  const base = esp ? esp.peInicial : 15;
  const porNivel = esp ? esp.pePorNivel : 5;
  const total = base + porNivel*Math.max(0, p.nivel-1) + bonusNumericoLimiar(p,'inteligencia','PE máximo') + (p.bonus.pe||0);
  // Arquétipo Prodígio (Primeira Ascensão): multiplicador de PE máximo ×1,5.
  const arq = arquetipo(p);
  return arq && arq.id === 'prodigio' ? Math.round(total*1.5) : total;
}
function sanidadeMaxima(p){
  return 100 + bonusNumericoLimiar(p,'carisma','Sanidade máxima') + (p.bonus.sanidade||0);
}

/* --- Ativação de Habilidades --------------------------------------------

   Habilidade Imediata: usa e acabou, só desconta o PE. Duradoura: liga e
   já sabe por quantos rounds fica ativa sozinha (tabela de Duração do
   Nível efetivo). Sustentada: liga até o jogador desativar ou faltar PE —
   "⏭ Passar Round" (aba Combate) cobra a metade do custo a cada round e
   desativa quem não tiver mais PE, e também conta os rounds da Duradoura.
--------------------------------------------------------------------------- */

function peAtual(p){ return p.atual.pe ?? peMaximo(p); }
// Desconta PE; se não tiver o suficiente, zera e avisa (pra quem chamou
// desativar a Habilidade, já que ela não se sustenta sem PE).
function gastarPe(p, quantidade){
  const atual = peAtual(p);
  if(atual < quantidade){ p.atual.pe = 0; return false; }
  p.atual.pe = atual - quantidade;
  return true;
}
// Marcar como "reação" gasta uma Reação da rodada (a única forma de
// alimentar o "Contra-Atacar" — regra do documento) em vez de custar
// Ação Comum/Bônus como o tipo normalmente custaria.
function usarReacaoSeMarcada(p, h){
  if(h.reacao) p.reacoesUsadasNaRodada = (p.reacoesUsadasNaRodada||0) + 1;
}
function ativarHabilidade(p, h){
  if(h.tipo === 'imediata'){
    gastarPe(p, h.custoPe||0);
    usarReacaoSeMarcada(p, h);
    return;
  }
  if(h.ativa){
    h.ativa = false;
    h.duracaoRestante = null;
    return;
  }
  gastarPe(p, h.custoPe||0);
  usarReacaoSeMarcada(p, h);
  h.ativa = true;
  if(h.tipo === 'duradoura'){
    const info = TABELA_HABILIDADE[habilidadeNivelEfetivo(h)-1];
    const m = info.duracao.match(/\d+/);
    h.duracaoRestante = m ? Number(m[0]) : null;
  }else{
    h.duracaoRestante = null;
  }
}
// Avança 1 round: Duradouras contam pra baixo e desligam sozinhas ao
// zerar; Sustentadas cobram metade do custo padrão e desligam sozinhas
// se faltar PE (regra do documento: "até que se esgote o PE").
function passarRound(p){
  (p.habilidades||[]).forEach(h => {
    if(!h.ativa) return;
    if(h.tipo === 'duradoura'){
      if(h.duracaoRestante != null){
        h.duracaoRestante -= 1;
        if(h.duracaoRestante <= 0){ h.ativa = false; h.duracaoRestante = null; }
      }
    }else if(h.tipo === 'sustentada'){
      const teve = gastarPe(p, Math.ceil((h.custoPe||0)/2));
      if(!teve) h.ativa = false;
    }
  });
  p.reacoesUsadasNaRodada = 0;
}
function habilidadesAtivas(p){ return (p.habilidades||[]).filter(h => h.ativa); }

// Reações: Nível/3 arredondado pra cima, mínimo 2 pra todo mundo.
function reacoesPorRound(p){ return Math.max(2, Math.ceil(p.nivel/3)); }

// Passivas/Habilidades extras que os limiares de Sabedoria concedem, além
// da progressão normal (2 iniciais, +1 Habilidade por Nível, +1 Passiva a
// cada 5 Níveis).
function passivasBonusSabedoria(p){
  const m = limiaresAtivos(atributoEfetivo(p,'sabedoria'),'sabedoria')
    .reduce((t,l) => t + (l.txt.includes('+3') ? 3 : l.txt.includes('+1') ? 1 : 0), 0);
  return m;
}
function habilidadesEsperadas(p){ return 2 + Math.max(0, p.nivel-1); }
function passivasEsperadas(p){
  const arq = arquetipo(p);
  // Arquétipo Inato (Primeira Ascensão): +2 Passivas além do máximo normal.
  const bonusInato = arq && arq.id === 'inato' ? 2 : 0;
  return 2 + Math.floor(Math.max(0, p.nivel-1)/5) + passivasBonusSabedoria(p) + bonusInato;
}

// PV da Imersão Espiritual (Segunda Ascensão): Nível × Sabedoria efetiva.
function pvImersao(p){ return p.nivel * atributoEfetivo(p,'sabedoria'); }
// PE gasto por round mantendo a Imersão ativa — base 10, ajustável em ±3
// por "tier" (até 3 tiers pra cada lado, fortalecendo ou enfraquecendo).
function peImersaoPorRound(p){ return 10 + (p.imersao.tiers||0)*3; }

// Maior Nível de Habilidade já liberado no Nível atual do personagem.
function nivelHabilidadeLiberado(p){
  let liberado = 0;
  LIBERACAO_HABILIDADE.forEach(l => { if(p.nivel >= l.nivelPersonagem) liberado = l.nivelHabilidade; });
  return liberado;
}

// Pontos de Atributo já gastos numa Invocação, contra o pool do Nível dela.
function invocacaoPontosGastos(inv){
  return ATRIBUTOS.reduce((t,a) => t + (inv.atributos[a.id]||0), 0);
}
function invocacaoPV(inv){
  return invocacaoNivelInfo(inv.nivel).pvCalc(inv.atributos.constituicao||0);
}

// Elemental: mesma fórmula de PV/PE/Sanidade da Especialização do
// personagem, só que aplicada aos Atributos e ao Nível do próprio Elemental
// (ele é, na prática, um segundo personagem pequeno).
function elementalEspecializacao(p){
  return ESPECIALIZACOES.find(e => e.id === p.elemental.especializacaoId) || null;
}
function elementalPV(p){
  const esp = elementalEspecializacao(p);
  const con = p.elemental.atributos.constituicao||0;
  const base = esp ? esp.pvInicial + con : 10 + con;
  const porNivel = esp ? (Number(esp.pvPorNivel.match(/\d+/)[0]) + con) : con;
  return base + porNivel*Math.max(0, p.elemental.nivel-1);
}
function elementalPE(p){
  const esp = elementalEspecializacao(p);
  const base = esp ? esp.peInicial : 15;
  const porNivel = esp ? esp.pePorNivel : 5;
  return base + porNivel*Math.max(0, p.elemental.nivel-1);
}
function elementalSanidade(p){
  const car = p.elemental.atributos.carisma||0;
  return 100 + (car > 9 ? 60 : car > 4 ? 30 : 0);
}
// Ajuda Elemental: nível/2 (arredondado pra baixo) vezes por cena, o
// personagem pode pedir energia ao Elemental — usa o Nível do PERSONAGEM,
// não o do Elemental (regra do documento).
function ajudaElementalPorCena(p){ return Math.floor(p.nivel/2); }

// O Elemental é uma ficha pequena própria — Atributos e Perícias seguem a
// MESMA lógica de evolução do personagem principal (pontosAtributosBase,
// periciaTotal, periciasTreinadasLimite), só que usando o Nível e os
// Atributos do próprio Elemental em vez dos do dono. Sem bônus de Ascensão
// ou Passiva — o Elemental não tem nenhum dos dois.
function elementalPontosAtributosBase(nivel){ return pontosAtributosBase(nivel); }
function elementalPontosAtributosGastos(p){
  return ATRIBUTOS.reduce((t,a) => t + (p.elemental.atributos[a.id]||0), 0);
}
function elementalPontosAtributosDisponiveis(p){
  return elementalPontosAtributosBase(p.elemental.nivel) - elementalPontosAtributosGastos(p);
}
function elementalPericiaAtributoId(p, per){
  return per.id === 'luta' ? (p.elemental.lutaAtributo || 'forca') : per.atributo;
}
function elementalPericiaTotal(p, per){
  const atributo = p.elemental.atributos[elementalPericiaAtributoId(p, per)]||0;
  const bonusTreino = p.elemental.pericias[per.id] ? 5 : 0;
  return atributo + bonusTreino + Math.ceil(p.elemental.nivel/4);
}
function elementalPericiasTreinadasContagem(p){
  return PERICIAS.filter(per => p.elemental.pericias[per.id]).length;
}
function elementalPericiasTreinadasLimite(p){
  return 2 + (p.elemental.atributos.inteligencia||0) + Math.ceil(p.elemental.nivel/4);
}

// Fotografia dos números que mudam só por causa do Nível do personagem —
// usada pra montar o resumo do botão "⭐ Subir de Nível".
function snapshotNivelSavio(p){
  const sanidade = SANIDADE_POR_NIVEL.find(s => s.nivel === p.nivel);
  return {
    nivel: p.nivel,
    pv: pvMaximo(p),
    pe: peMaximo(p),
    reacoes: reacoesPorRound(p),
    habilidadesEsperadas: habilidadesEsperadas(p),
    passivasEsperadas: passivasEsperadas(p),
    nivelHabLiberado: nivelHabilidadeLiberado(p),
    sanidadeDano: sanidade ? sanidade.dado : null,
    pontosAtributos: pontosAtributosBase(p.nivel),
    periciasTreinadasLimite: periciasTreinadasLimite(p),
  };
}
// Sobe 1 Nível e guarda o resumo em estado.nivelUpResumo — sem teto (o
// mestre decide o ritmo, igual os outros três sistemas fazem).
function subirNivel(p){
  const antes = snapshotNivelSavio(p);
  p.nivel += 1;
  const depois = snapshotNivelSavio(p);
  estado.nivelUpResumo = {antes, depois};
}

/* --- Armazenamento ---------------------------------------------------------

   Presente na URL (?id=...), a ficha vive na conta do Hub em vez do
   navegador — mesmo mecanismo do Fabula Ultima, SAO e Kaizoku no Sho
   (decisão #40 / #44).
------------------------------------------------------------------------- */

const MODO_HUB = new URLSearchParams(location.search).get('id');
const CHAVE = 'savio_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

let debounceHub = null;
function salvarNoHub(){
  clearTimeout(debounceHub);
  mostrarStatusSalvo('Salvando…', 'salvando');
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    // Resumo genérico pro Hub de Mestre ler sem saber a fórmula de PV deste
    // sistema (decisão #46) — espelhado a cada salvamento.
    p.resumoVida = {atual: Math.max(0, Math.min(pvMaximo(p), p.atual.pv ?? pvMaximo(p))), maxima: pvMaximo(p), rotulo: 'PV'};
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dados: p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
      statusSalvoOk();
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
      mostrarStatusSalvo('Erro ao salvar', 'erro');
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
    statusSalvoOk();
  }catch(e){
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
    mostrarStatusSalvo('Erro ao salvar', 'erro');
  }
}

const estado = {
  fichas: MODO_HUB ? [] : carregar(),
  atualId: null,
  aba: 'perfil',
  carregandoHub: !!MODO_HUB,
  erroHub: null,
  ehDono: false,
  compartilhado: false,
  modoGuiado: false,
  passoGuiado: 1,
  // nivelUpResumo: resumo transitório do último "Subir de Nível" — só de
  // exibição, não é salvo na ficha; some ao fechar ou ao trocar de
  // personagem (mesmo mecanismo dos outros três sistemas).
  nivelUpResumo: null,
  // mostrarAjuda: painel de Tutorial (❓ Ajuda) aberto/fechado — transitório,
  // fica aberto ao trocar de aba de propósito (o texto só atualiza sozinho).
  mostrarAjuda: false,
};
if(!MODO_HUB && estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub = 'nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p];
    estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false;
    render();
  }
}

function alternarCompartilhado(valor){
  estado.compartilhado = valor;
  render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({compartilhado: valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(mudanca){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounce = null;
function mudarSemRedesenhar(mudanca, elemento){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Desenho da tela --------------------------------------------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ABAS = [
  {id:'perfil',      nome:'Perfil'},
  {id:'atributos',   nome:'Atributos'},
  {id:'pericias',    nome:'Perícias'},
  {id:'classe',      nome:'Especialização'},
  {id:'habilidades', nome:'Habilidades'},
  {id:'invocacoes',  nome:'Invocações'},
  {id:'elemental',   nome:'Elemental'},
  {id:'passivas',    nome:'Passivas'},
  {id:'combate',     nome:'Combate'},
  {id:'ascensao',    nome:'Ascensão'},
  {id:'notas',       nome:'Notas'},
];

let ultimaChaveTela = null;

function render(){
  desenharBarra();
  const app = document.getElementById('app');

  if(MODO_HUB && estado.carregandoHub){
    app.innerHTML = `<div class="vazio"><h2>Carregando…</h2></div>`;
    return;
  }
  if(MODO_HUB && estado.erroHub === 'nao-encontrado'){
    app.innerHTML = `<div class="vazio">
      <h2>Ficha não encontrada</h2>
      <p class="mini">Ela pode ter sido apagada, ou não é sua.
      <a href="/fichas" style="color:var(--roxo)">Voltar para Fichas</a></p></div>`;
    return;
  }

  const p = atual();
  aplicarTema(p ? p.temaCor : TEMA_PADRAO);

  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em "+ Novo" para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const somenteLeitura = MODO_HUB && !estado.ehDono;

  // Se a aba ativa foi escondida (painel de Aparência), pousa na primeira
  // aba visível em vez de deixar o conteúdo sem botão aceso.
  const abasVis = abasVisiveis();
  if(!estado.modoGuiado && !estado.nivelUpResumo && abasVis.length && !abasVis.some(a => a.id === estado.aba)){
    estado.aba = abasVis[0].id;
  }

  const alerta = somenteLeitura
    ? `<div class="ok">Modo leitura — você está vendo a ficha de
       <strong>${esc(p.perfil.nome)}</strong>. Só quem é dono edita.</div>`
    : falhouAoSalvar
      ? (MODO_HUB
        ? `<div class="aviso"><strong>Não consegui salvar no Hub.</strong>
           Confira sua internet — se cair, exporte para não perder o que você
           preencheu.</div>`
        : `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
           Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
           perder o que você preencheu.</div>`) : '';

  app.innerHTML = estado.modoGuiado
    ? alerta + telaGuiada(p)
    : estado.nivelUpResumo
      ? alerta + telaResumoNivel(p, estado.nivelUpResumo)
      : alerta
        + `<div class="abas">` + abasVis.map(a =>
            `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
          ).join('') + `<button id="btAjudaAba" style="margin-left:auto" aria-current="${estado.mostrarAjuda}" title="O que esta aba faz, e como funciona no sistema">❓ Ajuda</button></div>`
        + (estado.mostrarAjuda ? `<div class="cartao" style="border-color:rgba(var(--roxo-rgb),.4)">
            <h3 style="font-size:15px;margin-bottom:8px">❓ ${ABAS.find(a=>a.id===estado.aba)?.nome}</h3>
            ${AJUDA_ABAS[estado.aba] || '<p class="mini">Sem ajuda cadastrada pra esta aba ainda.</p>'}
          </div>` : '')
        + painelDerivados(p)
        + ({perfil:abaPerfil, atributos:abaAtributos, pericias:abaPericias, classe:abaClasse, habilidades:abaHabilidades, invocacoes:abaInvocacoes, elemental:abaElemental, passivas:abaPassivas, combate:abaCombate, ascensao:abaAscensao, notas:abaNotas}[estado.aba])(p);

  const chaveTela = estado.modoGuiado ? `guiado:${estado.passoGuiado}` : estado.nivelUpResumo ? 'levelup' : `aba:${estado.aba}`;
  app.classList.remove('entra');
  if(chaveTela !== ultimaChaveTela){
    void app.offsetWidth;
    app.classList.add('entra');
  }
  ultimaChaveTela = chaveTela;

  ligarEventos();

  if(somenteLeitura){
    app.querySelectorAll('input, select, textarea, button:not([data-aba]):not(#btAjudaAba)')
      .forEach(el => el.disabled = true);
  }
}

function desenharBarra(){
  const btModoGuiado = document.getElementById('btModoGuiado');
  btModoGuiado.hidden = !atual() || !!estado.nivelUpResumo;
  btModoGuiado.textContent = estado.modoGuiado ? '📋 Ver ficha completa' : '🧭 Modo Guiado';
  btModoGuiado.className = estado.modoGuiado ? 'destaque' : '';

  if(MODO_HUB){
    document.getElementById('seletor').hidden = true;
    document.getElementById('btNovo').hidden = true;
    document.getElementById('btExcluir').hidden = true;
    document.getElementById('linkFichas').hidden = false;

    const labelCompartilhar = document.getElementById('labelCompartilhar');
    labelCompartilhar.style.display = estado.ehDono ? 'flex' : 'none';
    document.getElementById('chkCompartilhar').checked = estado.compartilhado;
    document.getElementById('btImportar').hidden = !estado.ehDono;
    return;
  }
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

// Painel sempre visível: os números que se consulta o tempo todo numa mesa.
// Ajuste rápido de PV/PE/Sanidade (decisão #117 — "ficha padrão"): antes
// desta decisão, o Sávio não tinha NENHUMA forma de editar esses três na
// tela (a função gastarPe() já existia mas nunca era chamada por nada).
// Reaproveitado dentro de painelDerivados() (sempre visível).
function painelDerivados(p){
  const pvMax = pvMaximo(p), peMax = peMaximo(p), sanMax = sanidadeMaxima(p);
  const pv = p.atual.pv ?? pvMax;
  const pe = p.atual.pe ?? peMax;
  const sanidade = p.atual.sanidade ?? sanMax;
  const emRisco = pv <= Math.floor(pvMaximo(p)/4);
  const stepper = (chave, valor, max) => `<div class="linha" style="justify-content:center;gap:6px;margin-top:6px">
    <button type="button" data-recurso-ajuste="${chave}|-1" ${valor<=0?'disabled':''} title="Corrigir -1">-1</button>
    <button type="button" data-recurso-ajuste="${chave}|1" ${valor>=max?'disabled':''} title="Corrigir +1">+1</button>
  </div>`;
  return `<div class="cartao" style="margin-bottom:14px">
    <div class="grade g4">
      <div class="derivado ${emRisco?'risco':''}">
        <div class="rot">Pontos de Vida</div>
        <div class="val">${pv}<span style="font-size:14px;color:var(--suave)">/${pvMax}</span></div>
        <div class="obs">${especializacao(p) ? especializacao(p).nome : 'sem Especialização'}</div>
        ${stepper('pv', pv, pvMax)}
      </div>
      <div class="derivado">
        <div class="rot">Pontos de Energia</div>
        <div class="val">${pe}<span style="font-size:14px;color:var(--suave)">/${peMax}</span></div>
        <div class="obs">${p.exaustoes} exaustão(ões)</div>
        ${stepper('pe', pe, peMax)}
      </div>
      <div class="derivado">
        <div class="rot">Sanidade</div>
        <div class="val">${sanidade}<span style="font-size:14px;color:var(--suave)">/${sanMax}</span></div>
        <div class="obs">base 100</div>
        ${stepper('sanidade', sanidade, sanMax)}
      </div>
      <div class="derivado">
        <div class="rot">Nível</div>
        <div class="val">${p.nivel}</div>
        <div class="obs">${reacoesPorRound(p)} reações/round</div>
      </div>
    </div>

    <p class="mini" style="margin:14px 0 6px">Dano/gasto e cura/recuperação — digite só o valor sofrido, a ficha calcula o total sozinha</p>
    <div class="grade g3">
      <div><label for="c-perda-pv">Dano em PV</label><input id="c-perda-pv" type="number" min="0" value="0"></div>
      <div><label for="c-perda-pe">Gastar PE</label><input id="c-perda-pe" type="number" min="0" value="0"></div>
      <div><label for="c-perda-sanidade">Perder Sanidade</label><input id="c-perda-sanidade" type="number" min="0" value="0"></div>
    </div>
    <div class="linha" style="gap:8px;margin-top:6px">
      <button type="button" data-recurso-perda="pv" style="flex:1">Aplicar dano em PV</button>
      <button type="button" data-recurso-perda="pe" style="flex:1">Gastar PE</button>
      <button type="button" data-recurso-perda="sanidade" style="flex:1">Perder Sanidade</button>
    </div>
    <div class="grade g3" style="margin-top:10px">
      <div><label for="c-ganho-pv">Curar PV</label><input id="c-ganho-pv" type="number" min="0" value="0"></div>
      <div><label for="c-ganho-pe">Recuperar PE</label><input id="c-ganho-pe" type="number" min="0" value="0"></div>
      <div><label for="c-ganho-sanidade">Recuperar Sanidade</label><input id="c-ganho-sanidade" type="number" min="0" value="0"></div>
    </div>
    <div class="linha" style="gap:8px;margin-top:6px">
      <button type="button" data-recurso-ganho="pv" style="flex:1">Curar PV</button>
      <button type="button" data-recurso-ganho="pe" style="flex:1">Recuperar PE</button>
      <button type="button" data-recurso-ganho="sanidade" style="flex:1">Recuperar Sanidade</button>
    </div>

    <p class="mini" style="margin:14px 0 6px">Descanso — recupera PV, PE e Sanidade juntos (nunca diminui, só sobe até o alvo)</p>
    <div class="linha" style="gap:8px">
      <button type="button" id="btDescansoCurto" style="flex:1">Descanso Curto (50%)</button>
      <button type="button" id="btDescansoLongo" style="flex:1">Descanso Longo (100%)</button>
    </div>
  </div>${p.morrendo ? `<div class="aviso">⚠️ Personagem <strong>morrendo</strong> — a próxima vez que isso acontecer de novo é morte permanente (regra das 3 exaustões).</div>` : ''}`;
}

function campo(rotulo, chave, valor, tipo){
  return `<div><label for="c-${chave}">${rotulo}</label>
    <input id="c-${chave}" data-perfil="${chave}" type="${tipo||'text'}" value="${esc(valor)}"></div>`;
}

function blocoAtributos(p){
  const cap = atributoCap(p);
  const gastos = pontosAtributosGastos(p);
  const base = pontosAtributosBase(p.nivel);
  const restantes = base - gastos;
  return `<div class="derivado" style="margin-bottom:14px;max-width:260px">
    <div class="rot">Pontos de Atributo</div>
    <div class="val" style="${restantes<0?'color:var(--alerta)':''}">${gastos}<span style="font-size:14px;color:var(--suave)">/${base}</span></div>
    <div class="obs">${restantes<0 ? `${-restantes} acima do disponível` : `${restantes} restantes pra gastar`}</div>
  </div>
  <div class="grade g3">
    ${ATRIBUTOS.map(a => {
      const efetivo = atributoEfetivo(p, a.id);
      const bonusAsc = efetivo - (p.atributos[a.id]||0);
      return `<div class="cartao" style="margin-bottom:0">
      <label for="c-attr-${a.id}">${a.nome} (${a.abrev})</label>
      <input id="c-attr-${a.id}" data-atributo="${a.id}" type="number" min="0" max="${cap}" value="${p.atributos[a.id]}">
      <p class="mini" style="margin-top:6px">${a.sobre}</p>
      ${bonusAsc ? `<p class="mini" style="color:var(--roxo-forte)">Efetivo: ${efetivo} (+${bonusAsc} da Ascensão, fora do teto)</p>` : ''}
      ${limiaresAtivos(efetivo, a.id).map(l => `<p class="mini" style="color:var(--roxo-forte)">✓ ${l.txt}</p>`).join('')}
    </div>`;
    }).join('')}
  </div>
  <p class="mini" style="margin-top:10px">Teto normal: ${cap}${cap===10 ? ' (sobe pra 15 depois da Segunda Ascensão)' : ''}.
    Pontos de Atributo começam em 6 e sobem +2 a cada 2 Níveis.</p>`;
}

/* --- Modo Guiado: criação passo a passo ---------------------------------- */

function telaGuiada(p){
  const passo = estado.passoGuiado;
  const totalPassos = 5;
  const cabecalho = `
    <div class="cartao" style="text-align:center">
      <p class="mini" style="text-transform:uppercase;letter-spacing:.1em">Modo Guiado — Passo ${passo} de ${totalPassos}</p>
      <div style="display:flex;justify-content:center;gap:6px;margin-top:8px">
        ${Array.from({length: totalPassos}, (_, i) => i+1).map(n =>
          `<span style="width:26px;height:4px;border-radius:2px;background:${n<=passo?'var(--roxo)':'var(--borda)'}"></span>`).join('')}
      </div>
    </div>`;

  if(passo === 1){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">1. Quem é seu personagem?</h2>
      <p class="mini" style="margin:6px 0 14px">Dados básicos — dá pra ajustar tudo depois na aba Perfil.</p>
      <div class="grade g2">
        ${campo('Nome','nome',p.perfil.nome)}
        ${campo('Idade','idade',p.perfil.idade)}
        ${campo('Gênero','genero',p.perfil.genero)}
        ${campo('Altura','altura',p.perfil.altura)}
      </div>
    </div>
    <div class="linha" style="justify-content:flex-end">
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  if(passo === 2){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">2. Atributos e Especialização</h2>
      <p class="mini" style="margin:6px 0 16px">
        Distribua os seis Atributos (0 a 10) e escolha uma Especialização —
        ela define seus Pontos de Vida e de Energia de partida.
      </p>
      ${blocoAtributos(p)}
    </div>
    <div class="cartao">
      <h3 style="font-size:16px;margin-bottom:10px">Especialização</h3>
      ${seletorEspecializacao(p)}
    </div>
    <div class="linha" style="justify-content:space-between">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  if(passo === 3){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">3. Habilidades iniciais</h2>
      <p class="mini" style="margin:6px 0 16px">
        Todo personagem começa com <strong>2 Habilidades</strong> — livres
        de verdade: você desenha o efeito usando a tabela de bônus por
        Nível abaixo como referência, não escolhe de um catálogo fechado.
      </p>
    </div>
    ${abaHabilidades(p)}
    <div class="linha" style="justify-content:space-between;margin-top:14px">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  if(passo === 4){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">4. Passivas iniciais</h2>
      <p class="mini" style="margin:6px 0 16px">
        Todo personagem também começa com <strong>2 Passivas</strong> —
        sempre ativas, sem precisar gastar PE nem ação pra usar.
      </p>
    </div>
    ${abaPassivas(p)}
    <div class="linha" style="justify-content:space-between;margin-top:14px">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">5. Pronto pra jogar!</h2>
      <p class="mini" style="margin:6px 0 14px">
        ${esc(p.perfil.nome || 'Seu personagem')} já tem o essencial —
        atributos, especialização, Habilidades e Passivas iniciais.
        Perícias você distribui aos poucos, jogando — o sistema do Sávio é
        livre de propósito. Cada aba tem um botão <strong>❓ Ajuda</strong>
        explicando o que ela faz, se precisar.
      </p>
    </div>
    ${painelDerivados(p)}
    <div class="linha" style="justify-content:space-between">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoConcluir" class="destaque">Concluir — ver ficha completa</button>
    </div>`;
}

// Tela cheia do Level Up guiado (mesmo esquema do Modo Guiado de criação:
// substitui TODO o conteúdo de #app) — mostra o que mudou automaticamente
// com o Nível e, quando abre uma vaga nova de Habilidade/Passiva, já deixa
// registrar ali mesmo (reaproveita habilidadeLinha/passivaLinha — os
// bindings de ligarEventos() não são presos a nenhuma aba específica).
function telaResumoNivel(p, resumo){
  const {antes, depois} = resumo;
  const linha = (rotulo, a, d, sufixo) => a === d ? '' :
    `<p class="mini" style="margin:4px 0"><strong>${rotulo}:</strong> ${a}${sufixo||''} → <span style="color:var(--roxo-forte)">${d}${sufixo||''}</span></p>`;
  const ganhouHabilidade = depois.habilidadesEsperadas > antes.habilidadesEsperadas;
  const ganhouPassiva = depois.passivasEsperadas > antes.passivasEsperadas;
  const liberouNivelHab = depois.nivelHabLiberado > antes.nivelHabLiberado;

  return `
    <div class="cartao" style="text-align:center">
      <p class="mini" style="text-transform:uppercase;letter-spacing:.1em">Level Up guiado</p>
    </div>
    <div class="resumo-nivel">
      <h3>⭐ Subiu para o Nível ${depois.nivel}!</h3>
      ${linha('Pontos de Vida máximos', antes.pv, depois.pv)}
      ${linha('Pontos de Energia máximos', antes.pe, depois.pe)}
      ${linha('Reações por round', antes.reacoes, depois.reacoes)}
      ${linha('Pontos de Atributo disponíveis', antes.pontosAtributos, depois.pontosAtributos)}
      ${linha('Perícias treináveis', antes.periciasTreinadasLimite, depois.periciasTreinadasLimite)}
      ${depois.sanidadeDano ? linha('Dano de Sanidade das Habilidades', antes.sanidadeDano || '—', depois.sanidadeDano) : ''}
      ${liberouNivelHab ? `<p class="mini" style="color:var(--roxo-forte);margin-top:8px">✨ Agora você pode ter Habilidades de Nível ${depois.nivelHabLiberado}!</p>` : ''}
    </div>
    ${ganhouHabilidade ? `<div class="cartao">
      <h3 style="font-size:16px;margin-bottom:10px">✨ Nova Habilidade disponível! (${p.habilidades.length}/${depois.habilidadesEsperadas})</h3>
      ${p.habilidades.map((h,i) => habilidadeLinha(h,i,p)).join('')}
      <button id="btAddHabilidade" class="destaque">+ Nova Habilidade</button>
    </div>` : ''}
    ${ganhouPassiva ? `<div class="cartao">
      <h3 style="font-size:16px;margin-bottom:10px">✨ Nova Passiva disponível! (${p.passivas.length}/${depois.passivasEsperadas})</h3>
      ${p.passivas.map((h,i) => passivaLinha(h,i)).join('')}
      <button id="btAddPassiva" class="destaque">+ Nova Passiva</button>
    </div>` : ''}
    <button id="btFecharResumoNivel" class="destaque" style="margin-top:16px">Concluir — voltar pra ficha</button>`;
}

function seletorEspecializacao(p){
  return `<div class="grade g2">
    ${ESPECIALIZACOES.map(e => `<label class="linha-lista" style="cursor:pointer;display:block;margin-bottom:0">
      <div class="linha">
        <input type="radio" name="especializacao" data-especializacao="${e.id}" style="width:auto" ${p.especializacaoId===e.id?'checked':''}>
        <strong>${e.nome}</strong>
      </div>

  </div>`;
}

  const custoFinal = custoBase !== null && meiaCusto ? Math.ceil(custoBase/2) : custoBase;
  const efeitosEscolhidos = habilidadeEfeitosEscolhidos(h);
  const nivelEfetivo = habilidadeNivelEfetivo(h);
  const linhaTabela = TABELA_HABILIDADE[nivelEfetivo-1];
  return `<div class="linha-lista">
    <div class="topo">
      <input data-hab-campo="${i}|nome" value="${esc(h.nome)}" placeholder="Nome da Habilidade" style="flex:1">
      <button data-hab-remover="${i}" class="perigo">Remover</button>
    </div>
    <div class="grade g3">
      <div><label>Nível (1–5)</label>
        <input type="number" min="1" max="5" data-hab-nivel="${i}" value="${h.nivel}"></div>
      <div><label>Tipo</label>
        <select data-hab-campo="${i}|tipo">
          ${TIPOS_HABILIDADE.map(t => `<option value="${t.id}" ${t.id===h.tipo?'selected':''}>${t.nome}</option>`).join('')}
        </select></div>
      <div><label>Custo de PE</label>
        <input type="number" min="0" data-hab-num="${i}|custoPe" value="${h.custoPe}"></div>
    </div>
    <p class="mini" style="margin-top:4px">Custo padrão pro Nível ${h.nivel}: ${custoFinal ?? '—'} PE${meiaCusto ? ' (já com a metade da Segunda Ascensão)' : ''}</p>
    <p class="mini" style="margin:8px 0">${(TIPOS_HABILIDADE.find(t=>t.id===h.tipo)||TIPOS_HABILIDADE[2]).sobre}</p>
    ${h.tipo === 'sustentada' ? `<p class="mini" style="color:var(--alerta);font-weight:600">⚠ Sustentada não pode causar Dano nem dar Cura — só serve pra Buff em você mesmo.</p>` : ''}
    <div style="margin-top:10px">
      <label>O que ela faz (marque um ou mais)</label>
      <div class="grade g2">
        ${EFEITOS_HABILIDADE.map(e => `<label class="checagem" style="padding:4px 0">
          <input type="checkbox" data-hab-efeito="${i}|${e.chave}" ${h.efeitos&&h.efeitos[e.chave]?'checked':''}> ${e.rotulo}
        </label>`).join('')}
      </div>
      ${h.tipo === 'sustentada' && efeitosEscolhidos.length > 1 ? `<p class="mini" style="color:var(--alerta)">Sustentada (+2) combinando ${efeitosEscolhidos.length} efeitos (−1): Nível efetivo ${nivelEfetivo} (era ${h.nivel}).</p>` : h.tipo === 'sustentada' ? `<p class="mini" style="color:var(--alerta)">Sustentada: Nível efetivo sobe pra ${nivelEfetivo} (era ${h.nivel}), por já ter duas desvantagens embutidas.</p>` : efeitosEscolhidos.length > 1 ? `<p class="mini" style="color:var(--alerta)">Combinando ${efeitosEscolhidos.length} efeitos: Nível efetivo cai pra ${nivelEfetivo} (era ${h.nivel}).</p>` : ''}
      ${efeitosEscolhidos.length ? `<div class="grade g2" style="margin-top:8px">
        ${efeitosEscolhidos.map(e => `<div class="derivado">
          <div class="rot">${e.rotulo}</div>
          <div class="val" style="font-size:18px">${linhaTabela[e.coluna]}</div>
        </div>`).join('')}
      </div>` : `<p class="mini">Marque ao menos um efeito pra calcular o bônus sozinho.</p>`}
    </div>
    <div class="linha" style="margin-top:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 10px;border:1px solid var(--borda);border-radius:8px">
      <span class="mini" style="${h.ativa?'color:var(--roxo-forte)':''}">
        ${h.tipo === 'imediata' ? 'Instantânea — não fica ativa'
          : h.ativa
            ? (h.tipo === 'duradoura'
              ? `🟣 Ativa — ${h.duracaoRestante ?? '?'} round(s) restante(s)`
              : `🟣 Ativa (sustentada) — gasta ${Math.ceil((h.custoPe||0)/2)} PE a cada "⏭ Passar Round"`)
            : '⚪ Inativa'}
      </span>
      <button data-hab-ativar="${i}" class="${h.ativa?'perigo':'destaque'}">
        ${(() => {
          const sufixoReacao = h.reacao ? ' como Reação' : '';
          if(h.tipo === 'imediata') return `Usar${sufixoReacao} (−${h.custoPe||0} PE)`;
          return h.ativa ? 'Desativar' : `Ativar${sufixoReacao} (−${h.custoPe||0} PE)`;

      <label class="checagem">

      </label>
    </div>
  </div>`;
}

function habilidadeResumoCombate(h, i){
  const efeitosEscolhidos = habilidadeEfeitosEscolhidos(h);
  const nivelEfetivo = habilidadeNivelEfetivo(h);
  const linhaTabela = TABELA_HABILIDADE[nivelEfetivo-1];
  const resumoEfeitos = efeitosEscolhidos.map(e => `${e.rotulo}: ${linhaTabela[e.coluna]}`).join(' · ');
  const tipoNome = (TIPOS_HABILIDADE.find(t=>t.id===h.tipo)||TIPOS_HABILIDADE[2]).nome;
  const sufixoReacao = h.reacao ? ' como Reação' : '';
  const rotuloBotao = h.tipo === 'imediata' ? `Usar${sufixoReacao} (−${h.custoPe||0} PE)`
    : h.ativa ? 'Desativar' : `Ativar${sufixoReacao} (−${h.custoPe||0} PE)`;
  return `<div class="linha" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 10px;border:1px solid var(--borda);border-radius:8px;margin-top:8px">
    <div>
      <strong>${esc(h.nome)||'(sem nome)'}</strong>
      <p class="mini">${tipoNome} · Nível ${h.nivel}${nivelEfetivo!==h.nivel?` (efetivo ${nivelEfetivo})`:''}${h.tipo === 'sustentada' ? ' · sem Dano/Cura' : ''}${h.reacao?' · reação':''}</p>
      ${resumoEfeitos ? `<p class="mini">${resumoEfeitos}</p>` : ''}
      <span class="mini" style="${h.ativa?'color:var(--roxo-forte)':''}">
        ${h.tipo === 'imediata' ? 'Instantânea — não fica ativa'
          : h.ativa
            ? (h.tipo === 'duradoura' ? `🟣 Ativa — ${h.duracaoRestante ?? '?'} round(s) restante(s)` : `🟣 Ativa (sustentada) — gasta ${Math.ceil((h.custoPe||0)/2)} PE a cada round`)
            : '⚪ Inativa'}
      </span>
    </div>
    <button data-hab-ativar="${i}" class="${h.ativa?'perigo':'destaque'}">${rotuloBotao}</button>
  </div>`;
}

      <input type="checkbox" data-asc-check="segunda" ${p.ascensao.segunda?'checked':''} ${p.ascensao.primeira?'':'disabled'}>
      Já alcancei a Segunda Ascensão
    </label>
    ${p.ascensao.segunda ? `
    <ul style="margin:12px 0 0;padding-left:20px">
      <li style="margin-bottom:6px">Pode criar uma Imersão Espiritual (card abaixo).</li>
      <li style="margin-bottom:6px">Habilidades de Nível 3 ou menor agora custam metade do PE.</li>
      <li style="margin-bottom:6px">O teto de Atributo sobe de 10 pra 15.</li>
      <li style="margin-bottom:6px">Pode evoluir além do Nível 20.</li>
      <li style="margin-bottom:6px">A cada 3 Níveis depois do 20 (começando com um no próprio Nível 20),
        escolha uma Habilidade pra "ascender": ela sobe 1 Nível sem gastar
        PE extra. Ascender uma Habilidade Nível 5 já aprimorada pro Nível 7
        faz ela virar uma <strong>Habilidade Máxima</strong> — usável 1x por
        cena, custa 25 PE, dá bônus de acerto igual ao seu Nível, pode ser

      <input id="c-asc-habascendidas" data-asc-habascendidas type="number" min="0" value="${p.ascensao.habilidadesAscendidas}"></div>
    <p class="mini" style="margin-top:4px">Vagas disponíveis no seu Nível
      atual: ${1 + Math.floor(Math.max(0, p.nivel-20)/3)} (a partir do

  </div>
  ${p.ascensao.segunda ? `<div class="cartao">
    <h3 style="font-size:16px;margin-bottom:10px">Imersão Espiritual</h3>

      <input type="checkbox" data-ime-check="ativa" ${p.imersao.ativa?'checked':''}> Já criei uma Imersão Espiritual

    ${p.imersao.ativa ? `

      <div><label for="c-ime-tipo">Tipo</label>
        <select id="c-ime-tipo" data-ime-select="tipoId">
          <option value="">— escolha —</option>
          ${TIPOS_IMERSAO.map(t => `<option value="${t.id}" ${p.imersao.tipoId===t.id?'selected':''}>${t.nome}</option>`).join('')}
        </select></div>
    </div>
    ${p.imersao.tipoId ? `<p class="mini" style="margin-top:6px">${TIPOS_IMERSAO.find(t=>t.id===p.imersao.tipoId).exemplo}</p>` : ''}
    <label for="c-ime-descricao" style="margin-top:10px">O que ela faz</label>
    <textarea id="c-ime-descricao" data-ime-campo="descricao" rows="2">${esc(p.imersao.descricao)}</textarea>
    <div class="grade g2" style="margin-top:10px">
      <div><label for="c-ime-bonus">Bônus contínuo</label>
        <select id="c-ime-bonus" data-ime-select="bonusId">
          <option value="">— escolha —</option>
          ${BONUS_IMERSAO.map(b => `<option value="${b.id}" ${p.imersao.bonusId===b.id?'selected':''}>${b.nome}</option>`).join('')}

      <div><label for="c-ime-tiers">Fortalecer/enfraquecer (-3 a +3)</label>
        <input id="c-ime-tiers" data-ime-tiers type="number" min="-3" max="3" value="${p.imersao.tiers}"></div>
    </div>
    ${p.imersao.bonusId ? `<p class="mini" style="margin-top:6px">${BONUS_IMERSAO.find(b=>b.id===p.imersao.bonusId).texto}</p>` : ''}
    <div class="grade g2" style="margin-top:10px">
      <div class="derivado"><div class="rot">PV da Imersão</div><div class="val">${pvImersao(p)}</div><div class="obs">Nível × Sabedoria</div></div>

}
