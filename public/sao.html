<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Sistema SAO</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
  --verde:#4c8c5b; --laranja:#c97a2e; --vermelho:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s,transform .12s;
}
button:hover{border-color:var(--suave)}
button:not(:disabled):active{transform:scale(.95)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px;
  transition:box-shadow .18s ease, transform .18s ease}
.cartao:hover{box-shadow:0 4px 16px rgba(0,0,0,.35); transform:translateY(-2px)}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.risco .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.resumo-nivel{border:1px solid rgba(224,162,52,.5); background:rgba(224,162,52,.1);
  border-radius:8px; padding:12px 14px; font-size:13px; margin-top:14px}
.resumo-nivel h3{margin:0 0 6px; font-size:15px; color:var(--ambar-forte); font-family:Georgia,serif}

/* Animação de entrada ao trocar de tela (aba, Modo Guiado, Level Up) — a
   classe "entra" só é aplicada pelo render() quando a tela muda de verdade,
   nunca a cada tecla digitada (senão o conteúdo "piscaria" toda hora). Fica
   em #app (nunca recriado) em vez de numa div nova, de propósito. */
@keyframes fadeSlideIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
#app.entra{animation:fadeSlideIn .32s ease-out}
@keyframes brilhoNivel{0%{text-shadow:0 0 0 transparent} 35%{text-shadow:0 0 14px var(--ambar)} 100%{text-shadow:0 0 0 transparent}}
#app.entra .resumo-nivel h3{animation:brilhoNivel 1.2s ease-out}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.classe-linha{display:grid; grid-template-columns:1fr 90px auto; gap:10px; align-items:end; margin-bottom:10px}
.linha-lista{border:1px solid var(--borda); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--superficie-alta)}
.linha-lista .topo{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.cursor{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px}
.cursor.verde{background:var(--verde)}
.cursor.laranja{background:var(--laranja)}
.cursor.vermelho{background:var(--vermelho)}
.barra-skill{height:6px; border-radius:99px; background:var(--borda); overflow:hidden; margin-top:6px}
.barra-skill span{display:block; height:100%; background:var(--ambar)}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Sistema SAO</span>
  <a id="linkFichas" href="/fichas" hidden style="color:var(--ambar);text-decoration:none;font-size:13px">← Fichas</a>
  <button id="btModoGuiado" style="font-size:13px">🧭 Modo Guiado</button>
  <label id="labelCompartilhar" style="display:none;align-items:center;gap:6px;font-size:12px;color:var(--suave);text-transform:none;letter-spacing:normal">
    <input type="checkbox" id="chkCompartilhar" style="width:auto">
    Compartilhar (link de leitura)
  </label>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <button id="btExportar">Exportar</button>
  <button id="btImportar">Importar</button>
  <input type="file" id="arquivo" accept="application/json" hidden>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>
<main id="app"></main>
<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — SISTEMA SAO (homebrew original do Zé)

   Este é o CHASSI do sistema (decisão #17 do Hub: cada sistema de regras é
   um módulo próprio). Ele responde as sete perguntas de ARQUITETURA.md:
   atributos, criação, derivados, teste, condições, progressão e ficha —
   com um catálogo inicial pequeno de classes/skills, que cresce em fatias
   futuras (igual o Fabula Ultima foi ganhando classe por classe).

   Inspiração de três obras (não é ficha de nenhuma delas — é design
   original, sem texto/nome protegido de nenhuma):
   - Sword Art Online: sem separar "personagem" de "jogo" — o próprio
     personagem vê PV/PM, nível e nome de golpe na tela. Golpes assistidos
     pelo sistema (Sword Skills) com uma janela de vulnerabilidade depois.
   - Overgeared (Satisfy): multiclasse sem limite, cada skill sobe de
     estágio com o USO (não é escolha em lista), e morrer pesa caro (perde
     XP, pode derrubar item) mas não é definitivo.
   - Shangri-La Frontier: nível não é tudo — dar valor a estudar o próprio
     sistema (a aba Skills existe pra registrar isso).

   Os personagens ficam no SEU navegador (localStorage), igual o Fabula
   Ultima e o Kaizoku no Sho começaram (decisão #40) — Modo Hub (salvar na
   conta) é fatia futura, quando o resto do sistema estiver rodando numa
   mesa de verdade.
   =========================================================================== */

/* --- Regras do sistema, em forma de dados -------------------------------- */

// Mesma escala de dado do Fabula Ultima (decisão da conversa: reaproveitar
// o estilo de teste que os jogadores já conhecem). Teste = rola os dois
// dados dos atributos pedidos + soma, contra uma Dificuldade que o mestre
// define. Os dois dados iguais e 6+: sucesso crítico. Os dois em 1: falha
// crítica — igual o Escudo do Mestre do Fabula Ultima já explica.
const ESCALA = [6, 8, 10, 12];

const ATRIBUTOS = [
  {id:'forca',     nome:'Força',     abrev:'FOR', sobre:'dano corpo a corpo, capacidade de carga'},
  {id:'agilidade', nome:'Agilidade', abrev:'AGI', sobre:'iniciativa, evasão, ataque à distância'},
  {id:'mente',     nome:'Mente',     abrev:'MEN', sobre:'magia, PM, percepção do sistema'},
  {id:'vontade',   nome:'Vontade',   abrev:'VON', sobre:'resistência mental, foco, negociação'},
];

const PERFIS = [
  {id:'especializado', nome:'Especializado',     dados:[10,10,6,6]},
  {id:'mediano',       nome:'Mediano',           dados:[10,8,8,6]},
  {id:'toda-obra',     nome:'Pau pra toda obra', dados:[8,8,8,8]},
];

const CURSORES = [
  {id:'verde',    nome:'Verde — jogador comum',                  sobre:'nunca atacou outro jogador'},
  {id:'laranja',  nome:'Laranja — criminoso',                    sobre:'atacou outro jogador (PvP), mas não matou'},
  {id:'vermelho', nome:'Vermelho — assassino',                   sobre:'matou outro jogador dentro do jogo'},
];

// Classes acumulam sem limite (multiclasse — decisão da conversa). Cada uma
// só marca uma "família" (o que ela É), sem números fixos: os poderes de
// cada classe são fatia futura, igual o Fabula Ultima ganhou os catálogos
// depois do chassi básico existir.
const CATEGORIAS_CLASSE = [
  {id:'combate',  nome:'Combate',  sobre:'skills de ataque e defesa — sobe fácil brigando com monstro'},
  {id:'producao', nome:'Produção', sobre:'fabricar, refinar e vender itens'},
  {id:'outras',   nome:'Outras',   sobre:'utilidade fora de combate — fraca em briga, sem ofício'},
];

const CLASSES = [
  {id:'espadachim', nome:'Espadachim', categoria:'combate'},
  {id:'arcanista',  nome:'Arcanista',  categoria:'combate'},
  {id:'batedor',    nome:'Batedor',    categoria:'combate'},

/* --- Cálculos -------------------------------------------------------------- */

// Nível geral é a soma dos níveis de todas as classes com pelo menos 1
// ponto — sem teto artificial de "3 classes" como o Fabula Ultima, porque
// aqui multiclasse é ilimitada de propósito.
function nivelGeral(p){
  const soma = p.classes.reduce((total, c) => total + (c.classeId ? (c.nivel||0) : 0), 0);
  return Math.max(1, soma);
}

// Nível investido numa classe específica — soma se ela aparecer em mais de
// uma linha (a UI não incentiva isso, mas o cálculo fica robusto de qualquer
// jeito). É o teto de pontos de poder daquela classe.
function nivelDeClasse(p, classeId){
  return p.classes.reduce((total,c) => total + (c.classeId===classeId ? (c.nivel||0) : 0), 0);
}

// Lista de classes em que o personagem já investiu ao menos 1 nível, sem
// repetir — é o que decide quais cartões aparecem na aba Poderes.
function classesInvestidas(p){
  const vistos = new Set();
  return p.classes
    .filter(c => c.classeId && nivelDeClasse(p, c.classeId) > 0 && !vistos.has(c.classeId) && vistos.add(c.classeId))
    .map(c => c.classeId);
}

// Quantos pontos de poder já foram gastos numa classe — soma de todas as
// compras (incluindo as repetidas dos poderes com max > 1).
function pontosUsadosClasse(p, classeId){
  const mapa = p.poder.escolhas[classeId] || {};
  return Object.values(mapa).reduce((total,n) => total + (n||0), 0);
}

// Bônus automático que itens EQUIPADOS (e não quebrados) somam num derivado
// específico — mesma ideia dos acessórios do Fabula Ultima: só automatiza o
// que é um número sempre visível na ficha (decisão #57 do Hub).
function bonusInventario(p, tipo){
  return (p.inventario||[]).reduce((total, it) => {
    const quebrado = (it.durabilidadeMaxima||0) > 0 && (it.durabilidadeAtual||0) <= 0;
    return total + (it.equipado && !quebrado && it.efeitoTipo === tipo ? (it.efeitoValor||0) : 0);
  }, 0);
}

// Fórmulas de partida — dá pra ajustar na mesa se o número não bater com o
// ritmo da campanha, igual o Fabula Ultima deixa vários derivados editáveis
// à mão (decisão #57 do Hub).
function pvMaximo(p){ return 10 + nivelGeral(p)*3 + p.atributos.forca + bonusInventario(p,'pvMaximo'); }
function pmMaximo(p){ return 5 + nivelGeral(p)*2 + p.atributos.mente + bonusInventario(p,'pmMaximo'); }
function defesa(p){ return 8 + Math.floor(p.atributos.agilidade/2) + (p.bonus.defesa||0) + bonusInventario(p,'defesa'); }
function defesaMagica(p){ return 8 + Math.floor(p.atributos.vontade/2) + (p.bonus.defesaMagica||0) + bonusInventario(p,'defesaMagica'); }
function iniciativa(p){ return Math.floor(p.atributos.agilidade/2) + (p.bonus.iniciativa||0) + bonusInventario(p,'iniciativa'); }
function pvRisco(p){ return Math.floor(pvMaximo(p)/2); }

// Capacidade de carga: ligada à Força, igual Overgeared usa STR pro peso
// que dá pra carregar. Some o peso de TODO item na mochila, equipado ou não.
function pesoMaximo(p){ return 10 + p.atributos.forca*2; }
function pesoAtual(p){ return (p.inventario||[]).reduce((total,it) => total + (it.peso||0), 0); }

// Se o personagem já comprou este poder específico — usado pra ligar o
// desconto de "Faro pra Barganha" no preço de compra, sem precisar
// codificar isso na aba Poderes.
function temPoder(p, classeId, poderId){
  return ((p.poder.escolhas[classeId]||{})[poderId] || 0) > 0;
}

// Carteira em Ouro/Prata (100 Prata = 1 Ouro, mesma proporção do
// Overgeared/Satisfy). Gastar/receber sempre passa por aqui, pra nunca
// deixar a Prata "estourar" 100 sem virar Ouro.
function totalPrata(p){ return (p.carteira.ouro||0)*100 + (p.carteira.prata||0); }
function normalizarCarteira(p){
  const total = Math.max(0, totalPrata(p));
  p.carteira.ouro = Math.floor(total/100);
  p.carteira.prata = total % 100;
}
function gastarPrata(p, valor){
  const restante = totalPrata(p) - valor;
  if(restante < 0) return false;
  p.carteira.ouro = 0; p.carteira.prata = restante;
  normalizarCarteira(p);
  return true;
}
function receberPrata(p, valor){
  const total = totalPrata(p) + valor;
  p.carteira.ouro = 0; p.carteira.prata = total;
  normalizarCarteira(p);
}

// Faro pra Barganha (poder do Mercador) desconta 10% de qualquer compra.
function precoCompra(p, precoBase){
  return temPoder(p,'mercador','faro-pra-barganha') ? Math.max(0, Math.round(precoBase*0.9)) : precoBase;
}
function precoVenda(item){ return RARIDADE_PRECO[item.raridade] ?? null; }

// Crafting: funciona igual pra receita do catálogo e pra receita que o
// jogador criou — as duas têm o mesmo formato {nome, materiais, item}.
function temMateriais(p, receita){
  return receita.materiais.every(m => {
    const estoque = (p.materiais||[]).find(x => x.nome.trim().toLowerCase() === m.nome.trim().toLowerCase());
    return estoque && estoque.quantidade >= m.quantidade;
  });
}
function fabricar(p, receita){
  if(!temMateriais(p, receita)) return false;
  receita.materiais.forEach(m => {
    const estoque = p.materiais.find(x => x.nome.trim().toLowerCase() === m.nome.trim().toLowerCase());
    estoque.quantidade -= m.quantidade;
  });
  const it = receita.item;
  p.inventario.push({
    id: uid(), nome: receita.nome, tipo: it.tipo, raridade: it.raridade,
    efeitoTipo: it.efeitoTipo, efeitoValor: it.efeitoValor, peso: it.peso,
    durabilidadeMaxima: it.durabilidadeMaxima, durabilidadeAtual: it.durabilidadeMaxima,
    equipado: false, notas: it.notas,
  });
  return true;
}

/* --- Armazenamento ---------------------------------------------------------

   Presente na URL (?id=...), a ficha vive na conta do Hub em vez do
   navegador: /fichas cria a linha no banco e manda pra cá com o id dela.
   Sem o parâmetro, tudo continua exatamente como sempre — arquivo único,
   localStorage, sem conta nenhuma (decisão #40). Mesmo mecanismo do
   Fabula Ultima e do Kaizoku no Sho.
------------------------------------------------------------------------- */

const MODO_HUB = new URLSearchParams(location.search).get('id');
const CHAVE = 'sao_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

let debounceHub = null;
// No Hub, cada campo salva sozinho na conta (decisão #44) — sem lista
// local, sem botão de salvar. O debounce evita uma requisição por tecla.
function salvarNoHub(){
  clearTimeout(debounceHub);
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    // Resumo genérico pro Hub de Mestre ler sem saber a fórmula de PV
    // deste sistema (decisão #46) — espelhado a cada salvamento.
    p.resumoVida = {atual: Math.max(0, Math.min(pvMaximo(p), p.atual.pv ?? pvMaximo(p))), maxima: pvMaximo(p), rotulo: 'PV'};
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dados: p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    // Falhar em silêncio faria o jogador achar que salvou e perder tudo ao
    // fechar a aba — por isso o aviso precisa aparecer na tela.
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const estado = {
  fichas: MODO_HUB ? [] : carregar(),
  atualId: null,
  aba: 'status',
  carregandoHub: !!MODO_HUB,
  erroHub: null,      // 'nao-encontrado' | null
  // Começa falso de propósito: só vira true depois que o Hub CONFIRMAR que
  // é dono. Enquanto carrega, ou se a busca falhar, o padrão seguro é "não
  // é dono" — senão o interruptor de compartilhar apareceria numa ficha
  // que nem carregou direito.
  ehDono: false,
  compartilhado: false,
  // modoGuiado/passoGuiado: tela alternativa de criação passo a passo — não
  // é dado do personagem, só um jeito diferente de mostrar os mesmos campos.
  modoGuiado: false,
  passoGuiado: 1,
  // nivelUpResumo: resumo transitório do último "+1 Nível" numa classe
  // (antes/depois) — só de exibição, não é salvo na ficha; some ao fechar
  // ou ao trocar de personagem.
  nivelUpResumo: null,
};
if(!MODO_HUB && estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

// Busca a ficha no Hub uma vez, no início. Preenche estado.fichas com um só
// personagem — sem lista, sem seletor, exatamente o que /fichas já filtrou.
// Ler não exige ser o dono: se vier ehDono:false, é o link de leitura de
// outra pessoa (o mestre vendo a ficha de um jogador).
async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub = 'nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p];
    estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false;
    render();
  }
}

// Dono liga/desliga o link de leitura. Quem não é dono nem vê este controle.
function alternarCompartilhado(valor){
  estado.compartilhado = valor;
  render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({compartilhado: valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(mudanca){
  if(MODO_HUB && !estado.ehDono) return; // defesa extra: modo leitura não edita
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounce = null;
function mudarSemRedesenhar(mudanca, elemento){
  if(MODO_HUB && !estado.ehDono) return; // defesa extra: modo leitura não edita
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Desenho da tela --------------------------------------------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ABAS = [
  {id:'status',      nome:'Status'},
  {id:'mundo',       nome:'Mundo'},
  {id:'classes',     nome:'Classes'},
  {id:'poderes',     nome:'Poderes'},
  {id:'combate',     nome:'Combate'},
  {id:'equipamento', nome:'Equipamento'},
  {id:'crafting',    nome:'Crafting'},
  {id:'loja',        nome:'Loja'},
  {id:'golpes',      nome:'Golpes e Magias'},
  {id:'skills',      nome:'Skills'},
  {id:'notas',       nome:'Notas'},
];

// Guarda qual "tela" estava visível no render anterior, pra só tocar a
// animação de entrada quando ela muda de verdade (troca de aba, entra/sai
// do Modo Guiado ou do Level Up) — nunca a cada tecla digitada.
let ultimaChaveTela = null;

function render(){
  desenharBarra();
  const app = document.getElementById('app');

  if(MODO_HUB && estado.carregandoHub){
    app.innerHTML = `<div class="vazio"><h2>Carregando…</h2></div>`;
    return;
  }
  if(MODO_HUB && estado.erroHub === 'nao-encontrado'){
    app.innerHTML = `<div class="vazio">
      <h2>Ficha não encontrada</h2>
      <p class="mini">Ela pode ter sido apagada, ou não é sua.
      <a href="/fichas" style="color:var(--ambar)">Voltar para Fichas</a></p></div>`;
    return;
  }

  const p = atual();

  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em "+ Novo" para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const somenteLeitura = MODO_HUB && !estado.ehDono;

  const alerta = somenteLeitura
    ? `<div class="ok">Modo leitura — você está vendo a ficha de
       <strong>${esc(p.perfil.nome)}</strong>. Só quem é dono edita.</div>`
    : falhouAoSalvar
      ? (MODO_HUB
        ? `<div class="aviso"><strong>Não consegui salvar no Hub.</strong>
           Confira sua internet — se cair, exporte para não perder o que você
           preencheu.</div>`
        : `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
           Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
           perder o que você preencheu.</div>`) : '';

  app.innerHTML = estado.modoGuiado
    ? alerta + telaGuiada(p)
    : estado.nivelUpResumo
      ? alerta + telaResumoNivel(p, estado.nivelUpResumo)
      : alerta
        + `<div class="abas">` + ABAS.map(a =>
            `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
          ).join('') + `</div>`
        + painelDerivados(p)
        + ({status:abaStatus, mundo:abaMundo, classes:abaClasses, poderes:abaPoderes, combate:abaCombate, equipamento:abaEquipamento, crafting:abaCrafting, loja:abaLoja, golpes:abaGolpesMagias, skills:abaSkills, notas:abaNotas}[estado.aba])(p);

  // Anima a troca de tela sem acrescentar nenhuma div nova dentro do HTML
  // (uma div extra mudou o tempo de remoção do DOM o suficiente pra expor
  // uma race rara do Chromium com blur+innerHTML em testes automatizados) —
  // #app em si nunca é recriado, só o conteúdo dentro dele, então basta
  // tirar e recolocar a classe pra reiniciar a animação.
  const chaveTela = estado.modoGuiado ? `guiado:${estado.passoGuiado}`
    : estado.nivelUpResumo ? 'levelup'
    : `aba:${estado.aba}`;
  app.classList.remove('entra');
  if(chaveTela !== ultimaChaveTela){
    void app.offsetWidth; // força reflow pra CSS "esquecer" o estado anterior
    app.classList.add('entra');
  }
  ultimaChaveTela = chaveTela;

  ligarEventos();

  // Modo leitura: desliga todo campo/botão de edição, menos as próprias
  // abas (a pessoa ainda precisa navegar pra ver o resto da ficha).
  if(somenteLeitura){
    app.querySelectorAll('input, select, textarea, button:not([data-aba])')
      .forEach(el => el.disabled = true);
  }
}

function desenharBarra(){
  const btModoGuiado = document.getElementById('btModoGuiado');
  btModoGuiado.hidden = !atual() || !!estado.nivelUpResumo;
  btModoGuiado.textContent = estado.modoGuiado ? '📋 Ver ficha completa' : '🧭 Modo Guiado';
  btModoGuiado.className = estado.modoGuiado ? 'destaque' : '';

  // No Hub, /fichas já é a lista de personagens (decisão #42) — o seletor,
  // o "+ Novo" e o "Excluir" desta barra são só do modo local (arquivo
  // avulso, sem conta). "← Fichas" some no modo local pelo mesmo motivo.
  if(MODO_HUB){
    document.getElementById('seletor').hidden = true;
    document.getElementById('btNovo').hidden = true;
    document.getElementById('btExcluir').hidden = true;
    document.getElementById('linkFichas').hidden = false;

    // Só o dono decide compartilhar. Quem está vendo por um link
    // compartilhado nem editar consegue, então Importar também some.
    //
    // Escondido via style.display, não via atributo `hidden`: esta página
    // tem uma regra própria `label{display:block}` que, por ser do autor,
    // vence a regra `[hidden]{display:none}` do navegador — o atributo
    // ficaria ligado sem esconder nada. Estilo em linha sempre vence.
    const labelCompartilhar = document.getElementById('labelCompartilhar');
    labelCompartilhar.style.display = estado.ehDono ? 'flex' : 'none';
    document.getElementById('chkCompartilhar').checked = estado.compartilhado;
    document.getElementById('btImportar').hidden = !estado.ehDono;
    return;
  }
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

// Painel sempre visível: os quatro números que se consulta o tempo todo
// numa sessão — igual uma janela de status de jogo de verdade.
function painelDerivados(p){
  const pv = p.atual.pv ?? pvMaximo(p);
  const emRisco = pv <= pvRisco(p);
  return `<div class="grade g4" style="margin-bottom:14px">
    <div class="derivado ${emRisco?'risco':''}">
      <div class="rot">Pontos de Vida</div>
      <div class="val">${pv}<span style="font-size:16px;color:var(--suave)">/${pvMaximo(p)}</span></div>
      <div class="obs">${emRisco ? 'em risco' : 'risco em ' + pvRisco(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Pontos de Mana</div>
      <div class="val">${p.atual.pm ?? pmMaximo(p)}<span style="font-size:16px;color:var(--suave)">/${pmMaximo(p)}</span></div>
      <div class="obs">5 + nível×2 + Mente</div>
    </div>
    <div class="derivado">
      <div class="rot">Defesa</div>
      <div class="val">${defesa(p)}</div>
      <div class="obs">mágica ${defesaMagica(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Nível</div>
      <div class="val">${nivelGeral(p)}</div>
      <div class="obs">iniciativa ${iniciativa(p)} · suba na aba Classes</div>
    </div>
  </div>`;
}

function campo(rotulo, chave, valor, tipo){
  return `<div><label for="c-${chave}">${rotulo}</label>
    <input id="c-${chave}" data-perfil="${chave}" type="${tipo||'text'}" value="${esc(valor)}"></div>`;
}

// --- Modo Guiado: criação passo a passo. Reusa os mesmos campos/ids da
// ficha normal (campo/blocoAtributosSAO/linhaClasse) — ligarEventos() liga
// tudo de novo a cada render(), então nenhum binding novo é preciso pra eles.
function telaGuiada(p){
  const passo = estado.passoGuiado;
  const totalPassos = 3;
  const cabecalho = `
    <div class="cartao" style="text-align:center">
      <p class="mini" style="text-transform:uppercase;letter-spacing:.1em">Modo Guiado — Passo ${passo} de ${totalPassos}</p>
      <div style="display:flex;justify-content:center;gap:6px;margin-top:8px">
        ${Array.from({length: totalPassos}, (_, i) => i+1).map(n =>
          `<span style="width:26px;height:4px;border-radius:2px;background:${n<=passo?'var(--ambar)':'var(--borda)'}"></span>`).join('')}
      </div>
    </div>`;

  if(passo === 1){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">1. Quem é seu jogador?</h2>
      <p class="mini" style="margin:6px 0 14px">
        Este é o personagem que joga dentro do mundo virtual — nome de
        verdade e apelido no jogo podem ser bem diferentes.
      </p>
      <div class="grade g2">
        ${campo('Nome de verdade','nome',p.perfil.nome)}
        ${campo('Apelido no jogo','apelido',p.perfil.apelido)}
      </div>
    </div>
    <div class="cartao">
      <h2 style="font-size:18px">Perfil de Atributos</h2>
      <p class="mini" style="margin:6px 0 14px">
        Escolha um perfil de distribuição — ele já preenche os quatro
        Atributos com um dado cada; dá pra ajustar no próximo passo.
      </p>
      <div style="max-width:320px">
        <label for="c-perfilatr">Perfil de distribuição</label>
        <select id="c-perfilatr">
          ${PERFIS.map(x => `<option value="${x.id}" ${x.id===p.perfilAtributos?'selected':''}>
            ${x.nome} — ${x.dados.map(d=>'d'+d).join(', ')}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="linha" style="justify-content:flex-end">
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  if(passo === 2){
    return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">2. Atributos e primeira Classe</h2>
      <p class="mini" style="margin:6px 0 16px">
        Os Atributos já vieram do Perfil escolhido — dá pra ajustar aqui.
        Escolha também sua primeira Classe (dá pra somar mais depois, na
        aba Classes — multiclasse não tem limite).
      </p>
      ${blocoAtributosSAO(p)}
    </div>
    <div class="cartao">
      <h3 style="font-size:16px;margin-bottom:10px">Primeira Classe</h3>
      ${linhaClasse(p, 0)}
    </div>
    <div class="linha" style="justify-content:space-between">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoProximo" class="destaque">Próximo →</button>
    </div>`;
  }

  // passo 3: resumo + próximos passos
  return cabecalho + `
    <div class="cartao">
      <h2 style="font-size:18px">3. Pronto pra jogar!</h2>
      <p class="mini" style="margin:6px 0 14px">
        ${esc(p.perfil.nome || 'Seu personagem')} já tem o essencial. Poderes,
        Equipamento e o resto você preenche aos poucos, jogando.
      </p>
    </div>
    ${painelDerivados(p)}
    <div class="linha" style="justify-content:space-between">
      <button id="btGuiadoAnterior">← Voltar</button>
      <button id="btGuiadoConcluir" class="destaque">Concluir — ver ficha completa</button>
    </div>`;
}

// Extraído de abaStatus pra dar pra reusar no Modo Guiado (telaGuiada).

function abaMundo(p){

// Extraído de abaClasses pra dar pra reusar na 1ª classe do Modo Guiado
// (telaGuiada) sem duplicar o select/nível — uma única fonte de verdade.
function linhaClasse(p, i){
  const c = p.classes[i];
  const classe = CLASSES.find(x => x.id === c.classeId);
  const categoria = classe && CATEGORIAS_CLASSE.find(x => x.id === classe.categoria);
  return `<div class="classe-linha">
    <div>
      <label for="c-cl-${i}">${i+1}ª classe</label>
      <select id="c-cl-${i}" data-classe="${i}">
        <option value="">— nenhuma —</option>
        ${CATEGORIAS_CLASSE.map(cat => `<optgroup label="${cat.nome}">
          ${CLASSES.filter(x => x.categoria===cat.id).map(x =>
            `<option value="${x.id}" ${x.id===c.classeId?'selected':''}>${x.nome}</option>`).join('')}
        </optgroup>`).join('')}
      </select>
      ${categoria ? `<p class="mini" style="margin-top:6px">${categoria.nome} — ${categoria.sobre}</p>` : ''}
    </div>
    <div>
      <label for="c-nv-${i}">Nível</label>
      <input id="c-nv-${i}" data-nivel="${i}" type="number" min="0" value="${c.nivel||0}">
    </div>
    <button data-subir-nivel="${i}" class="destaque" ${!c.classeId?'disabled':''} title="Sobe 1 Nível nesta classe: ganha PV, PM e 1 ponto de Poder pra gastar nela">⭐ +1 Nível (sobe PV/PM e dá 1 Poder)</button>
    <button data-remover-classe="${i}" ${p.classes.length<=1?'disabled':''}>Tirar</button>
  </div>`;
}

// Fotografia dos números que mudam só por causa do Nível de uma classe —
// usada pra montar o resumo do botão "+1 Nível".
function snapshotNivelSAO(p){
  return {
    nivelGeral: nivelGeral(p),
    pv: pvMaximo(p),
    pm: pmMaximo(p),
  };
}
// Sobe 1 Nível numa classe específica (índice em p.classes) e guarda o
// resumo em estado.nivelUpResumo. Sem teto — o mestre decide o ritmo.
function subirNivelClasseSAO(p, indice){
  const c = p.classes[indice];
  if(!c || !c.classeId) return;
  const antes = snapshotNivelSAO(p);
  const classeId = c.classeId;
  c.nivel = (c.nivel||0) + 1;
  const depois = snapshotNivelSAO(p);
  estado.nivelUpResumo = {classeId, nivelClasse: c.nivel, antes, depois};
}

// Modo Guiado de Evolução: o resumo já embute os Poderes da classe que
// subiu (o "+1 ponto de poder" fica pronto pra gastar ali mesmo).
function painelResumoNivel(p, resumo){
  const {classeId, nivelClasse, antes, depois} = resumo;
  const nomeClasse = CLASSES.find(x => x.id === classeId)?.nome || classeId;
  const linha = (rotulo, chave) => {
    const a = antes[chave], d = depois[chave];
    if(a === d) return '';
    return `<p class="mini" style="margin:4px 0"><strong>${rotulo}:</strong> ${a} → <span style="color:var(--ambar-forte)">${d}</span></p>`;
  };
  return `<div class="resumo-nivel">
    <h3>⭐ ${esc(nomeClasse)} subiu para Nível ${nivelClasse}! <span style="font-size:11px;color:var(--suave);font-weight:normal">Nível geral ${antes.nivelGeral} → ${depois.nivelGeral}</span></h3>
    <p class="mini" style="margin-bottom:8px">O Nível geral é a soma do nível de todas as classes — subiu porque ${esc(nomeClasse)} subiu. PV e PM máximos dependem do Nível geral, por isso mudam mesmo se você tiver outras classes:</p>
    ${linha('Pontos de Vida máximos', 'pv')}
    ${linha('Pontos de Mana máximos', 'pm')}
    <div style="margin-top:12px">
      <p class="mini" style="color:var(--ambar-forte);margin-bottom:8px">✨ Cada Nível numa classe dá 1 ponto de Poder pra gastar só nela — escolha onde investir o de ${esc(nomeClasse)} agora:</p>
      ${blocoPoderesClasse(p, classeId)}
    </div>
    <button id="btFecharResumoNivel" class="destaque" style="margin-top:16px">Concluir — voltar pra ficha</button>
  </div>`;
}

// Extraído de abaPoderes pra dar pra reusar no resumo do botão "+1 Nível"
// (painelResumoNivel) — a MESMA classe que acabou de subir.
function blocoPoderesClasse(p, classeId){
  const classe = CLASSES.find(x => x.id === classeId);
  const poderes = PODERES_CLASSE[classeId] || [];
  const nivel = nivelDeClasse(p, classeId);
  const usados = pontosUsadosClasse(p, classeId);
  const escolhas = p.poder.escolhas[classeId] || {};
  return `<div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="font-size:18px">${classe.nome}</h2>
      <span class="mini">${usados}/${nivel} pontos de poder usados</span>
    </div>
    ${usados > nivel
      ? `<div class="aviso">Comprou mais poderes do que o nível desta classe permite — devolva algum ou suba o nível dela.</div>`
      : ''}
    ${poderes.map(poder => {
      const n = escolhas[poder.id] || 0;
      const podeComprar = usados < nivel && n < poder.max;
      return `<div class="linha-lista">
        <div class="topo">
          <strong>${poder.nome}${poder.max>1 ? ` (+${poder.max})` : ''}</strong>
          <span class="mini">${n}/${poder.max}</span>
        </div>
        <p class="mini" style="margin-bottom:10px">${poder.texto}</p>
        <div class="linha">
          <button data-poder-menos="${classeId}|${poder.id}" ${n<=0?'disabled':''}>-</button>
          <button data-poder-mais="${classeId}|${poder.id}" ${podeComprar?'':'disabled'}>+ Comprar</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function abaPoderes(p){
  const investidas = classesInvestidas(p);

    return `<div class="cartao vazio">

      Classes — os poderes dela aparecem aqui.</p></div>`;

}

function cartaoReceita(p, receita, indiceCustom){
  const classe = CLASSES.find(c => c.id === receita.classe);
  const temClasse = classe && nivelDeClasse(p, classe.id) > 0;
  const pronta = temClasse && temMateriais(p, receita);
  const listaMateriais = receita.materiais.map(m => {
    const estoque = (p.materiais||[]).find(x => x.nome.trim().toLowerCase() === m.nome.trim().toLowerCase());
    const tem = estoque && estoque.quantidade >= m.quantidade;
    return `<span style="color:${tem?'var(--suave)':'var(--alerta)'}">${m.quantidade}× ${esc(m.nome)}</span>`;
  }).join(', ');
  const raridade = RARIDADES.find(r => r.id === receita.item.raridade);
  return `<div class="linha-lista">
    <div class="topo">
      <strong>${esc(receita.nome) || 'Receita sem nome'}</strong>
      <button data-fabricar="${indiceCustom===undefined?'catalogo':'custom'}|${indiceCustom===undefined?receita.id:indiceCustom}" ${pronta?'':'disabled'}>Fabricar</button>
    </div>
    <p class="mini">Pede: ${listaMateriais || '(nenhum material definido ainda)'}</p>
    <p class="mini">Classe: ${classe?classe.nome:'—'}${classe && !temClasse ? ' (precisa de ao menos 1 nível nela)' : ''} · resulta em ${esc(receita.nome)}${raridade?` (${raridade.nome})`:''}</p>
  </div>`;
}

/* --- Eventos --------------------------------------------------------------

   O `render` reescreve a tela inteira, então os eventos são religados a
   cada desenho — mesmo caminho do Fabula Ultima e do Kaizoku no Sho.
------------------------------------------------------------------------- */

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  // Navegação do Modo Guiado — só existem quando estado.modoGuiado está ativo.
  const btGuiadoProximo = app.querySelector('#btGuiadoProximo');
  if(btGuiadoProximo) btGuiadoProximo.onclick = () => { estado.passoGuiado += 1; render(); };
  const btGuiadoAnterior = app.querySelector('#btGuiadoAnterior');
  if(btGuiadoAnterior) btGuiadoAnterior.onclick = () => { estado.passoGuiado -= 1; render(); };
  const btGuiadoConcluir = app.querySelector('#btGuiadoConcluir');
  if(btGuiadoConcluir) btGuiadoConcluir.onclick = () => {
    estado.modoGuiado = false;
    estado.aba = 'status';
    render();
  };

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.perfil[el.dataset.perfil] = el.value, el));

  app.querySelectorAll('[data-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.campo] = el.value, el));

  app.querySelectorAll('[data-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.num] = Number(el.value) || 0, el));

  app.querySelectorAll('[data-campo-raiz]').forEach(el =>
    el.onchange = () => mudar(p => p[el.dataset.campoRaiz] = el.value));

  // Aba Mundo: Andar/Zona, Guilda, Títulos, Duelo — tudo campo simples.
  app.querySelectorAll('[data-andar-num]').forEach(el =>
    el.onchange = () => mudar(p => p.andar[el.dataset.andarNum] = Number(el.value) || 1));
  app.querySelectorAll('[data-andar]').forEach(el =>
    el.onchange = () => mudar(p => p.andar[el.dataset.andar] = el.value));
  app.querySelectorAll('[data-guilda]').forEach(el =>
    el[el.tagName==='SELECT'?'onchange':'oninput'] = () => {
      const mutador = p => p.guilda[el.dataset.guilda] = el.value;
      el.tagName==='SELECT' ? mudar(mutador) : mudarSemRedesenhar(mutador, el);
    });
  app.querySelectorAll('[data-titulo-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.tituloCampo.split('|');
      p.titulos[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-titulo-visao]').forEach(el =>
    el.onchange = () => mudar(p => p.titulos[Number(el.dataset.tituloVisao)].visao = el.value));
  app.querySelectorAll('[data-remover-titulo]').forEach(b =>
    b.onclick = () => mudar(p => p.titulos.splice(Number(b.dataset.removerTitulo), 1)));
  const addTitulo = document.getElementById('btAddTitulo');
  if(addTitulo) addTitulo.onclick = () => mudar(p => p.titulos.push({id:uid(), nome:'', comoConseguiu:'', visao:'neutro'}));
  app.querySelectorAll('[data-duelo]').forEach(el =>
    el[el.tagName==='SELECT'?'onchange':'oninput'] = () => {
      const mutador = p => p.duelo[el.dataset.duelo] = el.value;
      el.tagName==='SELECT' ? mudar(mutador) : mudarSemRedesenhar(mutador, el);
    });

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Number(el.value)));

  const perfilAtr = document.getElementById('c-perfilatr');
  if(perfilAtr) perfilAtr.onchange = () => mudar(p => {
    p.perfilAtributos = perfilAtr.value;
    const modelo = PERFIS.find(x => x.id === perfilAtr.value);
    if(modelo) ATRIBUTOS.forEach((a,i) => p.atributos[a.id] = modelo.dados[i]);
  });

  app.querySelectorAll('[data-classe]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.classe)].classeId = el.value));
  app.querySelectorAll('[data-nivel]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.nivel)].nivel = Number(el.value) || 0));
  app.querySelectorAll('[data-remover-classe]').forEach(b =>
    b.onclick = () => mudar(p => p.classes.splice(Number(b.dataset.removerClasse), 1)));
  const addClasse = document.getElementById('btAddClasse');
  if(addClasse) addClasse.onclick = () => mudar(p => p.classes.push({classeId:'', nivel:0}));

  app.querySelectorAll('[data-subir-nivel]').forEach(b =>
    b.onclick = () => mudar(p => subirNivelClasseSAO(p, Number(b.dataset.subirNivel))));
  const btFecharResumoNivel = document.getElementById('btFecharResumoNivel');
  if(btFecharResumoNivel) btFecharResumoNivel.onclick = () => { estado.nivelUpResumo = null; render(); };

  // Poderes: os data-attrs guardam "classeId|poderId" juntos, separados por
  // "|", porque um botão só aceita um valor — mesmo truque do Fabula Ultima.
  app.querySelectorAll('[data-poder-mais]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [classeId, poderId] = b.dataset.poderMais.split('|');
      const def = PODERES_CLASSE[classeId].find(x => x.id === poderId);
      const mapa = p.poder.escolhas[classeId] || (p.poder.escolhas[classeId] = {});
      if(pontosUsadosClasse(p, classeId) >= nivelDeClasse(p, classeId)) return;
      mapa[poderId] = Math.min(def.max, (mapa[poderId] || 0) + 1);
    }));
  app.querySelectorAll('[data-poder-menos]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [classeId, poderId] = b.dataset.poderMenos.split('|');
      const mapa = p.poder.escolhas[classeId]; if(!mapa) return;
      mapa[poderId] = Math.max(0, (mapa[poderId] || 0) - 1);
    }));

  const switchAtivo = document.getElementById('c-switch-ativo');
  if(switchAtivo) switchAtivo.onchange = () => mudar(p => p.switchAtivo.ativo = switchAtivo.checked);
  app.querySelectorAll('[data-switch]').forEach(el =>
    el[el.tagName==='SELECT'?'onchange':'oninput'] = () =>
      (el.tagName==='SELECT' ? mudar : mudarSemRedesenhar)(p => p.switchAtivo[el.dataset.switch] = el.value, el));

  app.querySelectorAll('[data-condicao]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicao;
      p.condicoes = el.checked ? [...p.condicoes, id] : p.condicoes.filter(c => c !== id);
    }));

  const morteAtiva = document.getElementById('c-morte-ativa');
  if(morteAtiva) morteAtiva.onchange = () => mudar(p => p.penalidadeMorte.ativa = morteAtiva.checked);
  app.querySelectorAll('[data-morte]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const chave = el.dataset.morte;
      p.penalidadeMorte[chave] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
    }, el));
  const btCalcularPerda = document.getElementById('btCalcularPerda');
  if(btCalcularPerda) btCalcularPerda.onclick = () => mudar(p => {
    p.penalidadeMorte.xpPerdido = Math.floor((p.xp||0) * 0.1);
  });

  const permadeathAtivo = document.getElementById('c-permadeath-ativo');
  if(permadeathAtivo) permadeathAtivo.onchange = () => mudar(p => p.permadeath.ativo = permadeathAtivo.checked);
  const permadeathMorreu = document.getElementById('c-permadeath-morreu');
  if(permadeathMorreu) permadeathMorreu.onchange = () => mudar(p => p.permadeath.morreu = permadeathMorreu.checked);
  app.querySelectorAll('[data-permadeath]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.permadeath[el.dataset.permadeath] = el.value, el));

  app.querySelectorAll('[data-corporeal]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.corpoReal[el.dataset.corporeal] = el.value, el));
  const corpoRisco = document.getElementById('c-corpo-risco');
  if(corpoRisco) corpoRisco.onchange = () => mudar(p => p.corpoReal.emRisco = corpoRisco.checked);

  app.querySelectorAll('[data-bonus]').forEach(el =>
    el.onchange = () => mudar(p => p.bonus[el.dataset.bonus] = Number(el.value) || 0));

  app.querySelectorAll('[data-golpe-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.golpeCampo.split('|');
      p.golpes[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-golpe-origem]').forEach(el =>
    el.onchange = () => mudar(p => p.golpes[Number(el.dataset.golpeOrigem)].origem = el.value));
  app.querySelectorAll('[data-remover-golpe]').forEach(b =>
    b.onclick = () => mudar(p => p.golpes.splice(Number(b.dataset.removerGolpe), 1)));
  const addGolpe = document.getElementById('btAddGolpe');
  if(addGolpe) addGolpe.onclick = () => mudar(p =>
    p.golpes.push({id:uid(), nome:'', arma:'', dano:'', posMotion:'', origem:'sistema'}));

  const addGolpeCatalogo = document.getElementById('btAddGolpeCatalogo');
  if(addGolpeCatalogo) addGolpeCatalogo.onclick = () => mudar(p => {
    const sel = document.getElementById('c-catalogo-golpe');
    const item = GOLPES_CATALOGO.find(g => g.id === sel.value); if(!item) return;
    const arma = TIPOS_ARMA.find(a => a.id === item.arma);
    p.golpes.push({id:uid(), nome:item.nome, arma:arma?arma.nome:item.arma, dano:item.dano, posMotion:item.posMotion, origem:'sistema'});
  });

  app.querySelectorAll('[data-magia-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.magiaCampo.split('|');
      p.magias[Number(i)][chave] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
    }, el));
  app.querySelectorAll('[data-remover-magia]').forEach(b =>
    b.onclick = () => mudar(p => p.magias.splice(Number(b.dataset.removerMagia), 1)));
  const addMagia = document.getElementById('btAddMagia');
  if(addMagia) addMagia.onclick = () => mudar(p => p.magias.push({id:uid(), nome:'', custoPm:0, efeito:''}));

  const addMagiaCatalogo = document.getElementById('btAddMagiaCatalogo');
  if(addMagiaCatalogo) addMagiaCatalogo.onclick = () => mudar(p => {
    const sel = document.getElementById('c-catalogo-magia');
    const item = MAGIAS_CATALOGO.find(m => m.id === sel.value); if(!item) return;
    p.magias.push({id:uid(), nome:item.nome, custoPm:item.custoPm, efeito:item.efeito});
  });

  const unicaTem = document.getElementById('c-unica-tem');
  if(unicaTem) unicaTem.onchange = () => mudar(p => p.habilidadeUnica.tem = unicaTem.checked);
  app.querySelectorAll('[data-unica]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.habilidadeUnica[el.dataset.unica] = el.value, el));

  app.querySelectorAll('[data-skill-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.skillCampo.split('|');
      p.skills[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-remover-skill]').forEach(b =>
    b.onclick = () => mudar(p => p.skills.splice(Number(b.dataset.removerSkill), 1)));
  app.querySelectorAll('[data-avancar-skill]').forEach(b =>
    b.onclick = () => mudar(p => {
      const s = p.skills[Number(b.dataset.avancarSkill)];
      const idx = ESTAGIOS_SKILL.findIndex(e => e.id === s.estagio) ?? 0;
      if((s.nivelInterno||1) < 10){
        s.nivelInterno = (s.nivelInterno||1) + 1;
      }else if(idx < ESTAGIOS_SKILL.length - 1){
        s.estagio = ESTAGIOS_SKILL[idx+1].id;
        s.nivelInterno = 1;
      }
    }));
  const addSkill = document.getElementById('btAddSkill');
  if(addSkill) addSkill.onclick = () => mudar(p =>
    p.skills.push({id:uid(), nome:'', categoria:'', estagio:'iniciante', nivelInterno:1}));

  app.querySelectorAll('[data-item-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.itemCampo.split('|');
      p.inventario[Number(i)][chave] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
    }, el));
  // Peso e valor de efeito alimentam os números sempre visíveis (peso
  // carregado, e os derivados que o item alimentar) — por isso usam
  // 'change' com redesenho completo, e não o 'input' com debounce dos
  // campos só descritivos: sem isso, o painel ficaria com o número velho
  // até alguém trocar de aba.
  app.querySelectorAll('[data-item-num]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.itemNum.split('|');
      p.inventario[Number(i)][chave] = Number(el.value) || 0;
    }));
  app.querySelectorAll('[data-item-tipo]').forEach(el =>
    el.onchange = () => mudar(p => p.inventario[Number(el.dataset.itemTipo)].tipo = el.value));
  app.querySelectorAll('[data-item-raridade]').forEach(el =>
    el.onchange = () => mudar(p => p.inventario[Number(el.dataset.itemRaridade)].raridade = el.value));
  app.querySelectorAll('[data-item-efeito]').forEach(el =>
    el.onchange = () => mudar(p => p.inventario[Number(el.dataset.itemEfeito)].efeitoTipo = el.value));
  app.querySelectorAll('[data-item-equipado]').forEach(el =>
    el.onchange = () => mudar(p => p.inventario[Number(el.dataset.itemEquipado)].equipado = el.checked));
  // Durabilidade máxima tem regra própria: se o item estava cheio (ou era
  // novo, sem durabilidade nenhuma), sobe a atual junto — senão, quem já
  // estava com o item quebrado/gasto perderia esse estado só por editar o
  // teto.
  app.querySelectorAll('[data-item-durmax]').forEach(el =>
    el.onchange = () => mudar(p => {
      const it = p.inventario[Number(el.dataset.itemDurmax)];
      const novoMax = Number(el.value) || 0;
      if(!it.durabilidadeMaxima || it.durabilidadeAtual >= it.durabilidadeMaxima) it.durabilidadeAtual = novoMax;
      it.durabilidadeMaxima = novoMax;
    }));
  app.querySelectorAll('[data-remover-item]').forEach(b =>
    b.onclick = () => mudar(p => p.inventario.splice(Number(b.dataset.removerItem), 1)));
  app.querySelectorAll('[data-usar-item]').forEach(b =>
    b.onclick = () => mudar(p => {
      const it = p.inventario[Number(b.dataset.usarItem)];
      it.durabilidadeAtual = Math.max(0, (it.durabilidadeAtual||0) - 1);
    }));
  app.querySelectorAll('[data-reparar-item]').forEach(b =>
    b.onclick = () => mudar(p => {
      const it = p.inventario[Number(b.dataset.repararItem)];
      it.durabilidadeAtual = it.durabilidadeMaxima || 0;
    }));
  const addItem = document.getElementById('btAddItem');
  if(addItem) addItem.onclick = () => mudar(p => p.inventario.push({
    id:uid(), nome:'', tipo:'arma', raridade:'comum', efeitoTipo:'nenhum', efeitoValor:0,
    peso:0, durabilidadeMaxima:0, durabilidadeAtual:0, equipado:false, notas:'',
  }));

  app.querySelectorAll('[data-vender-item]').forEach(b =>
    b.onclick = () => mudar(p => {
      const it = p.inventario[Number(b.dataset.venderItem)];
      const preco = precoVenda(it); if(preco === null) return;
      receberPrata(p, preco);
      p.inventario.splice(Number(b.dataset.venderItem), 1);
    }));

  // Materiais: estoque nomeado que as receitas (catálogo e próprias) leem.
  // A quantidade usa 'change' com redesenho imediato — é ela que decide se
  // o botão "Fabricar" de cada receita fica travado ou não, então não pode
  // ficar esperando o debounce do nome (campo só descritivo) pra atualizar.
  app.querySelectorAll('[data-material-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.materialCampo.split('|');
      p.materiais[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-material-num]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, chave] = el.dataset.materialNum.split('|');
      p.materiais[Number(i)][chave] = Number(el.value) || 0;
    }));
  app.querySelectorAll('[data-remover-material]').forEach(b =>
    b.onclick = () => mudar(p => p.materiais.splice(Number(b.dataset.removerMaterial), 1)));
  const addMaterial = document.getElementById('btAddMaterial');
  if(addMaterial) addMaterial.onclick = () => mudar(p => p.materiais.push({id:uid(), nome:'', quantidade:0}));

  // Fabricar: "catalogo|receitaId" ou "custom|índice" — mesma função
  // fabricar() por trás dos dois, já que têm o mesmo formato de dados.
  app.querySelectorAll('[data-fabricar]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [origem, chave] = b.dataset.fabricar.split('|');
      const receita = origem === 'catalogo'
        ? RECEITAS_CATALOGO.find(r => r.id === chave)
        : p.receitasCustom[Number(chave)];
      if(receita) fabricar(p, receita);
    }));

  // Suas Receitas: editor completo (nome, classe, materiais, item que sai).
  app.querySelectorAll('[data-receita-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [ri, chave] = el.dataset.receitaCampo.split('|');
      p.receitasCustom[Number(ri)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-receita-classe]').forEach(el =>
    el.onchange = () => mudar(p => p.receitasCustom[Number(el.dataset.receitaClasse)].classe = el.value));
  app.querySelectorAll('[data-receita-material]').forEach(el => {
    const [ri, mi, chave] = el.dataset.receitaMaterial.split('|');
    const mutador = p => p.receitasCustom[Number(ri)].materiais[Number(mi)][chave] = el.type==='number' ? (Number(el.value)||0) : el.value;
    if(el.type==='number') el.onchange = () => mudar(mutador);
    else el.oninput = () => mudarSemRedesenhar(mutador, el);
  });
  app.querySelectorAll('[data-add-receita-material]').forEach(b =>
    b.onclick = () => mudar(p => p.receitasCustom[Number(b.dataset.addReceitaMaterial)].materiais.push({nome:'', quantidade:0})));
  app.querySelectorAll('[data-remover-receita-material]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [ri, mi] = b.dataset.removerReceitaMaterial.split('|');
      p.receitasCustom[Number(ri)].materiais.splice(Number(mi), 1);
    }));
  app.querySelectorAll('[data-receita-item]').forEach(el => {
    const [ri, chave] = el.dataset.receitaItem.split('|');
    const mutador = p => p.receitasCustom[Number(ri)].item[chave] = el.type==='number' ? (Number(el.value)||0) : el.value;
    if(el.tagName==='SELECT' || el.type==='number') el.onchange = () => mudar(mutador);
    else el.oninput = () => mudarSemRedesenhar(mutador, el);
  });
  app.querySelectorAll('[data-remover-receita]').forEach(b =>
    b.onclick = () => mudar(p => p.receitasCustom.splice(Number(b.dataset.removerReceita), 1)));
  const addReceita = document.getElementById('btAddReceita');
  if(addReceita) addReceita.onclick = () => mudar(p => p.receitasCustom.push({
    nome: '', classe: '', materiais: [{nome:'', quantidade:1}],
    item: {tipo:'outro', raridade:'comum', efeitoTipo:'nenhum', efeitoValor:0, peso:0, durabilidadeMaxima:0, notas:''},
  }));

  // Carteira e Loja
  app.querySelectorAll('[data-carteira]').forEach(el =>
    el.onchange = () => mudar(p => { p.carteira[el.dataset.carteira] = Number(el.value) || 0; normalizarCarteira(p); }));
  app.querySelectorAll('[data-comprar]').forEach(b =>
    b.onclick = () => mudar(p => {
      const item = ITENS_LOJA.find(x => x.id === b.dataset.comprar); if(!item) return;
      const preco = precoCompra(p, item.precoPrata);
      if(!gastarPrata(p, preco)) return;
      const it = item.item;
      p.inventario.push({
        id: uid(), nome: item.nome, tipo: it.tipo, raridade: it.raridade,
        efeitoTipo: it.efeitoTipo, efeitoValor: it.efeitoValor, peso: it.peso,
        durabilidadeMaxima: it.durabilidadeMaxima, durabilidadeAtual: it.durabilidadeMaxima,
        equipado: false, notas: it.notas,
      });
    }));
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('chkCompartilhar').onchange = e => {
  alternarCompartilhado(e.target.checked);
};

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value;
  estado.modoGuiado = false;
  estado.nivelUpResumo = null;
  render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'status';
  // Personagem novo começa no Modo Guiado — quem já conhece o sistema sai
  // com um clique em "Ver ficha completa" (barra do topo).
  estado.modoGuiado = true;
  estado.passoGuiado = 1;
  estado.nivelUpResumo = null;
  salvar(); render();
};

document.getElementById('btModoGuiado').onclick = () => {
  estado.modoGuiado = !estado.modoGuiado;
  estado.passoGuiado = 1;
  render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  estado.modoGuiado = false;
  estado.nivelUpResumo = null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      if(MODO_HUB){
        // No Hub só existe esta ficha — importar restaura o conteúdo dela
        // a partir de um backup, em vez de criar outra.
        lido.id = MODO_HUB;
        estado.fichas = [lido];
        estado.atualId = MODO_HUB;
      }else{
        // Id novo: importar nunca sobrescreve um personagem que já existe.
        lido.id = uid();
        estado.fichas.push(lido);
        estado.atualId = lido.id;
      }
      estado.modoGuiado = false;
      estado.nivelUpResumo = null;
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
