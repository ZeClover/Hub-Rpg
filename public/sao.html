<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Sistema SAO</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
  --verde:#4c8c5b; --laranja:#c97a2e; --vermelho:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s;
}
button:hover{border-color:var(--suave)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.risco .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.classe-linha{display:grid; grid-template-columns:1fr 90px auto; gap:10px; align-items:end; margin-bottom:10px}
.linha-lista{border:1px solid var(--borda); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--superficie-alta)}
.linha-lista .topo{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.cursor{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px}
.cursor.verde{background:var(--verde)}
.cursor.laranja{background:var(--laranja)}
.cursor.vermelho{background:var(--vermelho)}
.barra-skill{height:6px; border-radius:99px; background:var(--borda); overflow:hidden; margin-top:6px}
.barra-skill span{display:block; height:100%; background:var(--ambar)}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Sistema SAO</span>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <button id="btExportar">Exportar</button>
  <button id="btImportar">Importar</button>
  <input type="file" id="arquivo" accept="application/json" hidden>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>
<main id="app"></main>
<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — SISTEMA SAO (homebrew original do Zé)

   Este é o CHASSI do sistema (decisão #17 do Hub: cada sistema de regras é
   um módulo próprio). Ele responde as sete perguntas de ARQUITETURA.md:
   atributos, criação, derivados, teste, condições, progressão e ficha —
   com um catálogo inicial pequeno de classes/skills, que cresce em fatias
   futuras (igual o Fabula Ultima foi ganhando classe por classe).

   Inspiração de três obras (não é ficha de nenhuma delas — é design
   original, sem texto/nome protegido de nenhuma):
   - Sword Art Online: sem separar "personagem" de "jogo" — o próprio
     personagem vê PV/PM, nível e nome de golpe na tela. Golpes assistidos
     pelo sistema (Sword Skills) com uma janela de vulnerabilidade depois.
   - Overgeared (Satisfy): multiclasse sem limite, cada skill sobe de
     estágio com o USO (não é escolha em lista), e morrer pesa caro (perde
     XP, pode derrubar item) mas não é definitivo.
   - Shangri-La Frontier: nível não é tudo — dar valor a estudar o próprio
     sistema (a aba Skills existe pra registrar isso).

   Os personagens ficam no SEU navegador (localStorage), igual o Fabula
   Ultima e o Kaizoku no Sho começaram (decisão #40) — Modo Hub (salvar na
   conta) é fatia futura, quando o resto do sistema estiver rodando numa
   mesa de verdade.
   =========================================================================== */

/* --- Regras do sistema, em forma de dados -------------------------------- */

// Mesma escala de dado do Fabula Ultima (decisão da conversa: reaproveitar
// o estilo de teste que os jogadores já conhecem). Teste = rola os dois
// dados dos atributos pedidos + soma, contra uma Dificuldade que o mestre
// define. Os dois dados iguais e 6+: sucesso crítico. Os dois em 1: falha
// crítica — igual o Escudo do Mestre do Fabula Ultima já explica.
const ESCALA = [6, 8, 10, 12];

const ATRIBUTOS = [
  {id:'forca',     nome:'Força',     abrev:'FOR', sobre:'dano corpo a corpo, capacidade de carga'},
  {id:'agilidade', nome:'Agilidade', abrev:'AGI', sobre:'iniciativa, evasão, ataque à distância'},
  {id:'mente',     nome:'Mente',     abrev:'MEN', sobre:'magia, PM, percepção do sistema'},
  {id:'vontade',   nome:'Vontade',   abrev:'VON', sobre:'resistência mental, foco, negociação'},
];

const PERFIS = [
  {id:'especializado', nome:'Especializado',     dados:[10,10,6,6]},
  {id:'mediano',       nome:'Mediano',           dados:[10,8,8,6]},
  {id:'toda-obra',     nome:'Pau pra toda obra', dados:[8,8,8,8]},
];

const CURSORES = [
  {id:'verde',    nome:'Verde — jogador comum',                  sobre:'nunca atacou outro jogador'},
  {id:'laranja',  nome:'Laranja — criminoso',                    sobre:'atacou outro jogador (PvP), mas não matou'},
  {id:'vermelho', nome:'Vermelho — assassino',                   sobre:'matou outro jogador dentro do jogo'},
];

// Classes acumulam sem limite (multiclasse — decisão da conversa). Cada uma
// só marca uma "família" (o que ela É), sem números fixos: os poderes de
// cada classe são fatia futura, igual o Fabula Ultima ganhou os catálogos
// depois do chassi básico existir.
const CATEGORIAS_CLASSE = [
  {id:'combate',  nome:'Combate',  sobre:'skills de ataque e defesa — sobe fácil brigando com monstro'},
  {id:'producao', nome:'Produção', sobre:'fabricar, refinar e vender itens'},
  {id:'outras',   nome:'Outras',   sobre:'utilidade fora de combate — fraca em briga, sem ofício'},
];

const CLASSES = [
  {id:'espadachim', nome:'Espadachim', categoria:'combate'},
  {id:'arcanista',  nome:'Arcanista',  categoria:'combate'},
  {id:'batedor',    nome:'Batedor',    categoria:'combate'},
  {id:'ferreiro',   nome:'Ferreiro',   categoria:'producao'},
  {id:'alquimista', nome:'Alquimista', categoria:'producao'},
  {id:'mercador',   nome:'Mercador',   categoria:'outras'},
  {id:'domador',    nome:'Domador',    categoria:'outras'},
];

const CONDICOES = [
  {id:'atordoado',   nome:'Atordoado'},
  {id:'envenenado',  nome:'Envenenado'},
  {id:'sangrando',   nome:'Sangrando'},
  {id:'silenciado',  nome:'Silenciado (bloqueia magia)'},
  {id:'enraizado',   nome:'Enraizado'},
  {id:'cego',        nome:'Cego'},
  {id:'amedrontado', nome:'Amedrontado'},
  {id:'exausto',     nome:'Exausto'},
  {id:'pos-motion',  nome:'Vulnerável (pós-motion)'},
];

// Skill sobe de ESTÁGIO com o uso em jogo (Overgeared), não é escolha numa
// lista. Cada estágio tem 10 níveis internos; ao completar o 10º, passa
// pro próximo estágio. "Mestre 10" é o teto — a skill está dominada.
const ESTAGIOS_SKILL = [
  {id:'iniciante',     nome:'Iniciante'},
  {id:'intermediario', nome:'Intermediário'},
  {id:'avancado',      nome:'Avançado'},
  {id:'mestre',        nome:'Mestre'},
];

/* --- Personagem ----------------------------------------------------------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function novoPersonagem(nome){
  return {
    id: uid(), criadoEm: Date.now(), atualizadoEm: Date.now(),
    perfil: {
      nome: nome || 'Novo Jogador',
      apelido: '',   // o nick que aparece pro jogo — pode ser diferente do nome de verdade
      jogo: '',      // qual mundo virtual/campanha esta ficha está jogando
      guilda: '',
      aparencia: '',
    },
    cursor: 'verde',
    perfilAtributos: 'mediano',
    atributos: {forca:8, agilidade:8, mente:8, vontade:6},
    xp: 0,
    classes: [{classeId:'', nivel:0}],
    atual: {pv:null, pm:null},   // null = cheio
    bonus: {defesa:0, defesaMagica:0, iniciativa:0}, // pra equipamento, fatia futura
    condicoes: [],
    penalidadeMorte: {ativa:false, xpPerdido:0, itemPerdido:'', notas:''},
    golpes: [],           // sword skills: {id, nome, arma, dano, posMotion, origem}
    magias: [],           // {id, nome, custoPm, efeito}
    skills: [],           // {id, nome, categoria, estagio, nivelInterno}
    habilidadeUnica: {tem:false, nome:'', descricao:'', comoConseguiu:''},
    anotacoes: '',
  };
}

/* --- Cálculos -------------------------------------------------------------- */

// Nível geral é a soma dos níveis de todas as classes com pelo menos 1
// ponto — sem teto artificial de "3 classes" como o Fabula Ultima, porque
// aqui multiclasse é ilimitada de propósito.
function nivelGeral(p){
  const soma = p.classes.reduce((total, c) => total + (c.classeId ? (c.nivel||0) : 0), 0);
  return Math.max(1, soma);
}

// Fórmulas de partida — dá pra ajustar na mesa se o número não bater com o
// ritmo da campanha, igual o Fabula Ultima deixa vários derivados editáveis
// à mão (decisão #57 do Hub).
function pvMaximo(p){ return 10 + nivelGeral(p)*3 + p.atributos.forca; }
function pmMaximo(p){ return 5 + nivelGeral(p)*2 + p.atributos.mente; }
function defesa(p){ return 8 + Math.floor(p.atributos.agilidade/2) + (p.bonus.defesa||0); }
function defesaMagica(p){ return 8 + Math.floor(p.atributos.vontade/2) + (p.bonus.defesaMagica||0); }
function iniciativa(p){ return Math.floor(p.atributos.agilidade/2) + (p.bonus.iniciativa||0); }
function pvRisco(p){ return Math.floor(pvMaximo(p)/2); }

/* --- Armazenamento ---------------------------------------------------------

   Arquivo único, salvando no navegador (localStorage) — o mesmo caminho que
   o Fabula Ultima e o Kaizoku no Sho seguiram antes de ganhar Modo Hub
   (decisão #40). Sem `?id=`, sem conta: dá pra acertar as regras rápido
   com o Zé testando, e migrar pro Hub depois de fatia própria.
------------------------------------------------------------------------- */

const CHAVE = 'sao_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

function salvar(){
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    // Falhar em silêncio faria o jogador achar que salvou e perder tudo ao
    // fechar a aba — por isso o aviso precisa aparecer na tela.
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const estado = { fichas: carregar(), atualId: null, aba: 'status' };
if(estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

function mudar(mudanca){
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounce = null;
function mudarSemRedesenhar(mudanca, elemento){
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Desenho da tela --------------------------------------------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ABAS = [
  {id:'status',  nome:'Status'},
  {id:'classes', nome:'Classes'},
  {id:'combate', nome:'Combate'},
  {id:'golpes',  nome:'Golpes e Magias'},
  {id:'skills',  nome:'Skills'},
  {id:'notas',   nome:'Notas'},
];

function render(){
  desenharBarra();
  const app = document.getElementById('app');
  const p = atual();

  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em "+ Novo" para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const alerta = falhouAoSalvar
    ? `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
       Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
       perder o que você preencheu.</div>`
    : '';

  app.innerHTML = alerta
    + `<div class="abas">` + ABAS.map(a =>
        `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
      ).join('') + `</div>`
    + painelDerivados(p)
    + ({status:abaStatus, classes:abaClasses, combate:abaCombate, golpes:abaGolpesMagias, skills:abaSkills, notas:abaNotas}[estado.aba])(p);

  ligarEventos();
}

function desenharBarra(){
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

// Painel sempre visível: os quatro números que se consulta o tempo todo
// numa sessão — igual uma janela de status de jogo de verdade.
function painelDerivados(p){
  const pv = p.atual.pv ?? pvMaximo(p);
  const emRisco = pv <= pvRisco(p);
  return `<div class="grade g4" style="margin-bottom:14px">
    <div class="derivado ${emRisco?'risco':''}">
      <div class="rot">Pontos de Vida</div>
      <div class="val">${pv}<span style="font-size:16px;color:var(--suave)">/${pvMaximo(p)}</span></div>
      <div class="obs">${emRisco ? 'em risco' : 'risco em ' + pvRisco(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Pontos de Mana</div>
      <div class="val">${p.atual.pm ?? pmMaximo(p)}<span style="font-size:16px;color:var(--suave)">/${pmMaximo(p)}</span></div>
      <div class="obs">5 + nível×2 + Mente</div>
    </div>
    <div class="derivado">
      <div class="rot">Defesa</div>
      <div class="val">${defesa(p)}</div>
      <div class="obs">mágica ${defesaMagica(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Nível</div>
      <div class="val">${nivelGeral(p)}</div>
      <div class="obs">iniciativa ${iniciativa(p)}</div>
    </div>
  </div>`;
}

function campo(rotulo, chave, valor, tipo){
  return `<div><label for="c-${chave}">${rotulo}</label>
    <input id="c-${chave}" data-perfil="${chave}" type="${tipo||'text'}" value="${esc(valor)}"></div>`;
}

function abaStatus(p){
  const cursor = CURSORES.find(c => c.id === p.cursor) || CURSORES[0];
  return `<div class="cartao">
    <p class="mini" style="margin-bottom:14px">
      Esta é a <strong>Janela de Status</strong> que seu personagem vê dentro
      do jogo — ele sabe estes números tanto quanto você. Não é uma
      abstração escondida da mesa.
    </p>
    <div class="grade g2">
      ${campo('Nome de verdade','nome',p.perfil.nome)}
      ${campo('Apelido no jogo','apelido',p.perfil.apelido)}
      ${campo('Jogo / mundo virtual','jogo',p.perfil.jogo)}
      ${campo('Guilda/clã','guilda',p.perfil.guilda)}
      <div>
        <label for="c-cursor">Cursor (flag de PK)</label>
        <select id="c-cursor" data-campo-raiz="cursor">
          ${CURSORES.map(c => `<option value="${c.id}" ${c.id===p.cursor?'selected':''}>${c.nome}</option>`).join('')}
        </select>
      </div>
      <div><label for="c-xp">XP</label>
        <input id="c-xp" data-num="xp" type="number" min="0" value="${p.xp}"></div>
    </div>
    <p class="mini" style="margin-top:8px"><span class="cursor ${cursor.id}"></span>${cursor.sobre}</p>
    <div style="margin-top:14px">
      <label for="c-aparencia">Aparência</label>
      <textarea id="c-aparencia" data-perfil="aparencia" rows="3">${esc(p.perfil.aparencia)}</textarea>
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Atributos</h2>
    <p class="mini" style="margin:6px 0 16px">
      Teste = rola o dado dos dois atributos que a ação pedir, soma, compara
      com a Dificuldade que o mestre define. Os dois dados no mesmo número e 6+:
      sucesso crítico. Os dois em 1: falha crítica.
    </p>
    <div style="max-width:320px;margin-bottom:16px">
      <label for="c-perfilatr">Perfil de distribuição</label>
      <select id="c-perfilatr">
        ${PERFIS.map(x => `<option value="${x.id}" ${x.id===p.perfilAtributos?'selected':''}>
          ${x.nome} — ${x.dados.map(d=>'d'+d).join(', ')}</option>`).join('')}
      </select>
    </div>
    <div class="grade g4">
      ${ATRIBUTOS.map(a => `<div>
        <label for="c-atr-${a.id}">${a.nome}</label>
        <select id="c-atr-${a.id}" data-atributo="${a.id}">
          ${ESCALA.map(d => `<option value="${d}" ${d===p.atributos[a.id]?'selected':''}>d${d}</option>`).join('')}
        </select>
        <p class="mini" style="margin-top:6px">${a.sobre}</p>
      </div>`).join('')}
    </div>
  </div>`;
}

function abaClasses(p){
  return `<div class="cartao">
    <h2 style="font-size:18px">Classes</h2>
    <p class="mini" style="margin:6px 0 16px">
      Multiclasse sem limite — quantas classes o personagem tiver. O nível
      de cada uma é o que você anota na mesa (não tem cálculo automático de
      XP aqui ainda: fica pro mestre decidir o ritmo). O Nível geral do
      personagem, lá em cima, é a soma de todos.
    </p>
    ${p.classes.map((c,i) => {
      const classe = CLASSES.find(x => x.id === c.classeId);
      const categoria = classe && CATEGORIAS_CLASSE.find(x => x.id === classe.categoria);
      return `<div class="classe-linha">
        <div>
          <label for="c-cl-${i}">${i+1}ª classe</label>
          <select id="c-cl-${i}" data-classe="${i}">
            <option value="">— nenhuma —</option>
            ${CATEGORIAS_CLASSE.map(cat => `<optgroup label="${cat.nome}">
              ${CLASSES.filter(x => x.categoria===cat.id).map(x =>
                `<option value="${x.id}" ${x.id===c.classeId?'selected':''}>${x.nome}</option>`).join('')}
            </optgroup>`).join('')}
          </select>
          ${categoria ? `<p class="mini" style="margin-top:6px">${categoria.nome} — ${categoria.sobre}</p>` : ''}
        </div>
        <div>
          <label for="c-nv-${i}">Nível</label>
          <input id="c-nv-${i}" data-nivel="${i}" type="number" min="0" value="${c.nivel||0}">
        </div>
        <button data-remover-classe="${i}" ${p.classes.length<=1?'disabled':''}>Tirar</button>
      </div>`;
    }).join('')}
    <button id="btAddClasse">+ Outra classe</button>
  </div>`;
}

/* --- Eventos --------------------------------------------------------------

   O `render` reescreve a tela inteira, então os eventos são religados a
   cada desenho — mesmo caminho do Fabula Ultima e do Kaizoku no Sho.
------------------------------------------------------------------------- */

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.perfil[el.dataset.perfil] = el.value, el));

  app.querySelectorAll('[data-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.campo] = el.value, el));

  app.querySelectorAll('[data-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.num] = Number(el.value) || 0, el));

  app.querySelectorAll('[data-campo-raiz]').forEach(el =>
    el.onchange = () => mudar(p => p[el.dataset.campoRaiz] = el.value));

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Number(el.value)));

  const perfilAtr = document.getElementById('c-perfilatr');
  if(perfilAtr) perfilAtr.onchange = () => mudar(p => {
    p.perfilAtributos = perfilAtr.value;
    const modelo = PERFIS.find(x => x.id === perfilAtr.value);
    if(modelo) ATRIBUTOS.forEach((a,i) => p.atributos[a.id] = modelo.dados[i]);
  });

  app.querySelectorAll('[data-classe]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.classe)].classeId = el.value));
  app.querySelectorAll('[data-nivel]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.nivel)].nivel = Number(el.value) || 0));
  app.querySelectorAll('[data-remover-classe]').forEach(b =>
    b.onclick = () => mudar(p => p.classes.splice(Number(b.dataset.removerClasse), 1)));
  const addClasse = document.getElementById('btAddClasse');
  if(addClasse) addClasse.onclick = () => mudar(p => p.classes.push({classeId:'', nivel:0}));

  app.querySelectorAll('[data-condicao]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicao;
      p.condicoes = el.checked ? [...p.condicoes, id] : p.condicoes.filter(c => c !== id);
    }));

  const morteAtiva = document.getElementById('c-morte-ativa');
  if(morteAtiva) morteAtiva.onchange = () => mudar(p => p.penalidadeMorte.ativa = morteAtiva.checked);
  app.querySelectorAll('[data-morte]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const chave = el.dataset.morte;
      p.penalidadeMorte[chave] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
    }, el));
  const btCalcularPerda = document.getElementById('btCalcularPerda');
  if(btCalcularPerda) btCalcularPerda.onclick = () => mudar(p => {
    p.penalidadeMorte.xpPerdido = Math.floor((p.xp||0) * 0.1);
  });

  app.querySelectorAll('[data-bonus]').forEach(el =>
    el.onchange = () => mudar(p => p.bonus[el.dataset.bonus] = Number(el.value) || 0));

  app.querySelectorAll('[data-golpe-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.golpeCampo.split('|');
      p.golpes[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-golpe-origem]').forEach(el =>
    el.onchange = () => mudar(p => p.golpes[Number(el.dataset.golpeOrigem)].origem = el.value));
  app.querySelectorAll('[data-remover-golpe]').forEach(b =>
    b.onclick = () => mudar(p => p.golpes.splice(Number(b.dataset.removerGolpe), 1)));
  const addGolpe = document.getElementById('btAddGolpe');
  if(addGolpe) addGolpe.onclick = () => mudar(p =>
    p.golpes.push({id:uid(), nome:'', arma:'', dano:'', posMotion:'', origem:'sistema'}));

  app.querySelectorAll('[data-magia-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.magiaCampo.split('|');
      p.magias[Number(i)][chave] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
    }, el));
  app.querySelectorAll('[data-remover-magia]').forEach(b =>
    b.onclick = () => mudar(p => p.magias.splice(Number(b.dataset.removerMagia), 1)));
  const addMagia = document.getElementById('btAddMagia');
  if(addMagia) addMagia.onclick = () => mudar(p => p.magias.push({id:uid(), nome:'', custoPm:0, efeito:''}));

  const unicaTem = document.getElementById('c-unica-tem');
  if(unicaTem) unicaTem.onchange = () => mudar(p => p.habilidadeUnica.tem = unicaTem.checked);
  app.querySelectorAll('[data-unica]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.habilidadeUnica[el.dataset.unica] = el.value, el));

  app.querySelectorAll('[data-skill-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.skillCampo.split('|');
      p.skills[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-remover-skill]').forEach(b =>
    b.onclick = () => mudar(p => p.skills.splice(Number(b.dataset.removerSkill), 1)));
  app.querySelectorAll('[data-avancar-skill]').forEach(b =>
    b.onclick = () => mudar(p => {
      const s = p.skills[Number(b.dataset.avancarSkill)];
      const idx = ESTAGIOS_SKILL.findIndex(e => e.id === s.estagio) ?? 0;
      if((s.nivelInterno||1) < 10){
        s.nivelInterno = (s.nivelInterno||1) + 1;
      }else if(idx < ESTAGIOS_SKILL.length - 1){
        s.estagio = ESTAGIOS_SKILL[idx+1].id;
        s.nivelInterno = 1;
      }
    }));
  const addSkill = document.getElementById('btAddSkill');
  if(addSkill) addSkill.onclick = () => mudar(p =>
    p.skills.push({id:uid(), nome:'', categoria:'', estagio:'iniciante', nivelInterno:1}));
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value; render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'status';
  salvar(); render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      lido.id = uid();
      estado.fichas.push(lido);
      estado.atualId = lido.id;
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

render();
</script>
