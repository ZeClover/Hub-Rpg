<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Hogwarts RPG</title>
<style>
/* Paleta própria (dourado/vinho) pra diferenciar do resto do Hub — mesma
   base escura dos outros sistemas (decisão #17: cada sistema é um módulo,
   com identidade própria mas família visual comum). */
:root{
  --fundo:#0c0a08; --superficie:#161009; --superficie-alta:#201709;
  --borda:#3a2a14; --texto:#f2ead9; --suave:#b3a488;
  --roxo:#c9a227; --roxo-forte:#e3bf49; --roxo-rgb:201,162,39;
  --alerta:#c4506b;
  --verde:#4c8c5b; --laranja:#c97a2e; --vermelho:#8c3b3b;
  --fonte-titulo:Georgia,'Times New Roman',serif;
}
@media print{
  :root{
    --fundo:#ffffff !important; --superficie:#ffffff !important; --superficie-alta:#f3f3f3 !important;
    --borda:#999999 !important; --texto:#000000 !important; --suave:#333333 !important;
    --roxo:#000000 !important; --roxo-forte:#000000 !important; --roxo-rgb:0,0,0 !important; --alerta:#000000 !important;
  }
  .barra, button{ display:none !important; }
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0; background:var(--fundo); color:var(--texto); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:var(--fonte-titulo); font-weight:600; margin:0}
a{color:var(--roxo-forte)}
.barra{position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 16px; background:var(--superficie); border-bottom:1px solid var(--borda)}
.marca{font-family:var(--fonte-titulo); font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--roxo)}
.cresce{flex:1}
.status-salvo{font-size:12px; color:var(--suave); white-space:nowrap}
.status-salvo.salvando{color:var(--roxo-forte)}
.status-salvo.ok{color:var(--verde)}
.status-salvo.erro{color:var(--alerta); font-weight:600}
button,select,input,textarea{font:inherit; color:var(--texto)}
button{background:var(--superficie-alta); border:1px solid var(--borda); border-radius:8px; padding:7px 12px; cursor:pointer}
button:hover{border-color:rgba(var(--roxo-rgb),.6)}
button.destaque{background:rgba(var(--roxo-rgb),.18); border-color:rgba(var(--roxo-rgb),.6); color:var(--roxo-forte)}
button.perigo{border-color:rgba(196,80,107,.5); color:#e58a9b}
button[aria-current="true"]{border-color:rgba(var(--roxo-rgb),.7); color:var(--roxo-forte); background:rgba(var(--roxo-rgb),.14)}
input,select,textarea{background:var(--superficie-alta); border:1px solid var(--borda); border-radius:6px; padding:7px 9px; width:100%}
label{display:block; font-size:12px; color:var(--suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em}
main{max-width:980px; margin:0 auto; padding:16px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.abas button{font-size:13px}
.cartao{background:var(--superficie); border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:14px}
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px}
.grade2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.linha{display:flex; gap:10px; align-items:center}
.mini{font-size:12.5px; color:var(--suave)}
.vazio{padding:60px 16px; text-align:center}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; border:1px solid var(--borda); color:var(--suave)}
.pill.on{border-color:rgba(var(--roxo-rgb),.6); color:var(--roxo-forte); background:rgba(var(--roxo-rgb),.12)}
.item-conteudo{border:1px solid var(--borda); border-radius:10px; padding:12px; margin-bottom:10px}
.item-conteudo h4{font-size:14.5px; margin-bottom:4px}
.item-conteudo .campos{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; font-size:12.5px; color:var(--suave); margin:6px 0}
.item-conteudo .campos b{color:var(--texto)}
.linha-cond{display:flex; gap:8px; align-items:center; border:1px solid var(--borda); border-radius:8px; padding:8px 10px; margin-bottom:8px}
.ok{background:rgba(76,140,91,.15); border:1px solid rgba(76,140,91,.4); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:13px}
.aviso{background:rgba(196,80,107,.15); border:1px solid rgba(196,80,107,.4); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:13px}
.barra-vida{height:10px; border-radius:6px; background:var(--superficie-alta); overflow:hidden; border:1px solid var(--borda)}
.barra-vida > div{height:100%; background:var(--vermelho)}
.barra-tensao > div{height:100%; background:var(--roxo)}
.grid-atributo{text-align:center; border:1px solid var(--borda); border-radius:10px; padding:10px}
.grid-atributo .valor{font-size:26px; font-family:var(--fonte-titulo)}
.busca{margin-bottom:10px}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Hogwarts RPG</span>
  <a id="linkFichas" href="/fichas" hidden style="color:var(--roxo);text-decoration:none;font-size:13px">← Fichas</a>
  <label id="labelCompartilhar" style="display:none;align-items:center;gap:6px;font-size:12px;color:var(--suave);text-transform:none;letter-spacing:normal">
    <input type="checkbox" id="chkCompartilhar" style="width:auto">
    Compartilhar (link de leitura)
  </label>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <span id="statusSalvo" class="status-salvo"></span>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>

function novoPersonagem(){
  const t = Date.now();
  const pericias = {}; PERICIAS.forEach(p => pericias[p] = 0);
  return {
    id: uid(), criadoEm: t, atualizadoEm: t,
    perfil: {
      nome:'Novo Bruxo', sobrenome:'', imagem:'',
      anoEscolar:1, casa:'', statusSangue:'', familia:'', origem:'',
      ambicao:'', medo:'', vinculo:'', descricao:'', notasMestre:'',
    },
    nivel: 1,
    atributos: {Arcano:0, Engenho:0, Pulso:0, Presença:0, Fibra:0},
    pericias,
    periciasOverride: false,
    vida: {atual:5, maxima:5},
    tensao: 0,
    condicoes: [],
    ferimentos: [],
    conteudosConhecidos: {},
    conteudosCustom: [],
    favoritos: [],
    varinha: {madeira:'', nucleo:'', comprimento:'', flexibilidade:'', tendencia:'', propriedade:'', peculiaridade:'', sintonia:1, lealdade:'Leal'},
    galeoes: 0,
    mostrarRestritos: false,
  };
}

function anoEscolar(nivel){ return Math.max(1, Math.min(7, Math.ceil(nivel/5))); }
function limitePericia(ano){ return ano<=2?2 : ano<=4?3 : ano===5?4 : 5; }

function todosConteudos(p){ return [...CONTEUDOS_SEED, ...p.conteudosCustom]; }

/* --- Armazenamento (mesmo mecanismo dos outros sistemas: decisão #40/#44) - */

const MODO_HUB = new URLSearchParams(location.search).get('id');
const CHAVE = 'hogwarts_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{ const cru = localStorage.getItem(CHAVE); return cru ? JSON.parse(cru) : []; }
  catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

function mostrarStatusSalvo(texto, classe){
  const el = document.getElementById('statusSalvo');
  if(!el) return;
  el.textContent = texto;
  el.className = 'status-salvo ' + (classe || '');
}
function statusSalvoOk(){
  mostrarStatusSalvo('Salvo ✓', 'ok');
  setTimeout(() => mostrarStatusSalvo('', ''), 1800);
}

let debounceHub = null;
function salvarNoHub(){
  clearTimeout(debounceHub);
  mostrarStatusSalvo('Salvando…', 'salvando');
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    // Resumo genérico de vida pro Painel de Vida da Mesa ao Vivo (decisão #46).
    p.resumoVida = {atual: Math.max(0, Math.min(p.vida.maxima, p.vida.atual)), maxima: p.vida.maxima, rotulo: 'Vida'};
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dados:p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar=false; render(); }
      statusSalvoOk();
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar=true; render(); }
      mostrarStatusSalvo('Erro ao salvar', 'erro');
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar=false; render(); }
    statusSalvoOk();
  }catch(e){
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar=true; render(); }
    mostrarStatusSalvo('Erro ao salvar', 'erro');
  }
}

const estado = {
  fichas: MODO_HUB ? [] : carregar(),
  atualId: null, aba:'perfil',
  carregandoHub: !!MODO_HUB, erroHub: null,
  ehDono:false, podeEditar:false, compartilhado:false,
};
if(!MODO_HUB && estado.fichas.length) estado.atualId = estado.fichas[0].id;
const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub='nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p]; estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.podeEditar = !!personagem.podeEditar;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false; render();
  }
}

function alternarCompartilhado(valor){
  estado.compartilhado = valor; render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({compartilhado:valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(fn){
  if(MODO_HUB && !estado.podeEditar) return;
  const p = atual(); if(!p) return;
  fn(p); p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounceTexto = null;
function mudarSemRedesenhar(fn){
  if(MODO_HUB && !estado.podeEditar) return;
  const p = atual(); if(!p) return;
  fn(p); p.atualizadoEm = Date.now();
  clearTimeout(debounceTexto);
  debounceTexto = setTimeout(salvar, 500);
}

    <div class="grade2">
      <div><label>Nível (1–35)</label><input type="number" min="1" max="35" data-campo-num="nivel" value="${p.nivel}"></div>
      <div><label>Marco Extraordinário</label><div class="mini" style="padding-top:8px">${[5,10,15,20,25,30,35].includes(p.nivel) ? '✨ Sim — +1 Atributo e +2 escolhas Únicas neste nível.' : 'Não — +1 Treinamento de Perícia e +2 escolhas de Conteúdo neste nível.'}</div></div>
    </div>
  </div>`;
}

function abaCombate(p){
  const pctVida = Math.round(100 * Math.max(0,Math.min(1, p.vida.atual / Math.max(1,p.vida.maxima))));
  const pctTensao = Math.round(100 * Math.max(0,Math.min(1, p.tensao / 3)));
  return `<div class="cartao">
    <h3 style="margin-bottom:10px">Vida</h3>
    <div class="linha" style="margin-bottom:8px">
      <button data-vida-delta="-1">−1</button>
      <button data-vida-delta="1">+1</button>
      <span class="mini">${p.vida.atual} / ${p.vida.maxima}</span>
      <span class="cresce"></span>
      <label style="width:auto;font-size:12px;text-transform:none">Máxima <input type="number" min="1" style="width:70px;display:inline-block" data-campo-num="vida.maxima" value="${p.vida.maxima}"></label>
    </div>
    <div class="barra-vida"><div style="width:${pctVida}%"></div></div>
    <p class="mini" style="margin-top:8px">0 Vida não mata sozinho — o Mestre escolhe a consequência (Incapacitado / Ferimento Grave / À Beira da Morte).</p>
  </div>

  <div class="cartao">
    <h3 style="margin-bottom:10px">Tensão Mágica</h3>
    <div class="linha" style="margin-bottom:8px">
      <button data-tensao-delta="-1">−1</button>
      <button data-tensao-delta="1">+1</button>
      <span class="mini">${p.tensao} / 3 ${p.tensao>=3 ? '— Limite' : ''}</span>
    </div>
    <div class="barra-vida barra-tensao"><div style="width:${pctTensao}%"></div></div>
  </div>

  <div class="cartao">
    <h3 style="margin-bottom:10px">Defesa Passiva</h3>
    <p class="mini">7 + Pulso (${p.atributos.Pulso}) = <b>${7 + (p.atributos.Pulso||0)}</b>. Defesa Ativa (gastando a Reação) substitui, nunca soma às duas.</p>
  </div>

  <div class="cartao">
    <h3 style="margin-bottom:10px">Ferimentos Graves</h3>
    ${p.ferimentos.length===0 ? '<p class="mini">Nenhum registrado.</p>' : p.ferimentos.map(f => `
      <div class="linha-cond">
        <input data-fer-campo="${f.id}:nome" value="${esc(f.nome)}" placeholder="Nome" style="flex:1">
        <select data-fer-campo="${f.id}:estado" style="width:150px">
          ${['Não Tratado','Estabilizado','Em Tratamento','Recuperado'].map(e => `<option ${f.estado===e?'selected':''}>${e}</option>`).join('')}
        </select>
        <button data-fer-remover="${f.id}" class="perigo" style="padding:4px 10px">✕</button>
      </div>
      <textarea data-fer-campo="${f.id}:consequencia" rows="1" placeholder="Consequência" style="margin-bottom:8px">${esc(f.consequencia||'')}</textarea>
    `).join('')}
    <button data-novo-ferimento>+ Ferimento Grave</button>
  </div>`;
}

function abaCondicoes(p){
  return `<div class="cartao">
    <h3 style="margin-bottom:10px">Condições ativas</h3>
    ${p.condicoes.length===0 ? '<p class="mini">Nenhuma condição ativa.</p>' : p.condicoes.map(c => `
      <div class="linha-cond">
        <select data-cond-campo="${c.id}:nome" style="width:170px">
          ${CONDICOES_NOMES.map(n => `<option ${c.nome===n?'selected':''}>${n}</option>`).join('')}
        </select>
        <label style="width:auto;font-size:12px;text-transform:none">Rodadas <input type="number" min="0" style="width:70px;display:inline-block" data-cond-campo-num="${c.id}:rodadas" value="${c.rodadas}"></label>
        <input data-cond-campo="${c.id}:origem" value="${esc(c.origem||'')}" placeholder="Origem" style="flex:1">
        <button data-cond-rodada-menos="${c.id}" title="Fim de turno: -1 rodada">−1 rodada</button>
        <button data-cond-remover="${c.id}" class="perigo" style="padding:4px 10px">✕</button>
      </div>
    `).join('')}
    <button data-nova-condicao>+ Aplicar condição</button>
  </div>
  <div class="cartao">
    <h3 style="margin-bottom:10px">Referência rápida</h3>
    ${CONDICOES_NOMES.map(n => `<p class="mini" style="margin-bottom:6px"><b>${n}</b> — ${CONDICOES_DEF[n]}</p>`).join('')}
  </div>`;
}

function abaConteudos(p){
  const lista = todosConteudos(p).filter(c => p.mostrarRestritos || !c.restrito);
  const busca = (p._buscaConteudo || '').toLowerCase();
  const filtrada = busca ? lista.filter(c => c.nome.toLowerCase().includes(busca) || c.pericia.toLowerCase().includes(busca)) : lista;
  return `<div class="cartao">
    <h3 style="margin-bottom:10px">Conteúdos (Feitiços, Técnicas...)</h3>
    <p class="mini" style="margin-bottom:10px">Perícia mede competência; Conteúdo mede possibilidade. Marque o estado de cada um conforme o personagem aprende.</p>
    <div class="linha busca">
      <input placeholder="Buscar por nome ou perícia…" data-busca-conteudo value="${esc(p._buscaConteudo||'')}">
      <label style="width:auto;font-size:12px;text-transform:none"><input type="checkbox" style="width:auto" data-mostrar-restritos ${p.mostrarRestritos?'checked':''}> Mostrar restritos (Artes das Trevas)</label>
    </div>
    ${filtrada.map(c => {
      const estado = p.conteudosConhecidos[c.id] || 'oculto';
      const fav = p.favoritos.includes(c.id);
      return `<div class="item-conteudo">
        <h4>${esc(c.nome)} ${c.restrito?'<span class="pill" style="border-color:rgba(196,80,107,.5);color:#e58a9b">restrito</span>':''} ${c.concentracao?'<span class="pill">concentração</span>':''}</h4>
        <div class="campos">
          <div><b>${esc(c.categoria)}</b></div>
          <div>${esc(c.pericia)} + ${esc(c.atributo)}</div>
          <div>Alcance: ${esc(c.alcance)}</div>
          <div>Área: ${esc(c.area)}</div>
          <div>Duração: ${esc(c.duracao)}</div>
          <div>Natureza: ${esc(c.natureza)}</div>
        </div>
        <p class="mini"><b>Sucesso:</b> ${esc(c.sucesso)}</p>
        ${c.elevado!=='—' ? `<p class="mini"><b>Elevado:</b> ${esc(c.elevado)}</p>` : ''}
        ${c.excepcional!=='—' ? `<p class="mini"><b>Excepcional:</b> ${esc(c.excepcional)}</p>` : ''}
        <div class="linha" style="margin-top:8px;flex-wrap:wrap">
          <select data-conteudo-estado="${c.id}" style="width:170px">
            ${ESTADOS_CONTEUDO.map(e => `<option value="${e}" ${estado===e?'selected':''}>${ROTULO_ESTADO[e]}</option>`).join('')}
          </select>
          <button data-conteudo-favorito="${c.id}" class="${fav?'destaque':''}">${fav?'★ Favorito':'☆ Favoritar'}</button>
        </div>
      </div>`;
    }).join('')}
    ${filtrada.length===0 ? '<p class="mini">Nada encontrado.</p>' : ''}
  </div>

  <div class="cartao">
    <h3 style="margin-bottom:10px">Favoritos (${p.favoritos.length})</h3>
    ${p.favoritos.length===0 ? '<p class="mini">Marque até 8–12 pra agilizar sessão (decisão do patch v1.1) — não limita o que o personagem conhece.</p>' :
      p.favoritos.map(id => { const c = todosConteudos(p).find(x=>x.id===id); return c ? `<span class="pill on" style="margin:0 6px 6px 0;display:inline-block">${esc(c.nome)}</span>` : ''; }).join('')}
  </div>

  <div class="cartao">
    <h3 style="margin-bottom:10px">+ Conteúdo próprio</h3>
    <p class="mini" style="margin-bottom:10px">O Mestre cadastra sem mexer em código — igual ao catálogo, mas escrito por vocês.</p>
    <div class="grade">
      <div><label>Nome</label><input id="novoConteudoNome" placeholder="Ex.: Avis"></div>
      <div><label>Categoria</label><input id="novoConteudoCategoria" placeholder="Feitiço, Técnica, Receita..."></div>
      <div><label>Perícia</label><input id="novoConteudoPericia" placeholder="Ex.: Feitiços"></div>
      <div><label>Atributo</label><input id="novoConteudoAtributo" placeholder="Ex.: Arcano"></div>
    </div>
    <label style="margin-top:8px">Efeito (sucesso / elevado / excepcional, resumido)</label>
    <textarea id="novoConteudoEfeito" rows="2"></textarea>
    <button data-add-conteudo style="margin-top:10px">+ Adicionar à ficha</button>
    ${p.conteudosCustom.length ? `<h4 style="margin-top:16px;font-size:13px">Já criados</h4>` + p.conteudosCustom.map(c => `
      <div class="linha" style="margin-bottom:6px"><span class="mini" style="flex:1">${esc(c.nome)} — ${esc(c.categoria)}</span><button data-remover-conteudo-custom="${c.id}" class="perigo" style="padding:3px 8px">✕</button></div>
    `).join('') : ''}
  </div>`;
}

/* --- Render / eventos -------------------------------------------------------- */

function render(){
  desenharBarra();
  const app = document.getElementById('app');

  if(MODO_HUB && estado.carregandoHub){ app.innerHTML = `<div class="vazio"><h2>Carregando…</h2></div>`; return; }
  if(MODO_HUB && estado.erroHub === 'nao-encontrado'){
    app.innerHTML = `<div class="vazio"><h2>Ficha não encontrada</h2><p class="mini">Ela pode ter sido apagada, ou não é sua. <a href="/fichas">Voltar para Fichas</a></p></div>`;
    return;
  }
  const p = atual();
  if(!p){
    app.innerHTML = `<div class="vazio"><h2>Nenhum personagem ainda</h2><p class="mini">Clique em "+ Novo" para criar a primeira ficha.</p></div>`;
    return;
  }
  const somenteLeitura = MODO_HUB && !estado.podeEditar;
  const alerta = somenteLeitura
    ? `<div class="ok">Modo leitura — você está vendo a ficha de <strong>${esc(p.perfil.nome)}</strong>. Só quem é dono edita.</div>`
    : falhouAoSalvar ? `<div class="aviso"><strong>Não consegui salvar${MODO_HUB?' no Hub':''}.</strong> Confira sua conexão.</div>` : '';

  app.innerHTML = alerta
    + `<div class="abas">` + ABAS.map(a => `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`).join('') + `</div>`
    + ({perfil:abaPerfil, atributos:abaAtributos, pericias:abaPericias, combate:abaCombate, condicoes:abaCondicoes, conteudos:abaConteudos}[estado.aba])(p);

  ligarEventos();
  if(somenteLeitura){
    app.querySelectorAll('input, select, textarea, button:not([data-aba])').forEach(el => el.disabled = true);
  }
}

function desenharBarra(){
  if(MODO_HUB){
    document.getElementById('seletor').hidden = true;
    document.getElementById('btNovo').hidden = true;
    document.getElementById('btExcluir').hidden = true;
    document.getElementById('linkFichas').hidden = false;
    const label = document.getElementById('labelCompartilhar');
    label.style.display = estado.ehDono ? 'flex' : 'none';
    document.getElementById('chkCompartilhar').checked = estado.compartilhado;
    return;
  }
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.map(f => `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`).join('');
}

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  // Campos de texto genéricos: data-campo="perfil.nome" / "varinha.madeira" etc.
  app.querySelectorAll('[data-campo]').forEach(el => {
    const evento = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(evento, () => {
      const [grupo, chave] = el.dataset.campo.split('.');
      mudarSemRedesenhar(p => { p[grupo][chave] = el.value; });
    });
  });
  app.querySelectorAll('[data-campo-num]').forEach(el => {
    el.addEventListener('input', () => {
      const caminho = el.dataset.campoNum.split('.');
      mudarSemRedesenhar(p => {
        let alvo = p; for(let i=0;i<caminho.length-1;i++) alvo = alvo[caminho[i]];
        alvo[caminho[caminho.length-1]] = Math.max(0, Number(el.value) || 0);
      });
    });
  });

  // Atributos
  app.querySelectorAll('[data-atr-inc]').forEach(b => b.onclick = () => mudar(p => { if((p.atributos[b.dataset.atrInc]||0) < 5) p.atributos[b.dataset.atrInc]++; }));
  app.querySelectorAll('[data-atr-dec]').forEach(b => b.onclick = () => mudar(p => { if((p.atributos[b.dataset.atrDec]||0) > 0) p.atributos[b.dataset.atrDec]--; }));

  // Perícias
  app.querySelectorAll('[data-per-inc]').forEach(b => b.onclick = () => mudar(p => { if((p.pericias[b.dataset.perInc]||0) < 5) p.pericias[b.dataset.perInc]++; }));
  app.querySelectorAll('[data-per-dec]').forEach(b => b.onclick = () => mudar(p => { if((p.pericias[b.dataset.perDec]||0) > 0) p.pericias[b.dataset.perDec]--; }));
  const chkOverride = app.querySelector('[data-override-pericia]');
  if(chkOverride) chkOverride.onchange = () => mudar(p => { p.periciasOverride = chkOverride.checked; });

  // Vida / Tensão
  app.querySelectorAll('[data-vida-delta]').forEach(b => b.onclick = () => mudar(p => { p.vida.atual = Math.max(0, Math.min(p.vida.maxima, p.vida.atual + Number(b.dataset.vidaDelta))); }));
  app.querySelectorAll('[data-tensao-delta]').forEach(b => b.onclick = () => mudar(p => { p.tensao = Math.max(0, Math.min(3, p.tensao + Number(b.dataset.tensaoDelta))); }));

  // Ferimentos
  const btNovoFer = app.querySelector('[data-novo-ferimento]');
  if(btNovoFer) btNovoFer.onclick = () => mudar(p => p.ferimentos.push({id:uid(), nome:'Ferimento', consequencia:'', tratamento:'', recuperacao:'', estado:'Não Tratado'}));
  app.querySelectorAll('[data-fer-remover]').forEach(b => b.onclick = () => mudar(p => { p.ferimentos = p.ferimentos.filter(f => f.id !== b.dataset.ferRemover); }));
  app.querySelectorAll('[data-fer-campo]').forEach(el => {
    const [id, campo] = el.dataset.ferCampo.split(':');
    const evento = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evento, () => mudarSemRedesenhar(p => { const f = p.ferimentos.find(x=>x.id===id); if(f) f[campo] = el.value; }));
  });

  // Condições
  const btNovaCond = app.querySelector('[data-nova-condicao]');
  if(btNovaCond) btNovaCond.onclick = () => mudar(p => p.condicoes.push({id:uid(), nome:CONDICOES_NOMES[0], rodadas:1, origem:''}));
  app.querySelectorAll('[data-cond-remover]').forEach(b => b.onclick = () => mudar(p => { p.condicoes = p.condicoes.filter(c => c.id !== b.dataset.condRemover); }));
  app.querySelectorAll('[data-cond-rodada-menos]').forEach(b => b.onclick = () => mudar(p => {
    const c = p.condicoes.find(x=>x.id===b.dataset.condRodadaMenos); if(!c) return;
    c.rodadas = Math.max(0, c.rodadas - 1);
    if(c.rodadas === 0) p.condicoes = p.condicoes.filter(x => x.id !== c.id);
  }));
  app.querySelectorAll('[data-cond-campo]').forEach(el => {
    const [id, campo] = el.dataset.condCampo.split(':');
    const evento = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evento, () => mudarSemRedesenhar(p => { const c = p.condicoes.find(x=>x.id===id); if(c) c[campo] = el.value; }));
  });
  app.querySelectorAll('[data-cond-campo-num]').forEach(el => {
    const [id, campo] = el.dataset.condCampoNum.split(':');
    el.addEventListener('input', () => mudarSemRedesenhar(p => { const c = p.condicoes.find(x=>x.id===id); if(c) c[campo] = Math.max(0, Number(el.value)||0); }));
  });

  // Conteúdos
  const buscaEl = app.querySelector('[data-busca-conteudo]');
  if(buscaEl) buscaEl.addEventListener('input', () => mudarSemRedesenhar(p => { p._buscaConteudo = buscaEl.value; }));
  const chkRestritos = app.querySelector('[data-mostrar-restritos]');
  if(chkRestritos) chkRestritos.onchange = () => mudar(p => { p.mostrarRestritos = chkRestritos.checked; });
  app.querySelectorAll('[data-conteudo-estado]').forEach(el => el.addEventListener('change', () => mudar(p => { p.conteudosConhecidos[el.dataset.conteudoEstado] = el.value; })));
  app.querySelectorAll('[data-conteudo-favorito]').forEach(b => b.onclick = () => mudar(p => {
    const id = b.dataset.conteudoFavorito;
    if(p.favoritos.includes(id)) p.favoritos = p.favoritos.filter(x=>x!==id);
    else p.favoritos.push(id);
  }));
  const btAddConteudo = app.querySelector('[data-add-conteudo]');
  if(btAddConteudo) btAddConteudo.onclick = () => {
    const nome = document.getElementById('novoConteudoNome').value.trim();
    if(!nome) return;
    mudar(p => p.conteudosCustom.push({
      id: uid(), nome,
      categoria: document.getElementById('novoConteudoCategoria').value.trim() || 'Conteúdo',
      pericia: document.getElementById('novoConteudoPericia').value.trim() || '—',
      atributo: document.getElementById('novoConteudoAtributo').value.trim() || '—',
      alcance:'—', area:'—', duracao:'—', concentracao:false, dano:'0', natureza:'Não Letal',
      sucesso: document.getElementById('novoConteudoEfeito').value.trim() || '—',
      elevado:'—', excepcional:'—', restrito:false,
    }));
  };
  app.querySelectorAll('[data-remover-conteudo-custom]').forEach(b => b.onclick = () => mudar(p => { p.conteudosCustom = p.conteudosCustom.filter(c => c.id !== b.dataset.removerConteudoCustom); }));
}

document.getElementById('seletor').onchange = e => { estado.atualId = e.target.value; render(); };
document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p); estado.atualId = p.id;
  salvar(); render();
};
document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não tem como desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas[0]?.id || null;
  salvar(); render();
};
document.getElementById('chkCompartilhar').onchange = e => alternarCompartilhado(e.target.checked);

render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
