<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestiário · Pathfinder Remaster</title><link rel="stylesheet" href="/css/pathfinder-grimorio.css"><script defer src="/js/pathfinder-bestiario.js"></script><style>textarea{width:100%;min-height:130px;font:inherit;padding:12px;background:var(--fundo);color:inherit;border:1px solid var(--borda);border-radius:8px}fieldset{border:0;padding:0}#editor label{margin:16px 0}.linha{display:flex;gap:12px}.linha label{flex:1;min-width:0}#modelos{max-height:260px;overflow:auto}#modelos button{width:100%;text-align:left;margin:4px 0}</style></head><body><header><a href="/bestiario">← Meu bestiário</a><h1>Bestiário de Pathfinder</h1><p>Modelos de criaturas separados das fichas dos jogadores. Aplicar um modelo prepara um rascunho; salvar exige confirmação.</p></header><main><aside><a href="/pathfinder-grimorio.html?fonte=monster-core">Consultar Monster Core</a><label>Buscar modelo<input type="search" id="busca"></label><p id="cobertura"></p><div id="modelos"></div></aside><section><p role="status" id="estado">Carregando…</p><fieldset id="editor" disabled><label>Nome<input id="nome"></label><div class="linha"><label>Nível<input id="nivel" type="number" min="-1" max="30"></label><label>PV atuais<input id="pvAtual" type="number" min="0"></label><label>PV máximos<input id="pvMax" type="number" min="0"></label></div><label>Defesas, atributos e perícias<textarea id="atributos"></textarea></label><label>Ataques e ações<textarea id="acoes"></textarea></label><label>Traços, sentidos e regras especiais<textarea id="tracos"></textarea></label><label>Notas<textarea id="descricao"></textarea></label><button id="salvar">Salvar criatura</button><button id="exportar">Exportar rascunho</button></fieldset></section></main></body></html>
