<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Naruto 5e</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s,transform .12s;
}
button:hover{border-color:var(--suave)}
button:not(:disabled):active{transform:scale(.95)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
button:disabled{opacity:.4; cursor:default}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:960px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.cartao h2{font-size:17px; margin-bottom:12px}
.cartao h3{font-size:14px; color:var(--ambar-forte); margin:14px 0 8px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)} }

.campo{margin-bottom:12px}
.linha{display:flex; align-items:center; gap:8px}
.linha .cresce{flex:1}

.estat{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--superficie-alta); border:1px solid var(--borda); border-radius:10px;
  padding:10px 8px;
}
.estat .num{font-size:24px; font-weight:700; font-family:Georgia,serif}
.estat .rot{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--suave)}
.estat .mod{font-size:13px; color:var(--ambar-forte)}

table.lista{width:100%; border-collapse:collapse; font-size:14px}
table.lista th{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--suave); padding:6px 8px; border-bottom:1px solid var(--borda)}
table.lista td{padding:6px 8px; border-bottom:1px solid var(--borda); vertical-align:middle}
table.lista tr:last-child td{border-bottom:none}
.check{width:18px; height:18px; cursor:pointer}

.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px;
  border:1px solid var(--borda); color:var(--suave)}
.pill.on{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.aviso{font-size:13px; color:var(--suave); font-style:italic}
.rolagem{font-family:Georgia,serif; font-size:13px; color:var(--ambar-forte); min-width:70px; text-align:right}

.referencia{font-size:13.5px; color:var(--suave)}
.referencia b{color:var(--texto)}
.referencia ul{margin:6px 0; padding-left:20px}

footer{max-width:960px; margin:0 auto; padding:0 16px 40px; color:var(--suave); font-size:12px}
[hidden]{display:none !important}
</style>
</head>

<div class="barra">
  <span class="marca">Hub RPG · Naruto 5e</span>
  <div class="cresce"></div>

  <button id="btModoGuiado" title="Criação passo a passo, explicando o sistema">🧭 Modo Guiado</button>
  <button id="btnNovo">+ Novo</button>
  <button id="btnDuplicar">Duplicar</button>
  <button id="btnExportar">Exportar</button>
  <button id="btnImportar">Importar</button>
  <button id="btnExcluir" class="perigo">Excluir</button>
  <a href="/fichas">← Fichas</a>
</div>

<main>
  <div class="abas" role="tablist"></div>
  <div id="conteudo"></div>
</main>

<footer>
  Homebrew de fã (Naruto 5e, comunidade), baseado em Dungeons &amp; Dragons 5ª
  Edição. O Hub codifica só a mecânica em números — nada de texto, arte ou
  fluff do livro. Ficha salva neste navegador (localStorage); Modo Hub
  (salvar na conta) fica para uma fatia futura.
</footer>

<input type="file" id="arquivoImportar" accept="application/json" hidden>

<script>
/* ---------- Matemática base (mesma convenção usada em dnd-5e.html) ---------- */
function modAtributo(valor){ return Math.floor((valor - 10) / 2); }
function fmtMod(mod){ return mod >= 0 ? `+${mod}` : `${mod}`; }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/*
  Bônus de Proficiência do Naruto 5e é DIFERENTE do D&D 5e padrão: começa em
  +3 (não +2) e sobe a cada 3 níveis, não a cada 4. Tabela conferida linha a
  linha no livro (Character Advancement, cap. "Ambições & Antecedentes").
*/
function bonusProficiencia(nivel){
  const n = clamp(nivel || 1, 1, 20);
  return 3 + Math.floor((n - 1) / 3);
}
function metadeProfArredondada(nivel){ return Math.floor(bonusProficiencia(nivel) / 2); }

const XP_POR_NIVEL = [0,0,50,75,100,150,200,350,475,600,725,850,1000,1200,1400,1600,1800,2100,2400,2700,3000];

/* Dado de Vida/Chakra: valor fixo por nível (regra padrão do livro, não
   rolada) — no 1º nível vale o dado cheio + mod; nos seguintes, a média do
   dado arredondada para cima + mod, exatamente como o exemplo do próprio
   livro (3d12 = 21, ou seja 7 por nível, contando o 1º). */
const DADOS = ['d6','d8','d10','d12'];
function faceDado(dado){ return Number(String(dado||'d8').replace(/\D/g,'')) || 8; }
function mediaDadoArredondada(dado){ return Math.ceil((faceDado(dado) + 1) / 2); }
function totalPorDado(dado, nivel, mod){
  const n = clamp(nivel || 1, 1, 20);
  return n * (mediaDadoArredondada(dado) + mod);
}

/* ---------- Catálogos (chassi — clãs/classes/jutsu completos são fatias futuras) ---------- */
const ATRIBUTOS = [
  {id:'forca', nome:'Força'},
  {id:'destreza', nome:'Destreza'},
  {id:'constituicao', nome:'Constituição'},
  {id:'inteligencia', nome:'Inteligência'},
  {id:'sabedoria', nome:'Sabedoria'},
  {id:'carisma', nome:'Carisma'},
];
function atributo(id){ return ATRIBUTOS.find(a => a.id === id) || null; }

/* As 21 perícias do livro: Arcana virou Ninshou, e Controle de Chakra,
   Ilusões, Artes Marciais e Ofício são as quatro perícias novas (Religião
   saiu). Lista e atributo de cada uma conferidos no capítulo "Using Ability
   Scores". */
const PERICIAS = [
  {id:'atletismo', nome:'Atletismo', atributo:'forca'},
  {id:'artesMarciais', nome:'Artes Marciais', atributo:'forca'},
  {id:'acrobacia', nome:'Acrobacia', atributo:'destreza'},
  {id:'prestidigitacao', nome:'Prestidigitação', atributo:'destreza'},
  {id:'furtividade', nome:'Furtividade', atributo:'destreza'},
  {id:'controleChakra', nome:'Controle de Chakra', atributo:'constituicao'},
  {id:'oficio', nome:'Ofício', atributo:'inteligencia'},
  {id:'historia', nome:'História', atributo:'inteligencia'},
  {id:'investigacao', nome:'Investigação', atributo:'inteligencia'},
  {id:'natureza', nome:'Natureza', atributo:'inteligencia'},
  {id:'ninshou', nome:'Ninshou', atributo:'inteligencia'},
  {id:'adestrarAnimais', nome:'Adestrar Animais', atributo:'sabedoria'},
  {id:'ilusoes', nome:'Ilusões', atributo:'sabedoria'},
  {id:'intuicao', nome:'Intuição', atributo:'sabedoria'},
  {id:'medicina', nome:'Medicina', atributo:'sabedoria'},
  {id:'percepcao', nome:'Percepção', atributo:'sabedoria'},
  {id:'sobrevivencia', nome:'Sobrevivência', atributo:'sabedoria'},
  {id:'enganacao', nome:'Enganação', atributo:'carisma'},
  {id:'intimidacao', nome:'Intimidação', atributo:'carisma'},
  {id:'atuacao', nome:'Atuação', atributo:'carisma'},
  {id:'persuasao', nome:'Persuasão', atributo:'carisma'},
];
function pericia(id){ return PERICIAS.find(p => p.id === id) || null; }

/* Clãs (Compêndio de Estudos da Tsunade) — mecânica traduzida e resumida
   pelo Hub. O compêndio lista mais de 30 clãs, mas a extração do PDF parou
   no meio (mesma trava que já tinha acontecido com o Fabula Ultima): só os
   primeiros 15, em ordem alfabética até Hyūga, vieram completos. O resto
   (Iburi em diante) entra numa fatia futura, quando o resto do PDF chegar.
   Quando o clã dá bônus "ou" num atributo/afinidade, o texto conta as
   opções — a ficha não impõe escolha automática no atributo (mesmo

const CLAS = [

    pericias:['artesMarciais','medicina'],

    pericias:['ninshou','percepcao'],
    traco:'Afinidade de Raio de nascença; reduz o requisito de atributo pra aprender e lançar jutsu de Raio.'},

  {id:'hoshi', nome:'Hoshi', bonus:'+2 Constituição, +1 Inteligência', velocidade:9,
    pericias:['controleChakra','ninshou'],
    traco:'Aprende 1 Hijutsu D-Rank exclusivo do clã a mais, sem contar nos jutsu conhecidos.'},
  {id:'hoshigaki', nome:'Hoshigaki', bonus:'+2 Constituição, +1 Força', velocidade:9,
    pericias:['adestrarAnimais','atletismo'],
    traco:'Visão no escuro até 9m; proficiência com armas pesadas (Machado Grande, Naginata, Odachi, Foice, Tetsubo); afinidade de Água com requisito de atributo reduzido.'},
  {id:'hozuki', nome:'Hōzuki', bonus:'+2 Força, +1 Inteligência', velocidade:9,
    pericias:['artesMarciais','controleChakra'],
    traco:'Velocidade de natação 9m; afinidade de Água de nascença; não pode aprender nem usar Ninjutsu de Raio.'},
  {id:'hyuga', nome:'Hyūga', bonus:'+2 Sabedoria, +1 Destreza', velocidade:9,

    traco:'Visão no escuro até 9m (Byakugan) e 1 Jutsu D-Rank exclusivo do clã a mais, sem contar nos jutsu conhecidos.'},

function cla(id){ return CLAS.find(c => c.id === id) || null; }

/* Classes (Compêndio de Observação do Orochimaru) — as 11 completas. As 5
   primeiras vieram pelo Google Drive (trava de extração no meio do
   Ninjutsu Specialist); Zé mandou o PDF recortado em 6 partes como anexo
   pra fechar as 6 que faltavam (Scout-Nin a Science-Nin). CD/ataque de
   Ninjutsu/Genjutsu/Taijutsu conferidos nas 11: são SEMPRE Inteligência/
   Sabedoria/Força, sem exceção — por isso isso virou o padrão fixo da aba
   Jutsu (o seletor manual continua existindo só por segurança, caso
   Talentos/Modificações de Classe abram uma exceção no futuro). Escolhas
   de perícia "escolha N de..." ficam como texto de referência, não
   marcadas sozinhas (é decisão do jogador, igual as escolhas "ou" dos
   Clãs). `periciaFixa: null` marca as 2 classes (Scout-Nin, Science-Nin)
   cujas 4 perícias são todas de escolha, sem nenhuma fixa. */
const CLASSES = [

    proficiencias:'Armadura leve e média; armas simples; Kit de Medicina e Kit de Veneno.',
    periciaFixa:'medicina', periciasEscolha:'Controle de Chakra fixa, mais escolha 2 entre História, Intuição, Percepção, Ilusões, Ninshou.',
    subclasses:{nome:'Preceito da Medicina', opcoes:['Adept Medic','Combat Medic','Transmuter']},

    subclasses:{nome:'Foco de Ninjutsu', opcoes:['Blaze Walker','Hijutsu Elitist','Sanguine Master','Scribe Master','Stone Crusher','Storm Terror','Summoner','The Professor','Trace Talent','Tsunami']},

    dadoVida:'d8', dadoChakra:'d10', resistencias:['forca','constituicao','inteligencia'],

  {id:'taijutsuSpecialist', nome:'Taijutsu Specialist', tier:'Baixo (2-3 recursos extras)',

/* Vantagem Elemental (cap. Combate) — ciclo fixo de superioridade entre as
   5 naturezas. Quem usa o elemento superior tem vantagem no ataque ou no
   teste de Clash contra o elemento inferior. */
const CICLO_ELEMENTOS = ['Fogo','Vento','Raio','Terra','Água'];
function elementoSuperior(atacante, alvo){
  if(!atacante || !alvo || atacante === alvo) return 'neutro';
  const i = CICLO_ELEMENTOS.indexOf(atacante);
  if(i === -1) return 'neutro';
  const proximo = CICLO_ELEMENTOS[(i + 1) % CICLO_ELEMENTOS.length];
  if(proximo === alvo) return 'vantagem';
  const anterior = CICLO_ELEMENTOS[(i + CICLO_ELEMENTOS.length - 1) % CICLO_ELEMENTOS.length];
  if(anterior === alvo) return 'desvantagem';
  return 'neutro';
}

/* ---------- Derivados ---------- */
function valorAtributo(p, id){ return p.atributos[id] ?? 10; }
function modFinal(p, id){ return modAtributo(valorAtributo(p, id)); }
function prof(p){ return bonusProficiencia(p.nivel); }

function pvMaximo(p){ return totalPorDado(p.recursos.dadoVida, p.nivel, modFinal(p,'constituicao')); }
function pvAtual(p){ return clamp(pvMaximo(p) + p.recursos.pvAtualDelta, 0, pvMaximo(p)); }
function chakraMaximo(p){ return totalPorDado(p.recursos.dadoChakra, p.nivel, modFinal(p,'constituicao')); }
function chakraAtual(p){ return clamp(chakraMaximo(p) + p.recursos.chakraAtualDelta, 0, chakraMaximo(p)); }

/* CA = 10 + mod Destreza + metade do bônus de proficiência (arredondado
   pra baixo) + bônus de armadura — fórmula própria do Naruto 5e, diferente
   do D&D 5e puro. Conferida no capítulo de Equipamento. */
function defesa(p){
  if(p.recursos.defesaManual != null && p.recursos.defesaManual !== '') return Number(p.recursos.defesaManual);
  return 10 + modFinal(p,'destreza') + metadeProfArredondada(p.nivel) + Number(p.recursos.bonusArmadura || 0);
}
/* Iniciativa também soma metade do bônus de proficiência — outra diferença
   confirmada em relação ao D&D 5e padrão (lá é só o mod de Destreza). */
function bonusIniciativa(p){ return modFinal(p,'destreza') + metadeProfArredondada(p.nivel); }

/* Perícia sem proficiência fica só no modificador (regra normal); teste de
   resistência sem proficiência ainda soma metade do bônus de proficiência
   (arredondado pra baixo) — regra própria do Naruto 5e, conferida no
   capítulo de Combate. */
function totalPericia(p, periciaId){
  const per = pericia(periciaId);
  const m = modFinal(p, per.atributo);
  return m + (p.periciasProficientes[periciaId] ? prof(p) : 0);
}
function totalSalvamento(p, atributoId){
  const m = modFinal(p, atributoId);
  return m + (p.salvamentosProficientes[atributoId] ? prof(p) : metadeProfArredondada(p.nivel));
}

function xpParaProximoNivel(p){
  const n = clamp(p.nivel, 1, 19);
  return XP_POR_NIVEL[n + 1];
}

/* CD e bônus de ataque de Jutsu — o tipo de Ninjutsu sempre usa
   Inteligência; Taijutsu e Genjutsu variam por classe (ainda não
   catalogada no Hub), por isso o atributo de cada um é escolhido na
   ficha em vez de fixo. */
function cdJutsu(p, atributoId){ return 8 + prof(p) + modFinal(p, atributoId); }
function ataqueJutsu(p, atributoId){ return prof(p) + modFinal(p, atributoId); }

function rolarD20(){ return 1 + Math.floor(Math.random() * 20); }
function rolarETotal(mod){ const d = rolarD20(); return {dado:d, total:d+mod}; }

/* ---------- Interface ---------- */
const ABAS = [
  {id:'perfil', nome:'Perfil'},
  {id:'atributos', nome:'Atributos'},
  {id:'pericias', nome:'Perícias'},
  {id:'recursos', nome:'Recursos'},
  {id:'jutsu', nome:'Jutsu'},
  {id:'regras', nome:'Regras'},
  {id:'notas', nome:'Notas'},
];

function el(tag, attrs, ...filhos){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    /* null/undefined/false = "sem este atributo" (ex.: checked/selected
       condicionais) — setAttribute(k, null) marcaria o atributo como
       presente mesmo assim, deixando toda checkbox/opção "marcada". */
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for(const f of filhos.flat()){
    if(f == null) continue;
    e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
  }
  return e;
}

function campoTexto(rotulo, valor, onInput, tipo){
  const input = el('input', {type: tipo || 'text', value: valor ?? '', oninput: e => onInput(e.target.value)});
  return el('div', {class:'campo'}, el('label', {}, rotulo), input);
}
function campoArea(rotulo, valor, onInput){
  const t = el('textarea', {rows:3, oninput: e => onInput(e.target.value)});
  t.value = valor ?? '';
  return el('div', {class:'campo'}, el('label', {}, rotulo), t);
}
function campoSelect(rotulo, valor, opcoes, onChange){
  const s = el('select', {onchange: e => onChange(e.target.value)});
  for(const [v, txt] of opcoes) s.appendChild(el('option', {value:v, selected: v===valor ? 'selected' : null}, txt));
  return el('div', {class:'campo'}, el('label', {}, rotulo), s);
}

function renderAbas(){
  const barra = document.querySelector('.abas');
  barra.innerHTML = '';
  for(const a of ABAS){
    barra.appendChild(el('button', {
      'aria-current': a.id === abaAtual ? 'true' : 'false',
      onclick: () => { abaAtual = a.id; render(); },
    }, a.nome));
  }
}

   Guiado (renderGuiado) — mesma receita da decisão #134: um bloco só,
   chamado dos dois lugares, pra nunca ficar dessincronizado. */
function blocoCla(p){
  const opcoesCla = [['', '— outro (digitar abaixo) —'], ...CLAS.map(c => [c.id, c.nome])];
  const claEscolhido = cla(p.claId);
  const cCla = el('div', {class:'cartao'},
    el('h2', {}, 'Clã'),
    campoSelect('Clã', p.claId, opcoesCla, v => {
      p.claId = v;
      const c = cla(v);
      if(c) for(const id of c.pericias) p.periciasProficientes[id] = true;
      salvar(); render();
    }),
  );
  if(claEscolhido){
    cCla.appendChild(el('p', {class:'referencia'}, el('b',{},'Bônus recomendado: '), claEscolhido.bonus, ` · Deslocamento ${claEscolhido.velocidade}m`));
    cCla.appendChild(el('p', {class:'referencia'}, el('b',{},'Perícias já marcadas: '), claEscolhido.pericias.map(id => pericia(id).nome).join(' / ')));
    cCla.appendChild(el('p', {class:'referencia'}, claEscolhido.traco));
    cCla.appendChild(el('p', {class:'aviso'}, 'Bônus de atributo é referência — some você mesmo no campo de Atributos (mesma lógica do bônus de Antecedente).'));
  } else {
    cCla.appendChild(campoTexto('Nome do clã (fora do catálogo por enquanto)', p.cla, v => { p.cla = v; salvar(); }));
  }
  cCla.appendChild(el('p', {class:'aviso'}, `Catálogo com 15 dos ~38 clãs do Compêndio de Estudos da Tsunade — a extração do PDF parou em Hyūga. Os demais (Iburi em diante) entram quando o resto do livro chegar.`));
  return cCla;
}

function blocoClasse(p){
  const opcoesClasse = [['', '— outro (digitar abaixo) —'], ...CLASSES.map(c => [c.id, c.nome])];
  const classeEscolhida = classeDoCatalogo(p.classeId);

        if(c.periciaFixa) p.periciasProficientes[c.periciaFixa] = true;
        for(const at of c.resistencias) p.salvamentosProficientes[at] = true;

    cClasse.appendChild(el('p', {class:'referencia'}, el('b',{},`${classeEscolhida.subclasses.nome}: `), classeEscolhida.subclasses.opcoes.join(' / '), ' — só os nomes por enquanto, mecânica de cada uma é fatia futura.'));

  return cClasse;

function renderRecursos(p){
  const pv = pvMaximo(p), pvA = pvAtual(p);
  const ck = chakraMaximo(p), ckA = chakraAtual(p);

  const cartaoRecurso = (titulo, atual, maximo, temp, onDelta, onTemp) => el('div', {class:'cartao'},
    el('h2', {}, titulo),
    el('div', {class:'linha'},
      el('button', {onclick: () => onDelta(-1)}, '−1'),
      el('div', {class:'estat cresce'}, el('span',{class:'num'}, `${atual} / ${maximo}`), el('span',{class:'rot'}, 'atual / máximo')),
      el('button', {onclick: () => onDelta(1)}, '+1'),
    ),
    el('div', {class:'linha', style:'margin-top:8px'},
      el('div', {class:'campo cresce'}, el('label',{},'Dano/cura (+ cura, − dano)'),
        (() => { const i = el('input', {type:'number', value:0}); i._ref = true;
          return el('div', {class:'linha'}, i, el('button', {onclick: () => { onDelta(Number(i.value)||0); i.value = 0; }}, 'Aplicar')); })()),
      el('div', {class:'campo', style:'width:110px'}, el('label',{},'Temporário'),
        el('input', {type:'number', value:temp, oninput: e => onTemp(Number(e.target.value)||0)})),
    ),
  );

  const recPV = cartaoRecurso('Pontos de Vida (PV)', pvA, pv, p.recursos.pvTemp,
    (delta) => { p.recursos.pvAtualDelta = clamp(p.recursos.pvAtualDelta + delta, -pv, 0); salvar(); render(); },
    (v) => { p.recursos.pvTemp = Math.max(0, v); salvar(); render(); });
  const recChakra = cartaoRecurso('Pontos de Chakra', ckA, ck, p.recursos.chakraTemp,
    (delta) => { p.recursos.chakraAtualDelta = clamp(p.recursos.chakraAtualDelta + delta, -ck, 0); salvar(); render(); },
    (v) => { p.recursos.chakraTemp = Math.max(0, v); salvar(); render(); });

  const dados = el('div', {class:'cartao'},
    el('h2', {}, 'Dados de recurso'),
    el('p', {class:'aviso'}, 'Preenchidos sozinhos quando a Classe está no catálogo (aba Perfil); editáveis à mão pras classes que ainda não entraram.'),
    el('div', {class:'grade g2'},
      campoSelect('Dado de Vida', p.recursos.dadoVida, DADOS.map(d => [d,d]), v => { p.recursos.dadoVida = v; salvar(); render(); }),
      campoSelect('Dado de Chakra', p.recursos.dadoChakra, DADOS.map(d => [d,d]), v => { p.recursos.dadoChakra = v; salvar(); render(); }),
    ),
  );

  const defesaCartao = el('div', {class:'cartao'},
    el('h2', {}, 'Defesa e Iniciativa'),
    el('div', {class:'grade g3'},
      el('div', {class:'estat'}, el('span',{class:'num'}, String(defesa(p))), el('span',{class:'rot'},'Defesa (CA)')),
      el('div', {class:'estat'}, el('span',{class:'num'}, fmtMod(bonusIniciativa(p))), el('span',{class:'rot'},'Iniciativa')),
      el('div', {class:'estat'}, el('span',{class:'num'}, String(prof(p))), el('span',{class:'rot'},'Bônus de Proficiência')),
    ),
    el('div', {class:'grade g2', style:'margin-top:10px'},
      campoTexto('Bônus de armadura (manual)', p.recursos.bonusArmadura, v => { p.recursos.bonusArmadura = Number(v)||0; salvar(); render(); }, 'number'),
      campoTexto('Defesa manual (sobrepõe o cálculo, opcional)', p.recursos.defesaManual ?? '', v => { p.recursos.defesaManual = v === '' ? null : Number(v); salvar(); render(); }, 'number'),
    ),
    el('p', {class:'aviso'}, 'Defesa = 10 + mod. Destreza + metade do bônus de proficiência (arred. p/ baixo) + armadura. Vestir armadura sem proficiência dá desvantagem em Força/Destreza e em testes de conjuração de Jutsu.'),
  );

  const ryo = el('div', {class:'cartao'},
    el('h2', {}, 'Carteira'),
    campoTexto('Ryo', p.recursos.ryo, v => { p.recursos.ryo = Math.max(0, Number(v)||0); salvar(); render(); }, 'number'),
    el('p', {class:'aviso'}, 'Moeda única do Naruto 5e (≈ 1 Ryo = 1 peça de ouro do D&D 5e).'),
  );

  return [recPV, recChakra, defesaCartao, dados, ryo];
}

/* Modo Guiado — cria o personagem passo a passo, explicando cada conceito
   do sistema (pedido do Zé: "esse sistema nem eu sei direito"). Reaproveita
   os mesmos blocos/abas de sempre (blocoCla, blocoClasse, blocoAntecedente,
   renderAtributos, renderRecursos, renderJutsu) — nunca duplica a lógica,
   só reorganiza em passos com texto de explicação na frente. */
function cartaoExplicacao(titulo, texto){
  return el('div', {class:'cartao'}, el('h2', {}, titulo), el('p', {class:'referencia'}, texto));
}

function renderGuiado(p){
  const cabecalho = el('div', {class:'cartao', style:'text-align:center'},
    el('p', {class:'aviso', style:'text-transform:uppercase;letter-spacing:.14em;margin:0'},
      `Modo Guiado — Passo ${passoGuiado} de ${TOTAL_PASSOS_GUIADO}`),
    el('div', {class:'linha', style:'justify-content:center;gap:6px;margin-top:10px'},
      ...Array.from({length: TOTAL_PASSOS_GUIADO}, (_, i) => i + 1).map(n =>
        el('span', {style:`display:inline-block;width:26px;height:4px;border-radius:2px;background:${n<=passoGuiado?'var(--ambar)':'var(--borda)'}`})),
    ),
  );

  let corpo;
  if(passoGuiado === 1){
    corpo = [
      cartaoExplicacao('1. Bem-vindo ao Naruto 5e',
        'Naruto 5e é um homebrew de fã que reveste as regras de D&D 5ª Edição com o universo Naruto. Um personagem tem um Clã (como a "raça" do D&D — dá bônus de atributo e um traço especial), uma Classe (define seu papel e os dois recursos que você gasta em combate: PV, sua vida, e Chakra, o "combustível" dos Jutsu) e um Antecedente (de onde ele veio antes de virar shinobi). Vamos passar por cada peça, uma de cada vez.'),
      el('div', {class:'cartao'},
        el('h2', {}, 'Identidade'),
        campoTexto('Nome do personagem', p.nome, v => { p.nome = v; salvar(); render(); }),
        campoTexto('Jogador(a)', p.jogador, v => { p.jogador = v; salvar(); }),
      ),
    ];
  } else if(passoGuiado === 2){
    corpo = [
      cartaoExplicacao('2. Escolha um Clã',
        'O Clã é de onde sua família vem. Ele sugere um bônus de atributo (+2 num, +1 noutro — você mesmo soma isso lá na aba Atributos), já marca 1-2 Perícias de graça, define seu deslocamento e dá um traço especial só dele (às vezes ligado a uma Natureza elemental, como Água ou Raio). Se o clã que você quer ainda não estiver na lista, digite o nome mesmo assim — o resto ainda funciona.'),
      blocoCla(p),
    ];
  } else if(passoGuiado === 3){
    corpo = [
      cartaoExplicacao('3. Escolha uma Classe',
        'A Classe é o seu papel na equipe — o livro chama de "Especialista em Ninjutsu", "Caçador", "Médico-Nin" etc. Ela decide: o tamanho do seu Dado de Vida e Dado de Chakra (quanto de PV/Chakra você ganha por nível), 3 Resistências em que você é bom, 1 Perícia garantida (algumas classes não têm nenhuma fixa, só escolhas), e mais pra frente, uma Subclasse — por enquanto só o nome de cada uma está na ficha.'),
      blocoClasse(p),
    ];
  } else if(passoGuiado === 4){
    corpo = [
      cartaoExplicacao('4. Atributos',
        'Os 6 atributos de sempre (Força, Destreza, Constituição, Inteligência, Sabedoria, Carisma) funcionam como no D&D. O jeito mais simples é usar o array padrão — 15, 14, 13, 12, 11, 10 — distribuindo um valor em cada atributo abaixo. Depois de distribuir, some à mão o bônus do seu Clã (passo 2) e, se quiser, o bônus do Antecedente (próximo passo). As Resistências que sua Classe já marcou aparecem destacadas na tabela debaixo dos atributos.'),
      ...renderAtributos(p),
    ];
  } else if(passoGuiado === 5){
    corpo = [
      cartaoExplicacao('5. Perícias e Antecedente',
        'O Antecedente conta a história de antes da vida shinobi (Estudante, Órfão de Rua, Nobre...) e dá 2 Perícias mais um traço narrativo. Escolha um abaixo. As Perícias que seu Clã e sua Classe já garantiram aparecem marcadas sozinhas na aba Perícias — dá uma olhada lá depois pra ver o total de cada uma.'),
      blocoAntecedente(p),
    ];
  } else if(passoGuiado === 6){
    corpo = [
      cartaoExplicacao('6. PV, Chakra e Defesa',
        'PV (Pontos de Vida) e Chakra já calculam sozinhos a partir do Dado de Vida/Chakra da sua Classe, seu Nível e o modificador de Constituição — role de dano/cura normalmente durante o jogo. Defesa (a "CA" do sistema) soma Destreza + metade do seu Bônus de Proficiência + armadura; Iniciativa funciona parecido. Ryo é a moeda do jogo (bem parecida com peça de ouro do D&D).'),
      ...renderRecursos(p),
    ];
  } else if(passoGuiado === 7){
    corpo = [
      cartaoExplicacao('7. Primeiros Jutsu',
        'Jutsu são as "magias" do sistema: cada um tem um Rank (E é o mais fraco, S o mais forte) e custa Chakra pra lançar. Ninjutsu usa Inteligência, Genjutsu usa Sabedoria e Taijutsu usa Força — sempre, em qualquer classe do livro. No nível 1, escolha alguns Jutsu de Rank E do catálogo abaixo (o catálogo completo ainda está sendo montado — Rank E, D e C do Ninjutsu comum já estão prontos).'),
      ...renderJutsu(p),
    ];
  } else {
    const c = cla(p.claId), cl = classeDoCatalogo(p.classeId);
    corpo = [
      el('div', {class:'cartao'},
        el('h2', {}, 'Pronto pra jogar!'),
        el('p', {class:'referencia'},
          `${p.nome || 'Seu personagem'} é um shinobi`,
          c ? ` do clã ${c.nome}` : '', cl ? `, ${cl.nome}` : '', `, nível ${p.nivel}.`),
        el('p', {class:'referencia'}, `PV ${pvAtual(p)}/${pvMaximo(p)} · Chakra ${chakraAtual(p)}/${chakraMaximo(p)} · Defesa ${defesa(p)} · Iniciativa ${fmtMod(bonusIniciativa(p))}.`),
      ),
      cartaoExplicacao('Pra lembrar na mesa',
        'Chakra é gasto pra lançar Jutsu, não regenera sozinho em combate (só em descanso). Vantagem Elemental e a mecânica de Clash (dois Jutsu se cruzando) estão na aba Regras, com uma calculadora e uma tabela de referência — vale a pena dar uma olhada antes da primeira sessão. Bônus de Proficiência começa em +3 (não +2 como no D&D) e sobe a cada 3 níveis.'),

  const nav = el('div', {class:'linha', style:'justify-content:space-between;margin-top:4px'},

      : el('div', {}),
    passoGuiado < TOTAL_PASSOS_GUIADO
      ? el('button', {class:'destaque', onclick: () => { passoGuiado += 1; render(); }}, 'Próximo →')
      : el('button', {class:'destaque', onclick: () => { modoGuiado = false; render(); }}, '📋 Ver ficha completa'),
  );

  return [cabecalho, ...corpo, nav];
}

function render(){
  const p = personagemAtual();
  const cont = document.getElementById('conteudo');
  cont.innerHTML = '';
  const abasEl = document.querySelector('.abas');
  const btModoGuiado = document.getElementById('btModoGuiado');
  btModoGuiado.textContent = modoGuiado ? '📋 Ver ficha completa' : '🧭 Modo Guiado';
  btModoGuiado.className = modoGuiado ? 'destaque' : '';

  if(modoGuiado){
    abasEl.innerHTML = '';
    for(const parte of renderGuiado(p)) cont.appendChild(parte);
    return;
  }

  renderAbas();
  const partes = {
    perfil: renderPerfil, atributos: renderAtributos, pericias: renderPericias,
    recursos: renderRecursos, jutsu: renderJutsu, regras: renderRegras, notas: renderNotas,
  }[abaAtual](p);
  for(const parte of partes) cont.appendChild(parte);
}

function atualizarSeletor(){
  const s = document.getElementById('seletorPersonagem');
  s.innerHTML = '';
  for(const p of lista) s.appendChild(el('option', {value:p.id, selected: p.id===idAtual?'selected':null}, p.nome));
}

document.getElementById('seletorPersonagem').addEventListener('change', e => { idAtual = e.target.value; modoGuiado = false; render(); });
document.getElementById('btModoGuiado').addEventListener('click', () => {
  modoGuiado = !modoGuiado;
  passoGuiado = 1;
  render();
});
document.getElementById('btnNovo').addEventListener('click', () => {
  const nome = prompt('Nome do novo personagem:', 'Novo Personagem');
  if(nome == null) return;
  const p = personagemPadrao(nome);
  lista.push(p); idAtual = p.id; salvar(); render();
});
document.getElementById('btnDuplicar').addEventListener('click', () => {
  const atual = personagemAtual();
  const copia = JSON.parse(JSON.stringify(atual));
  copia.id = uid(); copia.nome = atual.nome + ' (cópia)';
  lista.push(copia); idAtual = copia.id; salvar(); render();
});
document.getElementById('btnExcluir').addEventListener('click', () => {
  if(lista.length <= 1){ alert('Precisa sobrar ao menos um personagem.'); return; }
  if(!confirm(`Excluir "${personagemAtual().nome}"? Isso não pode ser desfeito.`)) return;
  lista = lista.filter(p => p.id !== idAtual);
  idAtual = lista[0].id; salvar(); render();
});
document.getElementById('btnExportar').addEventListener('click', () => {
  const p = personagemAtual();
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `naruto5e-${(p.nome||'personagem').replace(/\s+/g,'-').toLowerCase()}.json`;
  a.click();
});
document.getElementById('btnImportar').addEventListener('click', () => document.getElementById('arquivoImportar').click());
document.getElementById('arquivoImportar').addEventListener('change', (e) => {
  const arquivo = e.target.files[0];
  if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const p = JSON.parse(leitor.result);
      p.id = uid();
      lista.push(p); idAtual = p.id; salvar(); render();
    }catch(err){ alert('Arquivo inválido.'); }
  };
  leitor.readAsText(arquivo);
  e.target.value = '';
});

atualizarSeletor();
render();
</script>
</body>
</html>
