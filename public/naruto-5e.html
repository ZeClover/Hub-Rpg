  {nome:'Golpe Saltado', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho de Sapo. Quando um aliado em até 4,5m avisar que vai fazer um ataque corpo a corpo contra alguém a até 9m dele, você o lança pro ar com um pisão: ele se move até 9m numa linha reta até ficar adjacente ao alvo e faz o ataque usando seu bônus de ataque de Taijutsu ou o dele (o que for melhor) — no acerto, soma seu dano desarmado ao dano causado. Em ranks mais altos: +3 de custo e +1 dado extra de dano desarmado por rank acima de D.'},
  {nome:'Miragem Relâmpago', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Quando fosse sofrer dano de um ataque corpo a corpo, ganha +3 de Defesa contra esse ataque (podendo transformar o acerto em erro) e contra-ataca: Ataque de Taijutsu corpo a corpo em quem te atacou — acerto causa o dobro do seu dano desarmado, empurra 4,5m e o alvo testa Força ou cai Derrubado.'},
  {nome:'Chute do Luar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa ter se movido pelo menos 4,5m em direção ao alvo antes de lançar. 2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 1d6; acertando os dois, o alvo é empurrado 6m e testa Constituição ou ganha 1 rank de Confusão. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Golpe na Nuca', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (Combo) num alvo humanoide: acerto causa seu dano desarmado + 1d6 e o alvo testa Constituição ou fica Zonzo. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Impacto Nobre', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Redemoinho do Avestruz', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Golpe da Prece', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (Combo): acerto causa 1d4 de dano de Concussão e o alvo testa Constituição ou fica Atordoado até o fim do turno atual. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D; do Rank B em diante, soma seu dano desarmado ao dano.'},
  {nome:'Assalto Orgulhoso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Fúria do Coelho', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'Deslocamento', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho de Coelho. Move em linha reta até seu deslocamento, passando pelo espaço de inimigos e terminando onde quiser: 2 Ataques de Taijutsu contra todos cujo espaço você atravessou — cada acerto causa seu dano desarmado + 1d4; acertando 2 ou mais numa mesma criatura, ela testa Destreza ou cai Derrubado (atravessar o espaço de uma criatura Grande ou maior dá +1 ataque extra nela por espaço adicional). Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D.'},
  {nome:'Dragão Ascendente', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 1d8 e lança o alvo 9m pro ar até o fim do turno atual, pousando de pé sem dano de queda. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Guarda Real', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'Especial', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Molda camadas de armadura de chakra: até o início do seu próximo turno, toda vez que fosse sofrer dano, pode gastar Chakra igual ao dano pra ficar imune a esse ataque ou jutsu (dano e efeitos) até o fim do turno atual — não protege contra efeitos que não causem dano nem custem Chakra. Pode ativar isso um número de vezes por lançamento igual ao seu modificador de Taijutsu.'},
  {nome:'Investida do Leão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',

  {nome:'Segundo Fôlego Celestial: Ofegar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Especial',

  {nome:'Presa Dupla da Serpente', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Movimento Silencioso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',

  {nome:'Aperto Constritor da Serpente', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Concentração, até 1 minuto',

  {nome:'Impacto Direto', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'Especial', alcance:'Toque', duracao:'Especial',

  {nome:'Chute Alternado', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Dança Selvagem', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Tartaruga Sábia', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',

  {nome:'Combo dos Dez', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Faz um número de Ataques de Taijutsu igual ao seu modificador de Taijutsu (máximo 10), cada um causando 1d4 de dano de Concussão; acertando pelo menos 3, o próximo Taijutsu que lançar antes do fim do turno ganha +3 em ataque e dano. Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo por rank acima de C; do Rank B em diante, +1d4 de dano; do Rank A em diante, mais +1d4; no Rank S, o tempo de conjuração vira Ação Bônus.'},
  {nome:'Acala Adamantina', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 2d8 e o alvo testa Força ou é empurrado 9m. Usado como Finalizador, vira 2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 3d8, e na falha o alvo é empurrado 9m, cai Derrubado e fica Zonzo. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de C.'},
  {nome:'Fera', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (cone de 4,5m)', duracao:'Instantâneo',

  {nome:'Espiral de Quebra', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'Pessoal (raio de 1,5m)', duracao:'Instantâneo',

  {nome:'Fogo Ardente: Tambor', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'1 minuto',
    efeito:'Ataque de Taijutsu corpo a corpo mirando o pulmão do alvo: no acerto, por 1 minuto, toda vez que ele lançar um jutsu que exija movimento, sofre 2d6 de dano Necrótico (ignora Resistência, Imunidade, Redução de Dano e PV temporário). Na 5ª vez que isso acontecer, o pulmão se rompe: 10d6 de dano Necrótico (mesmas imunidades ignoradas) e 4 ranks de Exaustão por 24 horas, encerrando o jutsu. Pode gastar a ação testando Constituição pra encerrar antes, ou usar um jutsu Médico que remova condições de rank C ou menor. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C; do Rank A em diante, o dano da ruptura sobe pra 15d6; no Rank S, o teste pra encerrar vem em desvantagem.'},
  {nome:'Chute Collier', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Clone de Combate', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'9m', duracao:'Concentração, até 1 minuto',

  {nome:'Pé de Cauda de Dragão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'Pessoal (1,5m)', duracao:'Instantâneo',

  {nome:'Sacrifício Precoce', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Depois de esquivar de um ataque corpo a corpo, salta no ombro do inimigo e o arremessa 9m em linha reta na direção que escolher: ele testa Força pra resistir ao arremesso e, se for jogado, testa Destreza ou cai Derrubado ao aterrissar (batendo numa parede, teto ou objeto Grande ou maior, sofre dano de queda).'},
  {nome:'Elementânia', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode mirar num alvo que já poderia ser alvo de um Finalizador (por causa de um Combo). Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 4d12, e escolhe um elemento pra imitar: Terra (todos a até 3m do alvo original testam Destreza ou sofrem 3d6 de dano de Concussão); Vento (o alvo testa Força ou é arremessado 4,5m por ponto do seu modificador de Taijutsu, sofrendo 2d6 de dano de Concussão pra cada 4,5m que não conseguiu percorrer ao bater num obstáculo); Fogo (o dano vira Fogo, e o alvo testa Constituição ou ganha 1 rank de Queimado); Água (rerrola todos os 1s e 2s no dano, ficando com o segundo resultado); ou Raio (um estrondo ecoa a até 90m de distância, e todos a até 9m do alvo, menos você, testam Constituição ou ficam Zonzos).'},
  {nome:'Pisão Explosivo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'4,5m', duracao:'Instantâneo',

  {nome:'Esmagamento Celestial da Noite', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'Pessoal', duracao:'Instantâneo',

  {nome:'Queda do Falcão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'9m', duracao:'Instantâneo',

  {nome:'Serpente Feroz', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Soco Esmagador', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Água Corrente', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',

  {nome:'Água Corrente: Sem Compasso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu corpo a corpo contra um alvo (sem causar dano): no fim dos ataques, ele testa Constituição, com -1 de penalidade por acerto além do primeiro; na falha, ganha 2 ranks de Exaustão até o fim do turno seguinte. Usado como Finalizador, a penalidade por acerto extra vira -2. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de C.'},
  {nome:'Quarto Fôlego Celestial: Arfar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Especial',
    efeito:'Precisa estar com o Terceiro Fôlego Celestial: Respirar ativo — ele para, e este toma o lugar dele (mesma restrição de duração e de não poder manter Ninjutsu/Genjutsu), somando os efeitos da cadeia toda. Multiplica sua capacidade pulmonar por 16: mais +2 em ataques de Taijutsu, +1d8 de dano de Taijutsu até duas vezes por turno, e +15 de PV temporário (empilhando com o resto da cadeia). Quando a duração acaba, ganha 1 rank de Fragilizado até o próximo descanso, que só um jutsu de rank maior que B consegue remover.'},
  {nome:'Fricção', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado e o alvo testa Constituição ou fica incapaz de usar as ações de Disparada, Esquivar, Desengajar, Ajudar ou Preparar por 1 minuto. Usado como Finalizador, vira 3 Ataques de Taijutsu corpo a corpo — acertando os três, o alvo falha automaticamente e também não consegue usar Objeto nem ações baseadas em perícia por 1 minuto. Pode gastar a ação testando Constituição contra sua CD de Taijutsu pra encerrar antes.'},
  {nome:'Palma da Grama', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo contra cada criatura a até 1,5m: cada acerto causa seu dano desarmado + 2d10 e o alvo testa Força ou é desarmado e ganha 1 rank de Fragilizado. Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de C.'},
  {nome:'Abalo Pesado', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Chute giratório de baixo com todo o peso do corpo: alvos à sua escolha a até 1,5m testam Destreza; na falha, sofrem seu dano desarmado + 4d8 e ficam Zonzos (metade do dano e nada mais se passar). Se pelo menos um falhar, pode empurrá-lo 9m e se mover até 7,5m atrás dele sem provocar ataque de oportunidade (o movimento do alvo empurrado provoca normalmente). Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de C.'},
  {nome:'Contra-ataque de Interseção', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Como Reação a um ataque, faz um Ataque de Taijutsu corpo a corpo pra interceptá-lo: acerto reduz o dano recebido em seu dano desarmado + 4d6. Em ranks mais altos: +3 de custo e +1 ataque coberto por rank acima de C.'},
  {nome:'Relâmpago Pulsante: Toque', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'O custo deste jutsu nunca pode ser reduzido. Toca um aliado disposto: ele pode gastar até 2 dados de Chakra, recuperando Pontos de Chakra iguais ao resultado, e ganha 1 uso extra de algum traço de classe com limite de usos (ou 1 recurso extra), perdido se não for gasto até o fim da duração — só pode se beneficiar disso uma vez por descanso curto. Em ranks mais altos: +3 de custo por rank acima de C; do Rank B em diante, até 2 alvos; do Rank A em diante, 2 recursos extras em vez de 1.'},
  {nome:'Atraso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado e o alvo testa Força; na falha, até o fim do turno seguinte, toda vez que tentar uma atividade que exija uma ação, rola 1d20 — com 11 ou mais, a ação atrasa pro próprio turno seguinte (gastando a ação de lá pra completar a original); o jutsu acaba de qualquer jeito depois da primeira tentativa. Em ranks mais altos: +3 de custo por rank acima de C; no Rank B, o limiar cai pra 9; no Rank A, pra 7; no Rank S, pra 5.'},
  {nome:'Morte Adiada', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Quando um aliado a até 1,5m cair a 0 PV, pressiona pontos vitais pra adiar a morte: ele fica consciente (ainda a 0 PV) até o fim do próprio turno seguinte, aí desmaia falhando 1 teste de resistência contra a morte. Em ranks mais altos: +3 de custo por rank acima de C; no Rank A, ele não falha nenhum teste; no Rank S, fica com 1 PV em vez de 0.'},
  {nome:'Grande Lampejo da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu: acerto causa seu dano desarmado + 2d12 e o alvo testa Constituição ou ganha +1 rank de Contundido. Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de C.'},
  {nome:'Furacão da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal (esfera de 4,5m de raio)', duracao:'Instantâneo',
    efeito:'Chute giratório pra trás numa esfera de 4,5m de raio ao seu redor: alvos testam Destreza; na falha, sofrem seu dano desarmado + 2d6 de Concussão, caem Derrubados e são puxados 3m em sua direção. Usado como Finalizador, chuta duas vezes: primeiro teste de Destreza (falha puxa 3m e causa seu dano desarmado + 2d8), depois um teste de Força imediato (falha empurra 9m pra longe e causa mais seu dano desarmado + 2d8) — passando em qualquer um dos dois, só metade do dano e nenhum efeito. Em ranks mais altos: +3 de custo e +1d6 (ou 1d8) de dano por rank acima de C.'},
  {nome:'Quebra-Céu da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Quando você ou um aliado em até 4,5m fosse sofrer dano de um ataque corpo a corpo, cria uma parede de vento: quem atacou testa Força ou é lançado 9m pra cima (sofrendo dano de queda no fim do turno). Dá a um aliado em até 4,5m uma Reação extra, usável só pra lançar um Finalizador de 1 Ação — até o fim do turno, esse aliado pode usá-la pra atingir quem atacou com um Finalizador ignorando alcance, uma vez por turno.'},
  {nome:'Liberação de Limites', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'Especial', alcance:'Toque', duracao:'1 rodada',
    efeito:'Toca um aliado disposto e injeta uma massa de Chakra nele: você gasta dados de Chakra até 2× seu bônus de proficiência, e ele precisa gastar o mesmo número (senão o jutsu acaba). Os efeitos escalam pelo total gasto entre os dois: com 2 dados, ele rola os dados gastos e soma ao dano do próximo ataque no turno seguinte, mas fica com 2 ranks de Fragilizado até o fim do seu próximo turno; com 4 dados, o mesmo, mas metade do resultado também soma ao teste de ataque; com 8 dados, ganha 1 ação extra no próprio turno e fica Atordoado até o início do turno seguinte; com 16 dados, a ação extra vem com Ação Bônus liberada pra qualquer atividade de 1 ação, e o Atordoado dura 1d4 rodadas; com 32 dados, a ação extra libera Ação Bônus e Reação também, e o Atordoado dura 1 minuto sem poder ser removido por nada.'},
  {nome:'Rajada do Leão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 1d6; acertando os dois, o alvo fica Zonzo até o fim do turno seguinte. Usado como Finalizador (só contra um alvo caindo), vira 3 Ataques de Taijutsu: cada acerto causa seu dano desarmado + 2d6, e acertando os três, o alvo ganha 3 ranks de Machucado e cai Derrubado. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de C.'},
  {nome:'Rajada de Pontos de Pressão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 3d4 e o alvo testa Constituição ou fica Fragilizado e Lento por 1 minuto (refazendo a resistência no fim de cada turno pra remover uma condição de cada vez, até perder as duas ou a duração acabar).'},
  {nome:'Palma do Rakshasa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 6d4 e o alvo testa Constituição ou fica Zonzo até o fim do turno seguinte. Usado como Finalizador, dobra o custo e o dano vira seu dano desarmado + 10d4 — se algo se interpuser (estrutura, construto ou outra criatura), tanto quem se meteu no meio quanto o alvo original sofrem o dano. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de C.'},
  {nome:'Sola do Rakshasa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enquanto durar (a concentração não quebra por dano), ganha uma Reação especial: quando fosse fazer uma resistência de Força ou Destreza contra um Ninjutsu ou Taijutsu em forma de esfera, cilindro, cone ou linha, pode chutar o jutsu, iniciando um Clash com vantagem (rerrolando 1s e 2s) — vencendo, causa 3× seu dano desarmado. Em ranks mais altos: +3 de custo por rank acima de C; no Rank B, vira 4×; no Rank A, 5×; no Rank S, 6×.'},
  {nome:'Falcão Ascendente', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Chuta o ar ou uma criatura pra se propelir até 9m em qualquer direção, sem provocar ataque de oportunidade — se terminar a até 1,5m de um inimigo, pode fazer um Ataque de Taijutsu corpo a corpo nele (seu dano desarmado + 4d6). Se chutar uma criatura no caminho em vez do ar, faz o Ataque de Taijutsu nela primeiro (mesmo dano) e ainda se propele; terminando perto de outro inimigo, pode repetir o chute nele também. Em ranks mais altos: +3 de custo e +1 uso do golpe-propulsor por rank acima de C.'},
  {nome:'Royal Flush', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'Especial', alcance:'1,5m', duracao:'Concentração, até 1 minuto',
    efeito:'Precisa estar se beneficiando da Guarda Real. Depois de zerar um dano com ela, a Guarda Real acaba e este jutsu toma o lugar (não custa Chakra pra manter, e acaba no fim do seu turno seguinte): ganha PV temporário igual ao dano reduzido pela Guarda Real, +6m de deslocamento, e +10 no próximo teste de Força ou Destreza (uma vez). Na próxima vez que causar dano com um Taijutsu, pode encerrar este jutsu pra somar ao dano um valor igual ao PV temporário ganho por ele.'},
  {nome:'Liberação de Segurança', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Versão alternativa do Desarranjo dos Canais do Corpo: em vez de embaralhar os sinais nervosos, acelera-os. Toca um aliado (não você): ganha metade do próprio deslocamento a mais (arredondado pra baixo, múltiplo de 1,5m), +1 de Defesa, +1d4 em resistências de Destreza, e nunca perde a capacidade de usar Ação Bônus ou Reação enquanto puder usar a Ação normal. Só 1 criatura se beneficia por vez (lançar de novo troca o alvo); acaba na hora se o alvo ficar Chocado.'},
  {nome:'Onda de Dispersão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal (raio de 4,5m)', duracao:'Instantâneo',
    efeito:'Golpe no chão libera uma onda de choque num raio de 4,5m ao seu redor: alvos testam Força; na falha, sofrem seu dano desarmado + 3d6 e são empurrados até a borda do raio (batendo numa parede ou estrutura, sofrem 1d6 de dano extra pra cada 3m que não conseguiram percorrer, mínimo 1d6). Em ranks mais altos: +3 de custo, +1d6 de dano e +1,5m de raio por rank acima de C; do Rank B em diante, pode escolher criaturas a até 1,5m de você pra ficarem imunes.'},
  {nome:'Seikuken', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'Concentração, Especial',
    efeito:'Precisa estar sob os efeitos de uma Postura de Taijutsu ou de Clã (como o Punho Gentil ou a Postura Shikotsumyaku) — sem isso, o jutsu acaba na hora. Não custa Chakra pra manter, mas você nunca pode se beneficiar de Ação Bônus enquanto durar. Quem te atacar corpo a corpo sofre -1d6 no ataque, e seus Ataques de Taijutsu corpo a corpo contra inimigos a até 1,5m ganham +1d6.'},
  {nome:'Terceiro Fôlego Celestial: Respirar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Especial',
    efeito:'Precisa estar com o Segundo Fôlego Celestial: Ofegar ativo — ele para, e este toma o lugar dele (mesma restrição de duração e de não poder manter Ninjutsu/Genjutsu), somando os efeitos da cadeia toda. Multiplica sua capacidade pulmonar por 8: mais +1 em ataques de Taijutsu, +1d8 de dano de Taijutsu até duas vezes por turno, e +10 de PV temporário (empilhando com o resto da cadeia). Quando a duração acaba, ganha 2 ranks de Fragilizado até o próximo descanso, que só um jutsu de rank maior que C consegue remover.'},
  {nome:'Andorinha Celestial Gêmea', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'Especial (32 Chakra)', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado com outro conjurador (Combinação). Você e ele fazem 2 Ataques de Taijutsu corpo a corpo cada um contra o mesmo alvo: cada acerto causa o dano desarmado de quem atacou + 2d4. Se os dois acertarem 2 ou mais vezes, ambos fazem mais um Ataque de Taijutsu — acertando os dois, o alvo sofre o dano desarmado de cada um + 3d8 e é lançado 6m, caindo Derrubado. O maior modificador de Carisma entre os dois conjuradores muda o combo: +2 ou +3 dá +1 ataque inicial pra cada um; +4 ou mais dá +2 ataques iniciais pra cada um.'},
  {nome:'Movimento Welter', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'6 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Precisa estar sob os efeitos de uma Postura de Taijutsu ou de Clã — sem isso, o jutsu acaba na hora. Quando for se mover 3m antes de um ataque corpo a corpo, pode ativar isso (até 3 vezes por turno, sempre movendo 3m e atacando de novo): ganha +1 em ataques e resistências de Destreza até o início do turno seguinte, e um ataque que empataria com sua Defesa conta como erro enquanto durar. Um sucesso numa resistência de Destreza nesse período não causa dano nem efeito nenhum; ser atingido pela primeira vez encerra o jutsu.'},
  {nome:'Queda Mortal em Redemoinho', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'9 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu: cada acerto causa seu dano desarmado + 2d8. Usado como Finalizador, vira 3 Ataques de Taijutsu corpo a corpo com o mesmo dano — acertando 2 ou mais, o alvo testa Constituição ou fica Atordoado até o início do turno seguinte. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de C.'},
  {nome:'Estalo em Redemoinho', tipo:'Taijutsu', categoria:'Taijutsu', rank:'C', custo:'7 Chakra', alcance:'Pessoal (cone de 4,5m)', duracao:'1 rodada',
    efeito:'Cone de 4,5m a partir de você: alvos testam Força; na falha, sofrem seu dano desarmado + 2d6, são puxados até 3m em sua direção e ficam Machucados até o início dos próprios turnos (metade do dano e nada mais se passar). Até o fim do turno atual, um aliado a até 4,5m pode usar a Reação pra atingir um alvo afetado com um Finalizador ignorando alcance, uma vez por turno. Em ranks mais altos: +3 de custo, +1d6 de dano e +1,5m no cone por rank acima de C.'},
  {nome:'Técnica da Pós-Imagem', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Bem antes de ser atingido por um ataque, teleporta até seu deslocamento total pra outro espaço, deixando uma cópia sua que se desfaz ao ser atingida pelo ataque original (que assim erra você).'},
  {nome:'Asakujaku: Pavão da Manhã', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (14 Chakra)', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador contra um alvo no ar ou caindo, e exige estar se beneficiando de pelo menos o Portão de Tomon (talento Oito Portões Internos: Keimon) ou de outro Portão Interno concedido por Oito Portões Internos: Shimon (depois de lançado, só pode repetir após 10 minutos de recuperação). Faz um número de Ataques de Taijutsu corpo a corpo igual ao seu bônus de proficiência — o primeiro acerto causa 1d6, e cada acerto seguinte sobe 1 degrau no dado (sem somar seu modificador de habilidade ao dano). Acertando 5 ou mais vezes, o alvo é jogado no chão, sofrendo dano de queda como se tivesse caído de 15m, e testa Constituição ou fica Atordoado até o fim do turno seguinte.'},
  {nome:'Asakujaku: Pomba da Manhã', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (14 Chakra)', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador contra um alvo no ar ou caindo, e exige estar se beneficiando de pelo menos o Quinto Fôlego Celestial: Suspirar ou de um Fôlego Celestial de rank maior (depois de lançado, só pode repetir após 10 minutos de recuperação). Faz um número de Ataques de Taijutsu corpo a corpo igual a quantos Fôlegos Celestiais estiver se beneficiando, cada um causando 1d10 + mod. de Taijutsu de dano de Concussão. Acertando 5 ou mais vezes, o alvo é jogado no chão e testa Constituição ou fica Atordoado até o fim do turno seguinte.'},
  {nome:'Punho Demolidor', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (ignora Redução de Dano ou Resistência do alvo pra esse dano): acerto causa seu dano desarmado + 5d8. Usado como Finalizador, o dano vira seu dano desarmado + 7d8 e o alvo testa Constituição ou fica Cambaleante até o fim do turno seguinte. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Impacto da Flor de Cerejeira', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 4d12 e o alvo testa Constituição ou fica Zonzo e Machucado. Usado como Finalizador, um acerto também força todo mundo tocando o chão a até 9m do alvo (menos você) a testar Destreza ou sofrer 6d6 de dano de Concussão e cair Derrubado (metade do dano se passar) — a área vira terreno difícil. Em ranks mais altos: +3 de custo, +1d12 e +2d6 de dano por rank acima de B.'},
  {nome:'Quebra do Dragão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador, exigindo estar na Postura do Punho de Dragão. 2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 3d8, e o alvo testa Força ou sofre -1d4 em ataques corpo a corpo e testes de Força/Destreza até o fim do seu turno seguinte (usado logo depois de um Combo, vira 3 ataques em vez de 2). Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Esmagamento do Dragão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'10 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador, mirando num alvo Zonzo, Derrubado ou Atordoado. Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 8d10 e o alvo testa Constituição ou a condição dele dura mais 1 rodada (se for só Derrubado, o dano ganha +1 dado extra e ele também fica Machucado). Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de B.'},
  {nome:'Quinto Fôlego Celestial: Suspirar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal', duracao:'Especial',
    efeito:'Precisa estar com o Quarto Fôlego Celestial: Arfar ativo — ele para, e este toma o lugar dele, somando os efeitos da cadeia toda. Multiplica o fluxo sanguíneo por 20: seus dois primeiros Ataques de Taijutsu de cada turno vêm com vantagem e +1d8 de dano extra, e ganha +20 de PV temporário (empilhando com o resto da cadeia). Quando a duração acaba, ganha 1 rank de Fragilizado e Lento até o próximo descanso longo, que só um jutsu Médico de rank A ou maior consegue remover.'},
  {nome:'Onda de Força', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (49 Chakra)', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Só pode ser lançado com outro conjurador a até 4,5m de você (Combinação) — ele se move como Reação pra ficar a até 1,5m de você, e os dois trocam de lugar num golpe cruzado que libera uma onda de choque num cone de 9m na mesma direção dos dois. Alvos testam Força contra a maior CD de Taijutsu entre os dois conjuradores, com o efeito piorando pela margem de falha: falhando por 1-4, sofrem o dano desarmado somado dos dois + 9d6 de Concussão e caem Derrubados; por 5-9, +12d6 e ficam Zonzos até o início do turno seguinte; por 10-14, +15d6 e Zonzos até o fim do turno seguinte; por 15 ou mais, +18d6, Zonzos até o fim do turno seguinte e empurrados 9m (batendo numa superfície fina, sofrem +2d6 e a atravessam; numa superfície grossa, sofrem dano de queda como se tivessem caído 5× a distância que faltava percorrer). O maior modificador de Carisma entre os dois conjuradores piora a resistência: +2 ou +3 dá -2; +4 ou mais dá -(1d6+1).'},
  {nome:'Full House', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Move até 9m em direção a um alvo, terminando a até 1,5m dele, e faz um Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 4d8. Usado como Finalizador, o dano vira seu dano desarmado + 7d8, e todo mundo a até 3m do alvo testa Força ou é arremessado 3m pra longe.'},
  {nome:'Dragão Cintilante', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'11 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Quando fosse ser atingido por um acerto crítico, reforça o corpo com chakra: esse crítico e todos os seguintes até o início do turno seguinte contam como acerto normal.'},
  {nome:'Pé Celestial da Dor', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu: acerto causa 7d10 de dano de Concussão. Usado como Finalizador, também força todo mundo a até 9m do alvo (menos você) a testar Destreza ou cair Derrubado, ser jogado 9m pro ar (sofrendo dano de queda) e ficar Incapacitado até o fim do turno atual. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de B.'},
  {nome:'Banquete do Caçador', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Teste de Taijutsu contra CD 13 + o número do rank do alvo (E=0, D=1, C=2, B=3, A=4, S=5) em até 18m (não custa Chakra pra manter; não funciona em construtos e outras criaturas inorgânicas): no sucesso, enquanto conseguir ver o alvo, as duas primeiras vezes em cada turno que causar seu dano desarmado nele, soma +2d8 de dano Necrótico (o jutsu acaba se o alvo sair da sua linha de visão).'},
  {nome:'Presa do Rei', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'11 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho de Leão (conta como ataque desarmado pro efeito de Ação Bônus dessa postura). 2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 2d6 e o alvo testa Constituição ou fica Machucado. Usado como Finalizador, o dano de cada acerto vira seu dano desarmado + 2d10. Em ranks mais altos: +3 de custo por rank acima de B; no Rank S, +1 ataque.'},
  {nome:'Incursão da Clareza', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Remove uma condição Física ou Sensorial que esteja te afetando, e ganha vantagem contra essa mesma condição por 1 minuto.'},
  {nome:'Esmagamento de Terra da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Cone de 9m a partir de você: alvos testam Destreza ou sofrem 3d8 de dano Perfurante e são jogados 7,5m pro ar, ficando no ar até o fim do turno atual — a área vira terreno difícil até ser limpa. Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Rajada da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Cone de 9m a partir de você: alvos testam Força ou são jogados 9m pro ar (enquanto no ar, não conseguem usar Reação contra um Finalizador seu antes do fim do turno atual). Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Vento Quente da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'Deslocamento total', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador. Escolhe um ponto que veja e se move até lá ignorando criaturas no caminho; quem você escolher atravessar testa Destreza ou sofre 3d6 de dano de Fogo e 2 ranks de Queimado (metade do dano e nada mais se passar). Terminando a até 1,5m de um inimigo, faz um Ataque de Taijutsu nele: acerto causa seu dano desarmado + 7d10 de dano de Fogo, e ele testa Força ou ganha 3 ranks de Machucado. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de B.'},
  {nome:'Bala do Furacão da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'10 Chakra', alcance:'13,5m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu à distância em até 13,5m: cada acerto causa 5d8 de dano de Concussão. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de B.'},
  {nome:'Soco Metralhadora!', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Fica travado no lugar (não pode se mover enquanto durar) e faz uma rajada de 5 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado. O esforço cobra seu preço — a cada acerto bem-sucedido, você também sofre 1d6+1 de dano Necrótico, que não pode ser reduzido, resistido nem evitado por Reação.'},
  {nome:'Entrada Máxima', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'13,5m', duracao:'Instantâneo',
    efeito:'Escolhe até 5 criaturas que possa ver em até 13,5m e faz um Ataque de Taijutsu corpo a corpo contra cada uma: acerto causa seu dano desarmado + 4d8 e 1 rank de Machucado. Em seguida, teleporta pra um espaço livre à vista a até 1,5m de um dos alvos (acertado ou não). Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de B.'},
  {nome:'Lótus Frontal Solo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'13,5m', duracao:'Instantâneo',
    efeito:'Exige estar com pelo menos o Primeiro Fôlego Celestial: Inspirar (ou um Fôlego Celestial mais avançado) ativo, ou se beneficiando de algum Portão do talento Oito Portões Internos. Salta no ar, gira como uma broca e despenca sobre um alvo à vista em até 13,5m: Ataque de Taijutsu corpo a corpo causando seu dano desarmado + 5d6, e todo mundo a até 3m do alvo testa Força ou é empurrado 3m pelo impacto. Usado como Finalizador, o dano vira seu dano desarmado + 5d12, o empurrão dobra pra 6m e quem falhar também fica Incapacitado e cai Derrubado. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Queda da Coruja', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Só pode ser usado contra um alvo que não o veja (você precisa estar escondido dele) a até 9m. Salta sobre o alvo e enrosca as pernas no pescoço dele: um Ataque de Taijutsu corpo a corpo pra deixá-lo Agarrado — no sucesso, o alvo testa Constituição ou fica Inconsciente. Uma vez inconsciente, ele continua assim por 10 minutos, ou até ser movido, tocado, sofrer dano ou entrar na área de algum jutsu.'},
  {nome:'Agressão da Alcateia', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar sob os efeitos da Postura do Punho de Lobo. 2 Ataques de Taijutsu corpo a corpo contra um alvo à vista: cada acerto causa seu dano desarmado + 2d6 e aumenta em +1 a faixa de crítico do seu próximo ataque nesse mesmo turno (os bônus se acumulam a cada acerto). Usado como Finalizador, vira 3 Ataques de Taijutsu corpo a corpo. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de B.'},
  {nome:'Dança Apaixonada da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (cone de 13,5m)', duracao:'Instantâneo',
    efeito:'Cone de 13,5m a partir de você: quem estiver na área testa Destreza pra escapar da sequência de socos e chutes enquanto você dança pelo campo de batalha e volta ao lugar num instante. Na falha, sofre 5d6 de dano de Concussão e cai Derrubado. Até o fim do turno, pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de B.'},
  {nome:'Punho Pistão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 6d4, com um surto de chakra empurrando o golpe mais fundo. Usado como Finalizador, vira um Ataque de Taijutsu corpo a corpo com +2 na faixa de crítico, causando seu dano desarmado + 9d4 — e se for crítico, em vez de dobrar o dado de dano desarmado, o dano vira seu dano desarmado + 25d4. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de B.'},
  {nome:'Presa do Predador', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador, e exige estar na Postura do Punho de Serpente. Molda as mãos como as presas escancaradas de uma serpente: 3 Ataques de Taijutsu corpo a corpo, cada acerto causando seu dano desarmado + 2d8. A cada acerto, o alvo testa Força ou sofre -1 em Força ou Destreza (escolha do alvo) por 1 minuto — pode gastar o turno inteiro se reajustando pra remover a penalidade antes disso. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de B.'},
  {nome:'Perna Tremedora', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado, 2 ranks de Fragilizado, e o alvo fica sem poder usar Reação até o fim do turno atual. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Pisão do Coelho Chefão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar na Postura do Punho de Coelho. Ataque de Taijutsu corpo a corpo contra um alvo à vista: acerto causa seu dano desarmado + 6d8, e um cone de 9m a partir do alvo atingido faz todo mundo dentro testar Força, sofrendo 6d8 de dano de Concussão na falha (metade na resistência bem-sucedida) pelo estrondo do chute. A área atrás do alvo racha e desmorona, virando terreno difícil. Usado como Finalizador, os dados de dano (o do ataque e o do cone) viram d12. Em ranks mais altos: +3 de custo e +1d8 (ou 1d12) de dano por rank acima de B.'},
  {nome:'Guarda Reversa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (14 Chakra)', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Como Reação a sofrer um ataque corpo a corpo, faz um teste de Artes Marciais: o resultado vira sua Defesa contra esse ataque (e contra qualquer ataque corpo a corpo até o fim do turno). Se um ataque corpo a corpo errar você neste turno, pode reverter o golpe — o ataque passa a mirar quem o desferiu. Se errarem sua Defesa por 10 ou mais, ganha uma Reação extra pra lançar um Taijutsu com tempo de conjuração de 1 Ação.'},
  {nome:'Vingança Real', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar se beneficiando da Guarda Real. Ataque de Taijutsu corpo a corpo liberando toda a energia cinética acumulada: no acerto, causa dano de Concussão igual a 1,5× o total de dano que a Guarda Real já reduziu a zero. Acertando ou errando, a Guarda Real termina imediatamente depois do ataque.'},
  {nome:'Chuva de Estrelas', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'13 Chakra', alcance:'18m (cubo de 6m)', duracao:'Instantâneo',
    efeito:'Escolhe um ponto à vista em até 18m: um cubo de 6m a partir dali chove socos e chutes à distância como projéteis — quem estiver na área testa Destreza ou sofre seu dano desarmado + 6d8 de dano de Concussão e cai Derrubado. O chão racha e vira terreno difícil. Em ranks mais altos: +3 de custo, +1d8 de dano e +1,5m no cubo por rank acima de B.'},
  {nome:'Aço', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (10 Chakra)', alcance:'Pessoal', duracao:'Especial',
    efeito:'Custa 10 Chakra pra ativar, mais 5 Chakra pra cada rodada extra que quiser manter (até um máximo de 10 rodadas, ou 1 minuto). Enquanto durar, seu corpo vira aço vivo: +7 de Redução de Dano contra Concussão, Perfurante e Cortante; +2d6 de dano extra em até duas rolagens de dano corpo a corpo (desarmado, de arma, Taijutsu ou Bukijutsu) por turno; e dobra o dano causado contra objetos, estruturas e construtos.'},
  {nome:'Nó de Aço', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar na Postura do Punho de Ferro, e só pode ser lançado como Finalizador. 2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 3d12 e o alvo testa Força ou é arremessado 3m por ponto do seu modificador de Força. Se arremessar o alvo com algum desses ataques, ganha deslocamento bônus igual à distância arremessada, só pra se mover até 1,5m do alvo (num espaço que o comporte). Se o alvo bater numa superfície com menos de 1,5m de espessura e ainda sobrar 3m ou mais de arremesso, ele a atravessa, sofrendo 4d6 de dano de Concussão por superfície atravessada. Em ranks mais altos: +3 de custo, +1d12 e +1d6 de dano por rank acima de B.'},
  {nome:'Terra Imóvel: Ressonância', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'Toque', duracao:'10 minutos',
    efeito:'O custo deste jutsu nunca pode ser reduzido. Toca uma criatura disposta (que não seja você) e reposiciona as articulações dela, liberando toda a tensão acumulada: pelos próximos 10 minutos, ela ganha +10 de deslocamento, +1 de Defesa e +1 em resistências de Força e Destreza. Além disso, ganha um uso extra de algum recurso limitado (um traço de clã com limite de uso, Dados de Velocidade, usos do Sharingan etc.) — se não for gasto até o fim da duração, se perde. Uma criatura só pode se beneficiar disso uma vez por descanso longo, e o efeito acaba na hora se ela ficar Fragilizada. Em ranks mais altos: +3 de custo por rank acima de B; do Rank A em diante, pode mirar até 2 criaturas.'},
  {nome:'Triplo-Duplo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'14 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo contra um alvo em alcance: acerto causa seu dano desarmado. Concede a até dois aliados a até 4,5m uma Reação extra, só pra lançarem um Taijutsu ou Bukijutsu com a palavra-chave Finalizador e tempo de conjuração de 1 Ação. Até o fim do turno, esses aliados podem usar essa Reação pra mirar o alvo atingido com o Finalizador ignorando alcance, um cada.'},
  {nome:'Lótus Frontal Duplo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'Especial (49 Chakra)', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado com outro conjurador a até 4,5m de você (Combinação) — como Reação, ele se move pra um espaço livre a até 1,5m de você. Os dois precisam estar com pelo menos o Primeiro Fôlego Celestial: Inspirar (ou algo mais avançado na cadeia) ativo, ou se beneficiando de algum Portão do talento Oito Portões Internos, e o alvo precisa estar no ar ou caindo. Os dois saltam, enrolam o alvo em arame e giram juntos como uma broca de três corpos, despencando com força de meteoro: cada conjurador faz um Ataque de Taijutsu corpo a corpo, cada um causando seu dano desarmado + 5d8. Usado como Finalizador, cada ataque vira o dano desarmado de quem atacou + 5d12, e todo mundo a até 9m do alvo testa Força ou é empurrado 6m e cai Derrubado. Combinação: o maior modificador de Carisma entre os dois conjuradores muda o efeito — +0 ou +1 não altera nada; +2 ou +3 faz os afetados testarem Constituição contra a maior CD de Taijutsu entre os dois, ficando Incapacitados por 1d4 rodadas na falha; +4 ou mais faz o mesmo teste, mas quem falha fica Atordoado por 1d4 turnos.'},
  {nome:'Golpes Imprevisíveis', tipo:'Taijutsu', categoria:'Taijutsu', rank:'B', custo:'12 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar na Postura do Punho Bêbado. Enquanto estiver em combate corpo a corpo com pelo menos 2 criaturas hostis, faz um Ataque de Taijutsu corpo a corpo contra cada uma delas: cada acerto causa seu dano desarmado + 3d8, te dá +1 de Defesa até o início do seu próximo turno, e impede aquele alvo de fazer ataque de oportunidade contra você até o início do turno dele. Além disso, ganha +1 em resistências contra condições Físicas e +10 de deslocamento até o fim do turno atual. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Quebra de Combo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'12 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Reação que pode ser usada mesmo sem poder normalmente se beneficiar de Reações, ao perceber que será alvo de um Finalizador. Até o fim do turno atual, todo jutsu com a palavra-chave Finalizador passa a ser tratado como se não tivesse sido lançado como Finalizador contra você; se um jutsu só puder ser lançado como Finalizador, você deixa de ser um alvo válido — e se não sobrar nenhum outro alvo válido, a conjuração é Interrompida e falha.'},
  {nome:'Jorro Anfíbio', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'15 Chakra', alcance:'Pessoal (4,5m)', duracao:'1 Rodada',
    efeito:'Exige estar na Postura do Punho de Sapo. Até o início do seu próximo turno, sempre que um aliado (incluindo você) fizer um Ataque de Taijutsu corpo a corpo contra um alvo, com os dois a até 4,5m de você, pode somar o seu dado de dano desarmado à rolagem de ataque desse golpe, saltitando pela área e reforçando cada ataque com o seu próprio impulso. Além disso, até o início do seu próximo turno, criaturas hostis que atacarem (corpo a corpo ou à distância) qualquer aliado a até 4,5m de você têm o dano reduzido ao dobro do seu dano desarmado.'},
  {nome:'Extensor de Combo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'Pessoal', duracao:'Concentração, Especial',
    efeito:'Exige estar com pelo menos o Quinto Fôlego Celestial: Suspirar (ou um Fôlego Celestial mais avançado) ativo; a concentração neste jutsu não quebra por dano. Enquanto o Fôlego continuar ativo, ganha no início de cada um dos seus turnos uma ação especial chamada Extensão de Combo, que permite lançar um Taijutsu com tempo de conjuração de Ação ou Ação Bônus, ou tomar a Ação de Disparada, sem gastar sua Ação ou Ação Bônus normal do turno.'},
  {nome:'Flor da Morte', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Kinjutsu: só pode mirar numa criatura Zonzo e Derrubada que não seja um construto. Ataque de Taijutsu corpo a corpo tentando parar o coração do alvo: no acerto, ele testa Constituição ou sofre 10d6 de dano Necrótico que não pode ser reduzido por nenhum meio (metade do dano na resistência bem-sucedida). Usado como Finalizador, na falha o alvo sofre os mesmos 10d6 de dano Necrótico e ganha 5 ranks de Laceração. Se o PV do alvo chegar a 0 por causa deste jutsu ou da Laceração causada por ele, o coração dele explode.'},
  {nome:'Golpe Debilitante', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'15 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Faz um Ataque de Taijutsu corpo a corpo contra cada criatura à sua escolha a até 1,5m de você, mirando as articulações: cada uma atingida sofre o dobro do seu dano desarmado, tem o deslocamento reduzido à metade e testa Constituição — na falha, ganha 2 ranks de Fragilizado e fica impedida de usar Reação contra você. No fim de cada um dos turnos dela, pode repetir a resistência pra voltar a poder usar Reação contra você.'},
  {nome:'Investida Dracônica', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Exige estar com pelo menos o Terceiro Fôlego Celestial: Respirar (ou um Fôlego Celestial mais avançado) ativo, ou se beneficiando de pelo menos o Portão de Seimon (talento Oito Portões Internos: Seimon). Salta pra trás e pro alto, liberando jatos de chakra pela coluna que o sustentam no ar antes de arremessá-lo de cima pra baixo contra um alvo à vista em até 4,5m: Ataque de Taijutsu corpo a corpo causando seu dano desarmado + 6d6. Acertando ou errando, uma onda de choque se espalha numa esfera de 6m a partir do espaço do alvo — todo mundo na área, menos você, testa Destreza ou sofre 6d6 de dano de Concussão e fica Zonzo por 1 minuto (metade do dano e nada mais se passar).'},
  {nome:'Lótus Final', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'Toque', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador de Taijutsu, contra um alvo Restrito ou Agarrado, e exige estar com pelo menos o Quinto Fôlego Celestial: Suspirar ativo, ou se beneficiando do Portão de Tomon (talento Oito Portões Internos: Keimon). Faz cinco Ataques de Taijutsu corpo a corpo contra o alvo: cada acerto causa seu dano desarmado + 1d6. Acertando todos os cinco, faz um sexto ataque — no acerto, causa 10d6 de dano de Concussão e derruba o alvo (este jutsu nunca pode causar um crítico). Depois de usá-lo, encerra imediatamente seu Fôlego Celestial ou seus Oito Portões Internos.'},
  {nome:'Matador Celestial', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'Especial (70 Chakra)', alcance:'27m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado com outro conjurador a até 4,5m de você (Combinação) — como Reação, ele se move pra um espaço a até 1,5m de você. Os dois saltam sobre o alvo, usando um ao outro como alavanca pra lançá-lo de um lado a outro entre os golpes: juntos, fazem um total de Ataques de Taijutsu corpo a corpo igual à soma dos dois modificadores de Taijutsu (máx. 10), alternando quem ataca sem repetir o mesmo conjurador duas vezes seguidas — cada acerto causa seu dano desarmado + 2d6. Acertando pelo menos sete vezes, os dois fazem um ataque final cada, valendo só o de maior resultado; conforme a margem de acerto sobre a Defesa do alvo, o dano aumenta: por 1 a 4, +4d6; por 5 a 9, +6d6; por 10 a 14, +8d6; por 15 ou mais, +10d6 (sempre somado ao dano desarmado dos dois). Combinação: se o maior modificador de Carisma entre os dois for +2 ou mais, o dado de dano de todos os ataques deste jutsu sobe um degrau (de d6 pra d8).'},
  {nome:'Guarda de Ferro', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'15 Chakra', alcance:'Pessoal', duracao:'1 Rodada',
    efeito:'Exige estar se beneficiando de alguma Postura de Taijutsu. Como Reação ao sofrer dano, soma seu modificador de Taijutsu à sua Redução de Dano contra esse ataque. Logo depois de reduzir o dano, ganha uma armadura fina de chakra na forma de PV temporário igual ao dobro da sua CD de Taijutsu — esse PV temporário desaparece no início do seu próximo turno.'},
  {nome:'Deslizamento de Terra', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'Especial', duracao:'Especial',
    efeito:'Só pode ser lançado enquanto estiver sobre um terreno inclinado ou uma ladeira. Bate o pé com força, mandando ondas de choque sutis mas devastadoras pelo terreno: tudo que não estiver bem fixado ao chão (ou agarrado a algo que esteja), num raio de 36m a partir de você, menos você mesmo, começa a escorregar ladeira abaixo. A partir daí, o terreno inclinado vira terreno difícil, e nada que esteja escorregando para até alcançar solo firme e plano: objetos, estruturas e construtos caem 18m por rodada, e criaturas caem 13,5m por rodada. No início de cada turno, quem estiver escorregando testa Destreza ou é atingido por outros destroços deslizando junto, sofrendo 4d6 de dano de Concussão por objeto, estrutura ou criatura a até 1,5m dele. Uma criatura pode gastar sua Reação no turno de outra pra tentar um teste de Força (Atletismo) e reduzir a própria queda à metade (arredondado pra baixo) no início do turno seguinte; quem já não estiver mais sobre a superfície inclinada no início do turno não precisa fazer nem o teste nem a resistência. A duração fica a critério do mestre, dependendo da altura da ladeira e da quantidade de coisas caindo — pode arrancar um pedaço de uma encosta ou soltar uma avalanche que ameace uma cidade inteira.'},
  {nome:'Soco Magnum', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'15 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enriquece braços e pernas com chakra: enquanto durar, ganha vantagem em ataques de oportunidade, e até duas vezes por turno seus ataques desarmados causam um dado extra de dano. Além disso, até duas vezes por turno, quando faz um ataque desarmado, o alvo testa Constituição ou tem o deslocamento reduzido em 3m até o fim do turno seguinte dele.'},
  {nome:'Mobilidade Fantasma', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'15 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Exige estar na Postura do Punho Silencioso. Se lançado enquanto está se beneficiando do Movimento Silencioso, o custo deste jutsu cai pela metade (arredondado pra baixo) e a concentração no Movimento Silencioso termina na hora, mas os benefícios dele continuam valendo enquanto este jutsu durar. Enquanto durar: pode se mover pelo espaço de criaturas sem penalidade de deslocamento nem teste de perícia; ao tomar a Ação de Disparada, pode fazê-lo como Ação Bônus e ignora terreno difícil; anda na água ou em paredes com seu deslocamento total; e seus ataques desarmados causam metade do dano a uma criatura adjacente ao alvo original, à sua escolha.'},
  {nome:'Impacto Real', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador, e só pode mirar num alvo que esteja Zonzo e Lento. Ataque de Taijutsu corpo a corpo com um gancho ascendente carregado de chakra: no acerto, causa seu dano desarmado + 10d8, e todo mundo adjacente a você (incluindo o alvo original) testa Força ou é arremessado 9m pro ar, ficando no ar. Até o fim do turno atual, todas essas outras criaturas (menos o alvo original) podem ser miradas por um Finalizador de Taijutsu ou Bukijutsu de um aliado seu a até 9m, ignorando alcance, uma vez por turno cada, usando a Reação dele e ignorando o tempo de conjuração normal do jutsu.'},
  {nome:'Rugido Selvagem', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'Especial (70 Chakra)', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Só pode ser lançado com outro conjurador a até 4,5m de você (Combinação) — como Reação, ele se move pra um espaço a até 1,5m de você. Os dois entram numa postura de combate simbiótica, rugindo e agindo sempre em conjunto, nunca de forma independente. Enquanto durar, não precisa gastar Chakra pra manter a concentração. Sempre que você ou o outro conjurador gastarem sua Ação ou Ação Bônus pra lançar um Taijutsu, os dois lançam o mesmo jutsu ao mesmo tempo, cada um pagando o próprio custo e recebendo os próprios benefícios — nenhum dos dois precisa conhecer o jutsu, mas os dois precisam conseguir cumprir os requisitos e lançá-lo pra ganhar o efeito (se um não conseguir, este jutsu termina na hora). Se o jutsu lançado dessa forma normalmente forçasse o outro conjurador a testar resistência, ele fica imune aos efeitos ofensivos dele. Combinação: se o maior modificador de Carisma entre os dois for +2 ou +3, ambos ganham +2 em ataques de Taijutsu; se for +4 ou mais, ambos ganham +1d4+1 em ataques de Taijutsu e +1 na CD de Taijutsu.'},
  {nome:'Seidou Goitsu', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'Pessoal', duracao:'Especial',
    efeito:'Técnica avançada de uma arte marcial antiga que combina o chakra Yin, voltado pra dentro, com uma explosão de chakra Yang pra fora, turbinando as capacidades físicas de quem a usa. No início de cada um dos seus turnos, escolhe entre tentar manter este jutsu ou encerrá-lo. Encerrando por vontade própria, o jutsu acaba sem mais efeito. Tentando mantê-lo, faz um teste de Artes Marciais contra CD 20 — no sucesso, o jutsu continua (cada vez que repetir esse teste depois da primeira, a CD sobe +2); na falha, o jutsu termina na hora. Enquanto durar, seus ataques desarmados e de Taijutsu são feitos com vantagem, e causam dano bônus igual ao seu nível, até duas vezes por turno. Se o jutsu terminar por causa de uma falha no teste de manutenção, ganha ranks de Fragilizado iguais ao número de rodadas que ele ficou ativo, durando esse mesmo número de minutos.'},
  {nome:'Sexto Fôlego Celestial: Arquejar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'19 Chakra', alcance:'Pessoal', duracao:'Especial',
    efeito:'Precisa estar com o Quinto Fôlego Celestial: Suspirar ativo — ele para, e este toma o lugar dele, somando os efeitos da cadeia toda. Duplica o tamanho do coração e dos pulmões, filtrando venenos e distribuindo nutrientes com muito mais eficiência — a aura de chakra ao seu redor fica bem mais intensa, quase como uma tempestade se formando. Seus dois primeiros Ataques de Taijutsu de cada turno causam 2d8 de dano extra, e ganha 30 de PV temporário (empilhando com o resto da cadeia). Quando a duração acaba, ganha 2 ranks de Fragilizado e 1 rank de Lento até o próximo descanso longo — só um jutsu Médico de rank S consegue remover isso antes.'},
  {nome:'Pacificação Suprema', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'1,5m', duracao:'Especial',
    efeito:'Técnica avançada de pacificação, feita pra tirar uma criatura de combate de vez ou impedi-la de entrar nele. Concentra toda a sua atenção num único alvo e faz um Ataque de Taijutsu corpo a corpo: no acerto, agarra e Restringe o alvo na hora. O alvo pode gastar a Reação num teste oposto de Força (Atletismo) pra se soltar, encerrando o jutsu na hora — na falha, continua Agarrado e Restrito. No turno dele, precisa gastar a Ação testando Força pra tentar escapar. Enquanto Agarrado e Restrito assim, não consegue fazer Selos de Mão, usar a ação de Ajudar, nem fazer testes de perícia de Força ou Destreza — e também não consegue falar nem fazer sons, porque você tapa a boca dele também. Depois de 5 rodadas Restrito assim, o alvo testa Constituição no início de cada um dos turnos dele — na falha, cai Inconsciente. Enquanto estiver agarrando alguém dessa forma, seu deslocamento cai à metade, você não pode usar a Ação de Disparada, não consegue fazer Selos de Mão, nem manter concentração em Ninjutsu ou Genjutsu.'},
  {nome:'Violência Suprema', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'19 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Bombeia chakra pelo corpo até conseguir mover os próprios membros só na força do pensamento. Enquanto durar, não pode manter concentração em Ninjutsu nem Genjutsu, mas ganha um bônus na Defesa igual à metade do seu bônus de proficiência, além de uma Reação especial chamada Represália Violenta: quando uma criatura for fazer um ataque corpo a corpo tendo você como alvo, pode gastar essa Reação pra lançar um Taijutsu com tempo de conjuração de 1 Ação, fazendo no máximo dois ataques contra a criatura que te atacou.'},
  {nome:'Garra Tenebrosa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Faz três Ataques de Taijutsu corpo a corpo contra uma criatura à vista em alcance, com golpes rápidos e fortes o bastante pra soltar faíscas: cada acerto causa seu dano desarmado + 2d8. Usado como Finalizador, o dano vira seu dano desarmado + 3d8, e se pelo menos um dos ataques acertar, o alvo testa Força ou ganha 3 ranks de Machucado. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de A.'},
  {nome:'Lírio-Tigre', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'9m', duracao:'Concentração, até 1 minuto',
    efeito:'Entra num estado de serenidade absoluta, enxergando o mundo ao redor com clareza impenetrável. Enquanto durar, ganha 18m de percepção às cegas.'},
  {nome:'Verdadeira Palma do Rakshasa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'20 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Exige conhecer tanto a Palma do Rakshasa quanto a Sola do Rakshasa. Funde as duas técnicas num equilíbrio perfeito: enquanto durar, não pode perder a concentração neste jutsu por dano nem por falhar um teste de concentração, e não pode lançar ou manter concentração na Palma do Rakshasa nem na Sola do Rakshasa separadamente. Enquanto durar, ganha os seguintes benefícios: até duas vezes por turno, seus Taijutsu causam +2d6 de dano extra no acerto; uma vez por turno, ao acertar um ataque de Taijutsu, pode forçar o alvo a testar Força, causando 2 ranks de Machucado na falha; causa o dano máximo possível contra estruturas e construtos; e, como Reação a precisar testar Força ou Destreza contra um ninjutsu ou taijutsu em forma de esfera, cilindro, cone ou linha, pode desferir um chute giratório iniciando um Clash — nesse teste de Força (Artes Marciais) do Clash, você tem vantagem e rerrola 1s e 2s. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de A; se lançado no Rank S, vencer o Clash com a Reação deste jutsu causa 7 vezes o seu dano desarmado.'},
  {nome:'Redemoinho Violento de Força Adamantina da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'18 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Exige estar com pelo menos o Quarto Fôlego Celestial: Arfar (ou um Fôlego Celestial mais avançado) ativo, ou se beneficiando do Portão de Seimon (talento Oito Portões Internos: Seimon). Pode ativar este jutsu uma vez, assim que entrar num desses Fôlegos ou Portões: move-se até 9m em direção a uma criatura hostil à vista e, se terminar a até 1,5m dela, desfere um chute giratório poderoso. Ataque de Taijutsu corpo a corpo: no acerto, causa 6 vezes o seu dano desarmado, e o alvo testa Força ou é arremessado 6m por ponto do seu modificador de Força. Se bater numa superfície com menos de 1,5m de espessura e ainda sobrar 3m ou mais de arremesso, ele a atravessa, sofrendo 6d6 de dano de Concussão por superfície atravessada.'},
  {nome:'Estrangulamento Violento', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'19 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Com um movimento repentino, agarra a garganta do alvo rápido demais pra ele reagir. Ataque de Taijutsu corpo a corpo: no acerto, o alvo fica Agarrado e Restrito, e não consegue fazer Selos de Mão (você segura uma das mãos dele). Ele também ganha 2 ranks de Exaustão, e mais 2 ranks no fim de cada um dos turnos dele. Como Ação em cada um dos turnos dele, pode testar Força pra escapar do seu aperto — conseguindo, perde todos os ranks de Exaustão ganhos por causa deste jutsu.'},
  {nome:'Destruidor de Mundos', tipo:'Taijutsu', categoria:'Taijutsu', rank:'A', custo:'19 Chakra', alcance:'Pessoal (cubo de 19,5m)', duracao:'Instantâneo',
    efeito:'Bate no chão com tanta força que destrói a área ao redor sem nenhuma cerimônia. Todo mundo num cubo de 19,5m a partir de você testa Destreza ou sofre 10d10 de dano de Concussão, enquanto pedaços do chão destruído voam em todas as direções. A área afetada vira terreno difícil, e criaturas a mais de 3m umas das outras ficam fortemente obscurecidas entre si. Usado como Finalizador, quem falhar na resistência também ganha 3 ranks de Machucado. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de A.'},
  {nome:'Nério Negro', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'30 Chakra', alcance:'1,5m', duracao:'1 minuto',
    efeito:'Kinjutsu Médico: Ataque de Taijutsu corpo a corpo pressionando um ponto na base do pescoço do alvo, revertendo por completo o fluxo sanguíneo dele. No acerto, pelo próximo minuto, o alvo testa Constituição no início de cada um dos próprios turnos (10 testes ao todo); a cada falha, sofre 5d6 de dano Necrótico que não pode ser reduzido nem resistido por nenhum meio, e acumula -1 em testes de Força, Destreza e Constituição, testes de perícia, ataques e resistências pelo resto da duração. Falhando os 10 testes, o alvo morre com todos os vasos sanguíneos do corpo estourando de uma vez. Se alguém lançar nele um jutsu Médico de Rank S que encerraria condições ou restauraria PV, este efeito termina na hora.'},
  {nome:'Rosa Azul', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'26 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Entra num estado de paixão e ambição absolutas: pelo tempo que durar, ganha duas Ações Bônus extras em cada um dos seus turnos. Enquanto durar, não pode ganhar nenhum benefício de Ninjutsu, Genjutsu, Taijutsu ou Bukijutsu que desse Ação, Ação Bônus ou Reação extras.'},
  {nome:'Céus Carmesim', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'25 Chakra', alcance:'Pessoal (cilindro de 13,5m)', duracao:'Instantâneo',
    efeito:'Um soco pra cima acende o ar ao redor com pura fricção cinética, tingindo o céu de vermelho num raio de 1,6km e disparando uma rajada de vento repentina. Toda criatura a até 13,5m de você, menos você mesmo, testa Força ou sofre 10d8 de dano de Fogo (metade se passar). Logo em seguida, as mesmas criaturas repetem o teste de Força — quem falhou o primeiro faz este segundo com desvantagem. Na falha do segundo teste, é arremessado 36m numa direção aleatória, sofrendo 10d8 de dano de Concussão ao bater no chão ou numa superfície sólida; no sucesso, sofre metade do dano e é arremessado só 18m.'},
  {nome:'Tigre Diurno', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'20 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador de Taijutsu, e exige estar se beneficiando de pelo menos o Sexto Fôlego Celestial: Arquejar ou o 7º Portão (talento Oito Portões Internos: Kyomon). Bate a palma com o punho fechado, criando um vórtice de pressão de ar: Ataque de Taijutsu à distância — no acerto, causa 10d12 de dano de Concussão e 10d12 de dano de Força. Toda criatura a até 9m do alvo testa Destreza ou sofre 10d10 de dano de Força (metade se passar).'},
  {nome:'Guarda Encouraçada', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'Especial (35 Chakra)', alcance:'Pessoal', duracao:'Especial',
    efeito:'Exige conhecer tanto a Guarda Real quanto a Vingança Real. Aplica os aprendizados das duas técnicas sobre si mesmo, envolvendo-se numa aura densa de chakra que barra quase todo tipo de dano. Depois de usar este jutsu, só pode se beneficiar dele de novo após um descanso longo ou completo. Enquanto durar (10 minutos, ou até o PV temporário dado por ele chegar a 0): seu deslocamento cai 4,5m; não pode lançar nem manter concentração em Ninjutsu ou Genjutsu; ganha PV temporário igual a 10× sua CD de Taijutsu; e passa a gastar metade do Chakra normal pra reduzir dano com a Guarda Real.'},
  {nome:'Elefante Vespertino', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'21 Chakra', alcance:'Pessoal (linha de 4,5m x 18m)', duracao:'Instantâneo',
    efeito:'Só pode ser lançado como Finalizador de Taijutsu — o auge da ofensiva do estilo. Exige estar se beneficiando de pelo menos o Sexto Fôlego Celestial: Arquejar ou o 7º Portão (talento Oito Portões Internos: Kyomon), ou algo mais avançado. Faz 5 Ataques de Taijutsu corpo a corpo contra um alvo (este jutsu nunca causa crítico); cada acerto causa 5d10 de dano de Concussão ao alvo e dispara uma onda de choque na linha atrás dele — toda criatura na linha testa Destreza ou sofre 5d8 de dano de Força (metade se passar).'},
  {nome:'Fúria Final', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'Especial (88 Chakra)', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado com outro conjurador a até 4,5m de você (Combinação) — como Reação, ele se move pra um espaço a até 1,5m de você. Juntos, atacam pontos vitais do alvo: cada conjurador faz 3 Ataques de Taijutsu corpo a corpo, causando seu dano desarmado + 5d8 no acerto. Se os dois acertarem todos os ataques no mesmo alvo, ele testa Constituição contra a maior CD de Taijutsu entre os dois conjuradores ou ganha 5 ranks de Fragilizado por 24 horas. Combinação: o maior modificador de Carisma entre os dois muda o efeito — +0 ou +1 não altera nada; +2 ou +3 dá aos dois +2 em ataques de Taijutsu; +4 ou mais dá aos dois +2 em ataques de Taijutsu, +1d4 de dano extra e +1 na CD de Taijutsu.'},
  {nome:'Inferno na Terra', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'35 Chakra', alcance:'Pessoal (esfera de 18m)', duracao:'Instantâneo',
    efeito:'Exige que o alvo esteja Derrubado, e só pode ser lançado como Finalizador. Ataque de Taijutsu corpo a corpo único contra o alvo Derrubado: no acerto, causa 10d12+80 de dano de Concussão, abrindo uma fissura até o mundo inferior e liberando uma esfera de destruição de 18m de raio ao seu redor. Acertando ou errando, toda criatura na esfera, menos você e o alvo original, testa Destreza ou sofre 10d8+80 de dano de Concussão (metade se passar). Depois de usar este jutsu, só pode usá-lo de novo após completar um descanso; usando de novo antes disso, também precisa gastar 5 Dados de Vida (ou de Tenacidade) além do custo em Chakra.'},
  {nome:'Deus Dragão da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'28 Chakra', alcance:'36m', duracao:'Instantâneo',
    efeito:'Uma técnica lendária: um chute giratório pra cima vira um tornado pressurizado em forma de dragão de bigodes longos. Move-se até 36m em qualquer direção, virando esquinas e subindo paredes. Toda criatura a até 1,5m do seu caminho testa Força ou é puxada pro tornado e arremessada até o fim do percurso, caindo 1,5m à frente de onde você parar, sofrendo 12d8 de dano de Concussão e o dobro do dano de queda normal pela distância percorrida (metade só do dano de Concussão se passar na resistência). Quem falhar essa resistência de Força também testa Constituição, sofrendo 6d8 de dano Cortante dos destroços arrancados pelo tornado (metade se passar).'},
  {nome:'Guy Noturno', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'Especial (1 Chakra)', alcance:'Especial', duracao:'Instantâneo',
    efeito:'Exige estar se beneficiando de pelo menos o Sétimo Fôlego Celestial: Exalar ou o 8º Portão (talento Oito Portões Internos: Shimon). Solta uma nuvem de vapor vermelho e o chakra ao redor toma a forma de uma fera flamejante da sua escolha; escolhe uma criatura ou ponto à vista a até 36m e avança em linha reta até lá, atravessando estruturas e obstáculos no caminho (menos construtos ou estruturas criadas por jutsu ou talentos) — até o início do turno seguinte, o alvo não pode se beneficiar de nenhuma Reação. Termina com um chute: Ataque de Taijutsu corpo a corpo com vantagem, rerrolando qualquer resultado do dado abaixo de 8. No acerto, o alvo testa Força — na falha, é reduzido a 0 PV e o corpo dele se desintegra, impossível de reviver por qualquer meio; no sucesso, sofre Xd12+100 de dano de Concussão, sendo X seu nível + bônus de proficiência + modificador de Taijutsu. Ao fim do ataque, todo o seu próprio sangue ferve, encerrando à força seu Fôlego Celestial e/ou seus Oito Portões Internos — nos minutos seguintes, seu corpo vira cinzas.'},
  {nome:'Lótus Vermelho', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'26 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Entra num estado de instinto e foco absolutos: pelo tempo que durar, ganha duas Reações extras em cada um dos seus turnos. Enquanto durar, não pode ganhar nenhum benefício de Ninjutsu, Genjutsu, Taijutsu ou Bukijutsu que desse Ação, Ação Bônus ou Reação extras.'},
  {nome:'Sétimo Fôlego Celestial: Exalar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'20 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Kinjutsu: precisa estar com o Sexto Fôlego Celestial: Arquejar ativo — ele para, e este toma o lugar dele, somando os efeitos da cadeia toda. Desliga os limitadores do próprio coração, bombeando uma quantidade impossível de oxigênio pelo corpo — a aura de chakra ao redor fica ainda mais intensa, tomando a forma que você quiser (uma caveira, olhos, um demônio). Seus dois primeiros Ataques de Taijutsu de cada turno ganham +5 pra acertar e causam 7d8 de dano extra, e ganha 40 de PV temporário (empilhando com o resto da cadeia). Ao encerrar este jutsu, ganha 7 ranks de Fragilizado e 7 ranks de Lento até passar uma semana inteira de descanso — isso não pode ser removido nem encerrado antes por nenhum meio.'},
  {nome:'Cumprimentos Estilosssos', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'Especial (30 Chakra)', alcance:'Pessoal', duracao:'Especial, até 1 minuto',
    efeito:'Encadeia uma sequência de gestos deliberadamente desafiadores pra desmoralizar o oponente. Enquanto durar: toda vez que acertar duas vezes a mesma criatura, ganha +1 em Defesa e em resistências até o início do seu próximo turno (máximo +5); não sofre penalidade em Defesa, ataques nem resistências; quando passaria numa resistência que causaria dano ou uma condição, não sofre nada em vez disso; e sempre que alguém errar um ataque contra você, pode usar a Ação de Ataque contra quem errou. Na primeira vez que sofrer dano ou qualquer efeito hostil, este jutsu termina na hora.'},
  {nome:'A Última Valsa', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'26 Chakra', alcance:'Pessoal (1,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Só pode ser lançado enquanto você estiver adjacente a pelo menos uma criatura hostil. A(s) criatura(s) adjacente(s) fazem um teste de Força ou Destreza (Artes Marciais) contra o seu — quem perder o teste, pelo tempo que durar, não consegue se afastar de você: sempre que tentar se mover ou teleportar pra longe, você pode gastar seu próprio deslocamento pra ficar adjacente de novo (não gasta deslocamento se isso acontecer no turno de outra criatura; dimensões diferentes contam como distância infinita, impedindo o efeito). Toda vez que se mover assim até alguém, pode usar a Ação de Ataque contra ela — no acerto, ela só pode alvejar você com ataques corpo a corpo ou à distância até o fim do turno atual. Além disso, quando for usar a Ação de Ataque, pode atacar individualmente cada criatura adjacente a você.'},
  {nome:'Lírio Branco', tipo:'Taijutsu', categoria:'Taijutsu', rank:'S', custo:'Especial (25 Chakra)', alcance:'Toque', duracao:'Concentração, até 1 minuto',
