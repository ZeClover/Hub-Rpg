    efeito:'Médico: toca a base da coluna de um aliado disposto (não pode alvejar a si mesmo), liberando o tempo de resposta dos reflexos dele. Pelo tempo que durar, o alvo ganha uma Ação Bônus e uma Reação extras em cada turno, mas não pode manter concentração em nenhum outro jutsu enquanto isso. Ao acabar, o corpo dele desacelera de vez, ficando Fragilizado por 1 hora. Se ele ganhar 2 ou mais ranks de Chocado enquanto estiver sob este efeito, fica Atordoado até o fim do turno seguinte dele. Uma criatura só pode se beneficiar deste jutsu uma vez por descanso.'},
  {nome:'Golpe Esmagador Único', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpe ascendente que arremete de baixo pra cima: Ataque de Taijutsu corpo a corpo, dano da arma + 2d6. Se acertar, o alvo testa Força ou tem a Defesa reduzida em 1d4 até o início do turno seguinte dele. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Corte de Golpe Único', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Corte largo em arco, sem desperdiçar movimento: Ataque de Taijutsu corpo a corpo, dano da arma + 2d6. Se acertar, o alvo testa Constituição ou ganha 1 rank de Sangramento. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Golpe Cruzado Duplo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Dois cortes cruzados formando um X: 2 Ataques de Taijutsu corpo a corpo, cada um causando dano da arma. Cada acerto força o alvo a testar Constituição ou ganhar 1 rank de Machucado. Em ranks mais altos: +3 de custo por rank acima de D, e o alvo sofre -1 no teste.'},
  {nome:'Penetração em Dois Pontos', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Ataca ombros ou pernas pra desestabilizar o alvo: 2 Ataques de Taijutsu corpo a corpo, dano da arma. Acertando ao menos uma vez, o alvo testa Constituição ou tem o deslocamento reduzido em 3m por acerto até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Canhão de Ar 36 PSI', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Dispara pela lâmina um projétil de ar comprimido: Ataque de Taijutsu à distância, dano da arma + 1d12. Se acertar, o alvo testa Destreza ou ganha 1 rank de Lento (repete o teste no fim de cada turno dele pra se livrar). Lançado como Chain 2, causa +2d12 de dano; como Chain 3, o alvo ganha mais 1 rank de Lento. Em ranks mais altos: +3 de custo e +1 no tamanho do dado de dano por rank acima de D.'},
  {nome:'Corte Lateral Triplo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'3 Ataques de Taijutsu corpo a corpo mirando as juntas do alvo pra desarmar e incapacitar, dano da arma sem somar seu modificador de habilidade. Causando dano ao menos uma vez, o alvo testa Constituição ou larga a arma (arremessada 3m) e fica Zonzo até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Perfuração em Três Pontos', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'3 Ataques de Taijutsu corpo a corpo em pontos diferentes da defesa do alvo, dano da arma sem somar seu modificador de habilidade. O alvo testa Constituição ou fica Fragilizado até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Calcanhar de Aquiles', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'1 minuto',
    efeito:'Mira nos pontos fracos da armadura do alvo (precisa estar vestindo armadura): faz um teste de Artes Marciais contra a Defesa dele. Se superar, ignora a redução de dano da armadura e a Defesa do alvo cai em 1 enquanto durar. Termina antes se perder o alvo de vista.'},
  {nome:'Corte do Encaixe da Flecha', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Corte instantâneo que só dá brecha pro alvo reagir: Ataque de Taijutsu corpo a corpo, dano da arma + 2d4. Ao acertar, pode se afastar 3m do alvo antes de rolar o dano. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Postura da Fúria Contida', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'1 minuto',
    efeito:'Postura: toda vez que é atingido, ou reage pra fazer um ataque errar, ganha 1 ponto de Fúria. Guarda até um total de Fúria igual ao seu nível, pra gastar depois em jutsu da família "Fúria Contida".'},
  {nome:'Fúria Contida: Rajada do Dragão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'1 minuto',
    efeito:'Exige estar na Postura da Fúria Contida. 2 Ataques de Taijutsu corpo a corpo, dano da arma + 1d4 cada. Acertando os dois, pode gastar 2 ou mais pontos de Fúria pra fazer um ataque adicional por ponto gasto, até 4 ataques adicionais.'},
  {nome:'Fúria Contida: Bloqueio Horizontal', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'1 minuto',
    efeito:'Reação a ser atingido por um ataque: exige estar na Postura da Fúria Contida. Gasta 2 ou mais pontos de Fúria pra aparar — rola o dado de dano da arma uma vez por ponto gasto e reduz o dano recebido pelo total rolado. Se isso zerar o dano, faz um ataque a cada 2 pontos de Fúria gastos, causando o dado de dano da arma em cada acerto.'},
  {nome:'Lâmina do Pecado: Preguiça', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Imbui a lâmina com o pecado da Preguiça: Ataque de Taijutsu corpo a corpo, dano da arma + 1d8. O alvo testa Constituição ou desce na ordem de iniciativa, perdendo o ímpeto de agir rápido. Lançado como Chain 2, causa +2d8 de dano; como Chain 3, o teste do alvo tem desvantagem. Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de D; a partir do Rank A, se o alvo já for o último na iniciativa e falhar o teste, fica incapaz de se mover ou agir até o fim do turno seguinte dele.'},
  {nome:'Golpe Contundente', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Carrega a arma de chakra concussivo e mira no centro do peito do alvo: Ataque de Taijutsu à distância, dano da arma + 2d4 de Concussão. Se acertar, o alvo testa Constituição ou fica Zonzo — enquanto isso durar, qualquer teste de concentração dele pra manter Genjutsu ou Ninjutsu soma 1d8 a mais de dificuldade. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Ricochete em Cadeia', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Mira pra acertar o maior número de alvos possível: Ataque de Taijutsu à distância, dano da arma + 1d8. Acertando, pode fazer um segundo Ataque de Taijutsu à distância contra outra criatura no alcance com -2 no ataque; acertando esse, um terceiro ataque contra outra criatura com mais -2 acumulado. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Sopro das Cinzas: Chamuscar', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Cobre a arma com chakra de Fogo até virar cinzas incandescentes: Ataque de Taijutsu à distância com +1 no intervalo de acerto crítico, dano da arma + 2d6 de Fogo. O alvo fica Cego pelas cinzas até o início do turno seguinte dele ou até ser alvo de um ataque antes disso. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D; no Rank B, atinge uma segunda criatura; no Rank S, uma terceira.'},
  {nome:'Sopro das Feras: Presa', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'O chakra que cobre a arma toma a forma de uma fera à sua escolha, visível a qualquer um: 2 Ataques de Taijutsu corpo a corpo, dano da arma + 1d6 cada, sem somar seu modificador de habilidade. Em ranks mais altos: +3 de custo por rank acima de D; a partir do Rank C, +1d6 de dano; no Rank B, +1 ataque; no Rank S, +2 ataques.'},
  {nome:'Sopro da Poeira: Sokusei', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'O chakra de Terra aumenta o peso e a força de impacto da arma: Ataque de Taijutsu à distância (não pode ser crítico), dano da arma + 1d12 de Terra, e o alvo é empurrado 1,5m. Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de D.'},
  {nome:'Sopro da Terra: Esmagar', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (3m de raio)', duracao:'Instantâneo',
    efeito:'Finge um golpe numa direção e muda de ângulo na hora H: toda criatura no raio com pontuação de Taijutsu menor que a sua sofre -1d4 no teste de resistência deste jutsu. Escolhe as criaturas afetadas, que testam Destreza — falhando, sofrem dano da arma + 2d6 de Terra e ficam Derrubadas e com 1 rank de Machucado; passando, sofrem metade do dano e nada mais. Em ranks mais altos: +3 de custo, +1d6 de dano e +1,5m de raio por rank acima de D; no Rank B, a penalidade vira -1d6; no Rank S, -1d8.'},
  {nome:'Sopro do Eco: Reverberação', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'O chakra manifesta uma nota musical visível sobre a arma e dispara dois estampidos sonoros: 2 Ataques de Taijutsu à distância, dano da arma cada. Cada acerto força o alvo e quem estiver a até 1,5m dele a testar Sabedoria ou ficar Ofuscado. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D; a partir do Rank C, +1 ataque; a partir do Rank B, também fica Zonzo na falha.'},
  {nome:'Sopro do Enoki: Infestar', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Médico: cobre a arma com chakra que a faz brilhar rosa suave. Enquanto durar, ao causar dano com essa arma (em ataque de arma ou de Taijutsu), uma vez por turno o alvo testa Constituição ou tem a Defesa reduzida em 1 (no máximo 2 vezes na mesma criatura). Em ranks mais altos: +3 de custo e +1 no limite de reduções por rank acima de D.'},
  {nome:'Sopro da Chama: Desprevenido', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Especial', duracao:'Instantâneo',
    efeito:'Corre até ficar adjacente a um alvo à vista (usando todo o seu deslocamento) e desfere um golpe único tentando decapitá-lo: Ataque de Taijutsu corpo a corpo com +1 no intervalo de crítico, dano da arma + 2d6+2 de Fogo. Acerto crítico dá ao alvo 1 rank de Queimado. Em ranks mais altos: +3 de custo e +1 no intervalo de crítico por rank acima de D; no Rank B, +1d6+1 de dano; no Rank S, um crítico quadruplica o dano de Fogo em vez do normal.'},
  {nome:'Sopro da Chuva: Cúmulos', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu à distância: acerto causa o dobro do dado de dano da arma + seu mod. de Taijutsu de dano de Frio, e o alvo testa Constituição ou fica Zonzo. A rolagem de ataque deste jutsu nunca sofre desvantagem nem penalidade vinda de condição, jutsu, traço ou característica hostil. Em ranks mais altos: +3 de custo e +1 dado de dano da arma por rank acima de D; a partir do Rank C, +1d4 no ataque se o alvo estiver Derrubado ou Zonzo; a partir do Rank B, isso vira +1d6 e passa a valer também pra Fragilizado; no Rank S, o ataque sempre tem vantagem.'},
  {nome:'Sopro das Rosas: Ameixa', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (1,5m)', duracao:'Instantâneo',
    efeito:'Médico: cobre a arma com chakra que a faz brilhar rosa suave. Reação a sofrer dano: gira a arma numa série de golpes pra desviar o máximo possível, reduzindo o dano recebido em dano da arma + 2d8. Toda criatura hostil adjacente a você testa Destreza ou sofre dano de Veneno igual ao total reduzido (metade se passar). Em ranks mais altos: +3 de custo e +1d8 na redução por rank acima de D; a partir do Rank C, o alcance do dano de Veneno sobe pra 3m; a partir do Rank B, o dado de redução vira d10; no Rank S, quem falhar sofre o dobro do dano.'},
  {nome:'Sopro dos Céus: Queda das Nuvens', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'O chakra de Vento espirala pela arma, dando força pra cortar através do céu: 2 Ataques de Taijutsu à distância, cada um causando o dado de dano da arma em dano de Vento (sem somar seu modificador de habilidade) e 1 rank de Sangramento no acerto. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de D.'},
  {nome:'Sopro do Som: Rugido', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (4,5m de raio)', duracao:'Instantâneo',
    efeito:'O chakra manifesta uma nota musical sobre a arma, que prende uma ferramenta explosiva enquanto você golpeia numa sinfonia de cortes até ela detonar: todos por perto (menos você) testam Sabedoria — falhando, sofrem dano da arma + 1d12 e ficam Ofuscados e Cegos até o início do turno seguinte deles (quanto melhor a qualidade da ferramenta explosiva usada, pior a penalidade no teste). Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de D; a partir do Rank B, a Cegueira dura até o fim do turno seguinte deles.'},
  {nome:'Sopro das Faíscas: Choque', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Rola 1d4 pra saber quantos alvos consegue atingir e escolhe criaturas à vista no alcance: Ataque de Taijutsu à distância contra cada uma, causando o dobro do dado de dano da arma + 1d8 de Raio (sem somar seu modificador de habilidade). Em ranks mais altos: +3 de custo e o dado que define o número de alvos sobe um passo (d4>d6>d8>d10>d12) por rank acima de D; a partir do Rank C, +1d8 de dano; a partir do Rank B, +1 dado de dano da arma; a partir do Rank A, mais +1d8 de dano; no Rank S, mais +1 dado de dano da arma.'},
  {nome:'Sopro do Trovão: Relâmpago', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Especial', duracao:'Instantâneo',
    efeito:'Corre até ficar adjacente a um alvo à vista (usando todo o seu deslocamento): Ataque de Taijutsu corpo a corpo, dano da arma + 2d10 de Raio (sem somar seu modificador de habilidade) — se o alvo tiver PV temporário, o dano acerta o PV normal e o temporário ao mesmo tempo. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D; no Rank C, escolhe um segundo alvo a até 9m do primeiro e repete o ataque nele; no Rank B, um terceiro alvo a até 9m do segundo; a partir do Rank A, um quarto alvo a até 9m do terceiro.'},
  {nome:'Sopro da Água: Superfície', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto causa dano da arma + 1d10 de Frio, e o alvo testa Força ou fica Zonzo. A rolagem de ataque deste jutsu nunca sofre desvantagem nem penalidade vinda de condição, jutsu, traço ou característica hostil. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D; a partir do Rank C, +1d4 no ataque se o alvo estiver Derrubado ou Zonzo; a partir do Rank B, isso vira +1d6 e passa a valer também pra Fragilizado; no Rank S, o ataque sempre tem vantagem.'},
  {nome:'Sopro do Vento: Cortador', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'3 Ataques de Taijutsu corpo a corpo, cada um causando o dado de dano da arma em dano de Vento, sem somar seu modificador de habilidade. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de D.'},
  {nome:'Disparo em Rajada', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (9m de cone)', duracao:'Instantâneo',
    efeito:'Prepara vários disparos e solta todos de uma vez num cone à sua frente: o alvo testa Destreza — falhando, sofre dano da arma + 1d6 (metade se passar). Se precisar rolar o dado de munição da arma, rola duas vezes e fica com o menor resultado. Lançado como Chain 2, causa +1d6 de dano extra; como Chain 3, esse extra vira +2d8. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Arremesso Explosivo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'27m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu à distância: acerto causa dano da arma + 1d6. Não importa o resultado, a arma se estilhaça e cria um campo minado num raio de 3m ao redor do alvo até o início do seu próximo turno — a primeira vez que uma criatura se mover dentro dessa área, sofre 2d4 de dano Cortante. Em ranks mais altos: +3 de custo e +1d6 nos dois danos por rank acima de D.'},
  {nome:'Tapete de Aço', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'13,5m (cubo de 6m)', duracao:'Instantâneo',
    efeito:'Espalha uma pilha de armas numa área a até 13,5m de distância: vira terreno difícil, e quem se move lá dentro sofre 1d4 de dano Perfurante a cada 1,5m percorridos (espaços já atravessados deixam de ser terreno difícil e de causar dano). Em ranks mais altos: +3 de custo e +1,5m no tamanho da área por rank acima de D.'},
  {nome:'Puxão de Corrente', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'3 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Arremessa a arma enrolando no alvo e puxa pra si: o alvo testa Força — falhando, é puxado 3m em linha reta na sua direção, não consegue fazer Selos de Mão até o início do turno seguinte dele, e fica Restrito por você (repete o teste de Força no fim de cada turno dele pra se soltar). Lançado como Chain 2, atinge mais um alvo no alcance; como Chain 3, os alvos têm desvantagem no teste inicial.'},
  {nome:'Munição Tocada por Chakra', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Cobre toda a munição de uma arma com chakra, tornando-a mais letal e eficiente. Enquanto durar: toda vez que causar dano com essa arma municiada, soma +1d4 de dano do mesmo tipo, até duas vezes por turno; ao rolar o dado de munição, rola um dado extra e fica com o maior resultado; e se fosse gastar um dado de munição inteiro num jutsu, pode optar por encerrar este jutsu em vez de gastar o dado. Em ranks mais altos: +3 de custo por rank acima de D; no Rank C, o dano extra vira 2d4; a partir do Rank A, vira 3d4.'},
  {nome:'Golpe Mutilante', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo ou à distância (conforme a arma usada), dano da arma. Acertando, o alvo testa Força ou fica Zonzo, Fragilizado e Derrubado. Sendo crítico, esse teste tem desvantagem. Em ranks mais altos: +3 de custo e +1 dado de dano da arma por rank acima de D.'},
  {nome:'Corte Curvo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Arremesso único que faz a arma curvar e cortar com precisão assustadora: Ataque de Taijutsu à distância, dano da arma + 2d8. Acertando, o alvo testa Constituição ou fica Cego até o fim do turno seguinte dele (falhando por 5 ou mais, fica Cego só até o fim do seu turno atual). Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Vibrações Cortantes', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, 1 minuto',
    efeito:'Faz a arma vibrar em velocidade supersônica: enquanto durar, toda vez que causar dano Cortante num alvo usando armadura, reduz o bônus de Armadura dele em 1 (só uma vez por rodada). Se isso zerar o bônus, some um dado extra de dano da arma em vez da redução.'},
  {nome:'Performance de Dança: Postura Neutra', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Saca a arma numa postura leve, de dançarino. Enquanto durar, qualquer Bukijutsu da família "Performance de Dança" que lançar ganha +1 no intervalo de crítico em Ataques de Taijutsu; se em vez disso exigir teste de resistência, quem rolar 1 ou 2 no d20 do teste e falhar sofre dano dobrado. Em ranks mais altos: +3 de custo por rank acima de D; no Rank C, +1 no intervalo de crítico; no Rank A, +2 no intervalo de crítico, e quem rolar 5 ou menos no teste de resistência fica vulnerável ao dano.'},
  {nome:'Dança do Tolo Dançarino', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Gira a arma num arco largo acertando todos ao redor: um único Ataque de Taijutsu corpo a corpo comparado individualmente contra a Defesa de cada criatura à sua escolha no alcance da arma. Quem for acertado sofre dano da arma + 2d4 e testa Destreza ou cai Derrubado. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Chicote do Tolo Dançarino', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Estala a arma com violência o bastante pra rachar o chão: toda criatura numa área de 4,5m ao seu redor testa Destreza — falhando, é chicoteada repetidamente, sofrendo dano da arma + 2d4 e ganhando Sangramento; passando, sofre só metade do dano e nada mais. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D.'},
  {nome:'Zona de Perigo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Dobro do alcance da arma', duracao:'Instantâneo',
    efeito:'Gira a arma ao redor do corpo usando chakra pra estender o alcance: toda criatura no alcance testa Destreza — falhando, sofre 3d6 de dano Cortante e ganha 1 rank de Sangramento. Em ranks mais altos: +3 de custo e +2d6 de dano por rank acima de D; a partir do Rank A, quem passar no teste sofre metade do dano em vez de nada.'},
  {nome:'Tiro Debilitante', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'1 rodada',
    efeito:'Arremessa armas rapidamente mirando pontos de pressão do alvo: Ataque de Taijutsu à distância, dano da arma + 4d4. O alvo também testa Constituição — falhando, os senbons se cravam nas juntas dele e ganha 1 rank de Fragilizado (passando, sofre só metade do dano). Uma criatura Fragilizada assim pode gastar uma Ação fazendo um teste de Sabedoria (Sobrevivência) contra sua CD de Taijutsu pra arrancar os senbons. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Dança Demoníaca', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Gira com a arma numa dança que confunde os inimigos: um Ataque de Taijutsu corpo a corpo contra todas as criaturas no alcance. Cada uma acertada sofre dano da arma, que sobe +1d4 a cada criatura adicional atingida. Em ranks mais altos: +3 de custo e +1,5m de alcance por rank acima de D; no Rank A, o alcance vira o seu deslocamento atual.'},
  {nome:'Aposta do Diabo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Faz uma aposta digna de um capeta: até o início do seu próximo turno, o primeiro ataque de arma ou de Taijutsu de um Bukijutsu que lançar tem vantagem e o dado de dano da arma sobe em +1 — mas em troca, o primeiro ataque de qualquer criatura contra você nesse período tem vantagem. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, o dado de dano da arma sobe +3; no Rank S, sobe +5.'},
  {nome:'Tiro Duplo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Prepara dois disparos pra sair de uma vez: até o fim do turno atual, a próxima vez que fizer um Ataque de Arma à distância, faz mais um como parte da mesma ação contra outra criatura — os dois se beneficiam de qualquer efeito que normalmente só valeria pro primeiro ataque. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, dois disparos extras; no Rank S, três.'},
  {nome:'Encrenca Dobrada', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Dispara uma rajada rápida de 2 tiros que deixam o inimigo cambaleando: 2 Ataques de Taijutsu à distância, dano da arma + 1d6 cada. Acertando ao menos um, o alvo testa Força ou tem o deslocamento reduzido em 3m por acerto até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Investida da Libélula', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Arremessa a arma pra um aliado disposto à vista, pra que ataque em seu lugar: até o fim do turno atual, a arma emprestada mantém todos os bônus e efeitos como se você mesmo a empunhasse. O aliado pode gastar a Reação dele pra fazer um Ataque de Taijutsu corpo a corpo contra alguém no alcance dele, causando dano da arma + seu modificador de habilidade — e, na mesma Reação, pode escolher arremessar a arma de volta pra você. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de D.'},
  {nome:'Estocada Mata-Dragão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Carrega um golpe de estocada com timing preciso: faz um teste de Artes Marciais contra a Defesa de um alvo no alcance. Superando, o ataque a seguir tem vantagem. Move-se até o alvo (sem provocar ataque de oportunidade) e faz um Ataque de Taijutsu corpo a corpo — acertando, causa dano da arma e o alvo testa Constituição ou fica incapaz de reagir até o fim do turno atual. Lançado como Chain 2, o teste de Artes Marciais tem vantagem; como Chain 3, o dano dobra no acerto. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Punho de Longo Alcance do Dragão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'2 disparos rápidos que desorientam e debilitam: 2 Ataques de Taijutsu à distância, dano da arma cada. Cada acerto força o alvo a testar Constituição ou ficar Zonzo. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Pouso da Libélula', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Salta e desce cravando estocadas incontáveis: 3 Ataques de Taijutsu corpo a corpo, cada um causando o dado de dano da arma. Acertando com pelo menos 3 golpes, o alvo cai Derrubado enquanto você aterrissa sobre ele. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de D.'},
  {nome:'Estocada em Eco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Concentração, 1 minuto',
    efeito:'Injeta chakra no antebraço pra golpear duas vezes num só movimento: enquanto durar, a primeira vez que acertar uma criatura com um ataque de arma em cada turno, pode causar o mesmo dano numa segunda criatura a até 1,5m de você e do alvo original.'},
  {nome:'Bloqueio Aprimorado', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Firma a arma numa postura mais defensiva (a concentração neste jutsu não quebra por dano). Enquanto durar: empunhando uma arma de haste, ganha +1 de Defesa; qualquer bônus de Defesa vindo da propriedade de bloqueio ou de selos de arma também soma no primeiro teste de Força ou Destreza de cada rodada; e pode gastar a Reação, ao sofrer dano, pra reduzir o dano recebido em duas vezes o dado de dano da arma — se isso zerar o dano, ganha uma Reação extra até o início do próximo turno, só pra lançar este jutsu de novo. Em ranks mais altos: +3 de custo e +1 dado de dano da arma na redução por rank acima de D.'},
  {nome:'Fio Eterno', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'1 minuto',
    efeito:'Cobre o fio da arma com uma camada fina de chakra que a protege: enquanto durar, a arma não sofre penalidade de nenhum traço, característica ou jutsu de rank igual ou menor que tentaria destruí-la, danificá-la ou reduzir seus ataques. Em ranks mais altos: +3 de custo por rank acima de D; a partir do Rank C, a duração vira 10 minutos; no Rank B, 1 hora; no Rank A, 8 horas; no Rank S, 24 horas.'},
  {nome:'Extermínio', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpeia duas vezes formando um X, tentando travar a capacidade de revidar do alvo: 2 Ataques de Taijutsu corpo a corpo, dano da arma + 1d12 cada. Acertando os dois, o alvo testa Constituição ou sofre -2 em todos os ataques até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo, +1d12 de dano e +1 na penalidade de ataque por rank acima de D.'},
  {nome:'Presa de Longo Alcance', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Dobro do alcance da arma', duracao:'Instantâneo',
    efeito:'Inunda a arma de chakra pra voar mais longe e bater mais forte: Ataque de Taijutsu à distância, dano da arma + 2d10. O alvo testa Força ou é arremessado 4,5m pra trás — se bater numa estrutura ou construto, fica preso nela, Agarrado até usar uma ação pra se soltar. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D; no Rank B, mais 4,5m de arremesso; no Rank S, mais 4,5m.'},
  {nome:'Rastros Relampejantes', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (18m)', duracao:'Instantâneo',
    efeito:'Arremessa armas em alta velocidade, riscando o ar de luz: Ataque de Taijutsu à distância contra um número de criaturas igual ao seu mod. de Taijutsu. Cada acerto causa dano da arma + 2d4 de dano Cortante, e o alvo testa Destreza ou ganha 2 ranks de Sangramento. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D.'},
  {nome:'Andorinha Voadora: Corte Cruzado', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Exige uma arma em cada mão: golpeia pra dentro com as duas de uma vez. 2 Ataques de Taijutsu contra até 2 inimigos a até 1,5m de você, dano da arma + 1d4 cada. O alvo testa Força ou é desarmado do que estiver segurando. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D.'},
  {nome:'Andorinha Voadora: Pião', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Exige uma arma em cada mão: gira como um pião acertando todos ao redor. Toda criatura no alcance da arma testa Destreza — falhando, sofre dano da arma + 2d6 (metade se passar) e ganha um efeito extra conforme o tipo de dano da arma: Concussão deixa Derrubado; Perfurante dá 1 rank de Fragilizado até o fim do turno seguinte; Cortante dá 1 rank de Sangramento. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Andorinha Voadora: Linha Reta', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (linha de 9m)', duracao:'Instantâneo',
    efeito:'Exige uma arma em cada mão: avança em linha reta por até 9m, atravessando o espaço de criaturas hostis pelo caminho. 2 Ataques de Taijutsu corpo a corpo contra as criaturas à sua escolha cujo espaço atravessou, dano da arma + 1d4 cada. O alvo testa Força ou cai Derrubado. Em ranks mais altos: +3 de custo e +1d4 de dano por rank acima de D.'},
  {nome:'Golpe Corta-Grama', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpeia baixo pra mancar o inimigo: Ataque de Taijutsu corpo a corpo, dano da arma + 2d4, e reduz o deslocamento do alvo pela metade até o fim do turno seguinte dele. Lançado como Chain 2, causa +3d4 de dano extra; como Chain 3, o dado de dano vira d8. Em ranks mais altos: +3 de custo e +1 no tamanho do dado de dano por rank acima de D.'},
  {nome:'Onda de Choque do Grande Dragão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Ergue a lâmina e corta com força o bastante pra criar uma onda de choque: Ataque de Taijutsu corpo a corpo, dano da arma + 1d8. Todas as outras criaturas no alcance (menos o alvo) testam Força ou são arremessadas 4,5m pra trás. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Tumulto Celestial', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpeia de baixo pra cima e depois derruba o golpe de volta: Ataque de Taijutsu corpo a corpo, dano da arma. Acertando, o alvo testa Força — falhando, você faz um segundo Ataque de Taijutsu corpo a corpo, causando dano da arma + 1d12 no acerto; passando, você ainda faz esse segundo ataque, mas com desvantagem (que nada pode anular).'},
  {nome:'Tiro da Sombra Oculta', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Arremessa a arma, mas o ataque de verdade se esconde na sombra dela: Ataque de Taijutsu à distância. O alvo faz um teste de Percepção contra CD 10 + seu bônus de Prestidigitação — falhando, o ataque ganha vantagem e ele não pode reagir. Acertando, causa dano da arma. Lançado como Chain 2, causa +2d6 de dano extra; como Chain 3, esse extra vira +2d8. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, +1 ataque; no Rank S, mais +1 ataque.'},
  {nome:'Arma Oculta', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'3 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Saca e guarda a arma tão rápido que é quase impossível perceber: até o fim do turno seguinte, o primeiro ataque de arma ou de Taijutsu com uma arma que sirva pra esse jutsu tem vantagem e +1 no intervalo de crítico. Ao causar dano assim, pode fazer (na mesma ação) um teste de Prestidigitação contra a Percepção passiva do alvo — no sucesso, some a arma antes que ele perceba o que o atingiu; falhando, suas armas não ganham mais esse bônus contra aquela criatura até você descansar. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, o bônus de crítico vira +2; no Rank S, vira +3.'},
  {nome:'Buracos do Desespero', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'(Não pode ser crítico) Estoca de ângulos diferentes tentando furar o alvo todo: 3 Ataques de Taijutsu corpo a corpo, cada um causando o dado de dano da arma. Acertando com pelo menos 2, o alvo ganha 1 rank de Sangramento. Lançado como Chain 2, +1 rank de Sangramento; como Chain 3, +1 ataque. Em ranks mais altos: +3 de custo e +1 rank de Sangramento por rank acima de D; a partir do Rank A, volta a poder ser crítico.'},
  {nome:'Iaijutsu: Canção do Leão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Com a espada embainhada, escuta a "respiração" do oponente antes de desembainhar, golpear ao passar por ele e reembainhar: Ataque de Taijutsu corpo a corpo, dano da arma + 1d10. Se superar a Defesa do alvo em 10 ou mais, ele não consegue reagir a este jutsu. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D; no Rank B, basta superar a Defesa em 5; no Rank S, o ataque ganha vantagem (e se já tiver vantagem por outro motivo, o alvo nunca consegue reagir).'},
  {nome:'Estocada Empaladora', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Estoca a arma no alvo e a mantém cravada: Ataque de Taijutsu corpo a corpo, dano da arma no acerto. Pode optar por deixar a arma cravada — enquanto isso durar, não pode atacar com ela, mas o alvo fica Agarrado por ela; pode gastar sua Ação Bônus pra torcer a arma, causando o dado de dano da arma, e soma esse mesmo dado em qualquer teste pra manter o Agarrão. O alvo pode se arrancar da arma como uma ação, escapando automaticamente do Agarrão mas ganhando 2 ranks de Sangramento. Em ranks mais altos: +3 de custo e +1 no tamanho do dado de dano por rank acima de D; no Rank B, ganha vantagem nos testes pra manter o Agarrão; no Rank S, quem se arrancar à força ganha 2 ranks de Laceração em vez de Sangramento.'},
  {nome:'Desvio da Teia de Ferro', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Reação: se envolve rapidamente na corrente ou fio da arma pra amortecer o golpe antes que ele acerte. Rola o dado de dano da arma duas vezes e soma seu modificador de habilidade, reduzindo o dano recebido pelo total. Em ranks mais altos: +3 de custo e mais duas rolagens do dado de dano da arma por rank acima de D.'},
  {nome:'Beijo da Lua', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Lança o ataque num arco tão alto que some da vista do alvo antes de cair como se viesse da própria lua: Ataque de Taijutsu à distância. O alvo testa Sabedoria contra sua CD de Taijutsu — falhando, o ataque ganha vantagem (ele perde o rastro); passando, o ataque sofre desvantagem (ele consegue acompanhar). Acertando, causa dano da arma + 2d6. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Quebra-Joelhos', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Uma sequência de golpes baixos mirando as pernas do alvo: 2 Ataques de Taijutsu corpo a corpo, dano da arma cada. Acertando os dois, o alvo cai Derrubado e precisa gastar todo o deslocamento dele só pra se levantar. Em ranks mais altos: +3 de custo e +1,5m de alcance por rank acima de D; no Rank B, +1 ataque; no Rank S, mais +1 ataque.'},
  {nome:'Investida Linear', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Dobro do seu deslocamento restante', duracao:'Instantâneo',
    efeito:'Toma uma postura ampla e avança pra desferir uma única estocada com força pra atravessar o alvo: Ataque de arma. Ganha +1 no ataque a cada 9m percorridos (máximo +5), e no acerto causa dano da arma + 1d10 a cada 9m percorridos (máximo 3d10). Causando 20 ou mais de dano, o alvo também ganha 1 rank de Sangramento e fica Lento até o fim do turno seguinte dele. Em ranks mais altos: +3 de custo e +9m no limite de deslocamento por rank acima de D.'},
  {nome:'Ferramentas Manipuladas: Meteoro Aprisionador', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'3 Chakra', alcance:'7,5m', duracao:'Instantâneo',
    efeito:'Invoca uma corrente pesada do pergaminho de armas e prende vários alvos à vista: Ataque de Taijutsu corpo a corpo contra até 3 alvos a até 7,5m um do outro. Acertando, eles ficam Agarrados e acorrentados entre si — nenhum pode se afastar mais de 7,5m dos outros. Como ação, cada um pode tentar um teste de Acrobacia ou Prestidigitação contra sua CD de Taijutsu pra escapar; quem falhar dificulta a fuga dos demais (cada tentativa seguinte de outra criatura acorrentada sofre -2 acumulativo até o fim do turno seguinte dela). Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Ferramentas Manipuladas: Chute de Lâminas', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'13,5m', duracao:'Instantâneo',
    efeito:'Invoca uma leva de espadas, facas e lanças e as chuta contra o alvo: rola 1d4 e guarda o resultado (X). Ataque de Taijutsu à distância causando Xd4 de dano Perfurante e 2 ranks de Sangramento no acerto. Em ranks mais altos: +3 de custo e o dado sobe um passo (d4>d6>d8>d10>d12) por rank acima de D.'},
  {nome:'Ferramentas Manipuladas: Chuva de Lâminas', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'18m (raio de 4,5m)', duracao:'Instantâneo',
    efeito:'Desenrola o pergaminho de armas no ar e invoca uma chuva de espadas, facas e lanças sobre uma área à vista: toda criatura num raio de 4,5m testa Destreza — falhando, sofre 3d6 + seu mod. de Taijutsu de dano Perfurante (metade se passar). A área vira terreno difícil, e a primeira vez que uma criatura andar por um espaço afetado, sofre 1d4 de dano das lâminas cravadas no chão. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Ferramentas Manipuladas: Muralha de Lâminas', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'3 Chakra', alcance:'Pessoal (3m de raio)', duracao:'Instantâneo',
    efeito:'Desenrola o pergaminho de armas num círculo de 3m ao seu redor, invocando uma leva de armas cortantes: toda criatura nesse raio testa Destreza — falhando, sofre 3d8 de dano Perfurante, não consegue lançar jutsu em rank elevado até o fim do turno seguinte dela, e ganha Sangramento; passando, sofre metade do dano e nada mais. Em ranks mais altos: +3 de custo, +1,5m de raio e +1d8 de dano por rank acima de D.'},
  {nome:'Postura do Rei Macaco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Lançado ao causar dano com a arma: entra numa postura acumulando a energia do golpe (não pode lançar outro jutsu enquanto isso durar, e a postura acaba sozinha no fim do turno seguinte). Enquanto estiver na postura, pode descarregá-la de três formas — como Ação: salta e desce a arma na cabeça do alvo (Ataque de Taijutsu corpo a corpo, dano da arma + 2d8, e o alvo testa Constituição ou fica Contundido); como Ação Bônus: avança de lado golpeando as pernas de um alvo a até 3m (Ataque de Taijutsu corpo a corpo, dano da arma + 2d4, e o alvo testa Força ou cai Derrubado); ou como Reação: um golpe rápido na lateral de um alvo a até 1,5m (Ataque de Taijutsu corpo a corpo, dano da arma no acerto — se o alvo tiver algum bônus de Defesa vindo de jutsu, traço ou característica, o golpe rompe esse bônus, ignora ele, causa +2d6 de dano extra, e você ganha esse mesmo bônus de Defesa até o fim do turno seguinte). Em ranks mais altos: +3 de custo e +1 no tamanho do dado de dano por rank acima de D.'},
  {nome:'10 Mil Pelos do Rei Macaco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Banha a arma em chakra até ela tomar a forma do lendário bastão do Rei Macaco (a concentração não quebra por dano). Enquanto durar: ao fazer a Ação de Atacar ou lançar um Bukijutsu da família "Rei Macaco" com essa arma, pode dar a ela Alcance Estendido igual ao seu mod. de Taijutsu (em metros); e, até duas vezes por turno, ao causar dano com um ataque de arma ou de Taijutsu, soma +1d6 de dano extra. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, o dano extra vira 2d6; no Rank S, vira 3d6.'},
  {nome:'Presa do Rei Macaco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Gira a arma sobre a cabeça antes de golpear de cima pra baixo e completar com a base da arma: 2 Ataques de Taijutsu corpo a corpo, dano da arma + 1d6 cada (sem somar seu modificador de habilidade). Acertando os dois, o alvo testa Força ou fica Zonzo. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de D.'},
  {nome:'Cauda do Rei Macaco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Gira a arma ao redor do corpo, trava atrás das costas com as duas mãos e desfere um giro lateral atingindo tudo à frente: Ataque de Taijutsu corpo a corpo, dano da arma + 2d6, e o alvo testa Constituição ou fica Zonzo. Se a arma tiver Alcance Estendido, o golpe se prolonga numa linha de 1,5m de largura (mais 1,5m por rank de Alcance Estendido que ela tiver) — toda criatura nessa extensão (menos o alvo original) testa Destreza, sofrendo dano da arma na falha ou nada no sucesso. Lançado como Chain 2, o dado de dano sobe +2; como Chain 3, faz mais um ataque. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Peso do Rei Macaco', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enche a arma de chakra multiplicando o peso dela em mais de 10 vezes (a concentração não quebra por dano). Enquanto durar, uma arma de Concussão multiplica o peso só no instante do impacto, voltando ao normal logo depois: cada vez que causar dano com um Ataque de Taijutsu corpo a corpo assim, o dado de dano da arma sobe um passo (d4>d6>d8>d10>d12). Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, sobe 2 passos; no Rank S, sobe 3 passos.'},
  {nome:'Golpe Multiponto', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpeia várias partes do corpo do alvo num piscar de olhos: um único Ataque de Taijutsu corpo a corpo ou à distância que repete o mesmo movimento várias vezes. Acertando, causa dano da arma + 2 dados extras de dano da arma. Em ranks mais altos: +3 de custo e +1 dado extra por rank acima de D.'},
  {nome:'Coragem de Nobunaga', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (9m de raio)', duracao:'1 minuto',
    efeito:'Solta um rugido cheio de desprezo e fúria empunhando uma arma de haste, imitando o lendário guerreiro Oda Nobunaga: pelo próximo minuto, todo aliado no alcance que ouvir fica imune (até o fim daquele turno) na primeira vez que ganharia qualquer rank de Enfeitiçado, Zonzo ou Medo. Toda criatura hostil no alcance que ouvir testa Carisma — falhando, na primeira vez que sofrer dano de um ataque com sua arma de haste, ganha 1 rank (à sua escolha) de Zonzo, Medo ou Fragilizado pelo resto do minuto, ou até gastar uma Ação pra refazer o teste e remover.'},
  {nome:'Esquiva Ofensiva', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Reação a ser atacado corpo a corpo: inverte a pegada na arma e golpeia antes de ser atingido. Ataque corpo a corpo contra quem o atacou, causando o dado de dano da arma + seu mod. de Taijutsu no acerto — e a rolagem desse dado também aumenta sua Defesa contra o ataque que disparou a reação, tentando desviá-lo.'},
  {nome:'Assalto da Dor', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (9m de cone)', duracao:'Instantâneo',
    efeito:'Gasta um dado de munição inteiro pra soltar uma parede de flechas, dardos, virotes, shuriken, kunai ou senbon: toda criatura num cone de 9m à sua frente testa Destreza — falhando, sofre Xd4 de dano do tipo da arma escolhida (X = o tamanho do dado gasto: d4=4, d6=6, d8=8, d10=10...). Em ranks mais altos: +3 de custo e o dado sobe um passo (d4>d6>d8>d10>d12) por rank acima de D.'},
  {nome:'Barragem da Dor', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (9m de raio)', duracao:'Instantâneo',
    efeito:'Salta girando e ataca todos ao redor: escolhe até 10 criaturas à vista no alcance. Rola a pilha de munição duas vezes e fica com o maior resultado (X). Todas testam Destreza — falhando, sofrem Xd4 + seu mod. de Taijutsu de dano do tipo da arma (metade se passar). Depois, você aterrissa num espaço livre à vista no alcance. Este jutsu gasta a pilha de munição inteira. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Dança da Dor', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (6m de raio)', duracao:'Instantâneo',
    efeito:'Solta uma rajada de armas ao seu redor: toda criatura num raio de 6m centrado em você testa Destreza — falhando, sofre dano da arma + 2d8 e fica Zonza; passando, sofre metade do dano e nada mais. Depois de lançar, o dado de munição da arma cai 2 passos. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Barragem de Bombas de Papel', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Prepara um punhado de bombas de papel entre os dedos das duas mãos (consumidas ao lançar) e as arremessa cobrindo um alvo: ele testa Destreza, sofrendo 7d4 de dano de Fogo na falha (metade se passar). Quem estiver a até 3m do alvo (menos ele) também testa Destreza, sofrendo 5d4 de dano de Fogo na falha (metade se passar). Cada nível de qualidade da bomba acima da básica soma +4d4 de dano.'},
  {nome:'Tiro Fixador', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Especial',
    efeito:'Faz uma série de disparos pra prender o alvo no lugar: Ataque de Taijutsu à distância, dano da arma + 1d10. O alvo testa Força ou fica Restrito. Ele mesmo, ou outra criatura a até 1,5m dele, pode gastar uma Ação fazendo um teste de Força (Atletismo) contra sua CD pra se livrar. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D; no Rank B, +2d10 de dano; no Rank S, +4d10.'},
  {nome:'Tiro Preparado', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Reação a ser atacado corpo a corpo: salta 1,5m pra trás (se possível) e revida na hora, cravando a arma no atacante pra tentar travar o golpe dele. Ataque de Taijutsu à distância, dano da arma + 3d4 Perfurante no acerto. O atacante testa Constituição — falhando, fica Atordoado até o fim do turno atual dele; passando, avança 1,5m (se possível) e completa o ataque normalmente. Esse movimento nunca provoca ataque de oportunidade. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Tiro de Empurrão', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Dispara um trio de tiros com força o bastante pra empurrar o alvo: 3 Ataques de Taijutsu à distância, dano da arma cada (sem somar seu modificador de habilidade). Acertando ao menos um, o alvo testa Força ou é arremessado 3m pra trás por acerto bem-sucedido. Em ranks mais altos: +3 de custo por rank acima de D, e -1 no teste do alvo.'},
  {nome:'Extensor de Alcance', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Concentra chakra na íris, aumentando o alcance perceptivo. Enquanto durar, o primeiro Ataque de Taijutsu ou de arma à distância que fizer em cada turno tem o alcance dobrado.'},
  {nome:'Golpe de Ricochete', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Reação a errar um ataque: bombeia chakra nos braços e tenta de novo — repete o mesmo ataque contra o mesmo alvo, mas com desvantagem. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, o segundo ataque vira normal (sem desvantagem); no Rank S, ganha vantagem.'},
  {nome:'Tiro na Sombra', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (27m)', duracao:'Instantâneo',
    efeito:'Arremessa a arma como se fosse um tiro só, mas esconde uma segunda na sombra dela: Ataque de Taijutsu à distância. O alvo faz um teste de Percepção contra sua rolagem de ataque — falhando, não percebe a segunda arma e sofre dano Cortante igual ao dado de dano da arma, acertando ou não o primeiro ataque. Acertando o ataque normal, causa dano da arma. Em ranks mais altos: +3 de custo e +1 dado no dano da falha de Percepção por rank acima de D.'},
  {nome:'Tiro Estilhaçante', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Dobro do alcance da arma', duracao:'Instantâneo',
    efeito:'Injeta tanto chakra na arma ao disparar que ela se estilhaça no ar, espalhando o dano numa área ampla: escolhe uma área de 6m de raio. Toda criatura hostil ali testa Destreza — falhando, sofre 4d6 de dano do tipo da arma e ganha 1 rank de Ofuscado pelo desequilíbrio da explosão. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Estrela Cadente', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Arremessa a arma priorizando velocidade em vez de força: Ataque de Taijutsu à distância, causando o dado de dano da arma no acerto. Mirando um alvo dentro do alcance normal da arma, o ataque tem vantagem; mirando um alvo só no alcance longo, o ataque tem desvantagem (que nada anula), mas causa +2d10 de dano extra.'},
  {nome:'Arremesso Esmagador', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Um disparo único feito pra romper defesas: Ataque de Taijutsu à distância, dano da arma + 2d6 de Concussão. Ignora cobertura parcial e causa o dobro de dano contra construtos e estruturas. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Dragão Alado', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Golpeia de baixo pra cima saltando junto, tentando erguer o alvo nos ares com você: Ataque de Taijutsu corpo a corpo, dano da arma + 2d4, e o alvo sobe 9m no ar junto com você. Lançado como Chain 2, o dado de dano sobe +2; como Chain 3, faz mais um ataque. Em ranks mais altos: +3 de custo e +2d4 de dano por rank acima de D.'},
  {nome:'Caça de Almas', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Cobre as armas de chakra antes de disparar (manter a concentração neste jutsu não custa Chakra). Enquanto durar, o primeiro Ataque de Arma à distância com uma arma Perfurante à distância em cada turno ganha +1 no intervalo de crítico. Em ranks mais altos: +3 de custo por rank acima de D; a partir do Rank B, +1 no intervalo de crítico; no Rank S, mais +1.'},
  {nome:'Marca da Alma', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'36m', duracao:'1 minuto',
    efeito:'Trava a mira mental e visual num alvo à vista: enquanto durar, a criatura marcada não se beneficia de cobertura de 3/4 nem de metade, e todo ataque de arma seu contra ela soma +1d10 de dano do tipo da arma. A marca dura até o alvo chegar a 0 PV ou você perder ele de vista (precisa relançar pra marcar de novo). Enquanto tiver um alvo marcado, qualquer ataque de arma seu contra outra criatura sofre -1d6 de dano. Em ranks mais altos: +3 de custo e +1 alvo marcável por rank acima de D.'},
  {nome:'Ruptura da Alma', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'6 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Mira na própria alma do oponente: prepara o golpe e o solta de uma vez. Ataque de Taijutsu corpo a corpo com desvantagem — acertando, causa 4d6 de dano Cortante e 1 rank de Sangramento. Lançado como Chain 2, +1 rank de Sangramento; como Chain 3, o dano vira 6d12.'},
  {nome:'Roubo de Alma', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Aprende a mirar no espírito do alvo, não no corpo: enquanto durar, a primeira vez em cada turno que um ataque de arma seu for crítico, dobra o dano do seu modificador de habilidade e ignora PV temporário. Em ranks mais altos: +3 de custo por rank acima de D, e +1 no intervalo de crítico do primeiro Ataque de Arma à distância de cada turno.'},
  {nome:'Lagoa Parada, Rio Correndo', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (4,5m de raio)', duracao:'Instantâneo',
    efeito:'Reação: segura a arma numa postura perpendicular perfeita, esperando o momento de golpear — quando uma criatura no alcance da sua arma fizer um ataque de arma ou de Taijutsu (até o início do seu próximo turno), você golpeia primeiro, puxando o ataque pra si. Ataque de Taijutsu contra ela — acertando, causa dano da arma e você vira o novo alvo do ataque dela.'},
  {nome:'Tempestade de Aço', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'Especial (28 Chakra)', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Combinação: você e os aliados a até 9m do alvo se preparam pra desencadear um temporal de aço. Cada participante faz, um de cada vez, um Ataque de Taijutsu contra o alvo, causando dano da arma + 3d8 no acerto. Depois que todos atacarem, o alvo sofre conforme os tipos de dano recebidos — pra cada tipo, testa o atributo ligado a ele (Força pra Concussão, Destreza pra Cortante, Constituição pra Perfurante) contra a maior CD de Taijutsu entre os atacantes, com -1 de penalidade por acerto daquele tipo: falhando na de Força, ganha 1 rank de Machucado; na de Destreza, 1 rank de Sangramento; na de Constituição, 1 rank de Lento. Em Combinação, o dado de dano sobe conforme o maior Carisma do grupo: d10 com +2 ou mais, d12 com +4 ou mais.'},
  {nome:'Lança Rompedora', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'4 Chakra', alcance:'Alcance da arma', duracao:'Instantâneo',
    efeito:'Estoca a lança carregada de chakra pra ferir carne ou quebrar aço: Ataque de Taijutsu corpo a corpo — acertando, escolhe entre causar dano da arma ou reduzir a Redução de Dano do alvo num valor igual a esse dano até o início do seu próximo turno. Lançado como Chain 2, faz as duas coisas sem precisar escolher; como Chain 3, faz mais um ataque.'},
  {nome:'Aura da Espada: Vermelha', tipo:'Bukijutsu', categoria:'Bukijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'1 minuto',

}

  try{ localStorage.setItem(CHAVE_LISTA, JSON.stringify(lista)); }catch(e){ /* aba anônima etc. */ }
}

/* ---------- Derivados ---------- */
function valorAtributo(p, id){ return p.atributos[id] ?? 10; }
function modFinal(p, id){ return modAtributo(valorAtributo(p, id)); }
function prof(p){ return bonusProficiencia(p.nivel); }

function pvMaximo(p){ return totalPorDado(p.recursos.dadoVida, p.nivel, modFinal(p,'constituicao')); }
function pvAtual(p){ return clamp(pvMaximo(p) + p.recursos.pvAtualDelta, 0, pvMaximo(p)); }
function chakraMaximo(p){ return totalPorDado(p.recursos.dadoChakra, p.nivel, modFinal(p,'constituicao')); }
function chakraAtual(p){ return clamp(chakraMaximo(p) + p.recursos.chakraAtualDelta, 0, chakraMaximo(p)); }

/* CA = 10 + mod Destreza + metade do bônus de proficiência (arredondado
   pra baixo) + bônus de armadura — fórmula própria do Naruto 5e, diferente
   do D&D 5e puro. Conferida no capítulo de Equipamento. */
function defesa(p){
  if(p.recursos.defesaManual != null && p.recursos.defesaManual !== '') return Number(p.recursos.defesaManual);
  return 10 + modFinal(p,'destreza') + metadeProfArredondada(p.nivel) + Number(p.recursos.bonusArmadura || 0);
}
/* Iniciativa também soma metade do bônus de proficiência — outra diferença
   confirmada em relação ao D&D 5e padrão (lá é só o mod de Destreza). */
function bonusIniciativa(p){ return modFinal(p,'destreza') + metadeProfArredondada(p.nivel); }

/* Perícia sem proficiência fica só no modificador (regra normal); teste de
   resistência sem proficiência ainda soma metade do bônus de proficiência
   (arredondado pra baixo) — regra própria do Naruto 5e, conferida no
   capítulo de Combate. */
function totalPericia(p, periciaId){
  const per = pericia(periciaId);
  const m = modFinal(p, per.atributo);
  return m + (p.periciasProficientes[periciaId] ? prof(p) : 0);
}
function totalSalvamento(p, atributoId){
  const m = modFinal(p, atributoId);
  return m + (p.salvamentosProficientes[atributoId] ? prof(p) : metadeProfArredondada(p.nivel));
}

function xpParaProximoNivel(p){
  const n = clamp(p.nivel, 1, 19);
  return XP_POR_NIVEL[n + 1];
}

/* CD e bônus de ataque de Jutsu — o tipo de Ninjutsu sempre usa
   Inteligência; Taijutsu e Genjutsu variam por classe (ainda não
   catalogada no Hub), por isso o atributo de cada um é escolhido na
   ficha em vez de fixo. */
function cdJutsu(p, atributoId){ return 8 + prof(p) + modFinal(p, atributoId); }
function ataqueJutsu(p, atributoId){ return prof(p) + modFinal(p, atributoId); }

function rolarD20(){ return 1 + Math.floor(Math.random() * 20); }
function rolarETotal(mod){ const d = rolarD20(); return {dado:d, total:d+mod}; }

  {id:'atributos', nome:'Atributos'},
  {id:'pericias', nome:'Perícias'},
  {id:'recursos', nome:'Recursos'},
  {id:'jutsu', nome:'Jutsu'},
  {id:'regras', nome:'Regras'},
  {id:'notas', nome:'Notas'},
];

function el(tag, attrs, ...filhos){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    /* null/undefined/false = "sem este atributo" (ex.: checked/selected
       condicionais) — setAttribute(k, null) marcaria o atributo como
       presente mesmo assim, deixando toda checkbox/opção "marcada". */
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for(const f of filhos.flat()){
    if(f == null) continue;
    e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
  }
  return e;
}

function campoTexto(rotulo, valor, onInput, tipo){
  const input = el('input', {type: tipo || 'text', value: valor ?? '', oninput: e => onInput(e.target.value)});
  return el('div', {class:'campo'}, el('label', {}, rotulo), input);
}
function campoArea(rotulo, valor, onInput){
  const t = el('textarea', {rows:3, oninput: e => onInput(e.target.value)});
  t.value = valor ?? '';
  return el('div', {class:'campo'}, el('label', {}, rotulo), t);
}
function campoSelect(rotulo, valor, opcoes, onChange){
  const s = el('select', {onchange: e => onChange(e.target.value)});
  for(const [v, txt] of opcoes) s.appendChild(el('option', {value:v, selected: v===valor ? 'selected' : null}, txt));
  return el('div', {class:'campo'}, el('label', {}, rotulo), s);
}

function renderAbas(){
  const barra = document.querySelector('.abas');
  barra.innerHTML = '';
  for(const a of ABAS){
    barra.appendChild(el('button', {
      'aria-current': a.id === abaAtual ? 'true' : 'false',
      onclick: () => { abaAtual = a.id; render(); },
    }, a.nome));
  }
}

/* Blocos reaproveitados entre a ficha normal (renderPerfil) e o Modo
   Guiado (renderGuiado) — mesma receita da decisão #134: um bloco só,
   chamado dos dois lugares, pra nunca ficar dessincronizado. */
function blocoCla(p){
  const opcoesCla = [['', '— outro (digitar abaixo) —'], ...CLAS.map(c => [c.id, c.nome])];
  const claEscolhido = cla(p.claId);
  const cCla = el('div', {class:'cartao'},
    el('h2', {}, 'Clã'),
    campoSelect('Clã', p.claId, opcoesCla, v => {
      p.claId = v;
      const c = cla(v);
      if(c) for(const id of c.pericias) p.periciasProficientes[id] = true;
      salvar(); render();
    }),
  );
  if(claEscolhido){
    cCla.appendChild(el('p', {class:'referencia'}, el('b',{},'Bônus recomendado: '), claEscolhido.bonus, ` · Deslocamento ${claEscolhido.velocidade}m`));
    cCla.appendChild(el('p', {class:'referencia'}, el('b',{},'Perícias já marcadas: '), claEscolhido.pericias.map(id => pericia(id).nome).join(' / ')));
    cCla.appendChild(el('p', {class:'referencia'}, claEscolhido.traco));
    cCla.appendChild(el('p', {class:'aviso'}, 'Bônus de atributo é referência — some você mesmo no campo de Atributos (mesma lógica do bônus de Antecedente).'));
  } else {
    cCla.appendChild(campoTexto('Nome do clã (fora do catálogo por enquanto)', p.cla, v => { p.cla = v; salvar(); }));
  }
  cCla.appendChild(el('p', {class:'aviso'}, `Catálogo com 15 dos ~38 clãs do Compêndio de Estudos da Tsunade — a extração do PDF parou em Hyūga. Os demais (Iburi em diante) entram quando o resto do livro chegar.`));
  return cCla;
}

function blocoClasse(p){
  const opcoesClasse = [['', '— outro (digitar abaixo) —'], ...CLASSES.map(c => [c.id, c.nome])];
  const classeEscolhida = classeDoCatalogo(p.classeId);
  const cClasse = el('div', {class:'cartao'},
    el('h2', {}, 'Classe'),
    campoSelect('Classe', p.classeId, opcoesClasse, v => {
      p.classeId = v;
      const c = classeDoCatalogo(v);
      if(c){
        p.recursos.dadoVida = c.dadoVida;
        p.recursos.dadoChakra = c.dadoChakra;
        if(c.periciaFixa) p.periciasProficientes[c.periciaFixa] = true;
        for(const at of c.resistencias) p.salvamentosProficientes[at] = true;
      }
      salvar(); render();
    }),
  );
  if(classeEscolhida){
    cClasse.appendChild(el('p', {class:'referencia'}, el('b',{},'Tier de Jutsu: '), classeEscolhida.tier,
      ` · Dado de Vida ${classeEscolhida.dadoVida} · Dado de Chakra ${classeEscolhida.dadoChakra}`));
    cClasse.appendChild(el('p', {class:'referencia'}, el('b',{},'Resistências: '), classeEscolhida.resistencias.map(id => atributo(id).nome).join(' / '), ' (já marcadas)'));
    cClasse.appendChild(el('p', {class:'referencia'},
      classeEscolhida.periciaFixa ? [el('b',{},'Perícia fixa: '), pericia(classeEscolhida.periciaFixa).nome, ' (já marcada). '] : el('b',{},'Sem perícia fixa. '),
      classeEscolhida.periciasEscolha));
    cClasse.appendChild(el('p', {class:'referencia'}, el('b',{},'Proficiências: '), classeEscolhida.proficiencias));
    cClasse.appendChild(el('p', {class:'referencia'}, el('b',{},`${classeEscolhida.subclasses.nome}: `), classeEscolhida.subclasses.opcoes.join(' / '), ' — só os nomes por enquanto, mecânica de cada uma é fatia futura.'));
    cClasse.appendChild(el('p', {class:'referencia'}, classeEscolhida.traco));
  } else {
    cClasse.appendChild(campoTexto('Nome da classe (fora do catálogo por enquanto)', p.classe, v => { p.classe = v; salvar(); }));
  }
  cClasse.appendChild(el('p', {class:'aviso'}, 'As 11 classes do Compêndio de Observação do Orochimaru estão catalogadas. Mecânica de cada opção de subclasse (as "Voto de Genjutsu", "Técnica de Batedor" etc.) ainda é fatia futura — por enquanto só os nomes.'));
  return cClasse;
}

function blocoAntecedente(p){
  const opcoesAntecedente = [['', '— nenhum —'], ...ANTECEDENTES.map(a => [a.id, a.nome])];
  const ant = antecedente(p.antecedenteId);
  const c2 = el('div', {class:'cartao'},
    el('h2', {}, 'Antecedente'),
    campoSelect('Antecedente', p.antecedenteId, opcoesAntecedente, v => { p.antecedenteId = v; salvar(); render(); }),
  );
  if(ant){
    c2.appendChild(el('p', {class:'referencia'},
      el('b', {}, 'Perícias: '), ant.pericias.map(id => pericia(id).nome).join(' / '),
      ant.escolhaDupla ? ' (escolha 2)' : (ant.escolhaSegunda ? ' (Acrobacia + escolha 1)' : (ant.variantePersuasao ? ' (ou Persuasão no lugar de Enganação)' : ''))));
    c2.appendChild(el('p', {class:'referencia'}, ant.traco));
    c2.appendChild(campoSelect('Bônus do antecedente: +1 em', p.antecedenteBonusAtributo,
      [['', '— escolher —'], ...ATRIBUTOS.map(a => [a.id, a.nome + (ant.sugestao.includes(a.id) ? ' (recomendado)' : '')])],
      v => { p.antecedenteBonusAtributo = v; salvar(); render(); }));
    c2.appendChild(el('p', {class:'aviso'}, 'Ou, no lugar do bônus de atributo, um Talento — catálogo ainda fora do Hub; anote a escolha em Notas.'));
  }
  return c2;
}

function renderPerfil(p){
  const c1 = el('div', {class:'cartao'},

    ),
    el('div', {class:'grade g3'},
      campoTexto('Nível (1–20)', p.nivel, v => { p.nivel = clamp(Number(v)||1,1,20); salvar(); render(); }, 'number'),
      campoTexto('XP atual', p.xp, v => { p.xp = Math.max(0, Number(v)||0); salvar(); render(); }, 'number'),
      el('div', {class:'campo'}, el('label',{}, 'XP p/ o próximo nível'), el('p', {}, String(xpParaProximoNivel(p)))),
    ),
  );

  const cCla = blocoCla(p);
  const cClasse = blocoClasse(p);
  const c2 = blocoAntecedente(p);

  const c3 = el('div', {class:'cartao'},
    el('h2', {}, 'Vontade de Fogo'),
    el('p', {class:'referencia'}, 'Recurso de até 3 pontos por sessão. Gasta 1 para: vantagem ou +5 num ataque/teste/resistência, uma reação extra, sucesso automático numa resistência contra a morte, alterar levemente a cena a seu favor, ou repassar o ponto a outro jogador.'),
    el('div', {class:'linha'},
      el('button', {onclick: () => { p.vontadeFogo = clamp(p.vontadeFogo - 1, 0, 3); salvar(); render(); }}, '−'),
      el('span', {class:'estat'}, el('span',{class:'num'}, String(p.vontadeFogo)), el('span',{class:'rot'},'Vontade de Fogo')),
      el('button', {onclick: () => { p.vontadeFogo = clamp(p.vontadeFogo + 1, 0, 3); salvar(); render(); }}, '+'),
    ),
  );

  const c4 = el('div', {class:'cartao'},
    el('h2', {}, 'Ambição, Drive, Metas e Medos'),
    campoArea('Ambição (o grande objetivo)', p.ambicao, v => { p.ambicao = v; salvar(); }),
    campoArea('Drive (o que empurra você)', p.drive, v => { p.drive = v; salvar(); }),
    campoArea('Metas atuais (curto prazo)', p.metas, v => { p.metas = v; salvar(); }),
    campoArea('Medos', p.medos, v => { p.medos = v; salvar(); }),
  );

  return [c1, cCla, cClasse, c2, c3, c4];
}

function renderAtributos(p){
  const grade = el('div', {class:'grade g3'});
  for(const a of ATRIBUTOS){
    const valor = valorAtributo(p, a.id);
    const mod = modAtributo(valor);
    const wrap = el('div', {class:'cartao'},
      el('div', {class:'estat'},
        el('span', {class:'rot'}, a.nome),
        el('input', {type:'number', style:'width:70px;text-align:center;font-size:20px', value:valor,
          oninput: e => { p.atributos[a.id] = clamp(Number(e.target.value)||10, 1, 30); salvar(); render(); }}),
        el('span', {class:'mod'}, fmtMod(mod)),
      ),
    );
    grade.appendChild(wrap);
  }

  const salvamentos = el('div', {class:'cartao'},
    el('h2', {}, 'Testes de Resistência'),
    el('p', {class:'aviso'}, 'Sem proficiência ainda soma metade do bônus de proficiência (arredondado pra baixo) — diferente do D&D 5e puro.'),
    el('table', {class:'lista'},
      el('thead', {}, el('tr', {}, el('th',{},'Atributo'), el('th',{},'Proficiente'), el('th',{},'Total'), el('th',{},''))),
      el('tbody', {}, ...ATRIBUTOS.map(a => {
        const total = totalSalvamento(p, a.id);
        const resultado = el('span', {class:'rolagem'}, '');
        return el('tr', {},
          el('td', {}, a.nome),
          el('td', {}, el('input', {type:'checkbox', class:'check', checked: !!p.salvamentosProficientes[a.id] || null,
            onchange: e => { p.salvamentosProficientes[a.id] = e.target.checked; salvar(); render(); }})),
          el('td', {}, fmtMod(total)),
          el('td', {},
            el('button', {onclick: () => { const r = rolarETotal(total); resultado.textContent = `d20(${r.dado}) = ${fmtMod(r.total).replace('+','')}`; }}, 'Rolar'),
            resultado,
          ),
        );
      })),
    ),
  );

  const info = el('div', {class:'cartao'},
    el('h2', {}, 'Geração dos atributos'),
    el('p', {class:'referencia'},
      'Array padrão: 15, 14, 13, 12, 11, 10 — mesma distribuição do D&D 5e. ',
      'Ou role 4d6 (descarte o menor) seis vezes. Ou compra de pontos: 30 pontos, custo 8→0, 9→1, 10→2, 11→3, 12→4, 13→5, 14→7, teto de 15 antes de bônus de clã/antecedente.'),
  );

  return [el('div', {class:'grade g6', style:'margin-bottom:14px'}, ...grade.children), salvamentos, info];
}

        resultado,
      ),

  });
  return [el('div', {class:'cartao'},
    el('h2', {}, 'Perícias'),

    el('table', {class:'lista'},
      el('thead', {}, el('tr', {}, el('th',{},'Perícia'), el('th',{},'Atr.'), el('th',{},'Prof.'), el('th',{},'Total'), el('th',{},''))),

    ),

}

function renderRecursos(p){
  const pv = pvMaximo(p), pvA = pvAtual(p);
  const ck = chakraMaximo(p), ckA = chakraAtual(p);

  const cartaoRecurso = (titulo, atual, maximo, temp, onDelta, onTemp) => el('div', {class:'cartao'},
    el('h2', {}, titulo),
    el('div', {class:'linha'},
      el('button', {onclick: () => onDelta(-1)}, '−1'),
      el('div', {class:'estat cresce'}, el('span',{class:'num'}, `${atual} / ${maximo}`), el('span',{class:'rot'}, 'atual / máximo')),
      el('button', {onclick: () => onDelta(1)}, '+1'),
    ),
    el('div', {class:'linha', style:'margin-top:8px'},
      el('div', {class:'campo cresce'}, el('label',{},'Dano/cura (+ cura, − dano)'),
        (() => { const i = el('input', {type:'number', value:0}); i._ref = true;
          return el('div', {class:'linha'}, i, el('button', {onclick: () => { onDelta(Number(i.value)||0); i.value = 0; }}, 'Aplicar')); })()),
      el('div', {class:'campo', style:'width:110px'}, el('label',{},'Temporário'),
        el('input', {type:'number', value:temp, oninput: e => onTemp(Number(e.target.value)||0)})),
    ),
  );

  const recPV = cartaoRecurso('Pontos de Vida (PV)', pvA, pv, p.recursos.pvTemp,
    (delta) => { p.recursos.pvAtualDelta = clamp(p.recursos.pvAtualDelta + delta, -pv, 0); salvar(); render(); },
    (v) => { p.recursos.pvTemp = Math.max(0, v); salvar(); render(); });
  const recChakra = cartaoRecurso('Pontos de Chakra', ckA, ck, p.recursos.chakraTemp,
    (delta) => { p.recursos.chakraAtualDelta = clamp(p.recursos.chakraAtualDelta + delta, -ck, 0); salvar(); render(); },
    (v) => { p.recursos.chakraTemp = Math.max(0, v); salvar(); render(); });

  const dados = el('div', {class:'cartao'},
    el('h2', {}, 'Dados de recurso'),
    el('p', {class:'aviso'}, 'Preenchidos sozinhos quando a Classe está no catálogo (aba Perfil); editáveis à mão pras classes que ainda não entraram.'),
    el('div', {class:'grade g2'},
      campoSelect('Dado de Vida', p.recursos.dadoVida, DADOS.map(d => [d,d]), v => { p.recursos.dadoVida = v; salvar(); render(); }),
      campoSelect('Dado de Chakra', p.recursos.dadoChakra, DADOS.map(d => [d,d]), v => { p.recursos.dadoChakra = v; salvar(); render(); }),
    ),
  );

  const defesaCartao = el('div', {class:'cartao'},
    el('h2', {}, 'Defesa e Iniciativa'),
    el('div', {class:'grade g3'},
      el('div', {class:'estat'}, el('span',{class:'num'}, String(defesa(p))), el('span',{class:'rot'},'Defesa (CA)')),
      el('div', {class:'estat'}, el('span',{class:'num'}, fmtMod(bonusIniciativa(p))), el('span',{class:'rot'},'Iniciativa')),
      el('div', {class:'estat'}, el('span',{class:'num'}, String(prof(p))), el('span',{class:'rot'},'Bônus de Proficiência')),
    ),
    el('div', {class:'grade g2', style:'margin-top:10px'},
      campoTexto('Bônus de armadura (manual)', p.recursos.bonusArmadura, v => { p.recursos.bonusArmadura = Number(v)||0; salvar(); render(); }, 'number'),
      campoTexto('Defesa manual (sobrepõe o cálculo, opcional)', p.recursos.defesaManual ?? '', v => { p.recursos.defesaManual = v === '' ? null : Number(v); salvar(); render(); }, 'number'),
    ),
    el('p', {class:'aviso'}, 'Defesa = 10 + mod. Destreza + metade do bônus de proficiência (arred. p/ baixo) + armadura. Vestir armadura sem proficiência dá desvantagem em Força/Destreza e em testes de conjuração de Jutsu.'),
  );

  const ryo = el('div', {class:'cartao'},
    el('h2', {}, 'Carteira'),
    campoTexto('Ryo', p.recursos.ryo, v => { p.recursos.ryo = Math.max(0, Number(v)||0); salvar(); render(); }, 'number'),
    el('p', {class:'aviso'}, 'Moeda única do Naruto 5e (≈ 1 Ryo = 1 peça de ouro do D&D 5e).'),
  );

  return [recPV, recChakra, defesaCartao, dados, ryo];
}

    el('td', {}, el('input', {value:j.nome, oninput: e => { j.nome = e.target.value; salvar(); }})),
    el('td', {}, el('select', {onchange: e => { j.tipo = e.target.value; salvar(); }},
      ...['Ninjutsu','Taijutsu','Genjutsu','Bukijutsu'].map(t => el('option', {value:t, selected: t===j.tipo?'selected':null}, t)))),
    el('td', {}, el('select', {onchange: e => { j.rank = e.target.value; salvar(); }},
      ...RANKS_JUTSU.map(r => el('option', {value:r.rank, selected: r.rank===j.rank?'selected':null}, r.rank)))),
    el('td', {}, el('input', {value:j.notas||'', oninput: e => { j.notas = e.target.value; salvar(); }})),
    el('td', {}, el('button', {class:'perigo', onclick: () => { p.jutsus.splice(i,1); salvar(); render(); }}, '×')),

  const info = el('div', {class:'cartao'},
    el('h2', {}, 'CD e ataque de Jutsu'),

    el('div', {class:'grade g2'},
      el('div', {class:'estat'}, el('span',{class:'rot'},'Ninjutsu (Inteligência)'),
        el('span', {class:'num'}, `CD ${cdJutsu(p,'inteligencia')} · +${ataqueJutsu(p,'inteligencia')}`)),
      el('div', {class:'estat'}, el('span',{class:'rot'},'Taijutsu'),

    ),
    el('div', {class:'grade g2', style:'margin-top:10px'},
      campoSelect('Atributo de Taijutsu da sua classe', p.tipoTaijutsu, [['forca','Força'],['destreza','Destreza']], v => { p.tipoTaijutsu = v; salvar(); render(); }),
      campoSelect('Atributo de Genjutsu da sua classe', p.tipoGenjutsu, [['sabedoria','Sabedoria'],['carisma','Carisma']], v => { p.tipoGenjutsu = v; salvar(); render(); }),
    ),
    el('div', {class:'estat', style:'margin-top:10px; max-width:260px'}, el('span',{class:'rot'},'Genjutsu'),

  const natureza = el('div', {class:'cartao'},
    el('h2', {}, 'Natureza elemental'),
    campoSelect('Natureza principal', p.naturezaPrincipal, [['', '— nenhuma —'], ...CICLO_ELEMENTOS.map(n => [n,n])], v => { p.naturezaPrincipal = v; salvar(); render(); }),
  );

  const selCatalogo = el('select', {},
    el('option', {value:''}, '— escolher do catálogo —'),
    ...JUTSU_CATALOGO.map(j => el('option', {value:j.nome}, `${j.nome} (${j.rank}-Rank, ${j.custo})`)),
  );
  const lista = el('div', {class:'cartao'},
    el('h2', {}, 'Jutsu conhecidos'),
    el('p', {class:'aviso'}, `Catálogo do Hub com ${JUTSU_CATALOGO.length} de ~1400 jutsu do Compêndio de Jutsu do Jiraiya (Ninjutsu Não-Elemental, as 5 Naturezas elementais, Genjutsu e Taijutsu 100% completos; Bukijutsu em andamento, falta Invocação) — vai crescendo aos poucos. Pra qualquer jutsu ainda fora da lista, cadastre à mão com "+ Jutsu em branco".`),
    el('table', {class:'lista'},
      el('thead', {}, el('tr', {}, el('th',{},'Nome'), el('th',{},'Tipo'), el('th',{},'Rank'), el('th',{},'Notas'), el('th',{},''))),
      el('tbody', {}, ...linhas),
    ),
    el('div', {class:'linha', style:'margin-top:10px'},
      selCatalogo,
      el('button', {class:'destaque', onclick: () => {
        const j = jutsuDoCatalogo(selCatalogo.value);
        if(!j) return;
