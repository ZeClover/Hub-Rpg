  {nome:'Calma Avassaladora', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Instantâneo',
    efeito:'Todos numa esfera de 9m de raio ao seu redor testam Carisma: na falha, perdem toda vontade de lutar por 4d8 minutos (voltando a ficar hostis, com a raiva reprimida somada, se forem atacados, sofrerem dano, ou o tempo passar); no sucesso, continuam agressivos e ficam imunes a esse Genjutsu por 24 horas.'},
  {nome:'Psiônica: Raio!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (linha de 18m)', duracao:'Instantâneo',
    efeito:'Linha de 18m por 1,5m de largura a partir de você; alvos à sua escolha testam Inteligência: sucesso resiste; falha sofre 2d10 de dano Psíquico e 1 rank de Confusão; falha crítica sofre 3d10 de dano Psíquico e 2 ranks de Confusão. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de C.'},
  {nome:'Psiônica: Ofuscação Sombria!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Instantâneo',
    efeito:'Onda de choque num raio de 9m ao seu redor; alvos à sua escolha testam Inteligência: sucesso resiste; falha sofre 3d8 de dano Psíquico e fica Ofuscado; falha crítica sofre 5d8 de dano Psíquico e ganha 3 ranks de Ofuscado. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de C.'},
  {nome:'Psiônica: Pulso Sombrio!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Cone de 9m a partir de você; alvos testam Inteligência: sucesso resiste; falha sofre 4d6 de dano Psíquico e, no início do turno seguinte, rola 1d8 — em 1 ou 2, o próximo jutsu que tentar lançar falha (mas ainda gasta o Chakra normalmente); falha crítica sofre 6d6 de dano Psíquico e o próximo jutsu falha garantido, gastando o dobro do Chakra. Em ranks mais altos: +3 de custo e +1,5m no alcance do cone por rank acima de C.'},
  {nome:'Psiônica: Esmagar Mente!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu à distância em até 18m: acerto causa 2d10 de dano Psíquico e o alvo testa Inteligência: sucesso crítico resiste; sucesso dá -1 de Defesa até o fim do turno seguinte; falha dá -2 de Defesa até o fim do turno seguinte; falha crítica dá -2 de Defesa, 2 ranks de Contundido e sem Reações até o fim do turno seguinte. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Psiônica: Pausa!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'1 rodada',
    efeito:'Alvo em até 18m testa Inteligência: sucesso crítico resiste e fica imune por 1d4 dos próprios turnos; sucesso resiste; falha o atrasa — decide suas ações no próprio turno, mas só consegue executá-las no fim do turno da criatura seguinte na iniciativa (se o alvo dessas ações saiu do alcance até então, elas falham); falha crítica é igual, mas só consegue agir na contagem de iniciativa 0. Em ranks mais altos: +3 de custo por rank acima de C; no Rank A, +1 alvo.'},
  {nome:'Psiônica: Corte Psíquico!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'27m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu à distância em até 27m (faixa de crítico +1): acerto causa 3d6 + mod. de Genjutsu de dano Psíquico e o alvo testa Inteligência (um acerto crítico já aplica os efeitos da falha crítica, resistência ou não): sucesso crítico resiste; sucesso dá 1 rank de Confusão até o início do turno seguinte; falha dá 1 rank de Confusão até o fim do turno seguinte; falha crítica dá 1 rank de Confusão, Ofuscado e Contundido. Em ranks mais altos: +3 de custo, +1 alvo e +1d6 de dano por rank acima de C.'},
  {nome:'Rabenda: Redução Enigmática', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'5 Chakra', alcance:'Pessoal (cubo de 7,5m)', duracao:'1 minuto',
    efeito:'Esporos de flores de Rabenda venenosas enchem um cubo de 7,5m a partir de você; quem começar o turno na área testa Carisma: sucesso crítico resiste e fica imune enquanto durar; sucesso resiste à maior parte do efeito; falha faz com que, toda vez que lançar um jutsu dentro da área, sofra -1 em testes, resistências e ataques ligados ao atributo usado pra lançar (acumula até -3; pode gastar a ação pra refazer a resistência e encerrar); falha crítica é igual, mas o limite sobe pra -5. Em ranks mais altos: +3 de custo por rank acima de C; do Rank B em diante, +3m no tamanho do cubo.'},
  {nome:'Rabenda: Tempestade Enigmática', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'9m (raio de 3m)', duracao:'Concentração, até 1 minuto',
    efeito:'Esporos de flores de Rabenda enchem um raio de 3m num ponto a até 9m (não pode repetir até o fim do seu turno seguinte depois que este acabar); quem começar o turno na área testa Carisma (você pode mover a nuvem até 9m por ação em cada turno seu): sucesso crítico resiste e fica imune a novas tentativas até o fim do seu próximo turno; sucesso resiste à maior parte do efeito; falha fica Lento enquanto durar e ganha 1 rank de Contundido no início de cada turno que passar na área; falha crítica ganha 2 ranks de Contundido em vez de 1.'},
  {nome:'Distorção do Sino', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Amarra sinos em armas arremessadas em até 3 pontos a até 18m; quem ouvir o toque num raio de 6m de cada ponto vê alucinações à sua escolha (múltiplas imagens suas, aliados parecendo você etc.) e testa Inteligência ou fica com desvantagem em todos os ataques (e quem atacar esse alvo tem vantagem) enquanto durar.'},
  {nome:'Monstros das Sombras', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 36m testa Sabedoria: sucesso resiste; falha fica Enfurecido, vendo os próprios aliados como monstros sombrios horríveis (se causar dano a um aliado, testa Sabedoria de novo — sucesso encerra o Enfurecido); falha crítica é igual, mas você e até 3 outras criaturas à sua escolha passam a parecer aliados dele enquanto durar (o teste pra encerrar, se ferir um "aliado", vem em desvantagem). Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Sono Profundo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'8 horas',
    efeito:'Escolhe qualquer número de criaturas dormindo que perceba num raio de 18m (quem não precisa dormir não pode ser alvo); cada uma testa Sabedoria: na falha, não se beneficia de descansos pela duração, e ao despertar de qualquer descanso, ganha 2 ranks de Exaustão e fica Desmoralizado enquanto tiver qualquer rank de Exaustão vindo deste jutsu.'},
  {nome:'Canção da Coragem', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Concentração, até 10 minutos',
    efeito:'Canta uma melodia inspiradora num raio de 9m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Quem começar o turno no alcance fica imune a Medo até o início do turno seguinte, nunca faz resistências em desvantagem contra jutsu hostil, e ignora penalidades nos próprios testes vindas de jutsu ou efeitos hostis. Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de C.'},
  {nome:'Canção da Dor', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Concentração, até 10 minutos',
    efeito:'Canta uma melodia de dor num raio de 9m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Quem começar o turno no alcance e tentar lançar um jutsu que exija movimento testa Inteligência ou sente uma dor muscular tão forte que perde o jutsu tentado. Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de C.'},
  {nome:'Canção do Alívio', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Concentração, até 10 minutos',
    efeito:'Canta uma melodia de cura num raio de 9m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Aliados à sua escolha no alcance ganham 1d4 + mod. de Genjutsu de PV temporário no início de cada um dos seus turnos (o PV temporário dura até 1 minuto depois do jutsu acabar). Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de C.'},
  {nome:'Sugestão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'9m', duracao:'Especial',
    efeito:'Sugere uma linha de ação (uma ou duas frases, que precisa parecer razoável — pedir algo obviamente nocivo encerra o jutsu) a um alvo que ouça e entenda você em até 9m (imune se não puder ser Enfeitiçado); ele testa Sabedoria: sucesso crítico resiste e percebe a tentativa; sucesso resiste; falha faz seguir a sugestão na hora, por até 1 minuto ou até completar a sugestão (o que vier primeiro, ou até ela virar algo obviamente nocivo); falha crítica é igual, mas a duração sobe pra 1 hora.'},
  {nome:'Escudo de Pensamentos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Toque', duracao:'8 horas',
    efeito:'Vela a mente de um alvo tocado por 8 horas: não pode ser lida ou detectada, ninguém consegue se comunicar telepaticamente com ele sem permissão, e ele tem vantagem em resistências contra efeitos que decidiriam se está mentindo. Também ganha vantagem na primeira resistência de Inteligência ou Sabedoria contra um Genjutsu — seja o resultado qual for, o jutsu termina nele depois dessa resistência.'},
  {nome:'Luz Verdadeira', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Seu corpo emite um brilho dourado, luz plena num raio de 9m: qualquer criatura ou objeto invisível, transformado ou escondido por um Genjutsu de rank C ou menor é revelado na hora, e qualquer Genjutsu visual de rank C ou menor a até 9m de você fica visivelmente fraco e transparente (quem seria revelado pode, como Reação, tentar um teste de Sabedoria (Ilusão) em desvantagem contra sua CD pra manter a ilusão intacta). Um inimigo que tente lançar um Genjutsu visual de rank C ou menor dentro da luz testa Sabedoria ou qualquer resistência contra esse Genjutsu passa a ser feita com vantagem. Em ranks mais altos: +3 de custo por rank acima de C, e passa a afetar jutsu até o rank em que for lançado.'},
  {nome:'Zona de Verdade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'9m (esfera de 4,5m de raio)', duracao:'Concentração, até 10 minutos',
    efeito:'Cria uma zona contra mentiras numa esfera de 4,5m de raio, centrada num ponto a até 9m; quem entrar na área pela primeira vez no turno ou começar o turno lá testa Carisma (você sempre sabe quem passou ou falhou): sucesso crítico resiste, mas você não sabe se passou ou falhou; sucesso resiste em parte, com -1d4 em testes de Enganação; falha acha muito difícil mentir de propósito, com -1d6 em testes de Enganação; falha crítica impede o alvo de falar caso fosse mentir.'},
  {nome:'Bênção', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'10 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Aliados num raio de 9m ganham +1d4 opcional em qualquer ataque, resistência ou teste de perícia enquanto durar (o custo deste jutsu nunca pode cair abaixo de 1, por nenhum meio). Em ranks mais altos: +3 de custo e +3m de raio por rank acima de B; no Rank S, o dado vira 1d6.'},
  {nome:'Mundo Caótico', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'18m (cubo de 7,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Joga poeira colorida no ar dizendo frases desconexas: um cubo de 7,5m a até 18m se enche de luzes, sons e cheiros confusos. Quem começar o turno lá dentro testa Inteligência: sucesso crítico resiste e percebe que foi alvo de algo ilusório; sucesso resiste; falha fica Cego, Surdo e Derrubado, sem conseguir se levantar ou se livrar dessas condições enquanto estiver na área (tudo passa automaticamente ao sair dela ou o jutsu acabar); falha crítica é igual, mas se sair da área sem passar na resistência, continua tendo que refazê-la no fim de cada turno pra realmente se livrar. Em ranks mais altos: +3 de custo, +4,5m de alcance e +1,5m no tamanho do cubo por rank acima de B.'},
  {nome:'Comando do Encontrado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'27m', duracao:'10 minutos',
    efeito:'Dá uma ordem de até 25 palavras a um alvo em até 27m, citando o nome dele, que testa Carisma se te ouvir (se a ordem for entrar em terreno perigoso ou se ferir, refaz a resistência toda vez que sofrer dano ou uma condição, encerrando no sucesso ou ao completar a ordem): sucesso resiste; falha fica Enfeitiçado e tenta cumprir a ordem por qualquer meio necessário enquanto durar; falha crítica é igual, mas racionaliza a ordem como benéfica pra ambos — no fim da duração, perde a vontade de terminar a tarefa. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de B.'},
  {nome:'Compulsão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Quem ouvir você em até 18m testa Sabedoria (sucesso automático se for imune a Enfeitiçado): sucesso resiste; falha permite que, como Ação Bônus a cada turno seu, você aponte uma direção — o alvo é forçado a gastar o máximo de deslocamento possível se movendo pra lá no turno seguinte (pode agir antes de se mover, e refaz a resistência depois pra tentar encerrar); não pode ser forçado a entrar em terreno obviamente perigoso (mas isso provoca ataque de oportunidade); falha crítica é igual, mas o alvo PODE ser forçado a entrar em terreno perigoso.'},
  {nome:'Confusão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'27m (esfera de 3m)', duracao:'Concentração, até 1 minuto',
    efeito:'Todos numa esfera de 3m de raio a até 27m testam Sabedoria: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha tira as Reações e faz rolar 1d10 no início de cada turno pra determinar o comportamento daquele turno (agir ao acaso, atacar quem estiver perto, ficar parado etc., a critério do mestre); falha crítica é igual, mas rola 1d8 em vez de 1d10 (tabela mais instável).'},
  {nome:'Campo de Lótus Negro', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'Especial', alcance:'Especial', duracao:'Especial',
    efeito:'Planta uma flor de lótus negra venenosa infundida com chakra em solo fértil (a flor tem 10 PV e Defesa 15; se for destruída, o jutsu acaba e precisa ser relançado — mesma busca da versão comum: quem procurar com Natureza, Medicina ou Sobrevivência testa contra sua CD, e sem proficiência é Sabedoria (Percepção) com -5, ou -5 pra todos se estiver entre outras lótus). Com 11 Chakra: como ação, por 10 minutos enquanto estiver a até 30m da flor, ela solta uma nuvem negra venenosa e inodora — quem você escolher a até 18m testa Inteligência no início de cada turno ou fica Envenenado por 1 hora, sofrendo -2 em ataque, dano, resistências e testes de perícia, e sendo pego desprevenido pelos seus Genjutsu. Com 22 Chakra: o alcance de ativação sobe pra 75m da flor e a área afetada pra 36m ao redor dela. Com 33 Chakra: a penalidade vira -5, e o dano Psíquico dos seus Genjutsu nele ganha +2× seu modificador de Genjutsu a mais (soma ao que já for somado). Com 44 Chakra: a até 75m da flor, seus Genjutsu não custam Chakra pra manter concentração por até 1 hora, e qualquer Genjutsu seu que exija concentração passa a durar 1 hora enquanto a flor estiver viva e você dentro desse alcance.'},
  {nome:'Ambiente Hostil', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'27m (cubo de 18m)', duracao:'Concentração, 10 minutos',
    efeito:'Cubo de 18m a até 27m onde o ambiente parece ganhar vida hostil (não custa Chakra pra manter). Quem começar o turno ali ou entrar pela primeira vez testa Sabedoria: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha vê o ambiente se voltar contra si, agarrando-o: deslocamento cai a 0 e perde o uso de uma das mãos (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas perde o uso das duas mãos.'},
  {nome:'Paralisia Sem Esforço', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Uma imagem ilusória agarra e prende um alvo em até 27m (sem efeito em mortos-vivos, construtos, plantas ou demônios), que testa Sabedoria: sucesso resiste; falha fica Atordoado enquanto durar, refazendo a resistência no fim de cada turno ou ao sofrer dano pra encerrar; falha crítica é igual, mas só refaz a resistência ao sofrer dano, não a cada turno.'},
  {nome:'Trevas Crescentes', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'45m (esfera de 18m de raio)', duracao:'Concentração, até 1 hora',
    efeito:'Sombras ameaçadoras tomam uma esfera de 18m de raio a até 45m: luz plena e fraca somem diante dos olhos de quem estiver lá, e qualquer jutsu ou efeito de rank C ou menor que criaria luz não produz luz visível na área. Você e até 3 criaturas à sua escolha são imunes e contam como ocultos pela escuridão contra quem estiver sob o efeito. Como ação, qualquer um pode testar Sabedoria pra enxergar através da escuridão até o início do turno seguinte. O jutsu acaba na hora se alguém lançar um jutsu de rank B ou maior que produza luz dentro da área.'},
  {nome:'Inimigos por Toda Parte', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 36m testa Inteligência (sucesso automático se for imune a Medo): sucesso resiste; falha fica Enfurecido enquanto durar, testando Carisma no fim de cada turno pra encerrar; falha crítica é igual, mas também sofre 4d6 de dano Psíquico no fim de cada turno (sem encerrar o jutsu).'},
  {nome:'Olhos da Verdade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Um vidro ou cristal tocado passa a mostrar o que aliados num raio de 18m ao seu redor estão vendo por 1 minuto; se algum deles enxergar através de uma ilusão ou tiver sentidos especiais (Visão Verdadeira, Visão de Chakra), você também vê isso pelo vidro ou cristal.'},
  {nome:'Medo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (cubo de 4,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Projeta os piores medos de cada um num cubo de 4,5m a partir de você; alvos testam Sabedoria: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha larga o que estiver segurando e ganha 2 ranks de Medo enquanto durar, gastando o máximo de ações possível pra fugir de você no início de cada turno (se não tiver pra onde ir, fica parado); refaz a resistência no fim de cada turno pra encerrar; falha crítica dá 4 ranks de Medo em vez de 2. Em ranks mais altos: +3 de custo e +3m no tamanho do cubo por rank acima de B.'},
  {nome:'Não-Me-Esqueças', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'Toque', duracao:'Especial',
    efeito:'Libera uma flor venenosa infundida com chakra: todo mundo (menos você) a até 1,5m dela é atingido por um pólen potente e inodoro, testando primeiro Constituição e depois Inteligência: na falha de Constituição, fica Envenenado por 1 hora e faz a próxima resistência em desvantagem; na falha de Inteligência, perde a lembrança nítida das últimas 24 horas por 1 hora (a memória continua lá, só embaçada — tentar lembrar exige um teste de Inteligência em desvantagem). Em ranks mais altos: +3 de custo por rank acima de B; no Rank A, uma falha na resistência deixa a memória embaçada permanentemente, até ser Dissipada.'},
  {nome:'Frenesi: Lâminas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Manifesta 4 lâminas ilusórias flutuantes ao seu redor: sempre que você causa dano com um Genjutsu da família "Frenesi", uma delas dispara sozinha num Ataque de Genjutsu à distância com vantagem, causando 4d8 de dano Psíquico no acerto. Como Ação Bônus, também pode comandar uma lâmina pra atacar: Ataque de Genjutsu à distância causando 5d8 de dano Psíquico no acerto. Quem sofrer dano desse jutsu testa Inteligência: sucesso resiste aos efeitos secundários; falha cai Derrubado e fica Lento até o fim do turno seguinte; falha crítica é igual, mas o Lento dura enquanto o jutsu durar.'},
  {nome:'Frenesi: Explosão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu à distância em até 18m: acerto causa 8d6 de dano Psíquico e o alvo testa Inteligência: sucesso resiste aos efeitos secundários; falha cai Derrubado e fica Enfurecido; falha crítica cai Derrubado e ganha 2 ranks de Enfurecido.'},
  {nome:'Frenesi: Gargalhada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (9m)', duracao:'Instantâneo',
    efeito:'Onda que atravessa a mente de todos num raio de 9m ao seu redor, você incluído (mas você testa com vantagem); cada um testa Inteligência: sucesso crítico resiste; sucesso fica Cego até o fim do turno atual; falha sofre 4d12 de dano Psíquico e fica Cego por 1 minuto (refazendo a resistência no fim de cada turno pra encerrar); falha crítica sofre 6d12 de dano Psíquico e fica Cego, Surdo e sem olfato ou paladar, rindo feito louco por 1 minuto (refazendo a resistência com -1d4 no fim de cada turno pra encerrar).'},
  {nome:'Invisibilidade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Você ou um alvo tocado fica Invisível até o jutsu acabar — tudo que estiver vestindo ou carregando também fica invisível enquanto estiver com ele.'},
  {nome:'Pensamentos Aguçados', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo tocado ganha +1 na faixa de crítico em Ataques de Genjutsu enquanto durar, e ao tirar um crítico com Ataque de Genjutsu, soma mais 2 dados de dano ao rolar. Em ranks mais altos: +3 de custo e +1 na faixa de crítico por rank acima de B; no Rank S, os dados extras no crítico sobem pra 5.'},
  {nome:'Uivo do Labirinto', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (18m)', duracao:'1 rodada',
    efeito:'Uivo de fera faminta; inimigos que ouvirem você em até 18m testam Sabedoria: na falha, acreditam estar num labirinto sendo atacados por uma fera selvagem — no próprio turno, precisam escolher entre enfrentar a fera (sofrendo 8d6 de dano Psíquico, encerrando o jutsu) ou se defender (caindo Derrubado e Atordoado até o início do turno seguinte). Em ranks mais altos: +3 de custo e +2d6 de dano por rank acima de B.'},
  {nome:'Sombras Enlouquecedoras', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'45m (esfera de 18m de raio)', duracao:'Concentração, até 1 minuto',
    efeito:'Escuridão ilusória enche uma esfera de 18m de raio a até 45m até o jutsu acabar (Visão no Escuro ou de Chakra não atravessam); gritos e risadas ecoam lá dentro. Quem começar o turno na esfera testa Carisma: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste, sofrendo só 3d8 de dano Psíquico; falha sofre 6d8 de dano Psíquico (chegar a 0 PV por esse dano deixa em 1 PV em vez de cair); falha crítica sofre 8d8 de dano Psíquico (mesma regra de PV mínimo 1) e ganha 5 ranks de Medo por 24 horas ou até um jutsu Médico de rank B ou maior remover o Medo. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Imagem Maior', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'36m', duracao:'Até ser dissipado',
    efeito:'Cria a imagem de um objeto, criatura ou fenômeno (até um cubo de 6m) num ponto a até 36m, completa com som, cheiro e temperatura condizentes (sem poder causar dano com calor/frio, som alto o bastante pra ferir/ensurdecer, ou cheiro que enjoe alguém). Enquanto estiver ao alcance, pode usar a ação pra mover a imagem, ajustando aparência e sons pra parecer natural (até manter uma "conversa"). Interação física revela a ilusão. Como ação, quem examinar pode fazer um teste de Ilusão contra sua CD pra perceber que é falsa — aí enxerga através dela, e as outras qualidades sensoriais ficam fracas pra ela.'},
  {nome:'Liberação Médica: Guarda Psiônica', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'18m', duracao:'Concentração, Especial',
    efeito:'Um som de apoio ecoa na mente de um aliado em até 18m (ele não pode manter concentração em mais de 1 jutsu enquanto durar): sempre que ele fosse fazer uma resistência de Inteligência, Sabedoria ou Carisma, você pode fazê-la no lugar dele, usando seus próprios bônus.'},
  {nome:'Dominação de Memória', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Toque', duracao:'Até ser restaurado',
    efeito:'Kinjutsu: toca um alvo e tenta remodelar suas memórias — ele testa Inteligência (com vantagem se estiver lutando contra você); na falha, fica Enfeitiçado por 1 minuto, Incapacitado e alheio ao redor (mas ainda ouve você) — sofrer dano ou ser alvo de outro jutsu encerra o efeito na hora, sem alterar nada. Enquanto o Enfeitiçado durar, você pode reescrever, aguçar, alterar ou inventar a lembrança de um evento que ele viveu nos últimos 12 meses (com até 1 dia de duração); precisa descrever em voz alta, numa língua que ele entenda, e a mente dele preenche os detalhes que faltarem (se o jutsu acabar antes de você terminar de descrever, nada muda). A memória alterada só passa a valer quando o jutsu termina, e pode ser rejeitada pela própria mente do alvo como "só um sonho" se contradisser demais suas crenças ou inclinações naturais. Só uma Quebra de Genjutsu ou um jutsu de Restauração Maior voltado especificamente a isso restaura a memória verdadeira.'},
  {nome:'Cisão Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'Pessoal', duracao:'10 minutos',
    efeito:'Manifesta uma segunda mente independente por 10 minutos: não controla seu corpo físico, mas em cada um dos seus turnos ganha 1 Ação e 1 Reação só pra tarefas puramente mentais (testes de Inteligência/Sabedoria, Ler o Inimigo, Buscar, ou lançar um Ninjutsu/Genjutsu Rank E que não precise de Selos de Mão nem Ferramentas Ninja).'},
  {nome:'Duplicata Enganosa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Fica Invisível enquanto um clone ilusório aparece no seu lugar (a invisibilidade acaba se atacar ou lançar jutsu; o clone dura enquanto durar a concentração). Como ação, move o clone até o dobro do seu deslocamento e o faz gesticular, falar e agir como quiser — você vê e ouve pelos sentidos dele como se estivesse lá (ficando Cego e Surdo aos seus arredores reais enquanto isso). Como Ação Bônus a cada turno, alterna entre seus sentidos e os do clone. Pode se afastar do clone em até 36m.'},
  {nome:'Possessão Parasita', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'36m', duracao:'Concentração, até 10 minutos',
    efeito:'Técnica ao estilo Yamanaka: dispara sua consciência num alvo em até 36m (automaticamente resiste se perceber sua presença) — enquanto isso, seu corpo cai Derrubado e Atordoado pela duração, sem sentir nada que aconteça com ele (se morrer, o jutsu vira permanente ou até ser Dissipado, e você fica preso no corpo invadido; a concentração não quebra por dano). O alvo testa Carisma: sucesso crítico resiste e percebe que algo tentou invadir sua mente; sucesso resiste; falha te deixa entrar na mente dele — você não o controla, mas vê e sente tudo que ele vive (se ele sofrer dano, você testa Carisma contra sua própria CD pra continuar lá dentro); falha crítica é igual, mas você também consegue ocasionalmente "falar" como se fosse um pensamento dele (não controla, mas pode tentar testes de Carisma pra influenciá-lo).'},
  {nome:'Assassino Fantasmagórico', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Cria uma manifestação ilusória dos piores medos de um alvo em até 36m, visível só pra ele, que testa Sabedoria: sucesso crítico resiste; sucesso dá 1 rank de Medo até o fim do turno seguinte; falha dá 3 ranks de Medo enquanto durar (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, e também sofre 6d10 de dano Psíquico no início de cada turno enquanto durar o Medo. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de B.'},
  {nome:'Ilusões Programadas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (esfera de 18m)', duracao:'Até ser dissipado',
    efeito:'Cola um Selo de Chakra especial numa superfície numa esfera de 18m ao seu redor, criando uma ilusão programada (objeto, criatura ou fenômeno de até 9m) imperceptível até uma condição específica que você define acontecer — aí ela entra em cena e representa a performance que você escreveu (até 5 minutos, repetindo do início enquanto a condição continuar valendo). Interação física revela a ilusão; quem examinar como ação pode tentar um teste de Genjutsu (Sabedoria) contra sua CD pra perceber que é falsa, passando a enxergar através dela e ouvir os sons como ocos.'},
  {nome:'Psiônica: Esmagar!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Uma imagem gigante de você tenta esmagar um alvo em até 18m: Ataque de Genjutsu à distância causando 5d10 de dano Psíquico; no acerto, o alvo testa Sabedoria: sucesso resiste aos efeitos secundários; falha cai Derrubado e só consegue se levantar gastando todo o deslocamento; falha crítica é igual, mas não consegue se levantar sozinho (precisa de ajuda de outra criatura) e fica com deslocamento 0 enquanto isso.'},
  {nome:'Psiônica: Sobrecarga Sensorial', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu corpo a corpo: no acerto, o alvo fica Cego até o fim do turno seguinte e testa Inteligência (quem tiver Inteligência 8 ou menos falha crítica automaticamente): sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha fica Contundido; falha crítica é igual, e também fica desorientado, sem conseguir sentir, provar, ouvir ou cheirar por 1 minuto. Em ranks mais altos: +3 de custo por rank acima de B; no Rank S, quem falhar também fica Incapacitado.'},
  {nome:'Psiônica: Tormento!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (9m)', duracao:'Instantâneo',
    efeito:'Som aparentemente mundano que todos ouvem como um estrondo brutal e doloroso; alvos à sua escolha num raio de 9m testam Sabedoria: sucesso resiste; falha sofre 5d8 de dano Psíquico e 3 ranks de Ofuscado; falha crítica sofre 5d8 de dano Psíquico, 3 ranks de Contundido e 1 rank de Lento (refazendo a resistência de Sabedoria no fim de cada turno pra encerrar o Lento).'},
  {nome:'Psiônica: Sala Trapaça', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (cubo de 31,5m)', duracao:'10 minutos',
    efeito:'Aplica um Genjutsu em todo mundo num cubo de 31,5m a partir de você: faz um teste de Genjutsu contra CD 10 + o número de criaturas relutantes afetadas — se passar, enquanto estiverem na área, a ordem de iniciativa vira ao contrário, e qualquer aumento de deslocamento (por jutsu, traço ou efeito) vira redução, e qualquer redução vira aumento. Se algum afetado sair da área, o jutsu acaba na hora. Em ranks mais altos: +3 de custo e +15m no tamanho do cubo por rank acima de B.'},
  {nome:'Explosão Psíquica', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Onda destrutiva num cone de 9m a partir de você; alvos testam Sabedoria: sucesso crítico resiste; sucesso sofre 4d8 de dano Psíquico; falha sofre 7d8 de dano Psíquico e cai Derrubado; falha crítica sofre 10d8 de dano Psíquico, cai Derrubado e fica Incapacitado até o fim do turno seguinte. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Pedido do Condenado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Ordem de até 25 palavras a um alvo em até 27m, citando o nome dele, que testa Carisma se te ouvir: sucesso crítico resiste; sucesso fica cego de raiva e Enfurecido até o fim do turno seguinte; falha fica Enfurecido e incapaz de ver você, sofrendo 3d6 de dano Psíquico enquanto durar (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas o dano sobe pra 5d6. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de B.'},
  {nome:'Mente de Borracha', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Quando você fosse ganhar uma condição Mental ou Sensorial, pode redirecioná-la pra um alvo hostil em até 18m, que testa Inteligência: sucesso resiste; falha faz o alvo ganhar a condição que seria sua, como se tivesse falhado a própria resistência; falha crítica é igual, mas ele não consegue remover a condição sozinho, precisando gastar uma ação refazendo essa resistência pra encerrar.'},
  {nome:'Arte de Selamento: Selo da Língua Amaldiçoada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Toque', duracao:'Permanente',
    efeito:'Kinjutsu: o alvo precisa estar Incapacitado ou disposto. Ao longo de 1 minuto, tatua um selo na língua dele, escolhendo 1 assunto sobre o qual ele nunca mais consegue falar, escrever ou revelar de propósito. Pra desfazer, o alvo precisa passar num teste de Ninshou contra sua CD de Genjutsu +5 (sem poder usar bônus de jutsu nesse teste) — cada tentativa leva 1 hora, e um sucesso libera o assunto de novo.'},
  {nome:'Arte de Selamento: Pensamentos Presos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'13 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m testa Carisma: sucesso resiste; falha sela o último jutsu que ele lançou, impedindo de relançá-lo enquanto durar (a tentativa falha mas ainda gasta o Chakra); falha crítica é igual, e também sela qualquer jutsu que vocês dois conheçam em comum. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de B.'},
  {nome:'Lentidão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'36m (cubo de 12m)', duracao:'1 minuto',
    efeito:'Até 6 alvos à sua escolha num cubo de 12m a até 36m testam Inteligência: sucesso crítico resiste; sucesso fica Lento até o fim do turno seguinte; falha ganha 1 rank de Lento por 1 minuto (refazendo a resistência no fim de cada turno pra encerrar); falha crítica ganha 2 ranks de Lento em vez de 1. Em ranks mais altos: +3 de custo e +2 alvos por rank acima de B.'},
  {nome:'Canção da Retirada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'11 Chakra', alcance:'Pessoal (raio de 13,5m)', duracao:'Concentração, até 10 minutos',
    efeito:'Melodia de fuga num raio de 13,5m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Inimigos escolhidos que começarem o turno no alcance testam Sabedoria ou são forçados a gastar o turno se afastando da criatura hostil mais próxima; aliados escolhidos ganham os benefícios de Disparada e Desengajar ao se afastar de um inimigo, ignoram terreno difícil nesse movimento e não provocam ataques de oportunidade (o benefício se perde até o fim do turno seguinte se tentarem lançar um jutsu de dano ou declarar um ataque).'},
  {nome:'Canção da Reversão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (raio de 13,5m)', duracao:'Concentração, até 10 minutos',
    efeito:'Melodia de derrota num raio de 13,5m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Quem começar o turno no alcance testa Carisma: na falha, toda vantagem vira desvantagem e vice-versa, e qualquer penalidade em ataque, teste de perícia ou resistência vira um bônus do mesmo tamanho (e qualquer bônus vira penalidade do mesmo tamanho) até o fim do turno.'},
  {nome:'Canção da Guerra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (raio de 13,5m)', duracao:'Concentração, até 10 minutos',
    efeito:'Melodia de guerra num raio de 13,5m ao seu redor (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte). Aliados à sua escolha no alcance ganham, até o início do seu próximo turno: +5 em testes de Ninshou, Ilusão e Artes Marciais; +3 na Iniciativa (podendo subir 1 posição na ordem se isso ultrapassar outra criatura); e +2 em ataque, dano e resistências.'},
  {nome:'Prisão Mortal da Árvore', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Cria a ilusão de até 3 alvos em até 27m sendo presos por uma árvore que cresce, enquanto você some da visão deles (fica invisível a todos os sentidos deles até a ilusão acabar por dano ou resistência); cada um testa Sabedoria: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso fica Lento até o fim do turno seguinte; falha fica Incapacitado, Cego, Surdo e Agarrado enquanto durar (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas fica Atordoado em vez de Incapacitado.'},
  {nome:'Foco Ilimitado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'12 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Aliado disposto tocado ganha, enquanto durar: +1d6 em testes de Constituição (Controle de Chakra) pra manter concentração; uma Ação Bônus extra por turno; e +1d4 em resistências de Inteligência ou Carisma contra Genjutsu.'},
  {nome:'Medo Inconfundível', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'Pessoal (cubo de 27m)', duracao:'Concentração, até 1 minuto',
    efeito:'Projeta os piores medos de todo mundo num cubo de 27m a partir de você; alvos testam Carisma: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso larga o que estiver segurando; falha larga o que segura e ganha 2 ranks de Medo enquanto durar (refazendo a resistência no fim de cada turno), sofrendo +5d6 de dano Psíquico extra sempre que levar dano Psíquico enquanto tiver Medo; falha crítica é igual, mas o extra vira +5d8. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de B.'},
  {nome:'Dor Implacável', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Cria a imagem de um alvo em até 18m sendo empalado repetidamente; ele testa Sabedoria: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso sofre 4d6 de dano Psíquico; falha sofre 13d6 de dano Psíquico; falha crítica é igual, e também fica Atordoado até o fim do turno seguinte. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de B.'},
  {nome:'Palavra do Perdido', tipo:'Genjutsu', categoria:'Genjutsu', rank:'B', custo:'14 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Kinjutsu: poucas palavras de desolação a um alvo em até 27m, citando o nome dele — se ouvir, sofre flashes mentais e memórias fraturadas enquanto durar. No início de cada turno dele, testa Inteligência: por cada margem de falha, ganha Fraturas (falhar por 1-4 dá 1 Fratura; 5-9 dá 2; 10-14 dá 3; 15 ou mais dá 4). Os efeitos escalam com o total de Fraturas: 2+ não lança jutsu de Rank A ou maior (piora a cada 2 Fraturas: 4=Rank B+, 6=Rank C+, 8=Rank D+); 3+ não mantém concentração em mais de 1 jutsu; 5+ não reconhece aliados, vendo todo mundo como hostil; 7+ dobra o custo de todo jutsu que lançar; 9+ perde a capacidade de lançar jutsu com Selos de Mão; 10+ fica com as Fraturas permanentes, virando um "vegetal mental" (pode tentar um teste de Inteligência a cada 30 dias; um sucesso reduz 3 Fraturas).'},
  {nome:'Sol Negro', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'20 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'Concentração, até 1 minuto',
    efeito:'Um cristal na palma da mão vira uma esfera de chakra roxo pulsante que te acompanha, com luz sinistra num raio de 18m ao seu redor; quem você escolher que começar o turno no alcance testa Sabedoria: na falha, você fica Invisível pra ele (e quem mais você quiser também, se estiver a até 18m de você e na luz da esfera) — um Invisível por este jutsu projeta uma sombra roxa fraca, e quem gastar a ação testando Sabedoria (Percepção) contra sua CD consegue enxergar e mirar nessa sombra (ainda em desvantagem, por ser só uma sombra). Refaz a resistência no fim de cada turno, ficando imune até o fim do turno seguinte se passar. Em ranks mais altos: +3 de custo e +4,5m de raio por rank acima de A.'},
  {nome:'Portador das Trevas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'Pessoal (esfera de 9m)', duracao:'Concentração, até 10 minutos',
    efeito:'Esfera de 9m ao seu redor tira a visão, audição e tato de quem estiver lá: alvos testam Sabedoria (quem entrar na esfera ou terminar o turno nela também testa) — na falha, ficam Cegos, Surdos e incapazes de sentir toque (o efeito persiste mesmo saindo da esfera, até passar na resistência); no fim de cada turno, podem testar Sabedoria de novo pra encerrar.'},
  {nome:'Dança Macabra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'18m', duracao:'Concentração, até 10 minutos',
    efeito:'Convoca 5 fantasmas sombrios médios do chão a até 18m, na forma que você escolher (Ataque/Dano += seu modificador de Genjutsu; Defesa 10 + seu modificador de Genjutsu; 55 PV; deslocamento 9m). Como Ação Bônus, dá a mesma ordem pra todos de uma vez — eles seguem a ordem até completar a tarefa.'},
  {nome:'Visão do Diabo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'19 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Aliado disposto tocado ganha Visão no Escuro de 18m que atravessa escuridão de origem Chakra, e Visão Verdadeira contra Genjutsu de rank A ou menor, por 1 minuto (só afeta uma criatura por vez — lançar de novo encerra no alvo anterior).'},
  {nome:'Ambição do Diabo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'9m', duracao:'1 minuto',
    efeito:'Substância estimulante no ar melhora até 2 aliados dispostos em até 9m enquanto durar: testes de Força/Destreza/Inteligência nunca resultam abaixo do próprio nível de personagem; ganham Maestria em ataques de Ninjutsu, Genjutsu e Taijutsu; Maestria em resistências contra Genjutsu sonoros; e podem rerolar um ataque errado contra a última criatura que os feriu, uma vez por turno. Ao acabar, ganham 3 ranks de Envenenado por 1 hora, que nenhum jutsu remove.'},
  {nome:'Assaltos do Diabo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'36m', duracao:'Instantâneo',
    efeito:'Alvo que te ouvir em até 36m vê duplicatas ilusórias suas o atacando: 3 Ataques de Genjutsu à distância, cada acerto causando 2d12 + mod. de Genjutsu de dano Psíquico. Acertando pelo menos 2, o próximo Ataque de Genjutsu contra o mesmo alvo vem com vantagem e rerrola 1s e 2s no dano (ficando com o segundo resultado); acertando pelo menos 3, o alvo testa Carisma ou ganha 1 rank de Contundido. Em ranks mais altos: +3 de custo e +1 ataque por rank acima de A.'},
  {nome:'Medos do Diabo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'16 Chakra', alcance:'Pessoal (27m)', duracao:'Instantâneo',
    efeito:'Todo mundo com pelo menos 1 rank de Desmoralizado a até 27m testa Carisma (quem tiver Carisma 8 ou menos falha crítica automaticamente): sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha sofre 3d10 de dano Psíquico por rank de Desmoralizado que tiver, sem ganhar o novo teste de resistência que essa condição dá no fim do turno; falha crítica sofre 4d10 de dano Psíquico por rank de Medo em vez disso. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de A.'},
  {nome:'Morra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Uma palavra de autoridade absoluta ordena que um alvo em até 9m que te veja e ouça se ataque com o próprio golpe mais forte; ele testa Carisma: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha o obriga, no turno seguinte, a lançar um jutsu ou fazer um ataque (à sua escolha) contra si mesmo — se não souber ou não puder fazer o que foi mandado, repete contra si o último ataque ofensivo que usou no combate (ou sofre 8d10 de dano Psíquico, se ainda não tiver atacado); falha crítica é igual, mas esse ataque contra si mesmo já sai como acerto crítico automático.'},
  {nome:'Dominar Pessoa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'20 Chakra', alcance:'9m', duracao:'Concentração, até 10 minutos',
    efeito:'Enfeitiça um humanoide em até 9m, que testa Sabedoria (com vantagem se você ou aliados estiverem lutando contra ele) ou fica Enfeitiçado enquanto durar; enquanto isso, mantém um vínculo telepático com ele a até 1,6km, dando ordens simples sem gastar ação (ele obedece o melhor que pode; sem ordem nova, se defende e se preserva). Como ação, pode assumir controle total até o fim do seu próximo turno (fazendo-o usar uma Reação também custa a sua). Toda vez que o alvo sofrer dano, refaz a resistência de Sabedoria — um sucesso encerra o jutsu.'},
  {nome:'Geas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'17 Chakra', alcance:'9m', duracao:'30 dias',
    efeito:'Kinjutsu: dá uma ordem de Genjutsu a um alvo em até 9m que a entenda, forçando um serviço ou proibindo uma ação à sua escolha — ele testa Sabedoria ou fica Enfeitiçado por 30 dias, sofrendo 9d10 de dano Psíquico (no máximo uma vez por dia) sempre que agir diretamente contra a ordem. A ordem não pode ser um suicídio certo (isso encerraria o jutsu na hora); você pode dispensar o efeito como ação a qualquer momento.'},
  {nome:'Verborragia', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'20 Chakra', alcance:'Pessoal', duracao:'10 minutos',
    efeito:'Enquanto durar, qualquer teste de Carisma que fizer pode ser trocado por um resultado fixo de 10, e qualquer jutsu que tentasse saber se você está mentindo sempre indica que está falando a verdade.'},
  {nome:'Foco Aguçado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'20 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo tocado ganha +1 na faixa de crítico enquanto durar, e ao tirar um crítico, os dados de dano sobem 1 degrau (ex.: d6 vira d8).'},
  {nome:'Pensamentos Apagados', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'17 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Implanta pensamentos desfocados na mente de um alvo em até 27m: no início de cada turno dele, testa Inteligência ou gasta o turno em atividades improdutivas (desenhar na areia, ajustar as tiras da armadura, contar kunai, planejar cenários elaborados demais) — se passar por 10 ou mais, o jutsu acaba na hora e ele fica imune por 1 hora. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de A.'},
  {nome:'Clone Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'20 Chakra por semana (52 semanas)', alcance:'Toque', duracao:'Instantâneo',
    efeito:'Kinjutsu: precisa de um corpo substituto vivo sem consciência e 100 Selos de Chakra ao redor dele. Ao longo de 1 ano inteiro, oferecendo Chakra toda semana sem falhar mais de 1 semana seguida, cultiva uma cópia inerte da consciência de quem lança (com todas as memórias até o início do processo) dentro desse corpo — só um clone assim por vez, podendo ser uma versão mais jovem de você. Se passar mais de 1 semana sem oferecer o Chakra, o processo para antes da hora e o clone acorda como pessoa própria, sem ligação com o original. Se completar o ano inteiro, quando o original morrer (com a consciência ainda intacta e capaz de ser transferida), ela passa pro clone, que só herda os atributos mentais (Inteligência, Sabedoria e Carisma) e o conhecimento que o original tinha no início do processo.'},
  {nome:'Quebra Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'17 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Submete um alvo em até 9m a uma tortura mental de um ano inteiro comprimida em 6 segundos; ele testa Inteligência: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso sofre 5d12 de dano Psíquico; falha sofre 10d12; falha crítica sofre 13d12. Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de A.'},
  {nome:'Miragem', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'16 Chakra', alcance:'1,6km', duracao:'10 dias',
    efeito:'Faz um terreno de até 1,6km² parecer, soar, cheirar e até parecer ao toque como outro tipo de terreno (a forma geral continua a mesma — um campo pode virar pântano, por exemplo — e você pode alterar ou adicionar construções onde não existem). Não afeta criaturas na área. Visão Verdadeira revela a forma real, mas quem tiver isso ainda interage fisicamente com a ilusão como se fosse real.'},
  {nome:'Floresta Venenosa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'19 Chakra', alcance:'18m (esfera de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Espalha pó venenoso numa esfera de 9m à sua frente (dentro de um alcance de 18m); quem estiver na área testa Inteligência: na falha, fica preso numa floresta ilusória de árvores venenosas, sem conseguir sair da esfera (sempre dá de cara com a borda e volta); enquanto durar, sofre 5d8 de dano de Veneno toda vez que terminar o turno lá dentro, testando Constituição no fim do próprio turno pra encerrar o efeito. Em ranks mais altos: +3 de custo e +2d8 de dano por rank acima de A.'},
  {nome:'Esmagamento Psíquico', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'15 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo em até 18m testa Inteligência: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso sofre 6d6 de dano Psíquico; falha sofre 12d6 de dano Psíquico e 1 rank de Confusão; falha crítica sofre 14d6 de dano Psíquico, 1 rank de Confusão e fica Enfurecido.'},
  {nome:'Aparência', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'17 Chakra', alcance:'9m', duracao:'8 horas',
    efeito:'Muda a aparência de qualquer número de alvos em até 9m (um alvo relutante pode testar Carisma pra não ser afetado) — disfarça corpo, roupa, armadura, armas e equipamento, podendo mudar até 0,3m de altura e deixar mais magro, gordo ou no meio (sem mudar o tipo de corpo, mesma disposição de membros). Dura 8 horas ou até você dispensar como ação. Não resiste a exame físico (objetos "adicionados" são atravessáveis, um corpo "mais magro" ainda é sentido no tamanho real ao tocar); quem gastar a ação examinando pode testar Inteligência (Investigação) ou Sabedoria (Ilusão) contra sua CD pra perceber o disfarce.'},
  {nome:'Dor Ilimitada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 27m testa Inteligência (em desvantagem se já estiver sob Dor Redobrada, e nesse caso uma falha quebra a concentração daquele jutsu e soma +4d8 aqui, além de reduzir o custo de concentração deste jutsu à metade enquanto durar; também vem em desvantagem se for alvo de Dor Implacável enquanto este durar): na falha, uma vez por turno, ao sofrer dano Psíquico, sofre +3d8 extra, e sempre que alguém o ferir, rerrola 1s e 2s no dano (ficando com o segundo resultado). Em ranks mais altos: +3 de custo e +1 alvo por rank acima de A.'},
  {nome:'Prazer Ilimitado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'18 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Até 3 aliados dispostos em até 27m: sempre que ganharem PV temporário de um Genjutsu, também recuperam PV normal igual a esse valor — se o Genjutsu que deu o PV temporário for Médico, o dado usado sobe 1 degrau e rerrola 1s e 2s (ficando com o segundo resultado).'},
  {nome:'Quebra-Vontades', tipo:'Genjutsu', categoria:'Genjutsu', rank:'A', custo:'Especial (20 Chakra)', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 36m testa Inteligência, Sabedoria ou Carisma (você escolhe qual no início e não muda depois) no começo de cada um dos próprios turnos: sucesso crítico resiste e fica imune até o fim do turno seguinte; sucesso resiste; falha reduz o atributo escolhido em 1d4 enquanto durar (chegar a 0 nesse atributo causa 14d8 + mod. de Genjutsu de dano Psíquico e encerra o jutsu; alguém a até 1,5m do alvo pode gastar a ação testando Sabedoria (Ilusão) contra sua CD pra quebrar o efeito na hora); falha crítica reduz o atributo em 1d6 em vez de 1d4. Em ranks mais altos: +3 de custo e +2 alvos por rank acima de A.'},
  {nome:'Antipatia/Simpatia', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'28 Chakra', alcance:'18m', duracao:'10 dias',
    efeito:'Escolhe um alvo (objeto ou criatura de tamanho enorme ou menor, ou uma área de até 60m de lado) a até 18m e um tipo de criatura inteligente (ex.: Sábios das Feras, Demônios, Humanos); escolhe Antipatia (repele) ou Simpatia (atrai) por 10 dias. Antipatia: quem for do tipo escolhido e vir o alvo ou chegar a até 18m dele testa Sabedoria ou fica Amedrontado enquanto puder vê-lo ou estiver nesse raio, gastando o movimento pra fugir pro lugar seguro mais próximo sem linha de visão. Simpatia: o mesmo tipo de criatura, ao ver o alvo ou chegar perto, testa Sabedoria ou gasta o movimento tentando se aproximar até tocar o alvo a cada turno — uma vez ali, não consegue se afastar de boa vontade (se o alvo a ferir, pode testar Sabedoria de novo pra se livrar). Em ambos os casos, quem terminar o turno longe do alvo e sem vê-lo testa Sabedoria pra reconhecer o efeito como ilusório e se livrar; também ganha uma nova chance a cada 24 horas, e um sucesso dá imunidade por 1 minuto.'},
  {nome:'Olho de Águia', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'10 minutos',
    efeito:'Você e quem escolher num raio de 18m ganham, por 10 minutos: Visão de Chakra de 36m, Visão no Escuro de 27m, Sentido Cego de 18m, Visão Verdadeira de 9m, e o alcance de ataques à distância dobrado.'},
  {nome:'Mente Fraca', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'25 Chakra', alcance:'45m', duracao:'Instantâneo',
    efeito:'Kinjutsu: ataca a mente de um alvo em até 45m, causando 8d6 de dano Psíquico e forçando um teste de Inteligência; na falha, Inteligência e Carisma do alvo caem pra 1 — não consegue lançar jutsu, ativar itens de chakra, entender idiomas nem se comunicar de forma inteligível (mas ainda reconhece e protege aliados). A cada 30 dias pode repetir o teste pra encerrar; uma Quebra de Genjutsu, Restauração ou Recuperação Mente-Corpo de rank A ou maior também encerram.'},
  {nome:'Presença do Leão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'10 minutos',
    efeito:'Todo inimigo num raio de 18m ao seu redor testa Carisma: na falha, enquanto estiver no alcance e pelos 10 minutos, não consegue tirar críticos, sofre -5 em ataques e testes, não mantém concentração em mais de 1 jutsu, perde resistência/imunidade a Medo e fica vulnerável a dano Psíquico.'},
  {nome:'Labirinto', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'28 Chakra', alcance:'18m', duracao:'Concentração, 10 minutos',
    efeito:'Até 4 alvos em até 18m testam Sabedoria: na falha, a mente é banida pra um labirinto (o corpo cai Derrubado e fica fisicamente Atordoado, mas a mente continua ativa) enquanto durar ou até escapar. Em cada turno, tenta um teste de Inteligência (Investigação) — se for proficiente, um sucesso acha a saída e encerra na hora — ou de Sabedoria (Intuição) — se for proficiente, um sucesso dá vantagem na próxima resistência de Sabedoria no início do turno seguinte, encerrando no sucesso (sem proficiência em nenhum dos dois, faz um teste simples de Inteligência contra sua CD; nenhum desses testes ganha bônus de Especialização ou dobro de proficiência).'},
  {nome:'Prisão Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'22 Chakra', alcance:'36m', duracao:'Até 1 minuto',
    efeito:'Kinjutsu: prende um alvo em até 36m numa cela ilusória que só ele percebe; testa Inteligência (sucesso automático se for imune a Enfeitiçado): no sucesso, sofre 5d10 de dano Psíquico e o jutsu acaba; na falha, sofre 5d10 de dano Psíquico e o espaço ao redor parece perigoso (fogo, lâminas flutuantes, presas — à sua escolha), ficando incapaz de ver ou ouvir além disso e Restrito enquanto durar. Se for movido pra fora da ilusão, atacar corpo a corpo através dela, ou colocar qualquer parte do corpo pra fora, sofre mais 10d10 de dano Psíquico e o jutsu acaba.'},
  {nome:'Sonho Sem Fim', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'28 Chakra', alcance:'Toque', duracao:'Até ser dissipado',
    efeito:'Kinjutsu: Ataque de Genjutsu corpo a corpo; no acerto, o alvo testa Sabedoria ou é preso num loop de sono ilusório que você criou, o corpo dormindo até ser libertado. No fim de cada dia, testa Sabedoria em desvantagem — um sucesso o aproxima de acordar, precisando de 5 sucessos seguidos pra realmente despertar (uma falha reseta a contagem). Só pode manter este jutsu ativo numa criatura por vez.'},
  {nome:'Frenesi dos Coelhos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'Concentração, até 1 minuto',
    efeito:'Coelhos ilusórios raivosos te seguem e atacam quem você escolher num raio de 18m; como ação em cada turno, faz um Ataque de Genjutsu corpo a corpo contra até 4 alvos no alcance — acerto causa 27d4 de dano Psíquico e o alvo testa Carisma ou ganha 3 ranks de Medo de você por 1 minuto e fica Restrito até o fim do turno seguinte. Atacar um alvo já Restrito por este jutsu faz rerrolar todos os 1s no dano, ficando com o segundo resultado.'},
  {nome:'Dança da Lesma', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Pessoal', duracao:'1 dia',
    efeito:'Prepara um Selo de Chakra especial (o custo deste jutsu nunca pode ser reduzido); enquanto durar, sempre que for alvo de um jutsu ou arte que exija resistência com a palavra-chave Genjutsu, pode escolher passar automaticamente — o efeito hostil é transferido pro selo, e este jutsu então acaba.'},
  {nome:'Jogo das Cobras', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'22 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Cobras ilusórias envolvem até 7 alvos em até 36m, que testam Sabedoria ou ficam Atordoados e ganham 2 ranks de Exaustão (acreditando não conseguir respirar); no fim de cada turno, testam de novo, ganhando mais 2 ranks de Exaustão a cada falha.'},
  {nome:'Canção do Sapo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Esfera de 9m de raio', duracao:'Permanente',
    efeito:'Kinjutsu: canta uma melodia calma e poderosa numa esfera de 9m de raio; role 20d10 + mod. de Genjutsu + bônus de proficiência — esse total é quanto de PV o jutsu "cobre". Toda criatura que ouvir você e tiver PV atual abaixo desse total cai imediatamente num sono profundo, incapaz de acordar sozinha até ser libertada, atingida por outro jutsu que a acorde, ou morta.'},
  {nome:'Espelho de Flor', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'10 minutos',
    efeito:'Um chakra tóxico imperceptível enche um raio de 18m ao seu redor, influenciando sutilmente os sentidos e o julgamento de quem estiver lá. Role 4d20 e guarde os resultados; enquanto durar, sempre que alguém afetado rolar um d20, você pode gastar um desses resultados guardados pra substituir o resultado dele pelo seu.'},
  {nome:'Pior Medo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'S', custo:'30 Chakra', alcance:'36m (esfera de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Cria criaturas ilusórias dos piores medos de cada um, visíveis só pra quem as tem, numa esfera de 9m de raio centrada num ponto a até 36m; alvos testam Sabedoria: na falha, ganham 5 ranks de Medo enquanto durar. No fim de cada turno de quem estiver Amedrontado assim, testa Sabedoria de novo ou sofre 8d10 de dano Psíquico (um sucesso encerra o jutsu só pra essa criatura).'},
  {nome:'Mil Anos de Dor', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa estar Escondido do alvo antes de lançar: Ataque de Taijutsu corpo a corpo — acerto força o alvo a testar Carisma ou ser empurrado 4,5m numa linha reta, humilhado (até o fim do próprio turno seguinte, o próximo ataque corpo a corpo contra ele vem com vantagem).'},
  {nome:'Dança da Avalanche', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (Combo): seu dano desarmado + 1d6 e o alvo testa Força ou ganha 1 rank de Machucado; até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D; no Rank B ganha +1 ataque; no Rank S o dado de dano vira d8.'},
  {nome:'Chute da Fúria Bestial', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'3m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (Finalizador) com alcance de até 3m: acerto causa seu dano desarmado + 2d4 e o alvo testa Força ou é empurrado 3m. Usado como Finalizador, vira um cone de 4,5m à sua frente: teste de Força ou seu dano desarmado + 2d6, empurrado 3m e Derrubado (metade do dano se passar). Em ranks mais altos: +3 de custo e +1d4 (ou 1d6) de dano por rank acima de D.'},
  {nome:'Flor Relâmpago', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu corpo a corpo (Combo), cada um causando 3d6 de dano de Concussão; acertando os dois no mesmo alvo, ele cai Derrubado. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: o dado de dano sobe 1 degrau (d6→d8→d10→d12) e +3 de custo por rank acima de D; no Rank B ganha +1 ataque; no Rank S soma seu modificador de Taijutsu ao dano.'},
  {nome:'Blindagem', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'+2 em uma resistência de Força ou Constituição. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B o bônus sobe pra +4, e no Rank S pra +6.'},
  {nome:'Chute Borboleta', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo (Finalizador) contra todos os adjacentes à sua escolha: acerto causa seu dano desarmado + 2d4 e o alvo testa Força ou ganha 1 rank de Contundido. Usado como Finalizador, vira um cubo de 4,5m a partir de você: teste de Força ou seu dano desarmado + 2d8, Contundido e Derrubado (metade do dano e nada mais se passar); depois dos testes, você se move até 4,5m pra um espaço livre sem provocar ataque de oportunidade. Em ranks mais altos: +3 de custo por rank acima de D; do Rank C em diante, +2d4 (ou 1d8) de dano; do Rank B em diante, +1 ataque ou +1 rank de Contundido; do Rank A em diante, mais +2d4 (ou 1d8) de dano; no Rank S, ninguém se beneficia de bônus de jutsu na Defesa ou na resistência de Força contra este golpe.'},
  {nome:'Golpe de Cérbero', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Até 3 alvos em até 1,5m: Ataque de Taijutsu corpo a corpo (Combo) em cada um — acerto causa seu dano desarmado + 1d8, impede ataques de oportunidade até o início do turno seguinte deles, e o próximo ataque corpo a corpo contra qualquer um deles ganha +2 até o fim do seu próximo turno. Até o fim do turno, pode lançar um Finalizador num deles ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D.'},
  {nome:'Garra da Presa Veloz', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Se move até 4,5m em direção a um inimigo, terminando adjacente a ele, e faz um Ataque de Taijutsu corpo a corpo (Combo): seu dano desarmado + 1d10. Um acerto crítico reduz à metade o custo do próximo Finalizador de rank igual que lançar antes do fim do turno. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1,5m no alcance/movimento por rank acima de D; do Rank B em diante, +1d10 de dano; no Rank S, mais +1d10.'},
  {nome:'Formação da Asa de Grou', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu corpo a corpo: acerto derruba e Agarra o alvo (pode manter Agarrada uma criatura por mão que tiver). O alvo pode usar a ação pra testar Força e escapar (sem seguir as regras normais de fuga de Agarrado); na falha, você pode fazer um ataque desarmado nele causando o dobro do seu dano desarmado. Em ranks mais altos: +3 de custo por rank acima de D; do Rank C em diante, +1 alvo.'},
  {nome:'Investida do Ciclone', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (1,5m)', duracao:'Instantâneo',
    efeito:'Pula 4,5m no ar girando: Ataque de Taijutsu corpo a corpo (Combo) contra todos à sua escolha no alcance — acerto causa seu dano desarmado + 2d4 e joga o alvo 4,5m pro ar, ficando no ar até o fim do turno atual (não pode lançar jutsu que exija movimento enquanto estiver assim, e não sofre dano de queda por causa disso). Até o fim do turno, você ou um aliado pode lançar um Finalizador num alvo afetado ignorando alcance e tempo de conjuração (Ação, Ação Bônus ou Reação), uma vez por turno.'},
  {nome:'Mergulho Profundo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Teste de Agarrar contra um alvo ao alcance: no sucesso, corre com ele até seu deslocamento total em direção à superfície mais distante que alcançar (uma parede, por exemplo, ou o chão se não tiver nada por perto), batendo nele e causando dano de Concussão igual ao seu dano desarmado (se os dois estiverem na água ou submersos, o teste de Agarrar vem com vantagem, e no sucesso você mergulha até o fundo em vez disso, causando o dobro do dano). Pode ser usado já estando com alguém Agarrado, batendo direto sem precisar de novo teste — o Agarrar acaba com o golpe.'},
  {nome:'Punho Demoníaco', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu à distância (Combo, soco de baixo pra cima que manda um tremor pelo chão) contra um alvo em até 9m na mesma superfície que você: acerto causa 3d6 de dano de Concussão. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Rolamento de Dempsey', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'Especial', alcance:'1,5m', duracao:'1 rodada',
    efeito:'Postura de boxe: até o início do seu próximo turno, sempre que alguém a até 1,5m te atacar corpo a corpo, pode gastar 4 Chakra pra esquivar, ganhando +2 de Defesa contra esse atacante (acumula até 2 vezes) e fazendo um ataque desarmado de volta na hora. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B, o bônus de Defesa sobe +1.'},
  {nome:'Rotação de Arrasto', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Quando alguém a até 1,5m errar um ataque corpo a corpo contra você, agarra e arrasta essa criatura 3m em qualquer direção, depois a arremessa 1,5m por ponto do seu modificador de Força (mínimo 1,5m); se bater numa superfície sólida no caminho, sofre 1d6 de dano de Concussão pra cada 3m que não conseguiu percorrer. Em ranks mais altos: +3 de custo e +3m na distância do arremesso por rank acima de D.'},
  {nome:'Golpe da Palma do Dragão', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho de Dragão. Ataque de Taijutsu corpo a corpo (Finalizador): acerto causa seu dano desarmado + 2d4 e empurra o alvo 3m; usado como Finalizador, o dano vira seu dano desarmado + 2d12 (empurrão continua 3m). Se o alvo bater numa superfície sólida no caminho, sofre 1d6 de dano de Concussão pra cada 3m que não conseguiu percorrer. Em ranks mais altos: +3 de custo, +1d4 (ou 1d12) de dano e +1,5m no empurrão por rank acima de D.'},
  {nome:'Contragolpe!', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Reação a um ataque que te acertaria: recua até 3m de quem te atacou e testa Destreza contra o resultado do ataque — se ganhar, o ataque erra. Depois, avança até 6m em direção a quem te atacou e faz um ataque desarmado: seu dano desarmado + 2 dados extras (do mesmo tipo do dano desarmado). Em ranks mais altos: +3 de custo e +1 dado extra por rank acima de D.'},
  {nome:'Entrada Dinâmica', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu contra um alvo em até 9m: acerto causa 3d10 de dano de Concussão. Acertando ou errando, você se move até 9m, terminando a até 1,5m do alvo original. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D.'},
  {nome:'Combo Errático', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho Bêbado. 2 Ataques de Taijutsu corpo a corpo (Combo) contra o mesmo alvo: cada acerto causa 2d6 de dano de Concussão e te dá +1 de Defesa até o início do seu próximo turno. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Exorcismo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'3 Ataques de Taijutsu corpo a corpo (Combo): cada acerto causa 1d12 de dano de Concussão e empurra o alvo 1,5m na direção que escolher; acertando pelo menos uma vez, o alvo testa Constituição ou ganha 1 rank de Machucado. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo por rank acima de D; do Rank B em diante, +1d12 de dano; no Rank S, mais +1d12.'},
  {nome:'Dragão em Queda', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Só pode mirar num alvo no ar ou caindo. Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 3d6 e manda o alvo se espatifar no chão, Derrubado. Usado como Finalizador, você cai atrás dele em alta velocidade e faz um segundo Ataque de Taijutsu corpo a corpo, causando mais 3d6 de dano de Concussão no acerto. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Combo da Pena', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode ser lançado estando no ar, caindo, ou mirando num alvo no ar ou caindo. 2 Ataques de Taijutsu corpo a corpo (Combo): cada acerto causa seu dano desarmado; acertando o mesmo alvo duas vezes, usa o impulso pra se propelir até 6m em qualquer direção, pousando sem sofrer dano de queda. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Primeiro Fôlego Celestial: Inspirar', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Dobra sua capacidade pulmonar, aumentando força física: enquanto durar (a concentração não quebra por dano, mas não pode manter concentração em Ninjutsu ou Genjutsu ao mesmo tempo), ganha +1 em ataques de Taijutsu, +1d8 de dano de Taijutsu até duas vezes por turno, e +3m de deslocamento.'},
  {nome:'Touro Impetuoso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enquanto durar, sua Força e Constituição viram 16 se forem menores, e ganha +15 de PV temporário. Sempre que lançar um Finalizador nesse período, um acerto ou uma falha na resistência do alvo também dá a ele +1 rank de Contundido.'},
  {nome:'Gato Gracioso', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enquanto durar, sua Destreza e Sabedoria viram 16 se forem menores, não sofre dano de queda de quedas menores que 9m, ganha +6m de deslocamento e +2 na Percepção passiva. Sempre que lançar um Combo nesse período, ganha mais +3m de deslocamento até o fim daquele turno.'},
  {nome:'Martelo', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Só pode mirar num alvo que já poderia ser alvo de um Finalizador ignorando alcance (ou seja, depois de um Combo). Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 3d8 de dano de Concussão e o alvo testa Força ou ganha +1 rank de Contundido e fica Zonzo. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D.'},
  {nome:'Aquecimento', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'O custo deste jutsu nunca pode ser reduzido. O próximo Taijutsu que exigir um teste de ataque tem o dado de dano subindo 1 degrau até o fim do turno (d4→d6→d8→d10→d12); em troca, até o início do turno seguinte, fica vulnerável ao próximo dano de Concussão, Perfuração ou Corte que um inimigo causar. Em ranks mais altos: +3 de custo por rank acima de D; do Rank C em diante, rerrola 1s, 2s e 3s no dano (ficando com o segundo resultado); do Rank B em diante, mais 1 degrau no dado; do Rank A em diante, o próximo Taijutsu ignora Resistência e Imunidade; no Rank S, a duração vira 1 minuto, o dado sobe 2 degraus a mais, e a vulnerabilidade (à sua escolha do tipo) dura o mesmo tempo.'},
  {nome:'Monge Elevado', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'2 Ataques de Taijutsu corpo a corpo: cada acerto causa seu dano desarmado + 1d6. Usado como Finalizador, o dano vira seu dano desarmado + 2d6 e você salta 4,5m pra trás sem provocar ataque de oportunidade. Em ranks mais altos: +3 de custo e +1,5m no salto por rank acima de D; no Rank B, +1d6 de dano; no Rank S, +2d6.'},
  {nome:'Punho Uivante', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Precisa estar na Postura do Punho de Lobo (não custa Chakra pra manter a concentração). Enquanto durar, pode usar o Punho da Presa de Lobo como Ação Bônus, uma vez por turno.'},
  {nome:'Punho de Ferro', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Precisa estar na Postura do Punho de Ferro. Ataque de Taijutsu corpo a corpo: acerto causa seu dano desarmado + 2d6 e o alvo testa Força ou é arremessado 1,5m por ponto do seu modificador de Força. Usado como Finalizador, o dano vira seu dano desarmado + 4d6 e o arremesso dobra pra 3m por ponto — se atingir uma superfície fina (menos de 1,5m de espessura) e ainda sobrar 3m ou mais de arremesso, ele atravessa a superfície, sofrendo 3d6 de dano de Concussão. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Golpe de Ferro', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'3 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Ataque de Taijutsu: acerto causa seu dano desarmado + 2d6; se o alvo lançar um jutsu como Reação a esse dano, o custo dele sobe +4 (ou ele precisa gastar 10 de Chakra pra reagir, se o jutsu normalmente não custasse nada). Usado como Finalizador, o dano vira seu dano desarmado + 4d6 e o aumento de custo da Reação vira +8. Em ranks mais altos: +3 de custo, +1d8 de dano e +4 no aumento de custo da Reação por rank acima de D.'},
  {nome:'Vendaval da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
    efeito:'Chute giratório baixo contra um alvo em até 1,5m, que testa Destreza ou cai Derrubado e precisa gastar a Ação pra se levantar até o fim do turno seguinte. Até o fim do turno, pode lançar um Finalizador nesse alvo ignorando alcance e tempo de conjuração (Ação ou Ação Bônus), uma vez por turno.'},
  {nome:'Chute da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',

  {nome:'Gancho da Folha', tipo:'Taijutsu', categoria:'Taijutsu', rank:'D', custo:'4 Chakra', alcance:'1,5m', duracao:'Instantâneo',
