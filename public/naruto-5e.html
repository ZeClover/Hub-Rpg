<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Naruto 5e</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s,transform .12s;
}
button:hover{border-color:var(--suave)}
button:not(:disabled):active{transform:scale(.95)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
button:disabled{opacity:.4; cursor:default}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:960px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.cartao h2{font-size:17px; margin-bottom:12px}
.cartao h3{font-size:14px; color:var(--ambar-forte); margin:14px 0 8px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)} }

.campo{margin-bottom:12px}
.linha{display:flex; align-items:center; gap:8px}
.linha .cresce{flex:1}

.estat{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--superficie-alta); border:1px solid var(--borda); border-radius:10px;
  padding:10px 8px;
}
.estat .num{font-size:24px; font-weight:700; font-family:Georgia,serif}
.estat .rot{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--suave)}
.estat .mod{font-size:13px; color:var(--ambar-forte)}

table.lista{width:100%; border-collapse:collapse; font-size:14px}
table.lista th{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--suave); padding:6px 8px; border-bottom:1px solid var(--borda)}
table.lista td{padding:6px 8px; border-bottom:1px solid var(--borda); vertical-align:middle}
table.lista tr:last-child td{border-bottom:none}
.check{width:18px; height:18px; cursor:pointer}

.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px;
  border:1px solid var(--borda); color:var(--suave)}
.pill.on{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.aviso{font-size:13px; color:var(--suave); font-style:italic}
.rolagem{font-family:Georgia,serif; font-size:13px; color:var(--ambar-forte); min-width:70px; text-align:right}

.referencia{font-size:13.5px; color:var(--suave)}
.referencia b{color:var(--texto)}
.referencia ul{margin:6px 0; padding-left:20px}

footer{max-width:960px; margin:0 auto; padding:0 16px 40px; color:var(--suave); font-size:12px}
[hidden]{display:none !important}
</style>
</head>

<div class="barra">
  <span class="marca">Hub RPG · Naruto 5e</span>
  <div class="cresce"></div>

  <button id="btModoGuiado" title="Criação passo a passo, explicando o sistema">🧭 Modo Guiado</button>
  <button id="btnNovo">+ Novo</button>
  <button id="btnDuplicar">Duplicar</button>
  <button id="btnExportar">Exportar</button>
  <button id="btnImportar">Importar</button>
  <button id="btnExcluir" class="perigo">Excluir</button>
  <a href="/fichas">← Fichas</a>
</div>

<main>
  <div class="abas" role="tablist"></div>
  <div id="conteudo"></div>
</main>

<footer>
  Homebrew de fã (Naruto 5e, comunidade), baseado em Dungeons &amp; Dragons 5ª
  Edição. O Hub codifica só a mecânica em números — nada de texto, arte ou
  fluff do livro. Ficha salva neste navegador (localStorage); Modo Hub
  (salvar na conta) fica para uma fatia futura.
</footer>

<input type="file" id="arquivoImportar" accept="application/json" hidden>

<script>
/* ---------- Matemática base (mesma convenção usada em dnd-5e.html) ---------- */
function modAtributo(valor){ return Math.floor((valor - 10) / 2); }
function fmtMod(mod){ return mod >= 0 ? `+${mod}` : `${mod}`; }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/*
  Bônus de Proficiência do Naruto 5e é DIFERENTE do D&D 5e padrão: começa em
  +3 (não +2) e sobe a cada 3 níveis, não a cada 4. Tabela conferida linha a
  linha no livro (Character Advancement, cap. "Ambições & Antecedentes").
*/
function bonusProficiencia(nivel){
  const n = clamp(nivel || 1, 1, 20);
  return 3 + Math.floor((n - 1) / 3);
}
function metadeProfArredondada(nivel){ return Math.floor(bonusProficiencia(nivel) / 2); }

const XP_POR_NIVEL = [0,0,50,75,100,150,200,350,475,600,725,850,1000,1200,1400,1600,1800,2100,2400,2700,3000];

/* Dado de Vida/Chakra: valor fixo por nível (regra padrão do livro, não
   rolada) — no 1º nível vale o dado cheio + mod; nos seguintes, a média do
   dado arredondada para cima + mod, exatamente como o exemplo do próprio
   livro (3d12 = 21, ou seja 7 por nível, contando o 1º). */
const DADOS = ['d6','d8','d10','d12'];
function faceDado(dado){ return Number(String(dado||'d8').replace(/\D/g,'')) || 8; }
function mediaDadoArredondada(dado){ return Math.ceil((faceDado(dado) + 1) / 2); }
function totalPorDado(dado, nivel, mod){
  const n = clamp(nivel || 1, 1, 20);
  return n * (mediaDadoArredondada(dado) + mod);
}

/* ---------- Catálogos (chassi — clãs/classes/jutsu completos são fatias futuras) ---------- */
const ATRIBUTOS = [
  {id:'forca', nome:'Força'},
  {id:'destreza', nome:'Destreza'},
  {id:'constituicao', nome:'Constituição'},
  {id:'inteligencia', nome:'Inteligência'},
  {id:'sabedoria', nome:'Sabedoria'},
  {id:'carisma', nome:'Carisma'},
];
function atributo(id){ return ATRIBUTOS.find(a => a.id === id) || null; }

/* As 21 perícias do livro: Arcana virou Ninshou, e Controle de Chakra,
   Ilusões, Artes Marciais e Ofício são as quatro perícias novas (Religião
   saiu). Lista e atributo de cada uma conferidos no capítulo "Using Ability
   Scores". */
const PERICIAS = [
  {id:'atletismo', nome:'Atletismo', atributo:'forca'},
  {id:'artesMarciais', nome:'Artes Marciais', atributo:'forca'},
  {id:'acrobacia', nome:'Acrobacia', atributo:'destreza'},
  {id:'prestidigitacao', nome:'Prestidigitação', atributo:'destreza'},
  {id:'furtividade', nome:'Furtividade', atributo:'destreza'},
  {id:'controleChakra', nome:'Controle de Chakra', atributo:'constituicao'},
  {id:'oficio', nome:'Ofício', atributo:'inteligencia'},
  {id:'historia', nome:'História', atributo:'inteligencia'},
  {id:'investigacao', nome:'Investigação', atributo:'inteligencia'},
  {id:'natureza', nome:'Natureza', atributo:'inteligencia'},
  {id:'ninshou', nome:'Ninshou', atributo:'inteligencia'},
  {id:'adestrarAnimais', nome:'Adestrar Animais', atributo:'sabedoria'},
  {id:'ilusoes', nome:'Ilusões', atributo:'sabedoria'},
  {id:'intuicao', nome:'Intuição', atributo:'sabedoria'},
  {id:'medicina', nome:'Medicina', atributo:'sabedoria'},
  {id:'percepcao', nome:'Percepção', atributo:'sabedoria'},
  {id:'sobrevivencia', nome:'Sobrevivência', atributo:'sabedoria'},
  {id:'enganacao', nome:'Enganação', atributo:'carisma'},
  {id:'intimidacao', nome:'Intimidação', atributo:'carisma'},
  {id:'atuacao', nome:'Atuação', atributo:'carisma'},
  {id:'persuasao', nome:'Persuasão', atributo:'carisma'},
];
function pericia(id){ return PERICIAS.find(p => p.id === id) || null; }

/* Clãs (Compêndio de Estudos da Tsunade) — mecânica traduzida e resumida
   pelo Hub. O compêndio lista mais de 30 clãs, mas a extração do PDF parou
   no meio (mesma trava que já tinha acontecido com o Fabula Ultima): só os
   primeiros 15, em ordem alfabética até Hyūga, vieram completos. O resto
   (Iburi em diante) entra numa fatia futura, quando o resto do PDF chegar.
   Quando o clã dá bônus "ou" num atributo/afinidade, o texto conta as
   opções — a ficha não impõe escolha automática no atributo (mesmo

const CLAS = [

    pericias:['artesMarciais','medicina'],

    pericias:['ninshou','percepcao'],
    traco:'Afinidade de Raio de nascença; reduz o requisito de atributo pra aprender e lançar jutsu de Raio.'},

  {id:'hoshi', nome:'Hoshi', bonus:'+2 Constituição, +1 Inteligência', velocidade:9,
    pericias:['controleChakra','ninshou'],
    traco:'Aprende 1 Hijutsu D-Rank exclusivo do clã a mais, sem contar nos jutsu conhecidos.'},
  {id:'hoshigaki', nome:'Hoshigaki', bonus:'+2 Constituição, +1 Força', velocidade:9,
    pericias:['adestrarAnimais','atletismo'],
    traco:'Visão no escuro até 9m; proficiência com armas pesadas (Machado Grande, Naginata, Odachi, Foice, Tetsubo); afinidade de Água com requisito de atributo reduzido.'},
  {id:'hozuki', nome:'Hōzuki', bonus:'+2 Força, +1 Inteligência', velocidade:9,
    pericias:['artesMarciais','controleChakra'],
    traco:'Velocidade de natação 9m; afinidade de Água de nascença; não pode aprender nem usar Ninjutsu de Raio.'},
  {id:'hyuga', nome:'Hyūga', bonus:'+2 Sabedoria, +1 Destreza', velocidade:9,

    traco:'Visão no escuro até 9m (Byakugan) e 1 Jutsu D-Rank exclusivo do clã a mais, sem contar nos jutsu conhecidos.'},

function cla(id){ return CLAS.find(c => c.id === id) || null; }

/* Classes (Compêndio de Observação do Orochimaru) — as 11 completas. As 5
   primeiras vieram pelo Google Drive (trava de extração no meio do
   Ninjutsu Specialist); Zé mandou o PDF recortado em 6 partes como anexo
   pra fechar as 6 que faltavam (Scout-Nin a Science-Nin). CD/ataque de
   Ninjutsu/Genjutsu/Taijutsu conferidos nas 11: são SEMPRE Inteligência/
   Sabedoria/Força, sem exceção — por isso isso virou o padrão fixo da aba
   Jutsu (o seletor manual continua existindo só por segurança, caso
   Talentos/Modificações de Classe abram uma exceção no futuro). Escolhas
   de perícia "escolha N de..." ficam como texto de referência, não
   marcadas sozinhas (é decisão do jogador, igual as escolhas "ou" dos
   Clãs). `periciaFixa: null` marca as 2 classes (Scout-Nin, Science-Nin)
   cujas 4 perícias são todas de escolha, sem nenhuma fixa. */
const CLASSES = [

    proficiencias:'Armadura leve e média; armas simples; Kit de Medicina e Kit de Veneno.',
    periciaFixa:'medicina', periciasEscolha:'Controle de Chakra fixa, mais escolha 2 entre História, Intuição, Percepção, Ilusões, Ninshou.',
    subclasses:{nome:'Preceito da Medicina', opcoes:['Adept Medic','Combat Medic','Transmuter']},

    subclasses:{nome:'Foco de Ninjutsu', opcoes:['Blaze Walker','Hijutsu Elitist','Sanguine Master','Scribe Master','Stone Crusher','Storm Terror','Summoner','The Professor','Trace Talent','Tsunami']},

    dadoVida:'d8', dadoChakra:'d10', resistencias:['forca','constituicao','inteligencia'],

  {id:'taijutsuSpecialist', nome:'Taijutsu Specialist', tier:'Baixo (2-3 recursos extras)',

/* Vantagem Elemental (cap. Combate) — ciclo fixo de superioridade entre as
   5 naturezas. Quem usa o elemento superior tem vantagem no ataque ou no
   teste de Clash contra o elemento inferior. */
const CICLO_ELEMENTOS = ['Fogo','Vento','Raio','Terra','Água'];
function elementoSuperior(atacante, alvo){
  if(!atacante || !alvo || atacante === alvo) return 'neutro';
  const i = CICLO_ELEMENTOS.indexOf(atacante);
  if(i === -1) return 'neutro';
  const proximo = CICLO_ELEMENTOS[(i + 1) % CICLO_ELEMENTOS.length];
  if(proximo === alvo) return 'vantagem';
  const anterior = CICLO_ELEMENTOS[(i + CICLO_ELEMENTOS.length - 1) % CICLO_ELEMENTOS.length];
  if(anterior === alvo) return 'desvantagem';
  return 'neutro';
}

  {nome:'Liberação de Água: Escondido na Névoa', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'6 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Vira névoa (só termina a 0 PV/Chakra, nunca por perder concentração ou ficar Incapacitado): 6m de voo, resistência a todo dano menos Terra, vantagem em Força/Destreza/Constituição, passa por frestas — mas não consegue falar, interagir, atacar nem lançar jutsu enquanto estiver assim.'},
  {nome:'Liberação de Água: Água-Viva Medicinal', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'9 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Água-viva grudada num aliado cura 4 PV no início do turno dele (tem a mesma CA do hospedeiro, mas só 1 PV, e pode ser alvo de ataques) — se o hospedeiro cair a 0 PV, ela murcha e o jutsu acaba.'},
  {nome:'Liberação de Água: Escorpião', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'8 Chakra', alcance:'4,5m', duracao:'Concentração, até 1 minuto',
    efeito:'2 Ataques de Ninjutsu corpo a corpo com um ferrão de água (3d6 de dano de Frio cada): teste de Constituição ou 1 rank de Resfriado, com o próximo dano de Frio sofrido subindo um passo de dado (perto de água, custa 2 Chakra a menos ou também causa a mesma quantidade em dano de Chakra).'},
  {nome:'Liberação de Água: Maré Furiosa', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'8 Chakra', alcance:'Pessoal (linha de 18m)', duracao:'Instantâneo',
    efeito:'Onda numa linha de 18m: teste de Força ou 3d8 de dano de Frio, Resfriado, empurrado 9m e Derrubado (metade e nada mais se passar) — perto de água, custa 2 Chakra a menos ou vira um cone de 9m.'},
  {nome:'Liberação de Água: Rugido de Atlântida', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'8 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Os jutsu de Água do alvo deixam quem eles afetam Molhado — Molhado que sofre dano de Fogo pega fogo extra e gera vapor que ofusca; que sofre Raio espalha o choque pros vizinhos; que sofre Vento espalha a condição Molhado pra quem estiver a até 3m.'},
  {nome:'Liberação de Água: Muralha de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'8 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Ergue uma parede de água (até 9m de comprimento, 3m de altura; CA igual à sua CD, PV 6d4+CD, resistente a Fogo; terreno difícil) que vira fonte de água pra jutsu Rank C ou menor quando acaba — perto de água, custa 2 Chakra a menos ou causa 2d8 de dano de Frio em quem atravessar pela primeira vez.'},
  {nome:'Liberação de Água: Absorção de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'7 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Absorve fontes de água por perto (até 3800 litros de um lago/mar): Força vira 20 (ou 22 se já for 20), pulo dobrado, resistência a Concussão e +2d10 de dano no primeiro acerto do turno — ao acabar, fica Fragilizado e Lento até o turno seguinte.'},
  {nome:'Liberação de Água: Respiração Aquática', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'6 Chakra', alcance:'Pessoal', duracao:'1 hora',
    efeito:'Respira embaixo d\'água normalmente por 1 hora.'},
  {nome:'Liberação de Água: Bala de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'7 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Ataque de Ninjutsu à distância: 4d6 de dano de Frio que ignora redução de dano (perto de água, custa 2 Chakra a menos ou atinge mais um alvo).'},
  {nome:'Liberação de Água: Clone de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'Especial (8 Chakra)', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Cria até 2 clones de água (8 Chakra cada) que lançam jutsu de Água Rank D que você conhece, com dado de dano mínimo d6, e atacam causando 1d8 de dano de Frio — vários clones no mesmo alvo somam +1d6 por clone extra ao ataque do clone líder.'},
  {nome:'Liberação de Água: Espada Cortante de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Cria uma espada de água (sem gastar Chakra pra manter): Ataque de Ninjutsu corpo a corpo causando 4d8 + seu modificador de dano de Frio (perto de água, custa 2 Chakra a menos ou o dado de dano sobe um passo).'},
  {nome:'Liberação de Água: Formação de Água: Lagoa', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'6 Chakra', alcance:'Pessoal (7,5m)', duracao:'Instantâneo',
    efeito:'Cria uma lagoa (área de 7,5m) que serve de fonte de água pra até 5 jutsu de Água.'},
  {nome:'Liberação de Água: Permeação de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'6 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Vira uma poça de água por 1 minuto: 18m de deslocamento, 36m de nado, passa por frestas de 1mm, sentido sísmico de 18m no lugar da visão, imune a Frio/Concussão/Perfurante/Cortante (vulnerável a Raio) — mas não consegue atacar, fazer Selos nem moldar Chakra.'},
  {nome:'Liberação de Água: Prisão de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'7 Chakra', alcance:'Toque', duracao:'Concentração, até 1 hora',
    efeito:'Teste de Destreza ou fica Restrito dentro de uma bolha (CA igual à sua CD, 10 PV, vulnerável a Terra, intercepta dano dirigido ao alvo) — você precisa manter contato com ela; o preso testa Força no fim de cada turno pra escapar (perto de água, custa 2 Chakra a menos ou esse teste vem em desvantagem).'},
  {nome:'Liberação de Água: Trombeta de Água', tipo:'Ninjutsu', categoria:'Água', rank:'C', custo:'9 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Ataque de Ninjutsu à distância: 4d10 de dano de Frio (perto de água, custa 2 Chakra a menos ou dobra o dano contra construtos e estruturas).'},

  {nome:'Liberação de Água: Armadura de Poseidon', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'14 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'Veste uma armadura de água por até 10 minutos; totalmente submerso, ganha 36m de nado, respira embaixo d\'água, 18m de sentido sísmico, seus jutsu de Água somam +1 dado de dano (2 se o alvo estiver Resfriado) 1×/turno, e pode trocar um ataque de arma por um Ataque de Ninjutsu corpo a corpo (3d8+mod. de Frio) ou à distância (2d8+mod., alcance 18/36m).'},
  {nome:'Liberação de Água: Absorção da Névoa Sangrenta', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'14 Chakra', alcance:'Pessoal (cubo de 13,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Custa 5 PV seus pra lançar: névoa vermelha numa área de 13,5m (visibilidade de só 1,5m) — você sempre sabe onde todos estão; quem não estiver no PV máximo perde Chakra no início do turno, e ninguém consegue curar PV ou remover Sangramento lá dentro.'},
  {nome:'Liberação de Água: Profundeza', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'Especial (77 Chakra)', alcance:'Pessoal (esfera de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Kinjutsu: cria esferas de água (9m de raio) onde os conjuradores e até 2 aliados escolhidos por cada um ganham 18m de nado e respiram normalmente (sem risco de afogar, e jutsu que lançarem lá dentro causam dano de Frio); quem mais estiver na área ao ser criada testa Destreza (ou é puxado 9m pro centro) e Constituição (ou começa a se afogar, sobrevivendo um número de rodadas igual ao seu mod. de Constituição antes de desmaiar). Em Combinação, o custo cai e o raio cresce com o maior Carisma do grupo.'},
  {nome:'Liberação de Água: Onda de Choque Explosiva', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'14 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'1 minuto',
    efeito:'Expele um oceano numa área de 18m (você fica em pé sobre ela): teste de Força ou 6d8 de dano de Frio e empurrado 9m submerso (com sucesso, flutua por cima e é empurrado 4,5m sem dano) — a água serve de fonte pra até 15 jutsu de Água.'},
  {nome:'Liberação de Água: Espelho Celestial da Esperança', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'Especial', alcance:'Especial', duracao:'Instantâneo',

  {nome:'Liberação de Água: Vórtice Aquático', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'12 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Redemoinho de água (6m de raio, terreno difícil): teste de Força ou 5d8 de dano de Frio e puxado 3m pro centro (metade se passar) — pode mover 9m por Ação Bônus (perto de água, custa 2 Chakra a menos ou quem já estiver Resfriado testa em desvantagem).'},
  {nome:'Liberação de Água: Água Dolorosa', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'11 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Chuva Vermelha', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'13 Chakra', alcance:'27m (raio de 3m)', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Gotas Reflexivas: Pingo', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'12 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Bolha protetora (5d8 + seu mod. de Ninjutsu em PV, resistente a Fogo, vulnerável a Terra) intercepta ataques até seu próximo turno; quem te acerta corpo a corpo sofre metade do próprio dano de volta em Frio (menos dano de Terra), e você tem vantagem em testes de resistência contra jutsu de área.'},
  {nome:'Liberação de Água: Bomba de Tubarão', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'12 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Arco do Tsunami', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'14 Chakra', alcance:'Pessoal', duracao:'Concentração, até 10 minutos',
    efeito:'2 Ataques de Ninjutsu à distância por ação (alcance de 36m): 3d12 de dano de Frio e teste de Constituição ou Resfriado até o fim do turno seguinte (perto de água, custa 2 Chakra a menos ou também reduz o deslocamento do alvo em 4,5m).'},
  {nome:'Liberação de Água: Presa de Água', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'11 Chakra', alcance:'9m', duracao:'Instantâneo',

  {nome:'Liberação de Água: Agulhas de Água da Morte', tipo:'Ninjutsu', categoria:'Água', rank:'B', custo:'13 Chakra', alcance:'Toque', duracao:'Instantâneo',

  {nome:'Liberação de Água: Permeação Ácida', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'20 Chakra', alcance:'Pessoal (4,5m)', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Agulhas de Chuva Caindo', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'19 Chakra', alcance:'36m (cubo de 27m)', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Grande Presa da Hidra', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'18 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Manifesta 9 cabeças de hidra de água: cada cabeça pode atacar (Ataque de Ninjutsu à distância, 8d8 de dano de Frio, gasta 1 cabeça), proteger com Reação (5d8 de PV temporário contra um ataque, gasta 1 cabeça), ou 3 cabeças de uma vez dão imunidade total a um efeito que pediria teste de Força/Destreza/Constituição até o fim do turno.'},
  {nome:'Liberação de Água: Grande Bala de Tubarão', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'20 Chakra', alcance:'36m', duracao:'Instantâneo',

  {nome:'Liberação de Água: Tigre da Chuva à Vontade', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'20 Chakra', alcance:'16km', duracao:'24 horas',
    efeito:'Nuvens de chuva cobrindo 16km ao redor: sente todo movimento e atividade que a chuva tocar (sem saber a localização exata) por 24 horas.'},
  {nome:'Liberação de Água: Tridente', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'20 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Dragão de Água', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'20 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Um dragão de água investe contra o alvo: Ataque de Ninjutsu à distância causando 14d6 de dano de Frio e teste de Constituição ou Atordoado e Derrubado até o fim do turno seguinte (perto de água, custa 2 Chakra a menos ou o dado de dano vira d8).'},
  {nome:'Liberação de Água: Muralha de Formação de Água', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'18 Chakra', alcance:'9m (esfera de 1,5m)', duracao:'Instantâneo',
    efeito:'Reação: protege você ou um aliado a até 9m com uma redoma de água giratória (20d6 PV até o início do próximo turno), protegendo também quem estiver a até 1,5m dele — perto de água, custa 2 Chakra a menos ou o raio de proteção dobra pra 3m.'},
  {nome:'Liberação de Água: Onda Cortante de Água', tipo:'Ninjutsu', categoria:'Água', rank:'A', custo:'19 Chakra', alcance:'Pessoal (cone de 18m)', duracao:'Instantâneo',
    efeito:'Jato de água pressurizada num cone de 18m: teste de Destreza ou 8d10 de dano de Frio (perto de água, custa 2 Chakra a menos ou também testa Constituição contra 2 ranks de Resfriado).'},

  {nome:'Liberação de Água: Afogar', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'30 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',

  {nome:'Liberação de Água: Tsunami de Vórtice Gigante', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'25 Chakra', alcance:'Pessoal (cone de 36m)', duracao:'Instantâneo',

  {nome:'Liberação de Água: Dança da Grande Prisão de Água', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'Concentração, até 10 minutos',
    efeito:'Esfera de água de 18m de raio centrada em você (se move com você): quem estiver dentro testa Força ou fica preso lá dentro, debaixo d\'água (só escapa alcançando a borda se passar no teste).'},
  {nome:'Liberação de Água: Chuva do Rancor', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'30 Chakra', alcance:'Pessoal (raio de 16km)', duracao:'Concentração, até 1 hora',

  {nome:'Liberação de Água: Convergência dos Céus de Água', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'22 Chakra', alcance:'Pessoal (raio de 18m)', duracao:'Concentração, até 10 minutos',
    efeito:'Controla toda água num raio de 36m: jutsu de Água Rank A ou menor custam metade — ganha ações extras: Broca de Água (Ataque de Ninjutsu à distância, 10d12 de dano de Frio), Armadura de Água (Reação a um acerto, 30 PV temporário até o próximo turno) e Correntes de Água (teste de Força ou fica Restrito e Incapacitado, repetindo o teste a cada turno pra se soltar).'},
  {nome:'Liberação de Água: Leão de Água Supremo', tipo:'Ninjutsu', categoria:'Água', rank:'S', custo:'25 Chakra', alcance:'36m', duracao:'Concentração, até 1 minuto',
    efeito:'Invoca um construto de água gigantesco (usa seu bônus/CD de Ninjutsu, rola iniciativa própria) — por Ação Bônus, você pode se fundir com a cabeça dele (tocando-o) e ganhar cobertura total contra tudo de fora enquanto estiver fundido.'},

  {nome:'Liberação de Raio: Banquete do Raio', tipo:'Ninjutsu', categoria:'Raio', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Instantâneo',

  {nome:'Liberação de Raio: Impulso Carregado', tipo:'Ninjutsu', categoria:'Raio', rank:'D', custo:'4 Chakra', alcance:'Toque', duracao:'Até 8 horas',
    efeito:'+1d8 na primeira rolagem de iniciativa do alvo; no minuto seguinte, ele pode usar Disparada como Ação Bônus todo turno (aí o jutsu acaba).'},
  {nome:'Liberação de Raio: Disjuntor', tipo:'Ninjutsu', categoria:'Raio', rank:'D', custo:'5 Chakra', alcance:'27m', duracao:'Instantâneo',
    efeito:'Ataque de Ninjutsu à distância: 1d6 de dano de Raio — quem estiver concentrado testa em desvantagem, e quem tiver um jutsu ativo sem concentração perde os benefícios até o fim do turno seguinte — Sobrecarga: dano sobe 2 passos de dado e soma seu modificador de Ninjutsu.'},
  {nome:'Liberação de Raio: Incômodo Eletromagnético', tipo:'Ninjutsu', categoria:'Raio', rank:'D', custo:'3 Chakra', alcance:'Pessoal (cubo de 7,5m)', duracao:'Instantâneo',
    efeito:'Onda elétrica numa área de 7,5m: teste de Constituição ou 1 rank de Chocado (em desvantagem se já estiver Chocado) — Sobrecarga: reduz o deslocamento em 3m por rank de Chocado que tiver.'},
  {nome:'Liberação de Raio: Campo Eletromagnético', tipo:'Ninjutsu', categoria:'Raio', rank:'D', custo:'5 Chakra', alcance:'Pessoal (cubo de 7,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Aura elétrica numa área de 7,5m: teste de Constituição ou o primeiro dano de Raio que sofrerem a cada turno sobe um passo de dado.'},

    efeito:'Reação imposta num aliado (não você) em até 9m que sofreu dano: ganha +1d6 em ataque e dano até o fim do turno seguinte, mas no fim desse turno testa Inteligência: sucesso crítico resiste e fica imune aos efeitos secundários até o fim do seu próximo turno; sucesso resiste aos efeitos negativos; falha sofre 2d6 de dano Psíquico; falha crítica é igual, e também leva -1d6 em ataque e dano até o fim do turno seguinte.'},
  {nome:'Noite: Dor Gélida', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'4,5m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu corpo a corpo em até 4,5m: acerto causa 4d6 de dano Psíquico e o alvo testa Inteligência — sucesso crítico resiste e fica imune aos efeitos secundários até o fim do seu próximo turno; sucesso resiste; falha dá 1 rank de Contundido; falha crítica dá 2 ranks. Em ranks mais altos: +3 de custo, +1d6 de dano e +1 alvo por rank acima de D.'},
  {nome:'Noite: Visão Gélida', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (raio de 6m)', duracao:'Concentração, até 1 minuto',
    efeito:'Aura num raio de 6m ao seu redor; alvos à sua escolha testam Inteligência (Visão de Chakra não dá vantagem nesse teste): sucesso crítico resiste e fica imune por 10 minutos; sucesso resiste; falha dá 2 ranks de Ofuscado a quem tiver Visão de Chakra ou Visão no Escuro, enquanto estiver na área se beneficiando desses sentidos; falha crítica também faz perder a Visão de Chakra ou Visão no Escuro enquanto durar.'},
  {nome:'Noite: Pensamentos Gélidos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (cubo de 7,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Onda de choque vocal num cubo de 7,5m a partir de você; alvos à sua escolha testam Inteligência: sucesso crítico resiste e fica imune por 10 minutos; sucesso resiste; falha dá 1 rank de Lento enquanto durar; falha crítica também dá 1 rank de Ofuscado. Em ranks mais altos: +3 de custo e +1,5m no tamanho do cubo por rank acima de D.'},
  {nome:'Noite: Toque Gélido', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (linha de 9m por 1,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Feixe numa linha de 9m de comprimento por 1,5m de largura a partir de você; alvos à sua escolha na linha testam Inteligência: sucesso crítico resiste e fica imune por 10 minutos; sucesso resiste; falha faz o alvo perder a noção de dor — o próximo Genjutsu que o afetar age sem que ele perceba, e então este jutsu acaba; falha crítica é igual, mas também sofre 3d6 de dano Psíquico no início de cada turno enquanto durar (refazendo a resistência no fim do turno pra encerrar esse dano).'},
  {nome:'Noite: Palavras Gélidas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (cone de 6m)', duracao:'Concentração, até 1 minuto',
    efeito:'Onda vocal num cone de 6m a partir de você; alvos à sua escolha testam Inteligência: sucesso crítico resiste e fica imune por 10 minutos; sucesso resiste; falha deixa o alvo Surdo a qualquer som que não venha de você; falha crítica é igual, e também dá -1d4 em resistências contra Genjutsu sonoros enquanto durar.'},
  {nome:'Mordida nos Calcanhares', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Cães ilusórios avançam sobre um alvo em até 27m, que testa Inteligência com vantagem se estiver a 3m ou mais do chão ou tiver vantagem em Percepção por algum sentido, traço ou jutsu: sucesso resiste; falha dá desvantagem em ataques e testes de perícia contra outra criatura à sua escolha, distraído pelos cães (refazendo a resistência no fim do turno pra encerrar); falha crítica é igual, e também causa 2d8 de dano Psíquico sempre que tentar lançar um jutsu com componente de Selos de Mão ou Mobilidade. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Visão Dolorosa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m testa Sabedoria: sucesso crítico resiste; sucesso resiste à maior parte do efeito mas fica sensível à luz, com -2 em ataques sob luz plena até o fim do turno seguinte; falha causa 2d8 + mod. de Genjutsu de dano Psíquico no início de cada turno do alvo (2d6 se estiver em penumbra), refazendo a resistência no fim de cada turno pra encerrar; falha crítica é igual, mas o dano sobe pra 3d8 (ou 3d6 em penumbra) e, sob luz plena, a resistência é refeita em desvantagem. Em ranks mais altos: +3 de custo, +1d8 (ou 1d6) de dano e +1 alvo por rank acima de D.'},
  {nome:'Voz Dolorosa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Grito num cone de 9m a partir de você; quem ouvir testa Sabedoria: sucesso crítico resiste; sucesso resiste à maior parte do efeito mas fica Surdo até o fim do turno seguinte; falha sofre 4d6 de dano Psíquico; falha crítica sofre 4d8 + mod. de Genjutsu. Em ranks mais altos: +3 de custo, +1d6 (ou 1d8) de dano e +1,5m de alcance por rank acima de D.'},
  {nome:'Luz Fantasma', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'3 Chakra', alcance:'Toque', duracao:'1 hora',
    efeito:'Toca um objeto de até 3m em qualquer dimensão: você e até 3 criaturas à sua escolha enxergam luz plena num raio de 6m ao redor dele e luz fraca por mais 6m (com a cor que quiser) — só vocês se beneficiam dessa luz; dispensa por Ação Bônus. Em ranks mais altos: +3 de custo e +1 objeto afetado por rank acima de D.'},
  {nome:'Psiônica: Garantia!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Reação ao ver uma criatura em até 18m sofrer dano: ela testa Inteligência; sucesso resiste à maior parte do efeito mas ainda sofre 2d6 de dano Psíquico; falha sofre Xd6 de dano Psíquico (X = seu modificador de Genjutsu); falha crítica é igual à falha e também fica Lento até o fim do turno seguinte.'},
  {nome:'Psiônica: Trava Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo hostil ao alcance de toque testa Inteligência: sucesso crítico resiste e fica imune a novas tentativas por 10 minutos; sucesso resiste; falha o trava numa repetição: em cada turno seguinte, é forçado a gastar a ação relançando o mesmo jutsu que lançou no turno anterior (à sua escolha) — se não tiver lançado nenhum, o efeito acaba na hora (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas a primeira resistência pra encerrar vem com -1d4.'},
  {nome:'Psiônica: Confusão!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo em até 18m testa Sabedoria: sucesso resiste; falha dá 1 rank de Confusão; falha crítica dá 1 rank de Confusão e soma +2 no primeiro teste pra remover a condição. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Psiônica: Corte!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu à distância: 4d8 de dano Psíquico (se lançado a até 3m do alvo, aumenta a faixa de crítico em +1). Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de D; no Rank B a faixa de crítico sobe mais +1, e no Rank S mais +2.'},
  {nome:'Psiônica: Atraso!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Escolhe um alvo em até 18m; no fim do seu turno seguinte, se ele tiver lançado algum jutsu no próprio turno seguinte, sofre 3d12 de dano Psíquico. Em ranks mais altos: +3 de custo e +1d12 de dano por rank acima de D.'},
  {nome:'Psiônica: Dreno!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Toque', duracao:'1 minuto',
    efeito:'Alvo hostil ao alcance de toque testa Inteligência: sucesso crítico resiste e fica imune a novas tentativas por 10 minutos; sucesso resiste; falha sofre 3d6 de dano Psíquico e -1d4 em ataques e testes de perícia baseados em Inteligência por 1 minuto; falha crítica é igual, mas o dano sobe pra 5d8. Em ranks mais altos: +3 de custo e mais 1d6 (ou 1d8) de dano por rank acima de D.'},
  {nome:'Psiônica: Expor Fraqueza', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m testa Inteligência: sucesso resiste; falha o deixa desajeitado — ataques contra ele ganham +1d4 pra acertar, uma vez por turno por atacante; falha crítica é igual, e também perde 1 de Defesa enquanto durar. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Psiônica: Futuro Falso', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo hostil em até 18m testa Inteligência: sucesso crítico resiste e fica imune a novas tentativas por 10 minutos; sucesso resiste; falha o força a gastar a Reação se movendo pelo menos 9m (se puder) pro espaço que escolheria se seu turno fosse agora; falha crítica é igual, mas o deslocamento fica pela metade até o fim do turno seguinte depois de se mover. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Psiônica: Fortaleza', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Armadura ilusória dá +1 de Defesa (+2 se você for alvo de um Ataque de Genjutsu); quem acertar você com arma corpo a corpo ou Taijutsu sofre um retorno psíquico e testa Inteligência (o dano recebido não muda): sucesso resiste; falha faz cair Derrubado e largar a arma, encerrando o jutsu; falha crítica é igual, e o deslocamento também cai a 0 até o fim do turno seguinte. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B você ganha redução de 5 no dano Psíquico enquanto durar, e no Rank S, redução de 10.'},
  {nome:'Psiônica: Transferência Hostil', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'3 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Escolhe um aliado em até 18m com alguma condição Mental e um alvo hostil também em até 18m, que testa Inteligência: sucesso resiste; falha faz o hostil ganhar uma das condições Mentais do aliado (à sua escolha); falha crítica faz o hostil ganhar todas as condições Mentais do aliado, que perde cada uma delas. Em ranks mais altos: +3 de custo e +1 alvo hostil por rank acima de D.'},
  {nome:'Psiônica: Meditar!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'3 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Enquanto durar, ganha +1d4 em ataques de Genjutsu e +1d6 de dano Psíquico extra nos Genjutsu que lançar. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B os dados sobem pra 1d6/1d8, e no Rank S pra 1d8/1d10.'},
  {nome:'Psiônica: Enxaqueca!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo em até 18m testa Inteligência (em desvantagem se tiver Inteligência 12 ou menos): sucesso resiste; falha sofre 4d4 de dano Psíquico e -3m de deslocamento até o fim do turno seguinte; falha crítica sofre 6d4 de dano Psíquico, -6m de deslocamento até o fim do turno seguinte, e o próximo jutsu (e custo de concentração) que pagar antes disso custa o dobro. Em ranks mais altos: +3 de custo, +1d4 de dano e +1 alvo por rank acima de D.'},
  {nome:'Psiônica: Mente em Branco!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo que ouvir você em até 18m testa Inteligência: sucesso crítico resiste; sucesso faz o próximo jutsu que lançar custar +4; falha o impede de lançar o jutsu que lançou no turno anterior (a tentativa simplesmente falha); falha crítica é igual, e também sofre 5d6 de dano Psíquico. Em ranks mais altos: +3 de custo, +1 alvo e +1d6 de dano por rank acima de D.'},
  {nome:'Psiônica: Onda Psíquica!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (cone de 4,5m)', duracao:'Instantâneo',
    efeito:'Cone de 4,5m a partir de você; alvos testam Sabedoria: sucesso resiste; falha dá Ofuscado e 1 rank de Confusão; falha crítica dá Ofuscado, 1 rank de Confusão e Contundido. Em ranks mais altos: +3 de custo e +1,5m no tamanho do cone por rank acima de D.'},
  {nome:'Psiônica: Pulso', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (6m)', duracao:'Instantâneo',
    efeito:'Alvos à sua escolha num raio de 6m ao seu redor testam Inteligência: sucesso resiste; falha sofre 3d4 de dano Psíquico e é empurrado 3m pra longe de você; falha crítica sofre 5d4 de dano Psíquico e é empurrado 7,5m. Em ranks mais altos: +3 de custo, +1d4 de dano e +1,5m de raio por rank acima de D.'},
  {nome:'Psiônica: Anular Alcance', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo hostil em até 18m testa Inteligência: sucesso resiste; falha dá 2 ranks de Ofuscado enquanto durar (não passa no fim dos turnos, só quando o jutsu acabar); falha crítica é igual, e jutsu ou ataques com alcance maior que 4,5m perdem 3m de alcance. Em ranks mais altos: +3 de custo, +1 alvo e mais 1,5m de redução na falha crítica por rank acima de D.'},
  {nome:'Psiônica: Pensamentos Compartilhados', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m testa Inteligência: sucesso crítico resiste e fica imune por 10 minutos, além de perceber que tentaram invadir a mente dele; sucesso resiste; falha faz o alvo compartilhar pensamentos sem perceber — no início de cada turno dele, o mestre revela o jutsu, ação ou pensamento que está tendo, e sempre que for lançar um jutsu ou atacar, você reage a tempo por já saber o que vem (refazendo a resistência no fim do turno dele, ainda sem perceber o Genjutsu); falha crítica é igual, mas ele só pode tentar resistir de novo quando perceber que está sob efeito.'},
  {nome:'Psiônica: Choque!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo em até 18m testa Inteligência: sucesso resiste; falha sofre 6d4 de dano Psíquico que ignora Resistência (Imunidade vale como Resistência); falha crítica sofre 6d6 de dano Psíquico nas mesmas condições e fica Zonzo. Em ranks mais altos: +3 de custo e +1d4 (ou 1d6) de dano, ou +1 alvo, por rank acima de D.'},
  {nome:'Psiônica: Golpe!', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Aliado tocado tem as mãos e pés banhados em energia psiônica: o primeiro ataque desarmado de cada turno dele causa +1d10 de dano Psíquico extra; se esse ataque for crítico, pode converter todo o dano causado nele em dano Psíquico. Em ranks mais altos: +3 de custo e +1d10 de dano por rank acima de D.'},
  {nome:'Psiônica: Suprimir Foco', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo hostil em até 18m sob efeito de algum bônus de jutsu testa Inteligência: sucesso resiste; falha suprime, à sua escolha, um dos bônus que ele ganha de jutsu (ataque, dano, Defesa ou testes) enquanto durar; falha crítica suprime todos esses bônus de uma vez. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Marionetes das Trevas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Como Ação Bônus ao lançar (e em turnos seguintes enquanto mantiver a concentração), comanda uma sombra ilusória pra atacar: Ataque de Genjutsu corpo a corpo em até 18m — acerto causa 2d10 de dano Psíquico e o alvo testa Inteligência ou fica Zonzo até o início do seu próximo turno. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Santuário', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'9m', duracao:'1 minuto',
    efeito:'Protege um alvo disposto em até 9m: quem tentar atacá-lo ou mirar nele com um jutsu precisa passar antes num teste de Sabedoria, ou é forçado a escolher outro alvo (ou perder a ação) — não protege contra efeitos em área. O jutsu acaba se o alvo protegido atacar ou lançar um jutsu que afete outra criatura. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Arte de Selamento: Delírios', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Selo de chakra marca um alvo em até 18m, que testa Carisma: na falha, fica hipnotizado por visões dos próprios desejos e, no início de cada turno, refaz a resistência — Atordoado até o fim do turno se falhar de novo (um sucesso encerra o jutsu; sofrer dano também força nova resistência); outra criatura que tocar o alvo pode tentar um teste de Sabedoria (Ilusão) contra sua CD pra encerrar o efeito à força. Em ranks mais altos: +3 de custo por rank acima de D; no Rank B afeta 2 alvos, e no Rank S, 3.'},
  {nome:'Arte de Selamento: Sonhos Bons', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Selo de chakra marca um alvo disposto em até 18m; como Ação Bônus, o mergulha num sono acelerado que deixa gastar Dados de Vida pra recuperar PV, como um descanso curto (mas sem recuperar talentos ou recursos que um descanso curto normalmente restauraria). Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Semblante de Pavor', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (raio de 6m)', duracao:'Concentração, até 1 minuto',
    efeito:'Seu rosto vira uma monstruosidade sem face; enquanto durar, ninguém a até 6m de você consegue se aproximar de boa vontade sem passar num teste de Sabedoria no início do turno (construtos e mortos-vivos são imunes) — você ganha vantagem em resistências contra Medo. Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de D.'},
  {nome:'Mordida da Sombra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Ataque de Genjutsu à distância em até 18m: acerto causa 4d6 + mod. de Genjutsu de dano Psíquico e reduz o deslocamento do alvo em 3m até o início do seu próximo turno (nenhum bônus de deslocamento funciona enquanto durar a redução). Em ranks mais altos: +3 de custo, +1 alvo, +1d6 de dano e mais 1,5m de redução no deslocamento por rank acima de D.'},
  {nome:'Imagem Silenciosa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'18m', duracao:'Concentração, até 10 minutos',
    efeito:'Cria a imagem de um objeto, criatura ou fenômeno visível (até um cubo de 4,5m) num ponto a até 18m — é só imagem, sem som ou cheiro. Como ação, pode mover a imagem por até 18m, ajustando a aparência pra parecer natural (por exemplo, fazendo uma criatura "andar"). Qualquer interação física revela a ilusão e encerra o jutsu na hora.'},
  {nome:'Silhueta', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'3 Chakra', alcance:'30m', duracao:'Concentração, até 10 minutos',
    efeito:'Cria um teatro de sombras numa superfície de até 9m² a até 30m, sem ponto de origem único (usa as sombras naturais do ambiente); só vê o espetáculo um número de criaturas igual ao seu modificador de Genjutsu. As figuras não fazem som, mas podem dançar, correr, lutar etc., geralmente baseadas em criaturas que você já viu.'},
  {nome:'Canção Sussurrada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'9m', duracao:'Concentração, até 10 minutos',
    efeito:'Cantarola ou repete uma frase; aliados dispostos a até 9m se sentem revigorados. Enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte. Quem começar o turno no alcance ganha vantagem em resistências contra Genjutsu sonoros, e esses Genjutsu deixam de pegá-los desprevenidos.'},
  {nome:'Canção dos Ancestrais', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (raio de 6m)', duracao:'Concentração, até 10 minutos',
    efeito:'Canta uma melodia estranha e incompreensível; quem começar o turno num raio de 6m ao seu redor testa Inteligência (enquanto durar, não custa Chakra pra manter — só uma Ação Bônus a cada turno seguinte): sucesso resiste; falha ganha a condição Loucura até o fim do turno seguinte; falha crítica ganha Loucura por 1d4 dos próprios turnos. Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de D.'},
  {nome:'Eco Silencioso e Cegante', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal (cone de 9m)', duracao:'Instantâneo',
    efeito:'Grito silencioso e enganoso num cone de 9m à sua frente; alvos à sua escolha testam Sabedoria: sucesso crítico resiste; sucesso resiste à maior parte do efeito mas fica Surdo até o fim do turno seguinte; falha sofre 2d6 de dano Psíquico e fica Cego (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas também sofre mais 4d6 de dano Psíquico no turno em que falhar e outros 4d6 no início do seu próximo turno.'},
  {nome:'Sobressalto', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'27m', duracao:'Instantâneo',
    efeito:'Alvo em até 27m (imune se for imune a Amedrontado) testa Carisma: sucesso resiste; falha se assusta e perde a concentração no jutsu de maior custo que estiver mantendo; falha crítica perde a concentração em todos os jutsu que estiver mantendo. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de D.'},
  {nome:'Película Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Barreira psíquica: sempre que for sofrer dano Psíquico, reduz em 3d6; além disso, ganha +1d4 em resistências contra Genjutsu enquanto durar. Em ranks mais altos: +3 de custo e mais 1d6 de redução por rank acima de D.'},
  {nome:'Rejeição de Pensamento', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'27m (raio de 3m)', duracao:'Instantâneo',
    efeito:'Escolhe um ponto a até 27m onde uma explosão psíquica atinge tudo num raio de 3m; alvos testam Sabedoria: sucesso resiste; falha sofre 4d6 de dano Psíquico; falha crítica sofre 4d6 de dano Psíquico e ganha 1 rank de Ofuscado. Em ranks mais altos: +3 de custo e +1d6 de dano por rank acima de D.'},
  {nome:'Riso Descontrolado', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'4 Chakra', alcance:'9m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 9m com Inteligência maior que 4 testa Sabedoria (com vantagem se tiver Sabedoria 15 ou mais; o jutsu acaba na hora se ele sofrer dano): sucesso crítico resiste; sucesso resiste à maior parte do efeito mas fica sem Reações até o início do turno seguinte; falha cai num ataque de riso, Derrubado e sem Reações (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, mas também fica Incapacitado.'},
  {nome:'Rosto Comum', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Toque', duracao:'10 minutos',
    efeito:'Aliado disposto tocado tem o rosto tornado completamente comum — enquanto durar, fica irreconhecível e impossível de apontar numa multidão. Quem tentar enxergar através da ilusão faz teste de Sabedoria (Intuição ou Ilusão) contra sua CD; se passar, fica imune a esse Genjutsu por 1 hora.'},
  {nome:'Garra da Víbora', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal (raio de 9m)', duracao:'1 minuto',
    efeito:'Libera veneno inodoro no ar (gasta 1 carga do Kit de Veneno), afetando quem inalar num raio de 9m ao seu redor; alvos testam Sabedoria (o jutsu acaba na hora se o Envenenado causado por ele for curado): sucesso crítico resiste e fica imune por 24 horas; sucesso resiste; falha fica Envenenado por 1 minuto, vendo cobras ilusórias — no início de cada turno, teste de Sabedoria (Acrobacia) contra sua CD ou fica Restrito pelas cobras até o início do turno seguinte; falha crítica é igual, mas o teste vem em desvantagem e o Restrito dura enquanto o Envenenado durar.'},
  {nome:'Armas das Trevas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'D', custo:'5 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Conjura adagas de trevas e pavor (parecem Kunai) que pode arremessar a até 18m antes de se dissiparem; como ação, faz um Ataque de Genjutsu corpo a corpo ou à distância — acerto causa 5d4 de dano Psíquico (a adaga se desfaz e reaparece na sua mão depois do arremesso). Em ranks mais altos: +3 de custo por rank acima de D; do Rank C em diante, +1d4 de dano; no Rank B, dois ataques em vez de um; do Rank A em diante, soma seu modificador de Genjutsu ao dano; no Rank S, três ataques em vez de um.'},
  {nome:'Aparição Abominável', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'27m', duracao:'Instantâneo',
    efeito:'Escolhe um número de alvos que consigam te ver em até 27m igual ao seu bônus de proficiência, que testam Inteligência: sucesso crítico resiste e fica imune a novas tentativas suas por 1 minuto; sucesso resiste; falha sofre 4d6 de dano Psíquico e 1 rank de Contundido; falha crítica sofre 4d6 + mod. de Genjutsu de dano Psíquico e 2 ranks de Contundido.'},
  {nome:'Alienação', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m testa Inteligência: sucesso crítico resiste e fica imune por 1d4 dos próprios turnos; sucesso resiste; falha perde a capacidade de se comunicar ou entender os outros enquanto durar; falha crítica é igual, e também não consegue usar armas, Selos de Chakra ou ferramentas ninja direito enquanto durar. Em ranks mais altos: +3 de custo por rank acima de C; no Rank A, +1 alvo.'},
  {nome:'Sentido de Batalha', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal (raio de 6m)', duracao:'1 minuto',
    efeito:'Liga a mente de aliados dispostos num raio de 6m: enquanto durar, todos sabem de condições afetando os outros a até 30m, sempre sabem a localização uns dos outros a até 1,6km, e podem usar a Ação de Ajudar como Reação entre si a até 9m de distância — quem ajudar escolhe dar ao ajudado, até o fim do turno seguinte dele, +1d4 no próximo ataque, +1d4 na próxima resistência, +1d6 no próximo teste de perícia, ou +2d6 de dano Psíquico no próximo dano causado.'},
  {nome:'Borrão', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Seu corpo fica borrado e tremeluzente enquanto durar: quem atacar você sofre desvantagem no ataque, a menos que não dependa de visão (como Sentido Cego) ou enxergue através de ilusões (como Visão Verdadeira).'},
  {nome:'Lábia Encantadora', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'9m', duracao:'1 minuto',
    efeito:'Alvo em até 9m testa Carisma: sucesso resiste; falha o deixa mais disposto a acreditar no pior cenário possível e agir contra o próprio julgamento e objetivos; falha crítica é igual, e também fica paranoico com todo mundo (menos você) enquanto durar.'},
  {nome:'Cochilo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'9m', duracao:'10 minutos',
    efeito:'Até 3 aliados dispostos em até 9m caem Inconscientes pela duração (acorda antes se sofrer dano ou alguém gastar uma ação sacudindo/batendo nele). Quem ficar inconsciente a duração inteira ganha o benefício de um descanso curto, e não pode ser afetado de novo por este jutsu até fazer um descanso longo.'},
  {nome:'Estilhaçar Chakra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Interrompe uma criatura em até 18m que esteja lançando um jutsu com Selos de Mão: teste de Ilusão contra o Ninshou (se for Ninjutsu) ou Ilusão (se for Genjutsu) dela — se o jutsu dela for de rank igual ou menor que este, é um teste oposto normal; se for de rank maior, ela testa com vantagem. Se você vencer, o jutsu dela falha sem efeito e não pode ser lançado de novo até o fim do próximo turno dela. Em ranks mais altos: +3 de custo por rank acima de C.'},
  {nome:'Movimento Circular', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'36m', duracao:'1 minuto',
    efeito:'Veneno inodoro afeta até 2 alvos em até 36m, que testam Inteligência: na falha, ficam Envenenados sem perceber e não conseguem se afastar mais de 9m da posição atual em nenhuma direção — se tentarem, gastam o deslocamento restante andando de volta pra posição inicial, sem perceber que estão andando pra trás (acham que continuam avançando, e a distância até o destino parece crescer sem fim). Curar o Envenenado encerra o jutsu na hora.'},
  {nome:'Fechando o Cerco', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 18m (desvantagem no teste se estiver num espaço fechado) testa Inteligência: sucesso crítico resiste; sucesso resiste à maior parte do efeito mas não consegue Disparar nem Esquivar até o fim do turno seguinte; falha sente o mundo se fechando ao redor, com desvantagem em testes de perícia e ataques à distância enquanto durar (refazendo a resistência no fim de cada turno pra encerrar); falha crítica é igual, e também sofre 2d6 + mod. de Genjutsu de dano Psíquico no início de cada turno. Em ranks mais altos: +3 de custo, +1 alvo e +1d6 de dano por rank acima de C.'},
  {nome:'Corrupção: Sementes Malignas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal (raio de 4,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Até 3 alvos num raio de 4,5m ao seu redor testam Carisma: sucesso crítico resiste e fica imune a novas tentativas por 1 minuto; sucesso resiste à maior parte do efeito; falha faz com que, ao ver um aliado tentando lançar um jutsu, seja forçado a gastar a Reação atacando esse aliado (com arma, se tiver dado de dano maior que desarmado) — se não estiver ao alcance, se aproxima até 4,5m como parte da Reação antes de atacar (refazendo a resistência no fim do turno pra encerrar); falha crítica é igual, mas em vez de atacar, se move na direção do aliado com todo o deslocamento. Em ranks mais altos: +3 de custo e +1,5m de raio por rank acima de C.'},
  {nome:'Corrupção: Crueldade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'9m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 9m testa Carisma: sucesso resiste à maior parte do efeito; falha marca o alvo com um selo de crueldade que descarrega 3d6 de dano de Chakra no início de cada turno dele (pode gastar a ação pra refazer a resistência e encerrar); falha crítica é igual, mas o dano sobe pra 5d6. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Corrupção: Ódio', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Teste de Carisma (sucesso crítico dá imunidade por 10 minutos): na falha, toda resistência de Constituição do alvo vira teste de habilidade normal, uma vez por rodada (refazendo a resistência de Carisma no fim de cada turno pra encerrar); na falha crítica, isso vale até duas vezes por rodada. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Corrupção: Hostilidade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Teste de Carisma (sucesso crítico dá imunidade por 10 minutos): na falha, toda resistência de Destreza do alvo vira teste de habilidade normal, uma vez por rodada (refazendo a resistência de Carisma no fim de cada turno pra encerrar); na falha crítica, isso vale até duas vezes por rodada. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Corrupção: Repulsa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Teste de Carisma (sucesso crítico dá imunidade por 10 minutos): na falha, toda resistência de Força do alvo vira teste de habilidade normal, uma vez por rodada (refazendo a resistência de Carisma no fim de cada turno pra encerrar); na falha crítica, isso vale até duas vezes por rodada. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Corrupção: Malignidade', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 27m testa Carisma (sucesso crítico dá imunidade por 1 minuto): na falha, acumula 2 pontos de Malignância Psíquica no início de cada turno (até 20), podendo tentar a resistência de novo uma vez por turno pra encerrar antes — quando o jutsu acaba (por sucesso ou pelo tempo passar), toda a Malignância acumulada detona, causando 1d10 de dano Psíquico por ponto; na falha crítica, acumula 3 pontos por turno em vez de 2. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Lâminas Dançantes', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'Concentração, até 1 minuto',
    efeito:'Cria 4 cópias ilusórias da arma que segura, flutuando a 1,5m de você e imitando seus ataques. Como ação, gasta uma delas num Ataque de Genjutsu à distância (até 18m): acerto causa 2d10 + mod. de Genjutsu. Quando um ataque corpo a corpo te acerta superando sua Defesa em 1-3, uma arma ilusória para o golpe (sem dano, arma destruída); superando em 4-6, você sofre metade do dano e uma arma é destruída. Uma vez por turno, enquanto tiver armas, um Ataque de Genjutsu seu que acertar também soma +1d10 de dano Psíquico de uma arma ilusória. Só funciona se o atacante conseguir te ver (nenhum efeito se você estiver Invisível, Escondido, em escuridão total, ou se o atacante estiver Cego). Em ranks mais altos: +3 de custo e +1 arma ilusória por rank acima de C.'},
  {nome:'Demência das Sombras', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'36m', duracao:'1 minuto',
    efeito:'Droga gasosa e inodora afeta um alvo em até 36m, que testa Sabedoria: sucesso crítico resiste e ganha vantagem se você tentar de novo na próxima hora; sucesso resiste à maior parte do efeito; falha faz o alvo ver uma sombra pelo canto do olho, ganhando 1 rank de Medo no fim de cada turno que começar fora de luz plena (evita penumbra e escuridão, gastando ações pra achar luz), refazendo a resistência no fim de cada turno pra encerrar; falha crítica é igual, mas só refaz a resistência quando sofrer dano, não a cada turno.'},
  {nome:'Cativar', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'1 minuto',
    efeito:'Quem ouvir você em até 18m testa Sabedoria (sucesso automático se for imune a Enfeitiçado; vantagem se estiver lutando contra você ou seus aliados): sucesso resiste; falha dá desvantagem em testes de Sabedoria (Percepção/Intuição) pra perceber ou interagir com qualquer um além de você, enquanto durar ou até parar de te ouvir (o jutsu acaba se você ficar mais de 6 segundos sem falar com o alvo); falha crítica faz o alvo falhar automaticamente nesses testes, só percebendo você e ignorando todo o resto.'},
  {nome:'Dor Falsa', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'9m', duracao:'Concentração, até 1 minuto',
    efeito:'Até 2 aliados dispostos (além de você) em até 9m ficam com a dor anestesiada: todo dano que sofreriam fica registrado mas represado até o jutsu acabar, e ignoram os efeitos de Fragilizado, Zonzo, Incapacitado e Envenenado enquanto durar (se a duração dessas condições ultrapassar a do jutsu, voltam a valer depois). Quando o jutsu termina, cada um sofre de uma vez todo o dano Psíquico represado (ignora Resistência e Imunidade).'},
  {nome:'Visões Falsas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Alvo em até 27m testa Inteligência: sucesso resiste; falha fica Cego e só enxerga o que você narrar sobre o que as outras criaturas fazem em cada turno (fingindo ataques, jutsu, fugas etc.); dano sofrido continua normal, e cada vez que é atingido refaz a resistência pra encerrar; falha crítica é igual, mas a resistência pra encerrar vem com -1d4. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Fuga das Pétalas', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Quando é atingido, seu corpo se desfaz em pétalas: rola 2d4 e reduz o bônus de ataque de quem te acertou por esse valor (podendo transformar o acerto em erro, desfazendo o dano). Façam ou não, você testa Destreza ou Sabedoria (Furtividade) contra a Percepção passiva de quem te atacou — se passar, se move até seu deslocamento sem provocar ataque de oportunidade e fica Escondido se terminar em cobertura parcial. Em ranks mais altos: +3 de custo e mais 1d4 de redução por rank acima de C.'},
  {nome:'Névoa da Guerra', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'27m (cubo de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Todos numa área de 9m a até 27m testam Sabedoria: na falha, ficam sob a influência do jutsu até ele acabar ou conseguirem se livrar sozinhos — com desvantagem em Sabedoria (Percepção) pra localizar inimigos, e sempre que atacarem um alvo com outra criatura adjacente a ele (aliada ou não), rolam 1d20: com 11 ou mais, o ataque acerta a criatura adjacente em vez do alvo original (aleatório se houver mais de uma). No início de cada turno, o afetado testa Sabedoria: se passar, fica livre do efeito até o início do turno seguinte.'},
  {nome:'Quebra de Genjutsu', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Toque', duracao:'Instantâneo',
    efeito:'Escolhe um alvo, objeto ou efeito de Genjutsu ao alcance de toque: qualquer Genjutsu de rank igual ou menor é transferido pro Selo de Chakra usado no lançamento, encerrando o efeito na hora; pra cada Genjutsu de rank maior, faz um teste de Genjutsu contra CD 12 + o número do rank dele (B=3, A=4, S=5) — se passar, o Genjutsu vai pro selo e fica guardado por até 10 minutos, podendo ser transferido pra outra criatura a até 1,5m com um Ataque de Genjutsu corpo a corpo (acerto aplica o selo; no início do turno seguinte dela, testa a resistência original como se o jutsu tivesse acabado de ser lançado nela). Em ranks mais altos: +3 de custo por rank acima de C.'},
  {nome:'Terreno Alucinatório', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'90m', duracao:'24 horas',
    efeito:'Faz um terreno natural num cubo de 45m a até 90m parecer, soar e cheirar como outro tipo de terreno natural (um campo pode virar pântano, um poço parecer um prado etc.) — só o visual/som/cheiro muda, o toque continua igual, então examinar de perto ou tocar tende a revelar a ilusão; quem examinar pode tentar um teste de Sabedoria (Ilusão) contra sua CD pra não acreditar nela.'},
  {nome:'Clone de Bruma', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal (raio de 13,5m)', duracao:'Concentração, até 1 minuto',
    efeito:'Névoa fina e imóvel centrada em você, numa esfera de 13,5m de raio: quem estiver dentro vê duplicatas suas formadas pela bruma (não se movem nem fazem som, e se desfazem em mais névoa ao serem tocadas). Enquanto estiver dentro, você ganha cobertura parcial e pode usar a ação de Esconder-se sem precisar se ocultar totalmente, graças ao número de duplicatas. Quem está fora da esfera não vê nada disso até entrar nela.'},
  {nome:'Padrões Hipnóticos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'36m (cubo de 9m)', duracao:'Concentração, até 1 minuto',
    efeito:'Um padrão de cores gira no ar por um instante num cubo de 9m a até 36m; quem ver testa Sabedoria: sucesso crítico resiste e ganha vantagem se você tentar de novo na próxima hora; sucesso resiste à maior parte do efeito; falha fica encantado pelas cores, incapaz de sair do cubo, com deslocamento pela metade e só conseguindo manter concentração em 1 jutsu por vez (refazendo a resistência no fim de cada turno pra encerrar; sofrer qualquer dano também encerra); falha crítica é igual, mas também fica Incapacitado com deslocamento 0 (também encerra se for movido à força por mais de 3m).'},
  {nome:'Armadilha Ilusória', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Toque', duracao:'Permanente',
    efeito:'Cria a ilusão de uma armadilha num objeto tocado (porta, baú, ou 1,5m² de chão). Quem examinar procurando armadilhas de propósito testa Sabedoria: sucesso encerra o jutsu (percebe que é falsa); falha faz acreditar que a armadilha é real — se tentar desarmá-la ou disparar, testa Prestidigitação contra sua CD: sucesso causa um retorno de 2d10 de dano Psíquico e revela a ilusão, encerrando o jutsu; falha causa 5d10 de dano Psíquico e Atordoado por 1 rodada, acreditando ter disparado a armadilha de verdade (a ilusão reseta e pode disparar de novo); falha crítica é igual à falha, mas o dado de dano vira d12 (5d12).'},
  {nome:'Desvio Ilusório', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Conjura uma criatura ilusória de aparência bela a até 18m; quem não estiver Cego a até 9m dela testa Carisma: na falha, fica Enfeitiçado por ela enquanto durar. Como Ação Bônus, você pode revelar que a criatura não é o que parecia (mantendo a beleza): os Enfeitiçados testam Carisma de novo — na falha, ficam chocados e Zonzos; no sucesso, o Enfeitiçado acaba. De qualquer forma, o jutsu termina assim que você revela a verdadeira natureza da criatura.'},
  {nome:'Aspecto Inofensivo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'Pessoal (raio de 6m)', duracao:'Concentração, até 10 minutos',
    efeito:'Área de visões falsas num raio de 6m ao seu redor: você e aliados dispostos à sua escolha parecem uma criatura ou objeto inofensivo (todos com a mesma aparência falsa, só o visual muda — som, movimento ou exame físico revelam a ilusão). Enquanto durar, não custa Chakra pra manter. Como ação, quem tentar examinar visualmente pode passar num teste de Sabedoria (Ilusão) contra sua CD pra enxergar através da ilusão.'},
  {nome:'Liberação Médica: Dor Compartilhada', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Ilusão autossustentável divide sua dor com um aliado disposto em até 18m: sempre que for sofrer dano, você sofre só a metade e o aliado sofre o resto como dano Psíquico. Em ranks mais altos: +3 de custo e +1 aliado por rank acima de C — com mais de um aliado, o dano restante é dividido entre todos.'},
  {nome:'Barreira Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'1 rodada',
    efeito:'Como Reação, ao fazer uma resistência contra um Genjutsu que você percebeu, ganha +1d6 numa resistência de Inteligência, Sabedoria ou Carisma até o fim do turno atual; também ganha resistência a dano Psíquico enquanto durar.'},
  {nome:'Escudo Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'Pessoal', duracao:'1 minuto',
    efeito:'Reduz todo dano Psíquico recebido em 5 enquanto durar; se isso zerar o dano e o jutsu ou efeito hostil também tentasse aplicar uma condição, essa condição também é ignorada. Em ranks mais altos: +3 de custo e mais 5 de redução por rank acima de C.'},
  {nome:'Provocação Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'6 Chakra', alcance:'18m', duracao:'Instantâneo',
    efeito:'Alvo em até 18m testa Carisma: sucesso resiste; falha o obriga a mirar em você com qualquer jutsu que lançar até o fim do turno seguinte; falha crítica é igual, e também o impede de lançar jutsu ou usar traços, efeitos ou itens que o curariam. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Estaca Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'10 minutos',
    efeito:'Ataque de Genjutsu à distância em até 18m: acerto causa 5d8 de dano Psíquico e o alvo testa Sabedoria: sucesso resiste; falha faz você sempre saber a localização do alvo (ele não consegue ficar Escondido de você, e se ficar Invisível, você o vê brilhando e ignora a invisibilidade); falha crítica é igual, e a localização também fica sempre visível pra outra criatura à sua escolha. Em ranks mais altos: +3 de custo e +1d8 de dano por rank acima de C.'},
  {nome:'Investida Mental', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'27m', duracao:'1 rodada',
    efeito:'Alvo em até 27m testa Inteligência: sucesso resiste; falha sofre 2d8 de dano Psíquico e fica sem Reações até o fim do turno seguinte; falha crítica sofre 3d8 + mod. de Genjutsu de dano Psíquico, também sem Reações, e no início do próprio turno seguinte testa Inteligência de novo ou só pode escolher UMA entre mover-se, Ação ou Ação Bônus nesse turno. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Recuperação Mente-Corpo', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'8 Chakra', alcance:'9m', duracao:'10 minutos',
    efeito:'Até 3 aliados dispostos em até 9m ganham 3d6+5 de PV temporário enquanto durar (perdem o que sobrar quando o jutsu acabar) e você remove 1 condição Mental de rank C ou menor de cada um. Em ranks mais altos: +3 de custo, mais 1d6+3 de PV temporário e +1 rank na condição removível por rank acima de C.'},
  {nome:'Terrores Noturnos', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'27m', duracao:'Concentração, até 1 minuto',
    efeito:'Escolhe um alvo com pelo menos 1 rank de Medo em até 27m, que testa Carisma: na falha, qualquer Genjutsu que estiver causando Medo nele termina na hora, mas os ranks de Medo dobram (ou viram 5 direto, se já tinha 3 ou mais) — enquanto durar, não pode ganhar mais Medo de outras fontes. No fim de cada turno, refaz a resistência de Carisma: no sucesso, perde todo o Medo e o jutsu acaba (perder a concentração também remove todo o Medo na hora). Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Flanqueamento', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'9 Chakra', alcance:'18m', duracao:'Concentração, até 1 minuto',
    efeito:'Escolhe um alvo em até 18m: enquanto durar, sempre que você fizer um Ataque de Genjutsu nele e errar, um clone ilusório seu tenta o mesmo ataque de outro ângulo (mesmos bônus) — se acertar, causa metade do dano e os efeitos extras normais. Além disso, como Reação, quando um aliado atacar esse mesmo alvo, você pode criar um clone ilusório do aliado fazendo o mesmo ataque, dando vantagem ao ataque real dele. Em ranks mais altos: +3 de custo e +1 alvo por rank acima de C.'},
  {nome:'Dragão Fantasma', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'7 Chakra', alcance:'Toque', duracao:'Concentração, até 1 minuto',
    efeito:'Toca um aliado disposto; quem você escolher e conseguir vê-lo a até 36m o vê se transformar num dragão enorme (testando Sabedoria pra enxergar através da ilusão) enquanto durar. Quando o aliado ataca ou lança um jutsu, o dragão ilusório parece estar fazendo aquilo (cuspindo fogo, golpe marcial ou aura dracônica); quando ele causa dano em alguém que o vê como dragão, soma +3d10 de dano Psíquico uma vez por turno. Como ação, o aliado também pode rugir: todo mundo a até 36m (menos você e quem já viu através da ilusão) testa Carisma ou ganha 1 rank de Medo do dragão por 1 minuto (pode gastar a ação pra tentar de novo e remover todo o Medo no sucesso).'},
  {nome:'Campo de Lótus Venenoso', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'Especial', alcance:'Especial', duracao:'Especial',
    efeito:'Planta uma flor de lótus venenosa infundida com chakra em solo fértil (a flor tem 1 PV e Defesa 5; se for destruída, o jutsu acaba e precisa ser relançado — quem procurar por ela usando Natureza, Medicina ou Sobrevivência testa contra sua CD pra achá-la, e sem proficiência é Sabedoria (Percepção) com -5, ou -5 pra todo mundo se ela estiver plantada entre outras lótus de verdade). Com 8 Chakra: como ação, por 1 minuto enquanto estiver a até 27m da flor, ela solta um gás venenoso e inodoro — quem você escolher a até 18m testa Inteligência no início de cada turno ou fica Envenenado, rolando 1d4 a mais de penalidade em resistências/testes ligados aos seus Genjutsu e sendo pego desprevenido por eles. Com 16 Chakra: o alcance de ativação sobe pra 36m da flor e a área afetada pra 27m ao redor dela. Com 24 Chakra: a penalidade extra do Envenenado vira 2d4, e o dano Psíquico dos seus Genjutsu nele ganha +2× seu modificador de Genjutsu (se ainda não somasse). Com 32 Chakra: a até 75m da flor, seus Genjutsu não custam Chakra pra manter concentração por até 10 minutos, e qualquer Genjutsu seu com duração de Concentração de até 1 minuto passa a durar 10 minutos (acaba após isso ou se a flor for destruída).'},
  {nome:'Delírio de Poder', tipo:'Genjutsu', categoria:'Genjutsu', rank:'C', custo:'Especial', alcance:'Pessoal', duracao:'Instantâneo',
    efeito:'Registra a diferença entre seus PV atuais e o máximo; no seu próximo turno, ao causar dano Psíquico, pode gastar Chakra até esse valor pra somar dano adicional igual ao Chakra gasto. Depois de usar esse bônus com sucesso, não pode lançar este jutsu de novo por 10 minutos.'},
