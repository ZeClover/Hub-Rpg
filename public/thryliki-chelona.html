<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Ficha — Thrylikí Chelóna</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s;
}
button:hover{border-color:var(--suave)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.risco .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.linha-lista{border:1px solid var(--borda); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--superficie-alta)}
.linha-lista .topo{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.trilha{display:flex; gap:6px; align-items:center}
.trilha button{width:28px; height:28px; padding:0; border-radius:50%}
.trilha button.cheio{background:var(--alerta); border-color:var(--alerta); color:var(--texto)}
</style>

<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — THRYLIKÍ CHELÓNA V6.1 (homebrew original do Zé)

   Este é o CHASSI do sistema (decisão #17 do Hub: cada sistema de regras é
   um módulo próprio). O Zé já tinha o design inteiro pronto (60 documentos,
   "concluído" em todo item de conteúdo, só faltando integração no Hub) —
   este arquivo não inventa mecânica nova, só codifica o que já está escrito
   nos arquivos de design dele. Prioridade: os graus de atributo, perícias,
   fórmula de teste, derivados (Vida/Deslocamento/Carga/Categoria/Ciclo),
   Origem, Área de Estudo (só como escolha — Ramos e poderes ficam pra
   fatias futuras, igual o Fabula Ultima ganhou classe por classe) e o
   painel de condições/consequências/Pacto com a Realidade.

   Arquivo único, salvando no navegador (localStorage) OU na conta do Hub
   se aberto com ?id= — mesmo mecanismo que Fabula Ultima, Kaizoku no Sho
   e Sistema SAO já usam.
   =========================================================================== */

/* --- Regras do sistema, em forma de dados -------------------------------- */

// Teste = 1d20 + Grau do Atributo + Treinamento + situação(-5/0/+5).
// Grau vai de 0 a 5; Nível, Categoria e Ascensões nunca entram no d20.
const GRAUS_ATRIBUTO = [0, 1, 2, 3, 4, 5];
const LEITURA_GRAU = {0:'debilitado ou incapaz', 1:'comum', 2:'competente', 3:'excepcional', 4:'mestre', 5:'ápice de controle'};

const ATRIBUTOS = [
  {id:'forca',         nome:'Força'},
  {id:'agilidade',     nome:'Agilidade'},
  {id:'constituicao',  nome:'Constituição'},
  {id:'inteligencia',  nome:'Inteligência'},
  {id:'presenca',      nome:'Presença'},
];

const TREINAMENTOS = [
  {id:'nada',     nome:'Nada',     bonus:0},
  {id:'treinado', nome:'Treinado', bonus:5},
  {id:'perito',   nome:'Perito',   bonus:10},
  {id:'expert',   nome:'Expert',   bonus:15},
];
function bonusTreinamento(id){ return (TREINAMENTOS.find(t => t.id === id) || TREINAMENTOS[0]).bonus; }
// Índice 0-3 (Nada/Treinado/Perito/Expert) — algumas fórmulas de Área (como
// a Mana de Simbologia) usam essa escala, diferente do bônus de d20.
function grauTreinamento(id){ return Math.max(0, TREINAMENTOS.findIndex(t => t.id === id)); }

// As 24 Perícias do livro original, cada uma com um Atributo principal —
// a ficção pode trocar o Atributo usado, mas o Treinamento não muda.
const PERICIAS = [

  {id:'medicina',       nome:'Medicina',       atributo:'inteligencia'},

  {id:'profissao',      nome:'Profissão',      atributo:'inteligencia', especialidade:true},

  {id:'estudante-simbologia', nome:'Estudante de Simbologia', treinamentos:['simbologia','conhecimentos'], permissao:'"Eu aprendo fácil": após um dia estudando um símbolo conhecido, compreende sua função básica e riscos.'},
  {id:'hacker', nome:'Hacker', treinamentos:['tecnologia','investigacao'], permissao:'"Controle robótico avançado" (1×/cena): com acesso a uma Interface, obtém credencial, informação ou comando simples de um sistema comum.'},
  {id:'cacador-recompensa', nome:'Caçador de Recompensa', treinamentos:['pontaria','furtividade'], permissao:'"Eu aprendi com os erros": começa com uma peça PCHR/ferramenta de rastreio de Categoria I e um Traço não ofensivo.'},
  {id:'executivo', nome:'Executivo', treinamentos:['diplomacia','percepcao'], permissao:'"Eu conheço um cara" (1×/sessão): convoca um contato estabelecido com o Mestre.'},
  {id:'detetive', nome:'Detetive', treinamentos:['investigacao','iniciativa'], permissao:'"Eu sei o que aconteceu" (1×/cena): reanalisa um local e pergunta o que deixou uma pista, foi removido, ou contradiz a versão atual.'},
  {id:'lutador-origem', nome:'Lutador', treinamentos:['luta','reflexos'], permissao:'"Eu aprendi com o tempo": conhece os princípios de uma tradição de combate.'},

  {id:'mercador', nome:'Mercador', treinamentos:['diplomacia','percepcao'], permissao:'"Eu sei que você quer isso" (1×/sessão): reduz em 1 a Faixa de Custo efetiva numa negociação, ou descobre uma condição não monetária.'},
  {id:'herdeiro', nome:'Herdeiro', treinamentos:[], permissao:'Dois Treinamentos escolhidos com o Mestre. "Eu mereço": começa com item adicional de Faixa de Custo 2, ou acesso familiar a um recurso de Faixa 3.'},
  {id:'marinheiro', nome:'Marinheiro', treinamentos:['fortitude','iniciativa'], permissao:'"Terra à vista" (1×/cena): ignora um modificador desfavorável causado por água, enjoo, tempestade ou superfície instável.'},
  {id:'cacador', nome:'Caçador', treinamentos:['sobrevivencia'], permissao:'Segundo Treinamento: Pontaria ou Luta. "Eu já vi essa criatura": +5 (1×/cena) ao explorar um comportamento observado de uma família de criaturas conhecida.'},

// As 16 Áreas de Estudo — as antigas classes/Caminhos. Cada uma só marca a
// categoria aqui: Ramos (subclasses, escolhidos no 2º Ano), poderes e o
// motor mecânico próprio de cada Área são fatia futura, igual o Fabula
// Ultima ganhou os poderes de cada classe depois do chassi existir.
const AREAS = [
  {id:'corpo-cinetica',          nome:'Corpo e Cinética',          verbos:'Tensionar → Encadear → Romper',       painel:'Esforço 0–5 e Rastro'},
  {id:'simbologia-arcana',       nome:'Simbologia Arcana',         verbos:'Compor → Inscrever → Manifestar',     painel:'Mana, Fórmula e Matriz de Tomo'},
  {id:'robotica-engenharia',     nome:'Robótica e Engenharia',     verbos:'Projetar → Configurar → Operar',      painel:'Sistemas, Carga e Comandos'},

  {id:'psicologia-noetica',      nome:'Psicologia e Noética',      verbos:'Perceber → Enquadrar → Intervir',     painel:'Estados, Enquadramentos e Insight'},
  {id:'medicina-anatomia',       nome:'Medicina e Anatomia',       verbos:'Diagnosticar → Intervir → Acompanhar',painel:'Diagnósticos e Foco Clínico'},
  {id:'geologia-cristalografia', nome:'Geologia e Cristalografia', verbos:'Prospectar → Pressurizar → Fraturar', painel:'Estruturas e Tensão'},
  {id:'historia-arqueologia',    nome:'História e Arqueologia',    verbos:'Investigar → Contextualizar → Reencenar', painel:'Fontes e Precedentes'},

  {id:'filosofia-metafisica',    nome:'Filosofia e Metafísica',    verbos:'Questionar → Definir → Sustentar',    painel:'Premissas e Coerência'},

// Ramos de cada Área — subclasses. Cada um tem Assinatura (2º Ano),
// Especialização (3º Ano), Maestria (4º Ano) e Tese (5º Ano); o Ano do
// personagem decide quais dessas etapas já aparecem na ficha. Ainda é
// só catálogo/referência: o recurso e o combate próprios de cada Área
// (Esforço, Mana, Pontos de Comando...) ficam para as próximas fatias,
// Área por Área.

    },
    {

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function novoPersonagem(nome){
  return {
    id: uid(), criadoEm: Date.now(), atualizadoEm: Date.now(),
    perfil: {
      nome: nome || 'Novo Estudante',
      origemId: '',
      areaId: '',
      ramoId: '',
      aparencia: '',
    },
    ano: 1,
    nivel: 1,
    atributos: {forca:1, agilidade:1, constituicao:1, inteligencia:1, presenca:1},
    // treinamentos: { periciaId: 'nada'|'treinado'|'perito'|'expert' }
    treinamentos: {},
    // especialidades: texto livre pra Conhecimentos e Profissão (pedem campo aberto)
    especialidades: {conhecimentos:'', profissao:''},
    // compras: livro-razão de PE gasto em Talentos e Recursos/Eletivas —
    // Atributos e Treinamentos não entram aqui (o custo é derivado do
    // Grau/degrau atual na hora, não precisa de registro duplicado).
    compras: [],
    // marcos: uma escolha por posição de Marco da Área já recebida
    // (marcosRecebidos conta quantas; isso registra o que foi escolhido).
    marcos: [],
    // ascensoes: um eixo por Ascensão concluída (ascensoesConcluidas conta
    // quantas; isso registra qual eixo cada uma escolheu).
    ascensoes: [],

    // completo (recuperacao-v6.1.md) — até aqui Vida só era exibida,
    // nunca editável (decisão #42 fecha isso).

    risco: {caido:false, quantidade:0},

    // Perfil/Traços/Âncora/estado/acesso), fiel a equipamentos-v6.1.md.

// Aplica um Caminho Pronto sobre o personagem ATUAL — não cria ficha nova,
// só preenche Origem/Área/Atributos/Treinamentos, exatamente como alguém
// faria na mão seguindo esse Caminho. Mistura com o que já estiver
// preenchido nas outras abas (Inventário, Progressão etc.) fica intacto.
function aplicarCaminhoPronto(p, caminhoId){
  const c = CAMINHOS_PRONTOS.find(x => x.id === caminhoId);
  if(!c) return;
  const origem = ORIGENS.find(o => o.id === c.origemId);
  p.perfil.origemId = c.origemId;
  p.perfil.areaId = c.areaId;
  p.atributos = {...c.atributos};
  if(origem) for(const t of origem.treinamentos) p.treinamentos[t] = 'treinado';
}

function grauAtributo(p, id){ return p.atributos[id] ?? 1; }

// Vida = 35 + Constituição×5 + piso(Nível/2) — conferido contra a planilha
// de referência do próprio Zé (Constituição 2, Nível 1 = 45).
function vidaMaxima(p){ return 35 + grauAtributo(p,'constituicao')*5 + Math.floor(p.nivel/2); }
function vidaAtual(p){ return Math.max(0, Math.min(vidaMaxima(p), p.atual.pv ?? vidaMaxima(p))); }

// Conversão Impacto ↔ Vida (combate-v6.1.md): "um Impacto é a unidade
// interna equivalente a aproximadamente 22% da Vida média de um
// personagem do mesmo nível" — regras-base.json fecha o número em 0,22.
// Recuperação usa percentuais fixos, "arredondados pra cima" (o próprio
// texto do documento).
const FRACAO_IMPACTO_VIDA = 0.22;
function impactoParaVida(p, impacto){ return Math.round(impacto * FRACAO_IMPACTO_VIDA * vidaMaxima(p)); }
function vidaPorPercentual(p, fracao){ return Math.ceil(fracao * vidaMaxima(p)); }
function deslocamento(p){ return 9 + 2*grauAtributo(p,'agilidade'); }

// Matriz de Tomo: capacidade da Fórmula por Ano (5º ganha +1 Metassímbolo,
// que não entra nessa conta numérica — é uma exceção autoral à parte).
function matrizTomo(p){
  if(p.ano <= 1) return 4;
  if(p.ano === 2) return 8;
  if(p.ano === 3) return 14;
  return 20;
}
// Fórmulas preparadas: quatro no 1º Ano, cinco no 3º, seis no 5º.
function limiteFormulasPreparadas(p){ return p.ano >= 5 ? 6 : p.ano >= 3 ? 5 : 4; }

function calculoFormula(sel){
  const potencia = FORMULA_POTENCIAS.find(x => x.id === sel.potencia) || FORMULA_POTENCIAS[1];
  const alcance = FORMULA_ALCANCES.find(x => x.id === sel.alcance) || FORMULA_ALCANCES[0];
  const alvo = FORMULA_ALVOS.find(x => x.id === sel.alvo) || FORMULA_ALVOS[0];
  const essencia = FORMULA_ESSENCIAS.find(x => x.id === sel.essencia) || FORMULA_ESSENCIAS[0];
  const duracao = FORMULA_DURACOES.find(x => x.id === sel.duracao) || FORMULA_DURACOES[0];
  const clausulas = (sel.clausulas || []).map(id => FORMULA_CLAUSULAS.find(c => c.id === id)).filter(Boolean);
  const mana = potencia.mana + alcance.mana + alvo.mana + essencia.mana + duracao.mana
    + clausulas.reduce((soma,c) => soma + c.mana, 0);
  const tomos = alcance.tomos + alvo.tomos + essencia.tomos + duracao.tomos
    + clausulas.reduce((soma,c) => soma + c.tomos, 0);
  return {impacto: potencia.impacto, mana, tomos};
}

// Construtor Livre de Poder: a gramática que vale pras outras quinze Áreas
// (Simbologia Arcana já tem a sua própria, a Fórmula acima). "Ano libera a
// gramática, Nível define potência, Categoria e Ascensões definem escala,
// a Área define como o poder funciona e o que ele custa" — texto do próprio
// documento de design. Começa no 3º Ano; 1º e 2º usam poder pronto ou
// modificação guiada, sem criação livre de verdade.
function liberacaoPorAno(p){
  if(p.ano >= 5) return {modo:'Ruptura', alteracoes:4, criacaoLivre:true, persistencia:true, conceitual:true};
  if(p.ano >= 4) return {modo:'Criação Avançada', alteracoes:3, criacaoLivre:true, persistencia:true, conceitual:false};
  if(p.ano >= 3) return {modo:'Criação Livre', alteracoes:2, criacaoLivre:true, persistencia:false, conceitual:false};
  if(p.ano >= 2) return {modo:'Modificação Guiada', alteracoes:1, criacaoLivre:false, persistencia:false, conceitual:false};
  return {modo:'Poderes Prontos', alteracoes:0, criacaoLivre:false, persistencia:false, conceitual:false};
}

}

// Marcos da Área: posições 1, 5, 9, 13, 17 de cada ciclo — 5 por ciclo
// completo, mais os já alcançados no ciclo atual.
function marcosRecebidos(p){
  const ciclosCompletos = ciclo(p) - 1;
  const posicoesNoCicloAtual = [1,5,9,13,17].filter(x => x <= nivelNoCiclo(p)).length;
  return 5*ciclosCompletos + posicoesNoCicloAtual;
}

// PE: 1 por Nível, acumula se não gasto — economia de custos-e-economia-de-pe-v6.1.md.
// "Mostrar a origem de cada bônus" (filosofia do núcleo): PE gasto nunca é
// um número solto, é a soma de um livro-razão de compras (p.compras) mais
// o custo registrado em cada Fórmula/Poder/Par de Doença já salvo — cada
// um sabe seu próprio custo, em vez de um contador central duplicado.
function peGanho(p){ return p.nivel; }
function peGastoTotal(p){
  const compras = (p.compras||[]).reduce((soma,c) => soma + c.custo, 0);
  const formulas = ((p.simbologiaArcana && p.simbologiaArcana.formulas) || []).reduce((soma,f) => soma + (f.custoPE||0), 0);
  const poderes = (p.poderesLivres||[]).reduce((soma,pw) => soma + (pw.custoPE||0), 0);
  // Pacote inicial gratuito: as duas primeiras técnicas/poderes/Pares de
  // Doença não custam PE — só a partir do terceiro.
  const paresPagos = Math.max(0, ((p.doencas && p.doencas.pares) || []).length - 2);
  return compras + formulas + poderes + paresPagos*2;
}
function peDisponivel(p){ return peGanho(p) - peGastoTotal(p); }

// Quantas técnicas/poderes "gratuitos" (Fórmulas + Poderes Livres, nessa
// ordem de criação) o personagem já tem — usado pra decidir se a próxima
// Fórmula/Poder salvo ainda cai no pacote inicial ou já cobra PE.
function tecnicasGratuitasUsadas(p){
  return ((p.simbologiaArcana && p.simbologiaArcana.formulas) || []).length + (p.poderesLivres || []).length;
}
function custoPeProximaTecnica(p, impacto){
  return tecnicasGratuitasUsadas(p) < 2 ? 0 : custoPePorImpacto(impacto);
}
function custoPePorImpacto(impacto){
  if(impacto <= 0.5) return 1;
  if(impacto <= 1) return 2;
  if(impacto <= 1.5) return 3;
  return 5; // Ápice, 2,5 Impactos
}

// Atributos e Treinamentos: custo pra alcançar o PRÓXIMO degrau, travado
// pela Categoria atual do personagem (I a V).
const CUSTO_GRAU_ATRIBUTO = {2:2, 3:3, 4:4, 5:5};
const GRAU_MAXIMO_CATEGORIA = {I:3, II:4, III:5, IV:5, V:5};
const CUSTO_TREINAMENTO_DEGRAU = {treinado:2, perito:3, expert:4};
const CATEGORIA_MINIMA_TREINAMENTO = {treinado:'I', perito:'II', expert:'III'};

function custoProximoGrau(grauAtual){ return CUSTO_GRAU_ATRIBUTO[grauAtual+1]; }
function podeComprarGrau(p, atributoId){
  const atual = grauAtributo(p, atributoId);
  const custo = custoProximoGrau(atual);
  if(!custo) return false;
  if(atual+1 > GRAU_MAXIMO_CATEGORIA[categoria(p)]) return false;
  return peDisponivel(p) >= custo;
}
function proximoTreinamento(id){
  const idx = TREINAMENTOS.findIndex(t => t.id === id);
  return TREINAMENTOS[idx+1];
}
function podeComprarTreinamento(p, periciaId){
  const atual = p.treinamentos[periciaId] || 'nada';
  const proximo = proximoTreinamento(atual);
  if(!proximo) return false;
  const custo = CUSTO_TREINAMENTO_DEGRAU[proximo.id];
  const minima = CATEGORIA_MINIMA_TREINAMENTO[proximo.id];
  if(CATEGORIAS_ITEM.indexOf(categoria(p)) < CATEGORIAS_ITEM.indexOf(minima)) return false;
  return peDisponivel(p) >= custo;
}

/* --- Armazenamento -----------------------------------------------------

   Presente na URL (?id=...), a ficha vive na conta do Hub em vez do
   navegador — mesmo mecanismo do Fabula Ultima, Kaizoku no Sho e Sistema
   SAO. Sem o parâmetro, arquivo único com localStorage, sem conta.
------------------------------------------------------------------------- */

const MODO_HUB = new URLSearchParams(location.search).get('id');
const CHAVE = 'thryliki_chelona_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

let debounceHub = null;
function salvarNoHub(){
  clearTimeout(debounceHub);
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    // Resumo genérico pro Hub de Mestre ler sem saber a fórmula de Vida
    // deste sistema (decisão #46) — espelhado a cada salvamento.
    p.resumoVida = {atual: Math.max(0, Math.min(vidaMaxima(p), p.atual.pv ?? vidaMaxima(p))), maxima: vidaMaxima(p), rotulo: 'Vida'};
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dados: p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub = 'nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p];
    estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false;
    render();
  }
}

function alternarCompartilhado(valor){
  estado.compartilhado = valor;
  render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({compartilhado: valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(mudanca){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounce = null;
function mudarSemRedesenhar(mudanca, elemento){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

// Doenças, Demi-humanos e Místicos — opcional, a mesa decide se entra na
// campanha (nenhum jogador precisa aceitar uma manifestação que não
// queira interpretar). Começa com até dois Pares gratuitos; a partir do
// terceiro, cada novo Par custa 2 PE (peGastoTotal já soma isso).
function painelDoencas(p){
  const pares = p.doencas.pares || [];
  const draft = estado.doencaRascunho;
  const custoProximo = pares.length < 2 ? 0 : 2;
  const semPE = peDisponivel(p) < custoProximo;
  const classificacoes = [...new Set(DOENCAS_CATALOGO.map(d => d.classificacao))];
  return `<div class="cartao">
    <h2 style="font-size:18px">Doenças, Demi-humanos e Místicos</h2>
    <p class="mini" style="margin:6px 0 14px">
      Opcional — a mesa decide se entra na campanha. Não representa
      doenças reais nem determina moralidade, personalidade ou valor de
      uma pessoa. Começa com até dois Pares gratuitos; do terceiro em
      diante, cada Par novo custa 2 PE. Limite recomendado: seis.
    </p>
    ${linkGrim('doencas', 'Ver o catálogo completo e as regras de Doenças')}
    <p class="mini" style="margin:14px 0 6px"><strong>Pares ativos (${pares.length}/6)${custoProximo?` — próximo custa ${custoProximo} PE`:' — os próximos são grátis'}</strong></p>
    ${pares.length ? pares.map((id,i) => {
      const d = DOENCAS_CATALOGO.find(x => x.id === id);
      if(!d) return '';
      return `<div class="linha-lista">
        <div class="topo">
          <strong>${esc(d.criatura)} — ${esc(d.nome)}</strong>
          <button data-doenca-remover="${i}" class="perigo">Remover</button>
        </div>
        <p class="mini"><strong>Pró:</strong> ${esc(d.pro)}</p>
        <p class="mini"><strong>Contra:</strong> ${esc(d.contra)}</p>
        <p class="mini"><strong>Âncora:</strong> ${esc(d.ancora)}</p>
      </div>`;
    }).join('') : '<p class="mini">(nenhum Par ativo)</p>'}

    ${pares.length < 6 ? `
      <p class="mini" style="margin:14px 0 6px">Catálogo</p>
      <div class="grade g3">
        <div><label for="c-doenca-classificacao">Classificação</label>
          <select id="c-doenca-classificacao">
            ${classificacoes.map(c => `<option value="${c}" ${c===draft.classificacao?'selected':''}>${c}</option>`).join('')}
          </select></div>
        <div style="grid-column:span 2"><label for="c-doenca-par">Par</label>
          <select id="c-doenca-par">
            ${DOENCAS_CATALOGO.filter(d => d.classificacao === draft.classificacao).map(d => `<option value="${d.id}" ${d.id===draft.id?'selected':''}>${d.criatura} — ${d.nome}</option>`).join('')}
          </select></div>
      </div>
      ${(() => { const dsel = DOENCAS_CATALOGO.find(x => x.id === draft.id); return dsel ? `
        <p class="mini" style="margin-top:8px"><strong>Pró:</strong> ${esc(dsel.pro)}</p>
        <p class="mini"><strong>Contra:</strong> ${esc(dsel.contra)}</p>
        <p class="mini"><strong>Âncora:</strong> ${esc(dsel.ancora)}</p>
      ` : ''; })()}
      <button id="btAddDoenca" style="margin-top:10px" ${semPE?'disabled':''}>+ Adicionar Par${custoProximo?` (${custoProximo} PE)`:''}</button>
      ${semPE ? `<p class="mini" style="margin-top:6px">PE insuficiente (disponível: ${peDisponivel(p)}).</p>` : ''}
    ` : `<p class="mini" style="margin-top:10px">Limite recomendado de seis Pares atingido.</p>`}
  </div>`;
}

function painelRamo(p, area){
  if(!area) return '';
  if(p.ano < 2){
    return `<div class="cartao">
      <h2 style="font-size:18px">Ramo</h2>
      <p class="mini" style="margin-top:6px">Ramo é escolhido a partir do 2º Ano — no 1º Ano o personagem só tem a Área e o Kit de Combate dela.</p>
    </div>`;
  }
  const ramos = RAMOS[area.id] || [];
  const ramo = ramos.find(r => r.id === p.perfil.ramoId);
  const etapas = [
    {ano: 2, rotulo: 'Assinatura (2º Ano)', texto: ramo?.ano2},
    {ano: 3, rotulo: 'Especialização (3º Ano)', texto: ramo?.ano3},
    {ano: 4, rotulo: 'Maestria (4º Ano)', texto: ramo?.ano4},
    {ano: 5, rotulo: 'Tese (5º Ano)', texto: ramo?.ano5},
  ];
  return `<div class="cartao">
    <h2 style="font-size:18px">Ramo</h2>
    <p class="mini" style="margin:6px 0 14px">A subclasse dentro da Área — só mostra as etapas que o Ano do personagem já libera.</p>
    ${linkGrim('tecnicas', 'Ver Técnicas de Ramo e o Kit de Combate do 1º Ano')}
    <select id="c-ramo" data-campo-raiz="perfil.ramoId">
      <option value="">— nenhum —</option>
      ${ramos.map(r => `<option value="${r.id}" ${r.id===p.perfil.ramoId?'selected':''}>${esc(r.nome)}</option>`).join('')}
    </select>
    ${ramo ? `
      ${ramo.intro ? `<p class="mini" style="margin-top:10px">${esc(ramo.intro)}</p>` : ''}
      ${etapas.filter(e => e.ano <= p.ano && e.texto).map(e => `
        <p class="mini" style="margin-top:10px"><strong>${e.rotulo}:</strong> ${esc(e.texto)}</p>
      `).join('')}
      ${ramo.contrajogo ? `<p class="mini" style="margin-top:10px"><strong>Contrajogo:</strong> ${esc(ramo.contrajogo)}</p>` : ''}
      ${painelTecnicasRamo(ramo)}
    ` : ''}
  </div>`;
}

// Técnicas prontas (Pressão/Sobrevivência/Tática): conteúdo já jogável a

        <p class="mini" style="margin:0"><strong>${esc(t.nome)}</strong> <span style="color:var(--suave)">(${esc(t.funcao)})</span></p>

      </div>`).join('')}

}

  const cf = estado.construtorFormula;
  const calc = calculoFormula(cf);
  const matriz = matrizTomo(p);
  const excedeTomos = calc.tomos > matriz;
  const limite = limiteFormulasPreparadas(p);
  const cheio = (p.simbologiaArcana.formulas||[]).length >= limite;
  const custoPE = custoPeProximaTecnica(p, calc.impacto);
  const semPE = peDisponivel(p) < custoPE;
  return `<div class="cartao">
    <h2 style="font-size:18px">Construtor de Fórmula</h2>
    <p class="mini" style="margin:6px 0 14px">

    <div class="grade g2">
      <div class="derivado">

function painelConstrutorPoder(p){
  if(!p.perfil.areaId) return '';
  const area = AREAS.find(a => a.id === p.perfil.areaId);
  const lib = liberacaoPorAno(p);
  if(!lib.criacaoLivre){
    return `<div class="cartao">
      <h2 style="font-size:18px">Construtor Livre de Poder</h2>
      <p class="mini" style="margin:6px 0">
        <strong>${p.ano}º Ano — ${lib.modo}.</strong> Criação livre de
        verdade começa no 3º Ano. Até lá: 1º usa poderes prontos do Ramo;
        2º pode alterar 1 campo de uma técnica pronta (Modificação Guiada),
        sem trocar acesso, recurso ou função principal.
      </p>
    </div>`;
  }
  // Simbologia Arcana tem gramática própria (a Fórmula, acima) em vez
  // dessa tradução genérica.
  if(p.perfil.areaId === 'simbologia-arcana'){
    return `<div class="cartao">
      <h2 style="font-size:18px">Construtor Livre de Poder</h2>
      <p class="mini" style="margin:6px 0">
        Simbologia Arcana usa sua própria gramática — o Construtor de
        Fórmula, acima — em vez desta tradução genérica.
      </p>
    </div>`;
  }
  const custoArea = PODER_CUSTO_AREA[p.perfil.areaId];
  const cp = estado.construtorPoder;
  const calc = calculoPoderLivre(cp);
  const potenciaAtual = PODER_POTENCIAS.find(x => x.id === cp.potencia) || PODER_POTENCIAS[1];
  const custoPE = custoPeProximaTecnica(p, potenciaAtual.impacto);
  const semPE = peDisponivel(p) < custoPE;
  const podeSalvar = !calc.excede && !semPE;
  return `<div class="cartao">
    <h2 style="font-size:18px">Construtor Livre de Poder</h2>
    <p class="mini" style="margin:6px 0 14px">
      <strong>${p.ano}º Ano — ${lib.modo}.</strong> Intenção → Área/Acesso →
      Âncora → função → Potência → distribuir o Impacto → ação/alcance/
      alvo/duração/custo/teste/contrajogo/Resíduo → validar. Um poder com
      vários resultados <strong>divide</strong> o Impacto entre eles, não
      soma um resultado cheio mais efeitos de graça.
    </p>
    ${linkGrim('poder-livre', 'Ver os Átomos de Impacto e o custo por Área')}

    <div class="grade g2">
      <div><label for="cp-nome">Nome do poder</label>
        <input id="cp-nome" value="${esc(cp.nome)}" placeholder="ex: Ponte Quebrada"></div>
      <div><label for="cp-potencia">Potência</label>
        <select id="cp-potencia">
          ${PODER_POTENCIAS.map(o => `<option value="${o.id}" ${o.id===cp.potencia?'selected':''}>${o.nome} (${o.impacto} Impacto)</option>`).join('')}
        </select></div>
    </div>
    <p class="mini" style="margin:8px 0 0"><strong>Ação:</strong> ${esc(potenciaAtual.acao)}${potenciaAtual.preparacao ? ` · preparação de ${potenciaAtual.preparacao} rodada(s)` : ''}</p>

    <div class="grade g2" style="margin-top:12px">
      <div><label for="cp-intencao">Intenção (o que muda na cena, numa frase)</label>
        <input id="cp-intencao" value="${esc(cp.intencao)}" placeholder="ex: empurrar e derrubar um alvo próximo"></div>
      <div><label for="cp-acesso">Acesso (como este personagem chega à Área)</label>
        <input id="cp-acesso" value="${esc(cp.acesso)}" placeholder="ex: Perfil Ativo de predador em alcateia"></div>
      <div><label for="cp-ancora">Âncora (perceptível e interferível)</label>
        <input id="cp-ancora" value="${esc(cp.ancora)}" placeholder="ex: os dentes e garras do personagem"></div>
      <div><label for="cp-forma">Forma (como o poder se manifesta)</label>
        <input id="cp-forma" value="${esc(cp.forma)}" placeholder="ex: avanço físico com mordida e garra"></div>
    </div>

    <p class="mini" style="margin:14px 0 6px">Resultados (dividem o Impacto — some até o orçamento da Potência)</p>
    <div class="condicoes">
      ${PODER_ATOMOS.map(a => `<label>
        <input type="checkbox" data-cp-atomo="${a.id}" ${cp.resultados.includes(a.id)?'checked':''}>
        ${a.nome} (${a.valor})</label>`).join('')}
    </div>
    <div class="grade g2" style="margin-top:10px">
      <div class="derivado ${calc.excede?'risco':''}">
        <div class="rot">Impacto usado</div>
        <div class="val">${calc.somaResultados}<span style="font-size:16px;color:var(--suave)">/${calc.impactoBudget}</span></div>
      </div>
    </div>
    ${calc.excede ? `<div class="aviso">Resultados somam mais que o Impacto da Potência escolhida — tire um resultado ou suba a Potência.</div>` : ''}

    <p class="mini" style="margin:14px 0 6px"><strong>Custo em ${area ? esc(area.nome) : 'sua Área'}:</strong>
      ${custoArea ? esc(custoArea[cp.potencia]) : ''}</p>
    ${custoArea ? `<p class="mini">${esc(custoArea.regra)}</p>` : ''}

    <div class="grade g2" style="margin-top:12px">
      <div><label for="cp-teste">Teste ou Resistência</label>
        <input id="cp-teste" value="${esc(cp.testeResistencia)}" placeholder="ex: Reflexos do alvo pra não cair"></div>
      <div><label for="cp-contrajogo">Contrajogo</label>
        <input id="cp-contrajogo" value="${esc(cp.contrajogo)}" placeholder="ex: terreno instável, se afastar antes do avanço, armadura no ponto de mordida"></div>
    </div>
    <div style="margin-top:10px">
      <label for="cp-residuo">Resíduo (toda transformação deixa perda, evidência ou vulnerabilidade)</label>
      <input id="cp-residuo" value="${esc(cp.residuo)}" placeholder="ex: arranhões visíveis e fôlego ofegante por uma cena">
    </div>

    <p class="mini" style="margin-top:10px">${custoPE ? `Custa ${custoPE} PE pra salvar.` : 'Grátis — ainda dentro do pacote inicial (duas primeiras técnicas/poderes).'}</p>
    <button id="btSalvarPoder" style="margin-top:6px" ${podeSalvar?'':'disabled'}>+ Salvar Poder${custoPE ? ` (${custoPE} PE)` : ''}</button>
    ${semPE ? `<p class="mini" style="margin-top:6px">PE insuficiente (disponível: ${peDisponivel(p)}).</p>` : ''}
  </div>`;
}

function painelPoderesLivres(p, poderes){
  if(!p.perfil.areaId || p.perfil.areaId === 'simbologia-arcana') return '';
  const lib = liberacaoPorAno(p);
  if(!lib.criacaoLivre) return '';
  return `<div class="cartao">
    <h2 style="font-size:18px">Poderes livres registrados (${poderes.length})</h2>
    ${poderes.length ? poderes.map((pw,i) => {
      const calc = calculoPoderLivre(pw);
      const potencia = PODER_POTENCIAS.find(x => x.id === pw.potencia) || PODER_POTENCIAS[1];
      return `<div class="linha-lista">
        <div class="topo">
          <input data-poder-campo="${i}|nome" value="${esc(pw.nome)}" placeholder="Nome" style="font-family:Georgia,serif;font-size:16px">
          <button data-poder-remover="${i}" class="perigo">Remover</button>
        </div>
        <p class="mini">${esc(potencia.nome)} · Impacto ${calc.somaResultados}/${calc.impactoBudget}${pw.custoPE ? ` · ${pw.custoPE} PE` : ''}${pw.intencao ? ' · ' + esc(pw.intencao) : ''}</p>
        ${pw.contrajogo ? `<p class="mini">Contrajogo: ${esc(pw.contrajogo)}</p>` : ''}
      </div>`;
    }).join('') : '<p class="mini">(nenhum poder registrado ainda)</p>'}
  </div>`;
}

// Vida — sofrer Impacto, curar, Primeiros Socorros e as quatro escalas de
// Recuperação (recuperacao-v6.1.md). Até aqui Vida só era exibida em
// painelDerivados, nunca editável.
function painelVida(p){
  const max = vidaMaxima(p);
  const atual = vidaAtual(p);
  const intervalosDisponiveis = 2 - (p.atual.intervalosUsados || 0);
  const guardaTotal = (p.inventario.itens || [])
    .filter(i => i.tipo === 'protecao')
    .reduce((soma,i) => soma + Math.max(0, Math.min(i.guardaMax||0, i.guardaAtual ?? i.guardaMax ?? 0)), 0);
  return `<div class="cartao">
    <h2 style="font-size:18px">Vida</h2>
    ${linkGrim('vida', 'Ver a conversão de Impacto e as 4 escalas de Recuperação')}
    <div class="grade g2">
      <div class="derivado ${atual<=Math.floor(max/2)?'risco':''}">
        <div class="rot">Vida</div>
        <div class="val">${atual}<span style="font-size:16px;color:var(--suave)">/${max}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;justify-content:center">
        <button data-vida-ajuste="-1" ${atual<=0?'disabled':''}>-1 (corrigir)</button>
        <button data-vida-ajuste="1" ${atual>=max?'disabled':''}>+1 (corrigir)</button>
      </div>
    </div>

    <p class="mini" style="margin:14px 0 6px">
      Sofrer Impacto — 1 Impacto equivale a ~22% da Vida máxima.
      ${guardaTotal ? `Guarda disponível nas Proteções equipadas: ${guardaTotal} (cada ponto reduz 0,25 Impacto — desconte aqui e gaste a Guarda correspondente no item, na aba Inventário).` : ''}
    </p>
    <div class="grade g3">
      <div><label for="c-vida-impacto">Impacto bruto</label>
        <input id="c-vida-impacto" type="number" min="0" step="0.25" value="1"></div>
      <div><label for="c-vida-guarda">Guarda gasta agora</label>
        <input id="c-vida-guarda" type="number" min="0" step="1" value="0"></div>
      <div style="display:flex;align-items:flex-end">
        <button id="btSofrerImpacto" style="width:100%">Aplicar dano</button>
      </div>
    </div>

    <p class="mini" style="margin:14px 0 6px">Curar</p>
    <div class="grade g3">
      <div><label for="c-vida-cura">Impacto de cura</label>
        <input id="c-vida-cura" type="number" min="0" step="0.25" value="1"></div>
      <div style="display:flex;align-items:flex-end;grid-column:span 2">
        <button id="btCurarImpacto" style="width:100%">Curar</button>
      </div>
    </div>
    <button id="btPrimeirosSocorros" style="margin-top:10px" ${p.atual.primeirosSocorrosUsado?'disabled':''}>Primeiros Socorros (0,5 Impacto, 1x por cena)</button>

    <p class="mini" style="margin:16px 0 6px">Recuperação</p>
    <div class="grade g3">
      <div>
        <button data-recuperacao="respiro" style="width:100%">Respiro</button>
        <p class="mini" style="margin-top:4px">Não recupera Vida — encerra condições de Janela/Cena.</p>
      </div>
      <div>
        <button data-recuperacao="intervalo" style="width:100%" ${intervalosDisponiveis<=0?'disabled':''}>Intervalo (${intervalosDisponiveis}/2)</button>
        <p class="mini" style="margin-top:4px">+25% da Vida máxima. Até dois por Descanso completo.</p>
      </div>
      <div>
        <button data-recuperacao="repouso" style="width:100%">Repouso</button>
        <p class="mini" style="margin-top:4px">+50% da Vida máxima.</p>
      </div>
    </div>
    <button data-recuperacao="descanso-completo" style="margin-top:10px">Descanso completo (Vida cheia, zera Intervalos, -1 em cada Consequência)</button>
  </div>`;
}

  return painelVida(p) + painelCorpoCinetica(p) + painelSimbologiaArcana(p) + painelRoboticaEngenharia(p) + painelBotanicaBiomancia(p) + painelArteExpressao(p) + painelZoologiaEtologia(p) + painelNovaArea(p) + painelKitCombateAno1(p) + painelConstrutorPoder(p) + painelPoderesLivres(p, p.poderesLivres || []) + `<div class="cartao">

        </div>
        <p class="mini" style="margin-top:6px">${c.sobre}</p>
      </div>`).join('')}
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Vida zero e Risco</h2>

      Em 0 Vida: Caído, 1 Risco. Fim de turno sem estabilizar: +1. Golpe

    </div>

function custoLegivel(n){
  // Corta casas decimais desnecessárias (1/3 -> "0,33", 2 -> "2").
  return Number(n.toFixed(2)).toString().replace('.', ',');
}

/* --- Eventos --------------------------------------------------------------

   O `render` reescreve a tela inteira, então os eventos são religados a
   cada desenho — mesmo caminho dos outros sistemas do Hub.
------------------------------------------------------------------------- */

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      if(el.dataset.campo) p[el.dataset.campo] = el.value;
      else p.perfil[el.dataset.perfil] = el.value;
    }, el));

  // Campos "de raiz" (fora de p.perfil) que precisam de redesenho imediato
  // porque alimentam o painel de derivados ou textos condicionais (Origem,
  // Área, Ano).
  app.querySelectorAll('[data-num-raiz]').forEach(el =>
    el.onchange = () => mudar(p => p[el.dataset.numRaiz] = Number(el.value) || 1));
  app.querySelectorAll('[data-campo-raiz]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [raiz, chave] = el.dataset.campoRaiz.split('.');
      p[raiz][chave] = el.value;
    }));

  const selCaminho = app.querySelector('#c-caminho');
  if(selCaminho) selCaminho.onchange = () => { estado.caminhoSelecionado = selCaminho.value; render(); };
  const btAplicarCaminho = app.querySelector('#btAplicarCaminho');
  if(btAplicarCaminho) btAplicarCaminho.onclick = () => {
    const p = atual(); if(!p) return;
    const c = CAMINHOS_PRONTOS.find(x => x.id === estado.caminhoSelecionado) || CAMINHOS_PRONTOS[0];
    const jaEscolheu = p.perfil.origemId || p.perfil.areaId;
    if(jaEscolheu && !confirm(`Aplicar "${c.nome}" substitui a Origem, os Atributos e os Treinamentos atuais. Continuar?`)) return;
    mudar(p => aplicarCaminhoPronto(p, c.id));
  };

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Number(el.value)));

  app.querySelectorAll('[data-treinamento]').forEach(el =>
    el.onchange = () => mudar(p => p.treinamentos[el.dataset.treinamento] = el.value));
  app.querySelectorAll('[data-especialidade]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.especialidades[el.dataset.especialidade] = el.value, el));

  app.querySelectorAll('[data-comprar-grau]').forEach(b =>
    b.onclick = () => mudar(p => {
      const id = b.dataset.comprarGrau;
      if(!podeComprarGrau(p, id)) return;
      const atual = grauAtributo(p, id);
      const custo = custoProximoGrau(atual);
      const nome = (ATRIBUTOS.find(a => a.id === id) || {}).nome || id;
      p.atributos[id] = atual + 1;
      p.compras.push({id: uid(), tipo:'atributo', descricao: `${nome}: Grau ${atual} → ${atual+1}`, custo});
    }));
  app.querySelectorAll('[data-comprar-treinamento]').forEach(b =>
    b.onclick = () => mudar(p => {
      const id = b.dataset.comprarTreinamento;
      if(!podeComprarTreinamento(p, id)) return;
      const proximo = proximoTreinamento(p.treinamentos[id] || 'nada');
      const custo = CUSTO_TREINAMENTO_DEGRAU[proximo.id];
      const nome = (PERICIAS.find(per => per.id === id) || {}).nome || id;
      p.treinamentos[id] = proximo.id;
      p.compras.push({id: uid(), tipo:'treinamento', descricao: `${nome}: ${proximo.nome}`, custo});
    }));

  app.querySelectorAll('[data-condicao-eixo]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicaoEixo;
      p.condicoesEixo = el.checked ? [...p.condicoesEixo, id] : p.condicoesEixo.filter(c => c !== id);
    }));
  app.querySelectorAll('[data-condicao-grave]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicaoGrave;
      p.condicoesGraves = el.checked ? [...p.condicoesGraves, id] : p.condicoesGraves.filter(c => c !== id);
    }));

  app.querySelectorAll('[data-consequencia]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [id, n] = b.dataset.consequencia.split('|');
      const num = Number(n);
      // Clicar no grau já marcado esvazia até ali (toggle); clicar além
      // enche até ali — mesmo padrão de clock usado no Relógio de Batalha.
      p.consequencias[id] = (num === (p.consequencias[id]||0)) ? num - 1 : num;
    }));

  const caido = document.getElementById('c-caido');
  if(caido) caido.onchange = () => mudar(p => p.risco.caido = caido.checked);
  const risco = document.getElementById('c-risco');
  if(risco) risco.onchange = () => mudar(p => p.risco.quantidade = Math.max(0, Math.min(3, Number(risco.value) || 0)));

  app.querySelectorAll('[data-pacto-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, chave] = el.dataset.pactoCampo.split('|');
      p.pacto.partes[Number(i)][chave] = el.value;
    }, el));
  app.querySelectorAll('[data-remover-pacto]').forEach(b =>
    b.onclick = () => mudar(p => {
      p.pacto.partes.splice(Number(b.dataset.removerPacto), 1);
      p.pacto.dividas = Math.max(0, p.pacto.partes.length);
    }));
  const addPacto = document.getElementById('btAddPacto');
  if(addPacto) addPacto.onclick = () => mudar(p => {
    p.pacto.partes.push({nome:'', canal:'', funcaoPerdida:''});
    p.pacto.dividas = p.pacto.partes.length;
  });

  // Corpo e Cinética: Esforço, Rastro e Romper.
  app.querySelectorAll('[data-cc-esforco]').forEach(b =>
    b.onclick = () => mudar(p => {
      const delta = Number(b.dataset.ccEsforco);
      p.corpoCinetica.esforco = Math.max(0, Math.min(5, p.corpoCinetica.esforco + delta));
    }));
  const ccForcar = document.getElementById('app').querySelector('[data-cc-forcar]');
  if(ccForcar) ccForcar.onclick = () => mudar(p => {
    p.corpoCinetica.esforco = Math.min(5, p.corpoCinetica.esforco + 1);
    if(!p.condicoesEixo.includes('exposto')) p.condicoesEixo = [...p.condicoesEixo, 'exposto'];
  });
  const ccReset = app.querySelector('[data-cc-reset]');
  if(ccReset) ccReset.onclick = () => mudar(p => p.corpoCinetica.esforco = 2);
  app.querySelectorAll('[data-cc-marca]').forEach(b =>
    b.onclick = () => mudar(p => {
      if(p.corpoCinetica.rastro.length < 2) p.corpoCinetica.rastro = [...p.corpoCinetica.rastro, b.dataset.ccMarca];
    }));

  if(recursoDesc) recursoDesc.oninput = () => { estado.compraRecurso.descricao = recursoDesc.value; };
  const btComprarRecurso = document.getElementById('btComprarRecurso');
  if(btComprarRecurso) btComprarRecurso.onclick = () => {
    const cr = estado.compraRecurso;
    const info = CUSTO_RECURSOS_ELETIVAS.find(r => r.id === cr.subtipo);
    mudar(p => {
      if(info.anoMinimo && p.ano < info.anoMinimo) return;
      if(peDisponivel(p) < info.custo) return;
      p.compras.push({id: uid(), tipo:'recurso', subtipo: cr.subtipo, descricao: cr.descricao, custo: info.custo});
    });
    estado.compraRecurso = {subtipo:'recurso', descricao:''};
  };

  app.querySelectorAll('[data-compra-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.compras.splice(Number(b.dataset.compraRemover), 1)));

  const marcoOpcao = document.getElementById('c-marco-opcao');
  if(marcoOpcao) marcoOpcao.onchange = () => { estado.marcoRascunho.opcao = marcoOpcao.value; render(); };
  const marcoDesc = document.getElementById('c-marco-desc');
  if(marcoDesc) marcoDesc.oninput = () => { estado.marcoRascunho.descricao = marcoDesc.value; };
  const btRegistrarMarco = document.getElementById('btRegistrarMarco');
  if(btRegistrarMarco) btRegistrarMarco.onclick = () => {
    const mr = estado.marcoRascunho;
    mudar(p => {
      if((p.marcos||[]).length >= marcosRecebidos(p)) return;
      p.marcos.push({id: uid(), opcao: mr.opcao, descricao: mr.descricao});
    });
    estado.marcoRascunho = {opcao:'repertorio', descricao:''};
  };
  app.querySelectorAll('[data-marco-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.marcos.splice(Number(b.dataset.marcoRemover), 1)));

  const ascensaoEixo = document.getElementById('c-ascensao-eixo');
  if(ascensaoEixo) ascensaoEixo.onchange = () => { estado.ascensaoRascunho.eixo = ascensaoEixo.value; render(); };
  const ascensaoDesc = document.getElementById('c-ascensao-desc');
  if(ascensaoDesc) ascensaoDesc.oninput = () => { estado.ascensaoRascunho.descricao = ascensaoDesc.value; };
  const btRegistrarAscensao = document.getElementById('btRegistrarAscensao');
  if(btRegistrarAscensao) btRegistrarAscensao.onclick = () => {
    const ar = estado.ascensaoRascunho;
    const eixoInfo = ASCENSAO_EIXOS.find(e => e.id === ar.eixo);
    mudar(p => {
      if((p.ascensoes||[]).length >= ascensoesConcluidas(p)) return;
      if(eixoInfo.anoMinimo && p.ano < eixoInfo.anoMinimo) return;
      p.ascensoes.push({id: uid(), eixo: ar.eixo, descricao: ar.descricao});
    });
    estado.ascensaoRascunho = {eixo:'massa-volume', descricao:''};
  };
  app.querySelectorAll('[data-ascensao-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.ascensoes.splice(Number(b.dataset.ascensaoRemover), 1)));

  // Doenças, Demi-humanos e Místicos.
  const doencaClassificacao = document.getElementById('c-doenca-classificacao');
  if(doencaClassificacao) doencaClassificacao.onchange = () => {
    estado.doencaRascunho.classificacao = doencaClassificacao.value;
    const primeiro = DOENCAS_CATALOGO.find(d => d.classificacao === doencaClassificacao.value);
    estado.doencaRascunho.id = primeiro ? primeiro.id : '';
    render();
  };
  const doencaPar = document.getElementById('c-doenca-par');
  if(doencaPar) doencaPar.onchange = () => { estado.doencaRascunho.id = doencaPar.value; render(); };
  const btAddDoenca = document.getElementById('btAddDoenca');
  if(btAddDoenca) btAddDoenca.onclick = () => mudar(p => {
    if(p.doencas.pares.length >= 6) return;
    const custo = p.doencas.pares.length < 2 ? 0 : 2;
    if(peDisponivel(p) < custo) return;
    p.doencas.pares.push(estado.doencaRascunho.id);
  });
  app.querySelectorAll('[data-doenca-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.doencas.pares.splice(Number(b.dataset.doencaRemover), 1)));

  // Progresso de Nível, Portfólio de Prova de Passagem e Recesso.
  const ritmoNivel = document.getElementById('c-ritmo-nivel');
  if(ritmoNivel) ritmoNivel.onchange = () => mudar(p => { p.progressaoEscolar.ritmo = ritmoNivel.value; });
  app.querySelectorAll('[data-progresso-nivel]').forEach(b =>
    b.onclick = () => mudar(p => { p.progressaoEscolar.progressoNivel = Number(b.dataset.progressoNivel); }));
  const btSubirNivelPadrao = document.getElementById('btSubirNivelPadrao');
  if(btSubirNivelPadrao) btSubirNivelPadrao.onclick = () => mudar(p => {
    if(p.progressaoEscolar.progressoNivel < 2) return;
    p.nivel += 1;
    p.progressaoEscolar.progressoNivel = 0;
  });
  const btSubirNivelDireto = document.getElementById('btSubirNivelDireto');
  if(btSubirNivelDireto) btSubirNivelDireto.onclick = () => mudar(p => { p.nivel += 1; });

  app.querySelectorAll('[data-portfolio]').forEach(el =>
    el.onchange = () => mudar(p => { p.progressaoEscolar.portfolio[el.dataset.portfolio] = el.checked; }));
  const recuperacaoInput = document.getElementById('c-recuperacao');
  if(recuperacaoInput) recuperacaoInput.oninput = () => mudarSemRedesenhar(p => {
    p.progressaoEscolar.recuperacao = recuperacaoInput.value;
  }, recuperacaoInput);
  const btNovoPortfolio = document.getElementById('btNovoPortfolio');
  if(btNovoPortfolio) btNovoPortfolio.onclick = () => mudar(p => {
    p.progressaoEscolar.portfolio = {dominio:false, criacao:false, cooperacao:false, consequencia:false};
    p.progressaoEscolar.recuperacao = '';
  });

  app.querySelectorAll('[data-recesso-atividade]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.recessoAtividade;
      const lista = p.progressaoEscolar.recesso.atividades;
      if(el.checked){
        if(lista.length >= 2) return;
        p.progressaoEscolar.recesso.atividades = [...lista, id];
      }else{
        p.progressaoEscolar.recesso.atividades = lista.filter(a => a !== id);
      }
    }));
  const recessoAnotacoes = document.getElementById('c-recesso-anotacoes');
  if(recessoAnotacoes) recessoAnotacoes.oninput = () => mudarSemRedesenhar(p => {
    p.progressaoEscolar.recesso.anotacoes = recessoAnotacoes.value;
  }, recessoAnotacoes);
  const btNovoRecesso = document.getElementById('btNovoRecesso');
  if(btNovoRecesso) btNovoRecesso.onclick = () => mudar(p => {
    p.progressaoEscolar.recesso = {atividades: [], anotacoes: ''};
  });

  // Vida: sofrer Impacto, curar, Primeiros Socorros, Recuperação.
  app.querySelectorAll('[data-vida-ajuste]').forEach(b =>
    b.onclick = () => mudar(p => {
      const max = vidaMaxima(p);
      p.atual.pv = Math.max(0, Math.min(max, vidaAtual(p) + Number(b.dataset.vidaAjuste)));
    }));
  const btSofrerImpacto = document.getElementById('btSofrerImpacto');
  if(btSofrerImpacto) btSofrerImpacto.onclick = () => mudar(p => {
    const bruto = Number(document.getElementById('c-vida-impacto').value) || 0;
    const guarda = Math.max(0, Number(document.getElementById('c-vida-guarda').value) || 0);
    const liquido = Math.max(0, bruto - guarda*0.25);
    const perda = impactoParaVida(p, liquido);
    p.atual.pv = Math.max(0, vidaAtual(p) - perda);
  });
  const btCurarImpacto = document.getElementById('btCurarImpacto');
  if(btCurarImpacto) btCurarImpacto.onclick = () => mudar(p => {
    const impacto = Number(document.getElementById('c-vida-cura').value) || 0;
    const cura = impactoParaVida(p, impacto);
    p.atual.pv = Math.min(vidaMaxima(p), vidaAtual(p) + cura);
  });
  const btPrimeirosSocorros = document.getElementById('btPrimeirosSocorros');
  if(btPrimeirosSocorros) btPrimeirosSocorros.onclick = () => mudar(p => {
    if(p.atual.primeirosSocorrosUsado) return;
    p.atual.pv = Math.min(vidaMaxima(p), vidaAtual(p) + impactoParaVida(p, 0.5));
    p.atual.primeirosSocorrosUsado = true;
  });
  app.querySelectorAll('[data-recuperacao]').forEach(b =>
    b.onclick = () => mudar(p => {
      const max = vidaMaxima(p);
      const tipo = b.dataset.recuperacao;
      if(tipo === 'respiro'){
        p.atual.primeirosSocorrosUsado = false;
      }else if(tipo === 'intervalo'){
        if((p.atual.intervalosUsados||0) >= 2) return;
        p.atual.pv = Math.min(max, vidaAtual(p) + vidaPorPercentual(p, 0.25));
        p.atual.intervalosUsados = (p.atual.intervalosUsados||0) + 1;
      }else if(tipo === 'repouso'){
        p.atual.pv = Math.min(max, vidaAtual(p) + vidaPorPercentual(p, 0.5));
      }else if(tipo === 'descanso-completo'){
        p.atual.pv = max;
        p.atual.intervalosUsados = 0;
        p.atual.primeirosSocorrosUsado = false;
        Object.keys(p.consequencias).forEach(k => { p.consequencias[k] = Math.max(0, p.consequencias[k] - 1); });
      }
    }));

  // Chassi, Núcleo de Consciência, Sistemas e Módulos de Robótica.
  const reChassi = document.getElementById('c-re-chassi');
  if(reChassi) reChassi.onchange = () => mudar(p => { p.roboticaEngenharia.chassiTipo = reChassi.value; });
  const reCategoriaChassi = document.getElementById('c-re-categoria-chassi');
  if(reCategoriaChassi) reCategoriaChassi.onchange = () => mudar(p => { p.roboticaEngenharia.categoriaChassi = reCategoriaChassi.value; });
  const reNucleo = document.getElementById('c-re-nucleo');
  if(reNucleo) reNucleo.onchange = () => mudar(p => { p.roboticaEngenharia.nucleo = reNucleo.value; });
  const reSistemaPrincipal = document.getElementById('c-re-sistema-principal');
  if(reSistemaPrincipal) reSistemaPrincipal.oninput = () => mudarSemRedesenhar(p => {
    p.roboticaEngenharia.sistemaPrincipal = reSistemaPrincipal.value;
  }, reSistemaPrincipal);

  const btAddApoio = document.getElementById('btAddApoio');
  if(btAddApoio) btAddApoio.onclick = () => mudar(p => {
    const limite = p.ano >= 2 ? 2 : 1;
    if((p.roboticaEngenharia.sistemasApoio||[]).length >= limite) return;
    p.roboticaEngenharia.sistemasApoio.push('');
  });
  app.querySelectorAll('[data-apoio-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      p.roboticaEngenharia.sistemasApoio[Number(el.dataset.apoioCampo)] = el.value;
    }, el));
  app.querySelectorAll('[data-apoio-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.roboticaEngenharia.sistemasApoio.splice(Number(b.dataset.apoioRemover), 1)));

  const moduloFamilia = document.getElementById('c-modulo-familia');
  if(moduloFamilia) moduloFamilia.onchange = () => { estado.moduloRascunho.familia = moduloFamilia.value; };
  const moduloCategoria = document.getElementById('c-modulo-categoria');
  if(moduloCategoria) moduloCategoria.onchange = () => { estado.moduloRascunho.categoria = moduloCategoria.value; };
  const moduloImpacto = document.getElementById('c-modulo-impacto');
  if(moduloImpacto) moduloImpacto.onchange = () => { estado.moduloRascunho.impacto = Number(moduloImpacto.value); };
  const moduloNome = document.getElementById('c-modulo-nome');
  if(moduloNome) moduloNome.oninput = () => { estado.moduloRascunho.nome = moduloNome.value; };
  const moduloAcao = document.getElementById('c-modulo-acao');
  if(moduloAcao) moduloAcao.oninput = () => { estado.moduloRascunho.acao = moduloAcao.value; };
  const moduloCusto = document.getElementById('c-modulo-custo');
  if(moduloCusto) moduloCusto.oninput = () => { estado.moduloRascunho.custo = moduloCusto.value; };
  const moduloAncora = document.getElementById('c-modulo-ancora');
  if(moduloAncora) moduloAncora.oninput = () => { estado.moduloRascunho.ancora = moduloAncora.value; };
  const moduloContrajogo = document.getElementById('c-modulo-contrajogo');
  if(moduloContrajogo) moduloContrajogo.oninput = () => { estado.moduloRascunho.contrajogo = moduloContrajogo.value; };
  const btAddModulo = document.getElementById('btAddModulo');
  if(btAddModulo) btAddModulo.onclick = () => {
    const dr = estado.moduloRascunho;
    mudar(p => {
      if((p.roboticaEngenharia.modulos||[]).length >= moduloTeto(p)) return;
      p.roboticaEngenharia.modulos.push({
        id: uid(), nome: dr.nome.trim() || 'Módulo sem nome', familia: dr.familia,
        categoria: dr.categoria, acao: dr.acao, custo: dr.custo, impacto: dr.impacto,
        ancora: dr.ancora, contrajogo: dr.contrajogo,
      });
    });
    estado.moduloRascunho = {nome:'', familia:'Locomoção', categoria:'I', acao:'', custo:'', impacto:1, ancora:'', contrajogo:''};
  };
  app.querySelectorAll('[data-modulo-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, campo] = el.dataset.moduloCampo.split('|');
      p.roboticaEngenharia.modulos[Number(i)][campo] = el.value;
    }, el));
  app.querySelectorAll('[data-modulo-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.roboticaEngenharia.modulos.splice(Number(b.dataset.moduloRemover), 1)));

  // Bestiário — Perfis e Traços de Zoologia e Etologia.
  const btAddPerfil = document.getElementById('btAddPerfil');
  if(btAddPerfil) btAddPerfil.onclick = () => mudar(p => {
    if((p.zoologiaEtologia.perfis||[]).length >= 3) return;
    p.zoologiaEtologia.perfis.push({id: uid(), nome: '', tracos: []});
  });
  app.querySelectorAll('[data-perfil-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, campo] = el.dataset.perfilCampo.split('|');
      p.zoologiaEtologia.perfis[Number(i)][campo] = el.value;
    }, el));
  app.querySelectorAll('[data-perfil-remover]').forEach(b =>
    b.onclick = () => mudar(p => {
      const i = Number(b.dataset.perfilRemover);
      const removido = p.zoologiaEtologia.perfis[i];
      if(removido && p.zoologiaEtologia.perfilAtivoId === removido.id) p.zoologiaEtologia.perfilAtivoId = '';
      p.zoologiaEtologia.perfis.splice(i, 1);
    }));
  app.querySelectorAll('[data-perfil-ativo]').forEach(el =>
    el.onchange = () => mudar(p => { p.zoologiaEtologia.perfilAtivoId = el.dataset.perfilAtivo; }));
  app.querySelectorAll('[data-add-traco]').forEach(b =>
    b.onclick = () => mudar(p => {
      const perfil = p.zoologiaEtologia.perfis[Number(b.dataset.addTraco)];
      if(!perfil.tracos) perfil.tracos = [];
      if(perfil.tracos.length >= 3) return;
      perfil.tracos.push({familia: TRACO_FAMILIAS[0], descricao: ''});
    }));
  app.querySelectorAll('[data-remover-traco]').forEach(b =>
    b.onclick = () => mudar(p => {
      const perfil = p.zoologiaEtologia.perfis[Number(b.dataset.removerTraco)];
      if(perfil.tracos && perfil.tracos.length) perfil.tracos.pop();
    }));
  app.querySelectorAll('[data-traco-familia]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [i, ti] = el.dataset.tracoFamilia.split('|');
      p.zoologiaEtologia.perfis[Number(i)].tracos[Number(ti)].familia = el.value;
    }));
  app.querySelectorAll('[data-traco-descricao]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [i, ti] = el.dataset.tracoDescricao.split('|');
      p.zoologiaEtologia.perfis[Number(i)].tracos[Number(ti)].descricao = el.value;
    }, el));

  const metassimbolo = document.getElementById('c-sa-metassimbolo');
  if(metassimbolo) metassimbolo.oninput = () => mudarSemRedesenhar(p => {
    p.simbologiaArcana.metassimbolo = metassimbolo.value;
  }, metassimbolo);
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('chkCompartilhar').onchange = e => {
  alternarCompartilhado(e.target.checked);
};

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value; render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'status';
  salvar(); render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      if(MODO_HUB){
        lido.id = MODO_HUB;
        estado.fichas = [lido];
        estado.atualId = MODO_HUB;
      }else{
        lido.id = uid();
        estado.fichas.push(lido);
        estado.atualId = lido.id;
      }
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
