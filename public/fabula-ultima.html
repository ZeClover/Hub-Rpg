function blocoCulinaria(p){
  const np = npDoPoder(p, 'gourmet', 'culinaria');
  if(np <= 0) return '';
  const nivel = nivelTotal(p);
  const cul = p.culinaria || {ingredientes:{amargo:0,salgado:0,azedo:0,doce:0,umami:0}, receitas:{}};
  const ingredientes = cul.ingredientes || {amargo:0,salgado:0,azedo:0,doce:0,umami:0};
  const capacidade = 10 + np*5;
  const totalIngredientes = Object.values(ingredientes).reduce((s,n) => s+n, 0);
  const receitas = cul.receitas || {};
  const nomeSabor = id => SABORES.find(s => s.id === id)?.nome || id;

  return `<div class="cartao">
    <h2 style="font-size:18px">Culinária</h2>
    <p class="mini" style="margin:6px 0 14px">
      Ingredientes têm um sabor cada (pág. 149); combine 2 ou 3 numa iguaria.
      Cada combinação de dois sabores (mesmo repetido) tem um efeito fixo, que
      você descobre rolando 1d12 na primeira vez — a ficha de receitas abaixo
      guarda o resultado pra sempre.
    </p>

    <p class="mini" style="color:var(--texto);font-size:14px">
      <strong>Ingredientes</strong> (${totalIngredientes} de ${capacidade})
    </p>
    <div class="grade g3" style="margin-top:8px">
      ${SABORES.map(s => `<div>
        <label>${s.nome}</label>
        <div class="linha">
          <button data-ingrediente-menos="${s.id}" ${(ingredientes[s.id]||0)<=0?'disabled':''} aria-label="Diminuir">−</button>
          <span style="min-width:2ch;text-align:center">${ingredientes[s.id]||0}</span>
          <button data-ingrediente-mais="${s.id}" ${totalIngredientes>=capacidade?'disabled':''} aria-label="Aumentar">+</button>
        </div>
      </div>`).join('')}
    </div>

    <p class="mini" style="color:var(--texto);font-size:14px;margin-top:16px"><strong>Ficha de receitas</strong></p>
    ${paresDeSabor().map(([a,b]) => {
      const chave = chaveSabor(a,b);
      const receita = receitas[chave];
      const efeitoDef = receita ? CULINARIA_EFEITOS.find(e => e.id === receita.efeito) : null;
      return `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--borda)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="mini"><strong>${nomeSabor(a)} + ${nomeSabor(b)}</strong></span>
          ${!receita ? `<button data-receita-rolar="${chave}">Rolar (d12)</button>` : `
            <span class="linha" style="width:auto;gap:8px;flex-wrap:wrap">
              <span class="mini">d12 → ${receita.efeito}</span>
              ${efeitoDef?.escolha ? `<select data-receita-escolha="${chave}">
                <option value="">— escolher —</option>
                ${opcoesDeEscolha(efeitoDef.escolha).map(o => `<option value="${o.id}" ${receita.escolha===o.id?'selected':''}>${o.nome}</option>`).join('')}
              </select>` : ''}
            </span>`}
        </div>
        ${receita ? `<p class="mini" style="margin:4px 0 0">${textoEfeitoCulinaria(receita.efeito, receita.escolha, nivel)}</p>` : ''}
      </div>`;
    }).join('')}

    <p class="mini" style="color:var(--texto);font-size:14px;margin-top:16px"><strong>Preparar iguaria</strong></p>
    <p class="mini" style="margin-top:4px">Escolha 2 ou 3 sabores (gasta 1 ingrediente de cada da lista acima); combinações novas são reveladas na hora.</p>
    <div class="grade g3" style="margin-top:8px">
      ${[0,1,2].map(i => `<select data-iguaria-sabor="${i}">
        <option value="">${i<2?'— sabor —':'— sabor (opcional) —'}</option>
        ${SABORES.map(s => `<option value="${s.id}">${s.nome}</option>`).join('')}
      </select>`).join('')}
    </div>
    <button id="btPrepararIguaria" style="margin-top:8px">Preparar</button>

    ${cul.ultimaIguaria ? `<div style="margin-top:10px;padding:10px;border:1px solid var(--borda);border-radius:8px">
      <p class="mini"><strong>Última iguaria</strong> (${cul.ultimaIguaria.sabores.map(nomeSabor).join(' + ')}):</p>
      ${cul.ultimaIguaria.pares.map(chave => {
        const r = receitas[chave]; if(!r) return '';
        const [a,b] = chave.split('|');
        return `<p class="mini" style="margin-top:6px"><strong>${nomeSabor(a)} + ${nomeSabor(b)}:</strong> ${textoEfeitoCulinaria(r.efeito, r.escolha, nivel)}</p>`;
      }).join('')}
    </div>` : ''}
  </div>`;
}

function blocoVeiculo(p){
  const np = npDoPoder(p, 'piloto', 'veiculo-pessoal');
  if(np <= 0) return '';
  const veic = p.veiculo || {estrutura:null, modulos:[]};
  const estrutura = estruturaDoVeiculo(p);
  const modulos = veic.modulos || [];
  const limitePossuidos = limiteModulosPossuidos(np);
  const limiteAtivos = limiteModulosAtivos(np);

  if(!estrutura){
    return `<div class="cartao">
      <h2 style="font-size:18px">Veículo Pessoal</h2>
      <p class="mini" style="margin:6px 0 14px">
        Escolha a estrutura do seu veículo (pág. 158-159) — ela é permanente,
        escolha com cuidado.
      </p>
      <select id="c-veiculo-estrutura">
        <option value="">— escolher —</option>
        ${ESTRUTURAS_VEICULO.map(e => `<option value="${e.id}">${e.nome} (${e.passageiros} passageiro${e.passageiros===1?'':'s'} além de você, distância ${e.distancia})</option>`).join('')}
      </select>
    </div>`;
  }

  const pesoAtivoTotal = modulos.filter(m => m.ativo).reduce((soma,m) => {
    const def = moduloVeiculoDef(m.id, m.tipo);
    return soma + (def?.custaDois ? 2 : 1);
  }, 0);
  const armaduraAtivaCount = modulos.filter(m => m.tipo==='armadura' && m.ativo).length;
  const armaAtivaCount = modulos.filter(m => m.tipo==='arma' && m.ativo).length;
  const temArmaExclusivaAtiva = modulos.some(m => m.tipo==='arma' && m.ativo && moduloVeiculoDef(m.id,'arma')?.exclusivo);

  return `<div class="cartao">
    <div class="flex" style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <h2 style="font-size:18px">Veículo Pessoal</h2>
      <span class="mini">${estrutura.nome} · ${modulos.length} de ${limitePossuidos} módulos possuídos · ${pesoAtivoTotal} de ${limiteAtivos} ativos</span>
    </div>
    <p class="mini" style="margin:6px 0 14px">
      ${estrutura.nome}: ${estrutura.passageiros} passageiro${estrutura.passageiros===1?'':'s'} além de você, distância de viagem ${estrutura.distancia}. Cabem até ${estrutura.maxArma} módulo${estrutura.maxArma===1?'':'s'} de arma e ${estrutura.maxArmadura} de armadura ativos ao mesmo tempo (suporte não tem limite próprio, só entra na conta geral). Os números abaixo só valem enquanto estiver pilotando.
    </p>

    <div class="linha" style="flex-wrap:wrap;gap:10px">
      <select id="c-veiculo-novo" style="flex:1;min-width:220px">
        <option value="">— escolher módulo —</option>
        <optgroup label="Armadura">
          ${MODULOS_ARMADURA_VEICULO.map(m => `<option value="armadura:${m.id}">${m.nome}</option>`).join('')}
        </optgroup>
        <optgroup label="Arma">
          ${[...MODULOS_ARMA_VEICULO, ESCUDO_VEICULO].map(m => `<option value="arma:${m.id}">${m.nome}</option>`).join('')}
        </optgroup>
        <optgroup label="Suporte">
          ${MODULOS_SUPORTE_VEICULO.map(m => `<option value="suporte:${m.id}">${m.nome}${m.custaDois?' (conta como 2)':''}</option>`).join('')}
        </optgroup>
      </select>
      <button id="btAddModuloVeiculo" ${modulos.length>=limitePossuidos?'disabled':''}>Adicionar</button>
    </div>

    ${modulos.length===0 ? `<p class="mini" style="margin-top:14px">Nenhum módulo ainda.</p>` : modulos.map((m,i) => {
      const def = moduloVeiculoDef(m.id, m.tipo);
      if(!def) return '';
      const restritoEstrutura = def.estruturas && !def.estruturas.includes(estrutura.id);
      let bloqueado = false, motivo = '';
      if(!m.ativo){
        if(restritoEstrutura){ bloqueado = true; motivo = 'não serve nesta estrutura'; }
        else if(m.tipo==='armadura' && armaduraAtivaCount >= estrutura.maxArmadura){ bloqueado = true; motivo = 'limite de armadura ativa'; }
        else if(m.tipo==='arma' && temArmaExclusivaAtiva){ bloqueado = true; motivo = 'outro módulo de arma exclusivo já está ativo'; }
        else if(m.tipo==='arma' && def.exclusivo && armaAtivaCount > 0){ bloqueado = true; motivo = 'exclusivo — nenhum outro módulo de arma pode estar ativo'; }
        else if(m.tipo==='arma' && armaAtivaCount >= estrutura.maxArma){ bloqueado = true; motivo = 'limite de arma ativa'; }
        else if(pesoAtivoTotal + (def.custaDois?2:1) > limiteAtivos){ bloqueado = true; motivo = 'limite geral de módulos ativos'; }
      }
      const textoDetalhe = m.tipo==='armadura'
        ? `Defesa ${def.textoDefesa} · Defesa Mágica ${def.textoDefesaMagica}${def.marcial?' (marcial)':''}`
        : m.tipo==='arma'
        ? (def.ehEscudo ? def.texto : `Precisão ${textoPrecisao(def)} · Dano ${textoDano(def)}${def.exclusivo?' (exclusivo)':''}${def.obs?` — ${def.obs}`:''}`)
        : def.texto;
      return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--borda);display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="flex:1">
          <label style="display:flex;align-items:baseline;gap:8px;text-transform:none;letter-spacing:normal;font-size:14px;color:var(--texto)">
            <input type="checkbox" style="width:auto" data-veiculo-modulo-ativo="${i}" ${m.ativo?'checked':''} ${(!m.ativo && bloqueado)?'disabled':''}>
            <span><strong>${def.nome}</strong> <span class="mini">(${m.tipo})</span></span>
          </label>
          <p class="mini" style="margin:4px 0 0 26px">${textoDetalhe}</p>
          ${!m.ativo && bloqueado ? `<p class="mini" style="margin:2px 0 0 26px;color:var(--suave)">Travado: ${motivo}.</p>` : ''}
        </div>
        <button data-veiculo-modulo-remover="${i}">Tirar</button>
      </div>`;
    }).join('')}
  </div>`;
}

/* --- Eventos ------------------------------------------------------------ */

// O `render` reescreve a tela inteira, então os eventos são religados a cada
// desenho. É simples e suficiente para uma ficha; o custo só apareceria numa
// tela com centenas de campos.
function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.perfil[el.dataset.perfil] = el.value, el));

  app.querySelectorAll('[data-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.campo] = el.value, el));

  app.querySelectorAll('[data-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.num] = Number(el.value) || 0, el));

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Number(el.value)));

  const perfilAtr = document.getElementById('c-perfilatr');
  if(perfilAtr) perfilAtr.onchange = () => mudar(p => {
    p.perfilAtributos = perfilAtr.value;
    // Trocar de perfil já aplica os dados dele, na ordem atual dos Atributos.
    const modelo = PERFIS.find(x => x.id === perfilAtr.value);
    if(modelo) ATRIBUTOS.forEach((a,i) => p.atributos[a.id] = modelo.dados[i]);
  });

  app.querySelectorAll('[data-classe]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.classe)].classeId = el.value));

  app.querySelectorAll('[data-nivel]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.nivel)].nivel = Number(el.value) || 0));

  app.querySelectorAll('[data-remover-classe]').forEach(b =>
    b.onclick = () => mudar(p => p.classes.splice(Number(b.dataset.removerClasse), 1)));

  const addClasse = document.getElementById('btAddClasse');
  if(addClasse) addClasse.onclick = () => mudar(p => p.classes.push({classeId:'', nivel:0}));

  app.querySelectorAll('[data-bonus]').forEach(el =>
    el.onchange = () => mudar(p => p.bonus[el.dataset.bonus] = Number(el.value) || 0));

  app.querySelectorAll('[data-equip]').forEach(el =>
    el.onchange = () => mudar(p => {
      const chave = el.dataset.equip + 'Id'; // armaduraId, maoPrincipalId, maoSecundariaId
      (p.equipamento || (p.equipamento = {}))[chave] = el.value;
    }));

  app.querySelectorAll('[data-escolha-beneficio]').forEach(el =>
    el.onchange = () => mudar(p => p.escolhasBeneficio[el.dataset.escolhaBeneficio] = el.value));

  // Poderes: os data-attrs guardam "classeId|poderId" juntos, separados por
  // "|", porque um botão só aceita um valor.
  app.querySelectorAll('[data-poder-mais]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [classeId, poderId] = b.dataset.poderMais.split('|');
      const def = PODERES_CLASSE[classeId].find(x => x.id === poderId);
      const mapa = p.poder.escolhas[classeId] || (p.poder.escolhas[classeId] = {});
      mapa[poderId] = Math.min(def.max, (mapa[poderId] || 0) + 1);
    }));

  app.querySelectorAll('[data-poder-menos]').forEach(b =>
    b.onclick = () => mudar(p => {
      const [classeId, poderId] = b.dataset.poderMenos.split('|');
      const mapa = p.poder.escolhas[classeId]; if(!mapa) return;
      mapa[poderId] = Math.max(0, (mapa[poderId] || 0) - 1);
      // Some com um poder de catálogo (Magia Elemental, Dança...) derruba a
      // NP: o que sobrar do índice sem cobertura é cortado, pra não guardar
      // lixo. Simbolismo dá duas vagas por compra — por isso o porCompra.
      const entradaCatalogo = LISTAS_DE_FEITICO[classeId];
      if(entradaCatalogo?.poderId === poderId){
        const vagas = mapa[poderId] * (entradaCatalogo.porCompra || 1);
        p.poder.feiticos[classeId] = (p.poder.feiticos[classeId] || []).slice(0, vagas);
      }
    }));

  const arcano = document.getElementById('c-arcano');
  if(arcano) arcano.onchange = () => mudar(p => p.poder.arcanoVinculado = arcano.value || null);

  app.querySelectorAll('[data-feitico]').forEach(el =>
    el.onchange = () => mudar(p => {
      const [classeId, indice] = el.dataset.feitico.split('|');
      const conhecidos = p.poder.feiticos[classeId] || (p.poder.feiticos[classeId] = []);
      conhecidos[Number(indice)] = el.value || null;
    }));

  app.querySelectorAll('[data-ritual-potencia]').forEach(el =>
    el.onchange = () => mudar(p => {
      const d = el.dataset.ritualPotencia;
      const estado = p.rituais[d] || (p.rituais[d] = {potencia:'menor', area:'individual'});
      estado.potencia = el.value;
    }));

  app.querySelectorAll('[data-ritual-area]').forEach(el =>
    el.onchange = () => mudar(p => {
      const d = el.dataset.ritualArea;
      const estado = p.rituais[d] || (p.rituais[d] = {potencia:'menor', area:'individual'});
      estado.area = el.value;
    }));

  app.querySelectorAll('[data-projeto]').forEach(el =>
    el.onchange = () => mudar(p => {
      (p.projeto || (p.projeto = {potencia:'menor', area:'individual', uso:'consumivel', defeito:false}))[el.dataset.projeto] = el.value;
    }));

  const projetoDefeito = document.querySelector('[data-projeto-defeito]');
  if(projetoDefeito) projetoDefeito.onchange = () => mudar(p => {
    (p.projeto || (p.projeto = {potencia:'menor', area:'individual', uso:'consumivel', defeito:false})).defeito = projetoDefeito.checked;
  });

  const btAddAcessorioCatalogo = document.getElementById('btAddAcessorioCatalogo');
  if(btAddAcessorioCatalogo) btAddAcessorioCatalogo.onclick = () => {
    const sel = document.getElementById('c-acess-novo');
    if(!sel.value) return;
    mudar(p => {
      (p.acessorios || (p.acessorios = [])).push({id: sel.value, equipado: true});
    });
  };

  const btAddAcessorioAvulso = document.getElementById('btAddAcessorioAvulso');
  if(btAddAcessorioAvulso) btAddAcessorioAvulso.onclick = () => {
    const campo = document.getElementById('c-acess-avulso');
    const nome = campo.value.trim();
    if(!nome) return;
    mudar(p => {
      (p.acessorios || (p.acessorios = [])).push({id: null, nome, equipado: true});
    });
  };

  app.querySelectorAll('[data-acessorio-equipado]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.acessorios[Number(el.dataset.acessorioEquipado)].equipado = el.checked;
    }));

  app.querySelectorAll('[data-acessorio-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.acessorios.splice(Number(b.dataset.acessorioRemover), 1)));

  app.querySelectorAll('[data-engenhoca-mais]').forEach(b =>
    b.onclick = () => mudar(p => {
      const eng = p.engenhocas || (p.engenhocas = {alquimia:0, infusoes:0, tecnomagia:0});
      const tipo = b.dataset.engenhocaMais;
      eng[tipo] = Math.min(3, (eng[tipo] || 0) + 1);
    }));
  app.querySelectorAll('[data-engenhoca-menos]').forEach(b =>
    b.onclick = () => mudar(p => {
      const eng = p.engenhocas; if(!eng) return;
      const tipo = b.dataset.engenhocaMenos;
      eng[tipo] = Math.max(0, (eng[tipo] || 0) - 1);
    }));

  const alqMistura = document.getElementById('c-alq-mistura');
  if(alqMistura) alqMistura.onchange = () => mudar(p => {
    (p.alquimia || (p.alquimia = {mistura:'basica', rolagem:[], alvoIndice:null, efeitoEscolha:null})).mistura = alqMistura.value;
  });
  const btMisturar = document.getElementById('btMisturar');
  if(btMisturar) btMisturar.onclick = () => mudar(p => {
    const estado = p.alquimia || (p.alquimia = {mistura:'basica', rolagem:[], alvoIndice:null, efeitoEscolha:null});
    const mistura = ALQUIMIA_MISTURAS.find(m => m.id === estado.mistura) || ALQUIMIA_MISTURAS[0];
    estado.rolagem = Array.from({length: mistura.dados}, () => Math.floor(Math.random()*20) + 1);
    estado.alvoIndice = null;
    estado.efeitoEscolha = null;
  });
  const alqAlvo = document.getElementById('c-alq-alvo');
  if(alqAlvo) alqAlvo.onchange = () => mudar(p => {
    p.alquimia.alvoIndice = alqAlvo.value === '' ? null : Number(alqAlvo.value);
  });
  const alqEfeito = document.getElementById('c-alq-efeito');
  if(alqEfeito) alqEfeito.onchange = () => mudar(p => {
    p.alquimia.efeitoEscolha = alqEfeito.value || null;
  });

  app.querySelectorAll('[data-magisfera]').forEach(el =>
    el.onchange = () => mudar(p => {
      const conhecidas = p.magisferas || (p.magisferas = []);
      conhecidas[Number(el.dataset.magisfera)] = el.value || null;
    }));

  const culinariaBase = () => ({ingredientes:{amargo:0,salgado:0,azedo:0,doce:0,umami:0}, receitas:{}});
  app.querySelectorAll('[data-ingrediente-mais]').forEach(b =>
    b.onclick = () => mudar(p => {
      const cul = p.culinaria || (p.culinaria = culinariaBase());
      const sabor = b.dataset.ingredienteMais;
      const total = Object.values(cul.ingredientes).reduce((s,n) => s+n, 0);
      const capacidade = 10 + npDoPoder(p, 'gourmet', 'culinaria')*5;
      if(total < capacidade) cul.ingredientes[sabor] = (cul.ingredientes[sabor] || 0) + 1;
    }));
  app.querySelectorAll('[data-ingrediente-menos]').forEach(b =>
    b.onclick = () => mudar(p => {
      const cul = p.culinaria; if(!cul) return;
      const sabor = b.dataset.ingredienteMenos;
      cul.ingredientes[sabor] = Math.max(0, (cul.ingredientes[sabor] || 0) - 1);
    }));
  app.querySelectorAll('[data-receita-rolar]').forEach(b =>
    b.onclick = () => mudar(p => {
      const cul = p.culinaria || (p.culinaria = culinariaBase());
      cul.receitas[b.dataset.receitaRolar] = {efeito: String(Math.floor(Math.random()*12) + 1), escolha: null};
    }));
  app.querySelectorAll('[data-receita-escolha]').forEach(el =>
    el.onchange = () => mudar(p => {
      const receita = p.culinaria?.receitas?.[el.dataset.receitaEscolha];
      if(receita) receita.escolha = el.value || null;
    }));
  const btPrepararIguaria = document.getElementById('btPrepararIguaria');
  if(btPrepararIguaria) btPrepararIguaria.onclick = () => {
    const sabores = [0,1,2].map(i => document.querySelector(`[data-iguaria-sabor="${i}"]`)?.value).filter(Boolean);
    if(sabores.length < 2){ alert('Escolha pelo menos 2 sabores.'); return; }
    mudar(p => {
      const cul = p.culinaria || (p.culinaria = culinariaBase());
      const contagem = {};
      sabores.forEach(s => contagem[s] = (contagem[s] || 0) + 1);
      const faltando = Object.entries(contagem).some(([s,qtd]) => (cul.ingredientes[s] || 0) < qtd);
      if(faltando){ alert('Ingredientes insuficientes desses sabores.'); return; }
      Object.entries(contagem).forEach(([s,qtd]) => cul.ingredientes[s] -= qtd);
      const pares = new Set();
      for(let i=0;i<sabores.length;i++) for(let j=i+1;j<sabores.length;j++) pares.add(chaveSabor(sabores[i], sabores[j]));
      pares.forEach(chave => {
        if(!cul.receitas[chave]) cul.receitas[chave] = {efeito: String(Math.floor(Math.random()*12) + 1), escolha: null};
      });
      cul.ultimaIguaria = {sabores, pares: [...pares]};
    });
  };

  const veiculoBase = () => ({estrutura:null, modulos:[]});
  const btVeiculoEstrutura = document.getElementById('c-veiculo-estrutura');
  if(btVeiculoEstrutura) btVeiculoEstrutura.onchange = () => mudar(p => {
    (p.veiculo || (p.veiculo = veiculoBase())).estrutura = btVeiculoEstrutura.value || null;
  });
  const btAddModuloVeiculo = document.getElementById('btAddModuloVeiculo');
  if(btAddModuloVeiculo) btAddModuloVeiculo.onclick = () => {
    const sel = document.getElementById('c-veiculo-novo');
    if(!sel || !sel.value) return;
    const [tipo, id] = sel.value.split(':');
    mudar(p => {
      const veic = p.veiculo || (p.veiculo = veiculoBase());
      const modulos = veic.modulos || (veic.modulos = []);
      if(modulos.length >= limiteModulosPossuidos(npDoPoder(p, 'piloto', 'veiculo-pessoal'))) return;
      modulos.push({tipo, id, ativo:false});
    });
  };
  app.querySelectorAll('[data-veiculo-modulo-ativo]').forEach(el =>
    el.onchange = () => mudar(p => {
      p.veiculo.modulos[Number(el.dataset.veiculoModuloAtivo)].ativo = el.checked;
    }));
  app.querySelectorAll('[data-veiculo-modulo-remover]').forEach(b =>
    b.onclick = () => mudar(p => p.veiculo.modulos.splice(Number(b.dataset.veiculoModuloRemover), 1)));

  app.querySelectorAll('[data-atualrec]').forEach(el =>
    el.onchange = () => mudar(p => p.atual[el.dataset.atualrec] = Number(el.value) || 0));

  app.querySelectorAll('[data-heroica]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.heroica;
      const lista = p.heroicas || (p.heroicas = []);
      p.heroicas = el.checked ? [...new Set([...lista, id])] : lista.filter(x => x !== id);
    }));

  app.querySelectorAll('[data-afinidade]').forEach(el =>
    el.onchange = () => mudar(p => {
      (p.afinidades || (p.afinidades = {}))[el.dataset.afinidade] = el.value;
    }));

  const danoValor = document.getElementById('c-dano-valor');
  const danoTipo = document.getElementById('c-dano-tipo');
  const atualizarPreviaDano = () => {
    const p = atual(); const previa = document.getElementById('dano-previa');
    if(!p || !previa || !danoValor || !danoTipo) return;
    previa.textContent = resultadoDeDano(p, Number(danoValor.value) || 0, danoTipo.value).texto;
  };
  if(danoValor) danoValor.oninput = atualizarPreviaDano;
  if(danoTipo) danoTipo.onchange = atualizarPreviaDano;

  const btAplicarDano = document.getElementById('btAplicarDano');
  if(btAplicarDano) btAplicarDano.onclick = () => mudar(p => {
    const r = resultadoDeDano(p, Number(danoValor.value) || 0, danoTipo.value);
    const atual0 = p.atual.pv ?? pvMaximo(p);
    p.atual.pv = Math.max(0, Math.min(pvMaximo(p), atual0 - r.pv));
  });

  app.querySelectorAll('[data-condicao]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicao;
      p.condicoes = el.checked
        ? [...new Set([...p.condicoes, id])]
        : p.condicoes.filter(x => x !== id);
    }));

  const descanso = document.getElementById('btDescanso');
  if(descanso) descanso.onclick = () => mudar(p => {
    p.atual = {pv:null, pm:null, pi:null};
    p.condicoes = [];
  });

  app.querySelectorAll('[data-laco]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.lacos[Number(el.dataset.laco)].nome = el.value, el));
  app.querySelectorAll('[data-lacoemocao]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.lacos[Number(el.dataset.lacoemocao)].emocoes = el.value, el));
  app.querySelectorAll('[data-removerlaco]').forEach(b =>
    b.onclick = () => mudar(p => p.lacos.splice(Number(b.dataset.removerlaco), 1)));
  const addLaco = document.getElementById('btAddLaco');
  if(addLaco) addLaco.onclick = () => mudar(p => p.lacos.push({nome:'', emocoes:''}));
}

/* Redesenhar a cada tecla faria o cursor pular para o fim do campo. Para
   texto livre, salvamos sem redesenhar; o painel do topo é atualizado à mão
   quando o campo afeta algum número. */
let debounce;
function mudarSemRedesenhar(mudanca, elemento){
  if(MODO_HUB && !estado.ehDono) return; // defesa extra: modo leitura não edita
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('chkCompartilhar').onchange = e => {
  alternarCompartilhado(e.target.checked);
};

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value; render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'perfil';
  salvar(); render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      if(MODO_HUB){
        // No Hub só existe esta ficha — importar restaura o conteúdo dela
        // a partir de um backup, em vez de criar outra.
        lido.id = MODO_HUB;
        estado.fichas = [lido];
        estado.atualId = MODO_HUB;
      }else{
        // Id novo: importar nunca sobrescreve um personagem que já existe.
        lido.id = uid();
        estado.fichas.push(lido);
        estado.atualId = lido.id;
      }
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
