<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Fabula Ultima</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s;
}
button:hover{border-color:var(--suave)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.crise .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.classe-linha{display:grid; grid-template-columns:1fr 90px auto; gap:10px; align-items:end; margin-bottom:10px}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Fabula Ultima</span>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <button id="btExportar">Exportar</button>
  <button id="btImportar">Importar</button>
  <input type="file" id="arquivo" accept="application/json" hidden>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>
<main id="app"></main>
<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — FABULA ULTIMA (Livro Básico, edição brasileira)

   Ferramenta não-oficial feita por fã. Este arquivo codifica MECÂNICA:
   fórmulas, escala de dados, cálculo de defesa e o efeito numérico das
   condições. Ele não reproduz o texto, a arte ou as descrições do livro —
   para saber o que cada poder faz, consulte o seu exemplar.

   Fabula Ultima © Need Games e Rooster Games. Edição brasileira: Jambô.

   Os personagens ficam no SEU navegador (localStorage). Não há servidor nem
   conta: ninguém mais vê sua ficha, e ela não sincroniza entre aparelhos.
   Limpar os dados do site apaga tudo — por isso o "Exportar".
   =========================================================================== */

/* --- Regras do livro, em forma de dados -------------------------------- */

// Escala de dados dos Atributos: mínimo d6, máximo d12 (pág. 162).
const ESCALA = [6, 8, 10, 12];

const ATRIBUTOS = [
  {id:'destreza', nome:'Destreza', abrev:'DES', sobre:'precisão, coordenação, finesse e reflexos'},
  {id:'vigor',    nome:'Vigor',    abrev:'VIG', sobre:'capacidade física e robustez'},
  {id:'astucia',  nome:'Astúcia',  abrev:'AST', sobre:'observação, compreensão e raciocínio'},
  {id:'vontade',  nome:'Vontade',  abrev:'VON', sobre:'determinação, carisma e influência'},
];

// Perfis de distribuição na criação (pág. 162).
const PERFIS = [
  {id:'especializado', nome:'Especializado', dados:[10,10,6,6]},
  {id:'mediano',       nome:'Mediano',       dados:[10,8,8,6]},
  {id:'toda-obra',     nome:'Pau pra toda obra', dados:[8,8,8,8]},
];

// As 15 classes do Livro Básico. `marcial` registra o que a classe permite
// equipar — usado depois, quando o inventário existir.
const CLASSES = [
  {id:'andarilho',        nome:'Andarilho'},
  {id:'arcanista',        nome:'Arcanista'},
  {id:'atirador',         nome:'Atirador',        marcial:['arma à distância','escudo']},
  {id:'elementalista',    nome:'Elementalista'},
  {id:'entropista',       nome:'Entropista'},
  {id:'erudito',          nome:'Erudito'},
  {id:'espiritualista',   nome:'Espiritualista'},
  {id:'furioso',          nome:'Furioso',         marcial:['arma corpo a corpo','armadura']},
  {id:'guardiao',         nome:'Guardião',        marcial:['armadura','escudo']},
  {id:'guerreiro-sombrio',nome:'Guerreiro Sombrio', marcial:['arma corpo a corpo','armadura']},
  {id:'inventor',         nome:'Inventor'},
  {id:'ladino',           nome:'Ladino'},
  {id:'mestre-de-armas',  nome:'Mestre de Armas', marcial:['arma corpo a corpo','escudo']},
  {id:'orador',           nome:'Orador'},
  {id:'quimerista',       nome:'Quimerista'},
];

/* Condições (pág. 94). Cada uma reduz um ou dois Atributos em UM passo de
   dado. São cumulativas, e nenhum Atributo desce abaixo de d6 — as duas
   regras estão aplicadas em `dadoAtual`. */
const CONDICOES = [
  {id:'abalado',    nome:'Abalado',    reduz:['vontade']},
  {id:'atordoado',  nome:'Atordoado',  reduz:['astucia']},
  {id:'enfurecido', nome:'Enfurecido', reduz:['destreza','astucia']},
  {id:'envenenado', nome:'Envenenado', reduz:['vigor','vontade']},
  {id:'fraco',      nome:'Fraco',      reduz:['vigor']},
  {id:'lento',      nome:'Lento',      reduz:['destreza']},
];

const NIVEL_INICIAL = 5;   // pág. 161
const PI_BASE = 6;         // pág. 163
const ZENITES_INICIAIS = 500;

/* --- Cálculos ----------------------------------------------------------- */

// Dado atual = dado básico menos um passo por condição que afeta o Atributo,
// nunca abaixo de d6.
function dadoAtual(p, idAtributo){
  const basico = p.atributos[idAtributo] || 6;
  const quedas = CONDICOES
    .filter(c => p.condicoes.includes(c.id) && c.reduz.includes(idAtributo))
    .length;
  const posicao = ESCALA.indexOf(basico);
  return ESCALA[Math.max(0, (posicao === -1 ? 1 : posicao) - quedas)];
}

const nivelTotal = p => p.classes.reduce((soma, c) => soma + (c.nivel || 0), 0);

// PV/PM: nível total + cinco vezes o dado do Atributo, mais os bônus que as
// classes concederam (pág. 163). O bônus entra à mão porque depende de qual
// benefício grátis o jogador escolheu a cada nível.
const pvMaximo = p => nivelTotal(p) + 5 * dadoAtual(p,'vigor')   + (p.bonus.pv || 0);
const pmMaximo = p => nivelTotal(p) + 5 * dadoAtual(p,'vontade') + (p.bonus.pm || 0);
const crise    = p => Math.floor(pvMaximo(p) / 2);
const piMaximo = p => PI_BASE + (p.bonus.pi || 0);

// Defesa vem do dado ATUAL, não do básico — por isso uma condição derruba a
// defesa junto (pág. 168).
const defesa       = p => dadoAtual(p,'destreza') + (p.bonus.defesa || 0);
const defesaMagica = p => dadoAtual(p,'astucia')  + (p.bonus.defesaMagica || 0);
const iniciativa   = p => 0 + (p.bonus.iniciativa || 0);

/* --- Personagem --------------------------------------------------------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function novoPersonagem(nome){
  return {
    id: uid(), versaoFicha: 1, criadoEm: Date.now(), atualizadoEm: Date.now(),
    perfil: {nome: nome || 'Novo Personagem', identidade:'', tema:'', origem:'',
             pronomes:'', aparencia:''},
    perfilAtributos: 'mediano',
    atributos: {destreza:8, vigor:8, astucia:8, vontade:6},
    classes: [{classeId:'', nivel:0},{classeId:'', nivel:0},{classeId:'', nivel:0}],
    bonus: {pv:0, pm:0, pi:0, defesa:0, defesaMagica:0, iniciativa:0},
    atual: {pv:null, pm:null, pi:null},   // null = cheio
    condicoes: [],
    pontosFabula: 3,
    zenites: ZENITES_INICIAIS,
    lacos: [],
    anotacoes: '',
  };
}

/* --- Armazenamento ------------------------------------------------------ */

const CHAVE = 'fabula_ultima_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

function salvar(){
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    // Falhar em silêncio aqui faria o jogador achar que salvou e perder tudo
    // ao fechar a aba. O aviso precisa aparecer na tela.
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const estado = {fichas: carregar(), atualId: null, aba: 'perfil'};
if(estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

function mudar(mudanca){
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

/* --- Desenho da tela ---------------------------------------------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ABAS = [
  {id:'perfil',    nome:'Perfil'},
  {id:'atributos', nome:'Atributos e Classes'},
  {id:'recursos',  nome:'Recursos'},
  {id:'lacos',     nome:'Laços'},
];

function render(){
  desenharBarra();
  const app = document.getElementById('app');
  const p = atual();

  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em “+ Novo” para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const alerta = falhouAoSalvar
    ? `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
       Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
       perder o que você preencheu.</div>` : '';

  app.innerHTML = alerta
    + `<div class="abas">` + ABAS.map(a =>
        `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
      ).join('') + `</div>`
    + painelDerivados(p)
    + ({perfil:abaPerfil, atributos:abaAtributos, recursos:abaRecursos, lacos:abaLacos}[estado.aba])(p);

  ligarEventos();
}

function desenharBarra(){
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

// O painel de números derivados fica visível em todas as abas: é o que se
// consulta o tempo todo durante a sessão.
function painelDerivados(p){
  const pv = p.atual.pv ?? pvMaximo(p);
  const emCrise = pv <= crise(p);
  return `<div class="grade g4" style="margin-bottom:14px">
    <div class="derivado ${emCrise?'crise':''}">
      <div class="rot">Pontos de Vida</div>
      <div class="val">${pv}<span style="font-size:16px;color:var(--suave)">/${pvMaximo(p)}</span></div>
      <div class="obs">${emCrise ? 'em crise' : 'crise em ' + crise(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Pontos de Mana</div>
      <div class="val">${p.atual.pm ?? pmMaximo(p)}<span style="font-size:16px;color:var(--suave)">/${pmMaximo(p)}</span></div>
      <div class="obs">nível + 5 × Vontade</div>
    </div>
    <div class="derivado">
      <div class="rot">Defesa</div>
      <div class="val">${defesa(p)}</div>
      <div class="obs">mágica ${defesaMagica(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Nível</div>
      <div class="val">${nivelTotal(p)}</div>
      <div class="obs">${p.atual.pi ?? piMaximo(p)}/${piMaximo(p)} inventário</div>
    </div>
  </div>`;
}

function campo(rotulo, chave, valor, tipo){
  return `<div><label for="c-${chave}">${rotulo}</label>
    <input id="c-${chave}" data-perfil="${chave}" type="${tipo||'text'}" value="${esc(valor)}"></div>`;
}

function abaPerfil(p){
  return `<div class="cartao">
    <div class="grade g2">
      ${campo('Nome','nome',p.perfil.nome)}
      ${campo('Identidade','identidade',p.perfil.identidade)}
      ${campo('Tema','tema',p.perfil.tema)}
      ${campo('Origem','origem',p.perfil.origem)}
      ${campo('Pronomes','pronomes',p.perfil.pronomes)}
      <div><label for="c-fabula">Pontos de Fabula</label>
        <input id="c-fabula" data-num="pontosFabula" type="number" min="0" value="${p.pontosFabula}"></div>
    </div>
    <div style="margin-top:14px">
      <label for="c-aparencia">Aparência</label>
      <textarea id="c-aparencia" data-perfil="aparencia" rows="3">${esc(p.perfil.aparencia)}</textarea>
    </div>
    <div style="margin-top:14px">
      <label for="c-anotacoes">Anotações</label>
      <textarea id="c-anotacoes" data-campo="anotacoes" rows="5">${esc(p.anotacoes)}</textarea>
    </div>
  </div>`;
}

function abaAtributos(p){
  const perfil = PERFIS.find(x => x.id === p.perfilAtributos);
  const escolhidos = ATRIBUTOS.map(a => p.atributos[a.id]).sort((a,b) => b-a);
  const esperados = perfil ? [...perfil.dados].sort((a,b) => b-a) : null;
  const perfilBate = esperados && escolhidos.every((v,i) => v === esperados[i]);

  const total = nivelTotal(p);
  const usadas = p.classes.filter(c => c.classeId).length;

  return `<div class="cartao">
    <h2 style="font-size:18px">Atributos</h2>
    <p class="mini" style="margin:6px 0 16px">
      O <strong>dado básico</strong> é o que você escolhe. O <strong>dado atual</strong>
      já desconta as condições ativas, e é ele que vale para Defesa.
    </p>

    <div style="max-width:320px;margin-bottom:16px">
      <label for="c-perfilatr">Perfil de distribuição</label>
      <select id="c-perfilatr">
        ${PERFIS.map(x => `<option value="${x.id}" ${x.id===p.perfilAtributos?'selected':''}>
          ${x.nome} — ${x.dados.map(d=>'d'+d).join(', ')}</option>`).join('')}
      </select>
    </div>

    <div class="grade g4">
      ${ATRIBUTOS.map(a => {
        const base = p.atributos[a.id], agora = dadoAtual(p, a.id);
        return `<div>
          <label for="c-atr-${a.id}">${a.nome}</label>
          <select id="c-atr-${a.id}" data-atributo="${a.id}">
            ${ESCALA.map(d => `<option value="${d}" ${d===base?'selected':''}>d${d}</option>`).join('')}
          </select>
          <p class="mini" style="margin-top:6px">
            ${agora !== base ? `atual <strong style="color:var(--alerta)">d${agora}</strong> · ` : ''}${a.sobre}
          </p>
        </div>`;
      }).join('')}
    </div>

    ${perfilBate
      ? `<p class="ok">Os dados batem com o perfil ${perfil.nome}.</p>`
      : `<div class="aviso">Os dados escolhidos não batem com o perfil
         <strong>${perfil ? perfil.nome : '—'}</strong>
         (${perfil ? perfil.dados.map(d=>'d'+d).join(', ') : ''}).
         Troque o perfil ou ajuste os dados.</div>`}
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Classes</h2>
    <p class="mini" style="margin:6px 0 16px">
      Na criação são <strong>duas ou três classes</strong> e <strong>cinco níveis</strong>
      distribuídos entre elas.
    </p>
    ${p.classes.map((c,i) => `
      <div class="classe-linha">
        <div>
          <label for="c-cl-${i}">${i+1}ª classe</label>
          <select id="c-cl-${i}" data-classe="${i}">
            <option value="">— nenhuma —</option>
            ${CLASSES.map(x => `<option value="${x.id}" ${x.id===c.classeId?'selected':''}>${x.nome}</option>`).join('')}
          </select>
        </div>
        <div>
          <label for="c-nv-${i}">Nível</label>
          <input id="c-nv-${i}" data-nivel="${i}" type="number" min="0" max="10" value="${c.nivel||0}">
        </div>
        <button data-remover-classe="${i}" ${p.classes.length<=2?'disabled':''}>Tirar</button>
      </div>`).join('')}
    <button id="btAddClasse" ${p.classes.length>=7?'disabled':''}>+ Outra classe</button>

    ${total === NIVEL_INICIAL && usadas >= 2
      ? `<p class="ok">Nível ${total}, ${usadas} classes — pronto para começar.</p>`
      : `<div class="aviso">Somando ${total} ${total===1?'nível':'níveis'} em ${usadas}
         ${usadas===1?'classe':'classes'}. Um personagem novo começa com
         <strong>${NIVEL_INICIAL} níveis</strong> em <strong>2 ou 3 classes</strong>.
         Se este é um personagem avançado, pode ignorar.</div>`}
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Bônus das classes</h2>
    <p class="mini" style="margin:6px 0 16px">
      A cada nível de classe você escolhe um benefício grátis: PV+5, PM+5 ou PI+2.
      Some aqui o total escolhido — a ficha não adivinha por você.
    </p>
    <div class="grade g3">
      ${[['pv','PV adicionais'],['pm','PM adicionais'],['pi','PI adicionais']].map(([k,r]) =>
        `<div><label for="c-b-${k}">${r}</label>
         <input id="c-b-${k}" data-bonus="${k}" type="number" value="${p.bonus[k]||0}"></div>`).join('')}
    </div>
    <div class="grade g3" style="margin-top:14px">
      ${[['defesa','Defesa (armadura/escudo)'],['defesaMagica','Defesa mágica'],['iniciativa','Iniciativa']].map(([k,r]) =>
        `<div><label for="c-b-${k}">${r}</label>
         <input id="c-b-${k}" data-bonus="${k}" type="number" value="${p.bonus[k]||0}"></div>`).join('')}
    </div>
  </div>`;
}

function abaRecursos(p){
  const linha = (chave, rotulo, maximo) => `
    <div>
      <label for="c-a-${chave}">${rotulo}</label>
      <div class="linha">
        <input id="c-a-${chave}" data-atualrec="${chave}" type="number" min="0" max="${maximo}"
               value="${p.atual[chave] ?? maximo}">
        <span class="mini" style="white-space:nowrap">de ${maximo}</span>
      </div>
    </div>`;

  return `<div class="cartao">
    <h2 style="font-size:18px">Agora</h2>
    <div class="grade g3" style="margin-top:14px">
      ${linha('pv','Pontos de Vida', pvMaximo(p))}
      ${linha('pm','Pontos de Mana', pmMaximo(p))}
      ${linha('pi','Pontos de Inventário', piMaximo(p))}
    </div>
    <div class="linha" style="margin-top:14px">
      <button id="btDescanso" class="destaque">Descanso completo</button>
      <span class="mini">Enche PV, PM e PI, e limpa as condições.</span>
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Condições</h2>
    <p class="mini" style="margin:6px 0 14px">
      Cada condição reduz um passo de dado. Elas se acumulam, e nenhum
      Atributo desce abaixo de d6.
    </p>
    <div class="condicoes">
      ${CONDICOES.map(c => `<label>
        <input type="checkbox" data-condicao="${c.id}" ${p.condicoes.includes(c.id)?'checked':''}>
        ${c.nome} <span class="mini">(${c.reduz.map(r =>
          ATRIBUTOS.find(a=>a.id===r).abrev).join(' e ')})</span>
      </label>`).join('')}
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Zênites</h2>
    <div style="max-width:220px;margin-top:12px">
      <input data-num="zenites" type="number" min="0" value="${p.zenites}">
    </div>
  </div>`;
}

function abaLacos(p){
  return `<div class="cartao">
    <h2 style="font-size:18px">Laços</h2>
    <p class="mini" style="margin:6px 0 14px">
      Até seis laços. Cada um tem uma emoção de cada par, no máximo — e o
      nível do laço é quantas emoções ele tem.
    </p>
    ${(p.lacos.length ? p.lacos : []).map((l,i) => `
      <div class="grade g2" style="margin-bottom:12px;align-items:end">
        <div><label for="c-l-${i}">Com quem</label>
          <input id="c-l-${i}" data-laco="${i}" value="${esc(l.nome||'')}"></div>
        <div class="linha">
          <div style="flex:1"><label for="c-le-${i}">Emoções</label>
            <input id="c-le-${i}" data-lacoemocao="${i}" value="${esc(l.emocoes||'')}"
                   placeholder="Admiração, Lealdade…"></div>
          <button data-removerlaco="${i}">Tirar</button>
        </div>
      </div>`).join('')}
    <button id="btAddLaco" ${p.lacos.length>=6?'disabled':''}>+ Novo laço</button>
  </div>`;
}

/* --- Eventos ------------------------------------------------------------ */

// O `render` reescreve a tela inteira, então os eventos são religados a cada
// desenho. É simples e suficiente para uma ficha; o custo só apareceria numa
// tela com centenas de campos.
function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.perfil[el.dataset.perfil] = el.value, el));

  app.querySelectorAll('[data-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.campo] = el.value, el));

  app.querySelectorAll('[data-num]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p[el.dataset.num] = Number(el.value) || 0, el));

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Number(el.value)));

  const perfilAtr = document.getElementById('c-perfilatr');
  if(perfilAtr) perfilAtr.onchange = () => mudar(p => {
    p.perfilAtributos = perfilAtr.value;
    // Trocar de perfil já aplica os dados dele, na ordem atual dos Atributos.
    const modelo = PERFIS.find(x => x.id === perfilAtr.value);
    if(modelo) ATRIBUTOS.forEach((a,i) => p.atributos[a.id] = modelo.dados[i]);
  });

  app.querySelectorAll('[data-classe]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.classe)].classeId = el.value));

  app.querySelectorAll('[data-nivel]').forEach(el =>
    el.onchange = () => mudar(p => p.classes[Number(el.dataset.nivel)].nivel = Number(el.value) || 0));

  app.querySelectorAll('[data-remover-classe]').forEach(b =>
    b.onclick = () => mudar(p => p.classes.splice(Number(b.dataset.removerClasse), 1)));

  const addClasse = document.getElementById('btAddClasse');
  if(addClasse) addClasse.onclick = () => mudar(p => p.classes.push({classeId:'', nivel:0}));

  app.querySelectorAll('[data-bonus]').forEach(el =>
    el.onchange = () => mudar(p => p.bonus[el.dataset.bonus] = Number(el.value) || 0));

  app.querySelectorAll('[data-atualrec]').forEach(el =>
    el.onchange = () => mudar(p => p.atual[el.dataset.atualrec] = Number(el.value) || 0));

  app.querySelectorAll('[data-condicao]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicao;
      p.condicoes = el.checked
        ? [...new Set([...p.condicoes, id])]
        : p.condicoes.filter(x => x !== id);
    }));

  const descanso = document.getElementById('btDescanso');
  if(descanso) descanso.onclick = () => mudar(p => {
    p.atual = {pv:null, pm:null, pi:null};
    p.condicoes = [];
  });

  app.querySelectorAll('[data-laco]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.lacos[Number(el.dataset.laco)].nome = el.value, el));
  app.querySelectorAll('[data-lacoemocao]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => p.lacos[Number(el.dataset.lacoemocao)].emocoes = el.value, el));
  app.querySelectorAll('[data-removerlaco]').forEach(b =>
    b.onclick = () => mudar(p => p.lacos.splice(Number(b.dataset.removerlaco), 1)));
  const addLaco = document.getElementById('btAddLaco');
  if(addLaco) addLaco.onclick = () => mudar(p => p.lacos.push({nome:'', emocoes:''}));
}

/* Redesenhar a cada tecla faria o cursor pular para o fim do campo. Para
   texto livre, salvamos sem redesenhar; o painel do topo é atualizado à mão
   quando o campo afeta algum número. */
let debounce;
function mudarSemRedesenhar(mudanca, elemento){
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Barra do topo ------------------------------------------------------ */

document.getElementById('seletor').onchange = e => {
  estado.atualId = e.target.value; render();
};

document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'perfil';
  salvar(); render();
};

document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não dá para desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas.length ? estado.fichas[0].id : null;
  salvar(); render();
};

document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.perfil.nome || 'personagem').replace(/[^\w\-]+/g,'-').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('btImportar').onclick = () =>
  document.getElementById('arquivo').click();

document.getElementById('arquivo').onchange = e => {
  const arquivo = e.target.files[0]; if(!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(!lido || !lido.perfil) throw new Error('formato desconhecido');
      // Id novo: importar nunca sobrescreve um personagem que já existe.
      lido.id = uid();
      estado.fichas.push(lido);
      estado.atualId = lido.id;
      salvar(); render();
    }catch(err){
      alert('Não consegui ler esse arquivo. Ele precisa ser um JSON exportado por esta ficha.');
    }
    e.target.value = '';
  };
  leitor.readAsText(arquivo);
};

render();
</script>
</body>
</html>
