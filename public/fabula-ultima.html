<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Fabula Ultima</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s;
}
button:hover{border-color:var(--suave)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:940px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.crise .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.classe-linha{display:grid; grid-template-columns:1fr 90px auto; gap:10px; align-items:end; margin-bottom:10px}
</style>
</head>
<body>
<div class="barra">
  <span class="marca">Fabula Ultima</span>
  <a id="linkFichas" href="/fichas" hidden style="color:var(--ambar);text-decoration:none;font-size:13px">← Fichas</a>
  <label id="labelCompartilhar" style="display:none;align-items:center;gap:6px;font-size:12px;color:var(--suave);text-transform:none;letter-spacing:normal">
    <input type="checkbox" id="chkCompartilhar" style="width:auto">
    Compartilhar (link de leitura)
  </label>
  <select id="seletor" style="width:auto;min-width:170px"></select>
  <button id="btNovo">+ Novo</button>
  <span class="cresce"></span>
  <button id="btExportar">Exportar</button>
  <button id="btImportar">Importar</button>
  <input type="file" id="arquivo" accept="application/json" hidden>
  <button id="btExcluir" class="perigo">Excluir</button>
</div>
<main id="app"></main>
<script>
/* ===========================================================================
   FICHA DE PERSONAGEM — FABULA ULTIMA (Livro Básico, edição brasileira)

   Ferramenta não-oficial feita por fã. Este arquivo codifica MECÂNICA:
   fórmulas, escala de dados, cálculo de defesa e o efeito numérico das
   condições. Ele não reproduz o texto, a arte ou as descrições do livro —
   para saber o que cada poder faz, consulte o seu exemplar.

   Fabula Ultima © Need Games e Rooster Games. Edição brasileira: Jambô.

   Os personagens ficam no SEU navegador (localStorage). Não há servidor nem
   conta: ninguém mais vê sua ficha, e ela não sincroniza entre aparelhos.
   Limpar os dados do site apaga tudo — por isso o "Exportar".
   =========================================================================== */

/* --- Regras do livro, em forma de dados -------------------------------- */

// Escala de dados dos Atributos: mínimo d6, máximo d12 (pág. 162).
const ESCALA = [6, 8, 10, 12];

const ATRIBUTOS = [
  {id:'destreza', nome:'Destreza', abrev:'DES', sobre:'precisão, coordenação, finesse e reflexos'},
  {id:'vigor',    nome:'Vigor',    abrev:'VIG', sobre:'capacidade física e robustez'},
  {id:'astucia',  nome:'Astúcia',  abrev:'AST', sobre:'observação, compreensão e raciocínio'},
  {id:'vontade',  nome:'Vontade',  abrev:'VON', sobre:'determinação, carisma e influência'},
];

// Perfis de distribuição na criação (pág. 162).
const PERFIS = [
  {id:'especializado', nome:'Especializado', dados:[10,10,6,6]},
  {id:'mediano',       nome:'Mediano',       dados:[10,8,8,6]},
  {id:'toda-obra',     nome:'Pau pra toda obra', dados:[8,8,8,8]},
];

// As 15 classes do Livro Básico. `marcial` registra o que a classe permite
// equipar — usado depois, quando o inventário existir.
const CLASSES = [
  {id:'andarilho',        nome:'Andarilho'},
  {id:'arcanista',        nome:'Arcanista'},
  {id:'atirador',         nome:'Atirador',        marcial:['arma à distância','escudo']},
  {id:'elementalista',    nome:'Elementalista'},
  {id:'entropista',       nome:'Entropista'},
  {id:'erudito',          nome:'Erudito'},
  {id:'espiritualista',   nome:'Espiritualista'},
  {id:'furioso',          nome:'Furioso',         marcial:['arma corpo a corpo','armadura']},
  {id:'guardiao',         nome:'Guardião',        marcial:['armadura','escudo']},
  {id:'guerreiro-sombrio',nome:'Guerreiro Sombrio', marcial:['arma corpo a corpo','armadura']},
  {id:'inventor',         nome:'Inventor'},
  {id:'ladino',           nome:'Ladino'},
  {id:'mestre-de-armas',  nome:'Mestre de Armas', marcial:['arma corpo a corpo','escudo']},
  {id:'orador',           nome:'Orador'},
  {id:'quimerista',       nome:'Quimerista'},
  // Atlas: High Fantasy
  {id:'comandante',  nome:'Comandante', marcial:['arma corpo a corpo','arma à distância']},
  {id:'dancarino',   nome:'Dançarino'},
  {id:'simbolista',  nome:'Simbolista'},
  {id:'virtuoso',    nome:'Virtuoso'},
  // Atlas: Techno Fantasy
  {id:'esper',       nome:'Esper'},
  {id:'mutante',     nome:'Mutante'},
  {id:'piloto',      nome:'Piloto', marcial:['arma corpo a corpo','arma à distância']},
  // Atlas: Natural Fantasy
  {id:'floralista',  nome:'Floralista'},
  {id:'gourmet',     nome:'Gourmet'},
  {id:'invocador',   nome:'Invocador'},
  {id:'mercador',    nome:'Mercador'},
];
/* ===========================================================================
   PODERES DE CLASSE (Livro Básico, cap. 3)

   O sistema, direto do livro (pág. 40 e 176):
   - Cada classe tem exatamente CINCO poderes.
   - A cada nível investido numa classe, você ganha UM poder dela — não é
     automático, é escolha do jogador entre os cinco.
   - Poder com "(+N)" pode ser escolhido de novo, até N vezes, ficando mais
     forte a cada vez. Quantas vezes foi escolhido é o "NP" (nível de poder)
     que o texto do próprio poder referencia.
   - Poder sem "+" só pode ser escolhido uma vez (NP máximo 1).

   Os "benefícios iniciais" de uma classe (aumento de PV/PM/PI, permissão de
   equipamento) são FIXOS e valem uma vez só, ao ter pelo menos 1 nível
   naquela classe — não são escolhidos nível a nível. O livro é explícito:
   "Benefícios iniciais são cumulativos" — duas classes que dão PM+5 somam
   PM+10.

   IMPORTANTE PARA QUEM FOR ADICIONAR OUTRA CLASSE: por enquanto só estas
   quatro têm o texto conferido linha a linha com o Livro Básico. As outras
   onze ficam para quando o restante do livro puder ser extraído — ver
   docs/ROADMAP.md.
   =========================================================================== */

const BENEFICIOS_CLASSE = {
  andarilho:         [{tipo:'pi', valor:2}],
  arcanista:         [{tipo:'pm', valor:5}],
  atirador:          [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas à distância e escudos marciais'}],
  elementalista:     [{tipo:'pm', valor:5}],
  entropista:        [{tipo:'pm', valor:5}],
  erudito:           [{tipo:'pm', valor:5}],
  espiritualista:    [{tipo:'pm', valor:5}],
  furioso:           [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas corpo a corpo e armaduras marciais'}],
  guardiao:          [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armaduras e escudos marciais'}],
  'guerreiro-sombrio':[{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas corpo a corpo e armaduras marciais'}],
  inventor:          [{tipo:'pi', valor:2}, {tipo:'equipar', texto:'iniciar Projetos'}],
  ladino:            [{tipo:'pi', valor:2}],
  'mestre-de-armas': [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas corpo a corpo e escudos marciais'}],
  orador:            [{tipo:'pm', valor:5}],
  quimerista:        [{tipo:'pm', valor:5}],
  // Atlas: High Fantasy
  comandante: [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas corpo a corpo e à distância marciais'}],
  dancarino:  [{tipo:'escolha', opcoes:['pv','pm'], valor:5}],
  simbolista: [{tipo:'pi', valor:2}],
  virtuoso:   [{tipo:'pm', valor:5}],
  // Atlas: Techno Fantasy
  esper:      [{tipo:'pm', valor:5}],
  mutante:    [{tipo:'pv', valor:5}],
  piloto:     [{tipo:'pv', valor:5}, {tipo:'equipar', texto:'armas corpo a corpo e à distância marciais'}],
  // Atlas: Natural Fantasy
  floralista: [{tipo:'escolha', opcoes:['pv','pm'], valor:5}],
  gourmet:    [{tipo:'pi', valor:2}, {tipo:'equipar', texto:'iniciar Projetos de comidas e bebidas únicas'}],
  invocador:  [{tipo:'escolha', opcoes:['pv','pm'], valor:5}],
  mercador:   [{tipo:'pi', valor:2}],
};

// Soma os benefícios fixos de toda classe em que o personagem tem ao menos
// 1 nível. É por isso que pvMaximo/pmMaximo/piMaximo não pedem mais para o
// jogador digitar esse bônus à mão.
//
// Algumas classes (Dançarino, Floralista, Invocador) dão "PV ou PM, à sua
// escolha" em vez de um valor fixo — tipo 'escolha'. Guardamos a escolha em
// p.escolhasBeneficio[classeId] e ela conta como se fosse o tipo escolhido.
// Sem escolha feita ainda, o padrão é 'pv' — não porque seja a certa, mas
// para o total nunca ficar contando um benefício que a classe garante.
function beneficiosDeClasse(p, tipo){
  return p.classes
    .filter(c => c.classeId && c.nivel > 0)
    .flatMap(c => (BENEFICIOS_CLASSE[c.classeId] || []).map(b => ({...b, classeId: c.classeId})))
    .filter(b => {
      if(b.tipo === 'escolha') return (p.escolhasBeneficio[b.classeId] || b.opcoes[0]) === tipo;
      return b.tipo === tipo;
    })
    .reduce((soma, b) => soma + b.valor, 0);
}

// Toda classe do personagem que tem um benefício tipo 'escolha' ainda por
// decidir ou já decidido — usado para desenhar o seletor na tela.
function escolhasDeBeneficioPendentes(p){
  return p.classes
    .filter(c => c.classeId && c.nivel > 0)
    .flatMap(c => (BENEFICIOS_CLASSE[c.classeId] || [])
      .filter(b => b.tipo === 'escolha')
      .map(b => ({classeId: c.classeId, ...b})));
}

function textosDeEquipamento(p){
  return p.classes
    .filter(c => c.classeId && c.nivel > 0)
    .flatMap(c => BENEFICIOS_CLASSE[c.classeId] || [])
    .filter(b => b.tipo === 'equipar')
    .map(b => b.texto);
}

/* ===========================================================================
   EQUIPAMENTO (Livro Básico, pág. 126-137)

   Armadura e escudo entram nas fórmulas de Defesa/Defesa Mágica/Iniciativa;
   arma entra em Precisão/Dano. "Marcial" (E) é o item que só faz efeito pra
   quem tem a classe certa — CLASSES já registra isso em `marcial` (a mesma
   lista usada pra montar o texto "Pode equipar: ..." na aba de Atributos).
   =========================================================================== */

// Todo tipo marcial ('armadura', 'escudo', 'arma corpo a corpo', 'arma à
// distância') que pelo menos uma classe do personagem libera.
function tiposMarciaisLiberados(p){
  const liberados = new Set();
  p.classes.filter(c => c.classeId && c.nivel > 0).forEach(c => {
    const def = CLASSES.find(x => x.id === c.classeId);
    (def?.marcial || []).forEach(t => liberados.add(t));
  });
  return liberados;
}

// Armadura "leve" dá Defesa/Defesa Mágica com base no dado atual de
// Destreza/Astúcia (tipo:'dado'); armadura "pesada" (marcial) dá um valor
// fixo de Defesa, mas Defesa Mágica continua vindo do dado de Astúcia.
const ARMADURAS_BASICAS = [
  {id:'sem-armadura',    nome:'Sem armadura',    custo:0,
    defesa:{tipo:'dado', atributo:'destreza'}, defesaMagica:{tipo:'dado', atributo:'astucia'}, iniciativa:0},
  {id:'camisa-de-seda',  nome:'Camisa de Seda',  custo:100,
    defesa:{tipo:'dado', atributo:'destreza'}, defesaMagica:{tipo:'dado', atributo:'astucia', bonus:2}, iniciativa:-1},
  {id:'traje-de-viagem', nome:'Traje de Viagem', custo:100,
    defesa:{tipo:'dado', atributo:'destreza', bonus:1}, defesaMagica:{tipo:'dado', atributo:'astucia', bonus:1}, iniciativa:-1},
  {id:'tunica-de-combate', nome:'Túnica de Combate', custo:150,
    defesa:{tipo:'dado', atributo:'destreza', bonus:1}, defesaMagica:{tipo:'dado', atributo:'astucia', bonus:1}, iniciativa:0},
  {id:'vestes-de-sabio', nome:'Vestes de Sábio', custo:200,
    defesa:{tipo:'dado', atributo:'destreza', bonus:1}, defesaMagica:{tipo:'dado', atributo:'astucia', bonus:2}, iniciativa:-2},
  {id:'brigantina',      nome:'Brigantina',      custo:150, marcial:true,
    defesa:{tipo:'fixo', valor:10}, defesaMagica:{tipo:'dado', atributo:'astucia'}, iniciativa:-2},
  {id:'placa-de-bronze', nome:'Placa de Bronze', custo:200, marcial:true,
    defesa:{tipo:'fixo', valor:11}, defesaMagica:{tipo:'dado', atributo:'astucia'}, iniciativa:-3},
  {id:'placa-runica',    nome:'Placa Rúnica',    custo:250, marcial:true,
    defesa:{tipo:'fixo', valor:11}, defesaMagica:{tipo:'dado', atributo:'astucia', bonus:1}, iniciativa:-3},
  {id:'placa-de-aco',    nome:'Placa de Aço',    custo:300, marcial:true,
    defesa:{tipo:'fixo', valor:12}, defesaMagica:{tipo:'dado', atributo:'astucia'}, iniciativa:-4},
];

// Escudo ocupa a mão secundária e soma às defesas por cima da armadura.
const ESCUDOS_BASICOS = [
  {id:'escudo-de-bronze', nome:'Escudo de Bronze', custo:100,
    defesa:2, defesaMagica:0, iniciativa:0},
  {id:'escudo-runico',    nome:'Escudo Rúnico',    custo:150, marcial:true,
    defesa:2, defesaMagica:2, iniciativa:0},
];

// As armas básicas do livro (pág. 134-135). `maos` é quantos espaços de mão
// a arma ocupa; uma arma de duas mãos deixa a mão secundária sem espaço
// pra escudo ou segunda arma. `precisao.bonus` é o "+1" que algumas armas
// marciais somam direto no teste, além da rolagem alta dos dois dados de
// Atributo.
const ARMAS_BASICAS = [
  {id:'ataque-desarmado', nome:'Ataque Desarmado', custo:0, categoria:'luta',
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor']}, dano:6, tipoDano:'físico'},
  {id:'improvisada-corpo', nome:'Improvisada (corpo a corpo)', custo:0, categoria:'luta',
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor']}, dano:2, tipoDano:'físico',
    obs:'quebra depois do ataque'},
  {id:'soqueira-de-ferro', nome:'Soqueira de Ferro', custo:150, categoria:'luta',
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor']}, dano:6, tipoDano:'físico'},
  {id:'adaga-de-aco', nome:'Adaga de Aço', custo:150, categoria:'adaga', marcial:true,
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','astucia'], bonus:1}, dano:4, tipoDano:'físico'},
  {id:'espada-de-bronze', nome:'Espada de Bronze', custo:200, categoria:'espada', marcial:true,
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor'], bonus:1}, dano:6, tipoDano:'físico'},
  {id:'montante', nome:'Montante', custo:200, categoria:'espada', marcial:true,
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor'], bonus:1}, dano:10, tipoDano:'físico'},
  {id:'katana', nome:'Katana', custo:200, categoria:'espada', marcial:true,
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['destreza','astucia'], bonus:1}, dano:10, tipoDano:'físico'},
  {id:'rapieira', nome:'Rapieira', custo:200, categoria:'espada', marcial:true,
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','astucia'], bonus:1}, dano:6, tipoDano:'físico'},
  {id:'lanca-leve', nome:'Lança Leve', custo:200, categoria:'lança', marcial:true,
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor']}, dano:8, tipoDano:'físico'},
  {id:'lanca-pesada', nome:'Lança Pesada', custo:200, categoria:'lança', marcial:true,
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['destreza','vigor']}, dano:12, tipoDano:'físico'},
  {id:'martelo-de-ferro', nome:'Martelo de Ferro', custo:200, categoria:'pesada',
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['vigor','vigor']}, dano:6, tipoDano:'físico'},
  {id:'machado-largo', nome:'Machado Largo', custo:250, categoria:'pesada', marcial:true,
    maos:1, alcance:'corpo a corpo', precisao:{atributos:['vigor','vigor']}, dano:10, tipoDano:'físico'},
  {id:'machado-de-guerra', nome:'Machado de Guerra', custo:250, categoria:'pesada', marcial:true,
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['vigor','vigor']}, dano:14, tipoDano:'físico'},
  {id:'chicote-de-correntes', nome:'Chicote de Correntes', custo:150, categoria:'malho',
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['destreza','destreza']}, dano:8, tipoDano:'físico'},
  {id:'cajado', nome:'Cajado', custo:100, categoria:'arcana',
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['vontade','vontade']}, dano:6, tipoDano:'físico'},
  {id:'tomo', nome:'Tomo', custo:100, categoria:'arcana',
    maos:2, alcance:'corpo a corpo', precisao:{atributos:['astucia','astucia']}, dano:6, tipoDano:'físico'},
  {id:'besta', nome:'Besta', custo:150, categoria:'arco',
    maos:2, alcance:'à distância', precisao:{atributos:['destreza','astucia']}, dano:8, tipoDano:'físico'},
  {id:'arco-curto', nome:'Arco Curto', custo:200, categoria:'arco',
    maos:2, alcance:'à distância', precisao:{atributos:['destreza','destreza']}, dano:8, tipoDano:'físico'},
  {id:'pistola', nome:'Pistola', custo:250, categoria:'arma de fogo', marcial:true,

const NOMES_ATRIBUTOS_CURTO = {destreza:'DES', vigor:'VIG', astucia:'AST', vontade:'VON'};

function textoPrecisao(arma){
  const [a,b] = arma.precisao.atributos;
  const bonus = arma.precisao.bonus ? ` +${arma.precisao.bonus}` : '';
  return `【${NOMES_ATRIBUTOS_CURTO[a]} + ${NOMES_ATRIBUTOS_CURTO[b]}】${bonus}`;
}

function textoDano(arma){
  return `【RA + ${arma.dano}】 ${arma.tipoDano}`;
}

// Toda classe do personagem levada ao nível 10 — cada uma dá direito a
// escolher uma Habilidade Heroica.
const classesDominadas = p =>
  p.classes.filter(c => c.classeId && c.nivel >= 10).map(c => c.classeId);

function heroicaDisponivel(p, h){
  if(h.classes && !h.classes.some(c => classesDominadas(p).includes(c))) return false;
  if(h.poderRequisito && npDoPoder(p, h.poderRequisito.classeId, h.poderRequisito.poderId) <= 0) return false;
  return true;
}

// PV Extra/PM Extra/PI Extra são as únicas Habilidades Heroicas que a ficha
// aplica sozinha nos totais — o resto é só texto de referência, igual às
// mecânicas de conflito que o resto da ficha também não simula.
function beneficioHeroico(p, tipo){
  const heroicas = p.heroicas || [];
  const nivel = nivelTotal(p);
  if(tipo === 'pv' && heroicas.includes('pv-extra')) return nivel >= 40 ? 20 : 10;
  if(tipo === 'pm' && heroicas.includes('pm-extra')) return nivel >= 40 ? 20 : 10;
  if(tipo === 'pi' && heroicas.includes('pi-extra')) return 4;
  return 0;
}

// Soma o bônus fixo (auto) de todo acessório equipado. Acessórios com efeito
// condicional ou situacional (a maioria) ficam só como texto de referência —
// mesmo critério usado pra poderes de classe e Habilidades Heroicas.
function bonusDeAcessorios(p, campo){
  return (p.acessorios || [])
    .filter(a => a.equipado && a.id)
    .flatMap(a => (ACESSORIOS_DEF.find(x => x.id === a.id)?.auto) || [])
    .filter(b => b.campo === campo)
    .reduce((soma, b) => soma + b.valor, 0);
}

// O Anel das Cebolas é o único com bônus proporcional (2 por classe
// diferente), então não cabe no formato fixo de `bonusDeAcessorios`.
function temAnelDasCebolasEquipado(p){
  return (p.acessorios || []).some(a => a.equipado && a.id === 'anel-das-cebolas');
}
function bonusDoAnelDasCebolas(p){
  if(!temAnelDasCebolasEquipado(p)) return 0;
  return p.classes.filter(c => c.classeId && c.nivel > 0).length * 2;
}

  for(let i=0;i<SABORES.length;i++) for(let j=i;j<SABORES.length;j++) pares.push([SABORES[i].id, SABORES[j].id]);

function opcoesDeEscolha(tipoEscolha){
  if(tipoEscolha === 'condicao') return CULINARIA_CONDICOES.map(id => ({id, nome: CONDICOES.find(c=>c.id===id)?.nome || id}));
  if(tipoEscolha === 'tipoDano') return CULINARIA_TIPOS_DANO.map(id => ({id, nome: TIPOS_DANO.find(t=>t.id===id)?.nome || id}));
  if(tipoEscolha === 'atributo') return ATRIBUTOS.map(a => ({id:a.id, nome:a.nome}));
  return [];
}
function textoEfeitoCulinaria(efeitoId, escolha, nivel){
  const ef = CULINARIA_EFEITOS.find(e => e.id === efeitoId);
  if(!ef) return '';
  if(ef.escolha && !escolha) return '(falta escolher a opção do efeito)';
  return ef.texto(escolha, nivel);
}

// Os nove tipos de dano do jogo (pág. 96) e os quatro graus de Afinidade que
// um personagem pode ter com cada um (pág. 97). Imunidade sempre prevalece
// sobre Resistência/Vulnerabilidade, e Absorção prevalece sobre todas.
const TIPOS_DANO = [
  {id:'fisico', nome:'Físico'}, {id:'ar', nome:'Ar'}, {id:'fogo', nome:'Fogo'},
  {id:'gelo', nome:'Gelo'}, {id:'luz', nome:'Luz'}, {id:'raio', nome:'Raio'},
  {id:'terra', nome:'Terra'}, {id:'trevas', nome:'Trevas'}, {id:'veneno', nome:'Veneno'},
];
const AFINIDADES_NIVEIS = [
  {id:'normal',     nome:'Normal'},
  {id:'vulneravel', nome:'Vulnerável', multiplicador:2},
  {id:'resistente', nome:'Resistente', multiplicador:0.5},
  {id:'imune',      nome:'Imune',      multiplicador:0},
  {id:'absorve',    nome:'Absorve',    multiplicador:-1},
];

// Quanto de PV um personagem realmente perde (ou recupera, se Absorve) ao
// sofrer `quantidade` de dano do tipo `tipoId` — já aplicando a Afinidade.
function resultadoDeDano(p, quantidade, tipoId){
  const nivel = (p.afinidades || {})[tipoId] || 'normal';
  const mult = AFINIDADES_NIVEIS.find(a => a.id === nivel)?.multiplicador ?? 1;
  if(mult === -1) return {pv: -quantidade, texto: `Absorve: recupera ${quantidade} PV.`};
  if(mult === 0 && nivel === 'imune') return {pv: 0, texto: 'Imune: não perde PV.'};
  const final = Math.floor(quantidade * mult);
  return {pv: final, texto: `${nivel==='normal'?'Perde':nivel==='vulneravel'?'Vulnerável — perde':'Resistente — perde'} ${final} PV.`};
}

const ZENITES_INICIAIS = 500;

/* --- Cálculos ----------------------------------------------------------- */

// Dado atual = dado básico menos um passo por condição que afeta o Atributo,
// nunca abaixo de d6.
function dadoAtual(p, idAtributo){
  const basico = p.atributos[idAtributo] || 6;
  const quedas = CONDICOES
    .filter(c => p.condicoes.includes(c.id) && c.reduz.includes(idAtributo))
    .length;
  const posicao = ESCALA.indexOf(basico);
  return ESCALA[Math.max(0, (posicao === -1 ? 1 : posicao) - quedas)];
}

const nivelTotal = p => p.classes.reduce((soma, c) => soma + (c.nivel || 0), 0);

// PV/PM: nível total + cinco vezes o dado do Atributo, mais os benefícios
// iniciais das classes (pág. 163) — que são fixos por classe e cumulativos
// entre classes diferentes (pág. 176), não escolhidos nível a nível.
const pvMaximo = p => nivelTotal(p) + 5 * dadoAtual(p,'vigor')   + beneficiosDeClasse(p,'pv') + beneficioHeroico(p,'pv') + bonusDoAnelDasCebolas(p);
const pmMaximo = p => nivelTotal(p) + 5 * dadoAtual(p,'vontade') + beneficiosDeClasse(p,'pm') + beneficioHeroico(p,'pm') + bonusDoAnelDasCebolas(p);
const crise    = p => Math.floor(pvMaximo(p) / 2);
const piMaximo = p => PI_BASE + beneficiosDeClasse(p,'pi') + beneficioHeroico(p,'pi');

// Equipamento: armadura e a mão secundária (escudo ou arma extra) são
// escolhas do jogador; sem nenhuma escolhida ainda, os padrões abaixo
// reproduzem exatamente o personagem "sem equipamento".
const armaduraEquipada = p =>
  ARMADURAS_BASICAS.find(a => a.id === p.equipamento?.armaduraId) || ARMADURAS_BASICAS[0];
const armaPrincipalEquipada = p =>
  ARMAS_BASICAS.find(a => a.id === p.equipamento?.maoPrincipalId) || ARMAS_BASICAS[0];
// Arma de duas mãos ocupa a secundária também — o que estiver guardado ali
// (escudo ou outra arma) não faz efeito enquanto isso durar.
const escudoEquipado = p => armaPrincipalEquipada(p).maos === 2 ? null :
  ESCUDOS_BASICOS.find(e => e.id === p.equipamento?.maoSecundariaId) || null;
const armaSecundariaEquipada = p => armaPrincipalEquipada(p).maos === 2 ? null :
  ARMAS_BASICAS.find(a => a.id === p.equipamento?.maoSecundariaId) || null;

// Defesa vem do dado ATUAL, não do básico — por isso uma condição derruba a
// defesa junto (pág. 168). "Outros bônus" (p.bonus) cobre o que a ficha
// ainda não modela sozinha: poderes que somam Defesa/Iniciativa direto (ex:
// Arcano da Roda) — acessórios com bônus fixo já entram via bonusDeAcessorios.
const defesa = p => {
  const arm = armaduraEquipada(p).defesa;
  const base = arm.tipo === 'fixo' ? arm.valor : dadoAtual(p, arm.atributo) + (arm.bonus || 0);
  return base + (escudoEquipado(p)?.defesa || 0) + (p.bonus.defesa || 0) + bonusDeAcessorios(p,'defesa');
};
const defesaMagica = p => {
  const arm = armaduraEquipada(p).defesaMagica;
  const base = dadoAtual(p, arm.atributo) + (arm.bonus || 0);
  return base + (escudoEquipado(p)?.defesaMagica || 0) + (p.bonus.defesaMagica || 0) + bonusDeAcessorios(p,'defesaMagica');
};
const iniciativa = p =>
  armaduraEquipada(p).iniciativa + (escudoEquipado(p)?.iniciativa || 0) + (p.bonus.iniciativa || 0) + bonusDeAcessorios(p,'iniciativa');

/* --- Personagem --------------------------------------------------------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function novoPersonagem(nome){
  return {
    id: uid(), versaoFicha: 1, criadoEm: Date.now(), atualizadoEm: Date.now(),
    perfil: {nome: nome || 'Novo Personagem', identidade:'', tema:'', origem:'',
             pronomes:'', aparencia:''},
    perfilAtributos: 'mediano',
    atributos: {destreza:8, vigor:8, astucia:8, vontade:6},
    classes: [{classeId:'', nivel:0},{classeId:'', nivel:0},{classeId:'', nivel:0}],
    // PV/PM/PI de classe são automáticos (vêm de BENEFICIOS_CLASSE). O que
    // sobra aqui é só o que ainda não tem aba própria: o bônus que armadura
    // e escudo dão em Defesa, Defesa Mágica e Iniciativa.
    bonus: {defesa:0, defesaMagica:0, iniciativa:0},
    // escolhas: { 'elementalista': { 'magia-elemental': 2, ... }, ... } —
    // quantas vezes cada poder daquela classe foi escolhido (o NP dele).
    poder: {escolhas: {}, arcanoVinculado: null, feiticos: {}},
    // Classe cujo benefício inicial é "PV ou PM à sua escolha" — a decisão
    // do jogador, lida por beneficiosDeClasse().
    escolhasBeneficio: {},
    // rituais: { 'elementalismo': {potencia:'menor', area:'individual'}, ... }
    rituais: {},
    // Calculadora de Projeto do Inventor — sempre existe uma escolha ativa,
    // mesmo sem nenhum Projeto em andamento de verdade.
    projeto: {potencia:'menor', area:'individual', uso:'consumivel', defeito:false},
    // Sem nada escolhido, os getters (armaduraEquipada etc.) caem no padrão
    // ARMADURAS_BASICAS[0]/ARMAS_BASICAS[0] ("sem armadura"/"desarmado").
    equipamento: {armaduraId:'', maoPrincipalId:'', maoSecundariaId:''},
    // Acessórios possuídos: [{id: 'catálogo-x' | null, nome: '...', equipado: true}, ...]
    // id nulo = acessório digitado à mão, fora do catálogo.
    acessorios: [],
    // Engenhocas do Inventor: quantos níveis de cada tipo (0-3, básico/
    // avançado/superior) — a soma dos três nunca passa do NP do poder.
    engenhocas: {alquimia: 0, infusoes: 0, tecnomagia: 0},
    // Magisferas (Tecnomagia superior): feitiços escolhidos de Elementalista/
    // Entropista/Espiritualista, igual um catálogo de feitiço comum.
    magisferas: [],
    // Habilidades Heroicas escolhidas (uma por classe dominada — nível 10+).
    heroicas: [],
    // Culinária do Gourmet: estoque de ingrediente por sabor e a "ficha de
    // receitas" (efeito de cada combinação de sabor já descoberta).
    culinaria: {ingredientes: {amargo:0, salgado:0, azedo:0, doce:0, umami:0}, receitas: {}},
    // Veículo Pessoal do Piloto: estrutura fixa + módulos possuídos (cada um
    // com um `ativo` — só os ativos valem enquanto o personagem pilota).
    veiculo: {estrutura: null, modulos: []},
    atual: {pv:null, pm:null, pi:null},   // null = cheio
    condicoes: [],
    // afinidades[tipoId] = 'normal' | 'vulneravel' | 'resistente' | 'imune' | 'absorve'
    afinidades: {},
    pontosFabula: 3,
    zenites: ZENITES_INICIAIS,
    lacos: [],
    anotacoes: '',
  };
}

/* --- Armazenamento ------------------------------------------------------ */

// Presente na URL (?id=...), a ficha vive na conta do Hub em vez do
// navegador: /fichas cria a linha no banco e manda pra cá com o id dela.
// Sem o parâmetro, tudo continua exatamente como sempre — arquivo único,
// localStorage, sem conta nenhuma (decisão #40).
const MODO_HUB = new URLSearchParams(location.search).get('id');

const CHAVE = 'fabula_ultima_fichas';
let falhouAoSalvar = false;

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

let debounceHub = null;

// No Hub, cada campo salva sozinho na conta (decisão #44) — sem lista local,
// sem botão de salvar. O debounce evita uma requisição por tecla digitada.
function salvarNoHub(){
  clearTimeout(debounceHub);
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dados: p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    // Falhar em silêncio aqui faria o jogador achar que salvou e perder tudo
    // ao fechar a aba. O aviso precisa aparecer na tela.
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const estado = {
  fichas: MODO_HUB ? [] : carregar(),
  atualId: null,
  aba: 'perfil',
  carregandoHub: !!MODO_HUB,
  erroHub: null,       // 'nao-encontrado' | null
  // Começa falso de propósito: só vira true depois que o Hub CONFIRMAR que
  // é dono. Enquanto carrega, ou se a busca falhar, o padrão seguro é "não
  // é dono" — senão o interruptor de compartilhar apareceria numa ficha
  // que nem carregou direito.
  ehDono: false,
  compartilhado: false,
};
if(!MODO_HUB && estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

// Busca a ficha no Hub uma vez, no início. Preenche estado.fichas com um só
// personagem — sem lista, sem seletor, exatamente o que /fichas já filtrou.
// Ler não exige ser o dono: se vier ehDono:false, é o link de leitura de
// outra pessoa (o mestre vendo a ficha de um jogador) — ver blocoSomenteLeitura().
async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub = 'nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p];
    estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false;
    render();
  }
}

// Dono liga/desliga o link de leitura. Quem não é dono nem vê este controle.
function alternarCompartilhado(valor){
  estado.compartilhado = valor;
  render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({compartilhado: valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(mudanca){
  if(MODO_HUB && !estado.ehDono) return; // defesa extra: modo leitura não edita
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

/* --- Desenho da tela ---------------------------------------------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ABAS = [
  {id:'perfil',      nome:'Perfil'},
  {id:'atributos',   nome:'Atributos e Classes'},
  {id:'poderes',     nome:'Poderes'},
  {id:'heroico',     nome:'Heroico'},
  {id:'inventario',  nome:'Inventário'},
  {id:'recursos',    nome:'Recursos'},
  {id:'lacos',       nome:'Laços'},
];

function render(){
  desenharBarra();
  const app = document.getElementById('app');

  if(MODO_HUB && estado.carregandoHub){
    app.innerHTML = `<div class="vazio"><h2>Carregando…</h2></div>`;
    return;
  }
  if(MODO_HUB && estado.erroHub === 'nao-encontrado'){
    app.innerHTML = `<div class="vazio">
      <h2>Ficha não encontrada</h2>
      <p class="mini">Ela pode ter sido apagada, ou não é sua.
      <a href="/fichas" style="color:var(--ambar)">Voltar para Fichas</a></p></div>`;
    return;
  }

  const p = atual();

  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em “+ Novo” para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const somenteLeitura = MODO_HUB && !estado.ehDono;

  const alerta = somenteLeitura
    ? `<div class="ok">Modo leitura — você está vendo a ficha de
       <strong>${esc(p.perfil.nome)}</strong> por um link compartilhado.
       Só quem é dono edita.</div>`
    : falhouAoSalvar
      ? (MODO_HUB
        ? `<div class="aviso"><strong>Não consegui salvar no Hub.</strong>
           Confira sua internet — se cair, exporte para não perder o que você
           preencheu.</div>`
        : `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
           Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
           perder o que você preencheu.</div>`) : '';

  app.innerHTML = alerta
    + `<div class="abas">` + ABAS.map(a =>
        `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
      ).join('') + `</div>`
    + painelDerivados(p)
    + ({perfil:abaPerfil, atributos:abaAtributos, poderes:abaPoderes, heroico:abaHeroico, inventario:abaInventario, recursos:abaRecursos, lacos:abaLacos}[estado.aba])(p);

  ligarEventos();

  // Modo leitura: desliga todo campo/botão de edição, menos as próprias
  // abas (a pessoa ainda precisa navegar pra ver o resto da ficha).
  if(somenteLeitura){
    app.querySelectorAll('input, select, textarea, button:not([data-aba])')
      .forEach(el => el.disabled = true);
  }
}

function desenharBarra(){
  // No Hub, /fichas já é a lista de personagens (decisão #42) — o seletor,
  // o "+ Novo" e o "Excluir" desta barra são só do modo local (arquivo
  // avulso, sem conta). "← Fichas" some no modo local pelo mesmo motivo.
  if(MODO_HUB){
    document.getElementById('seletor').hidden = true;
    document.getElementById('btNovo').hidden = true;
    document.getElementById('btExcluir').hidden = true;
    document.getElementById('linkFichas').hidden = false;

    // Só o dono decide compartilhar. Quem está vendo por um link
    // compartilhado nem editar consegue, então Importar também some.
    //
    // Escondido via style.display, não via atributo `hidden`: esta página
    // tem uma regra própria `label{display:block}` que, por ser do autor,
    // vence a regra `[hidden]{display:none}` do navegador — o atributo
    // ficaria ligado sem esconder nada. Estilo em linha sempre vence.
    const labelCompartilhar = document.getElementById('labelCompartilhar');
    labelCompartilhar.style.display = estado.ehDono ? 'flex' : 'none';
    document.getElementById('chkCompartilhar').checked = estado.compartilhado;
    document.getElementById('btImportar').hidden = !estado.ehDono;
    return;
  }
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

// O painel de números derivados fica visível em todas as abas: é o que se
// consulta o tempo todo durante a sessão.
function painelDerivados(p){
  const pv = p.atual.pv ?? pvMaximo(p);
  const emCrise = pv <= crise(p);
  return `<div class="grade g4" style="margin-bottom:14px">
    <div class="derivado ${emCrise?'crise':''}">
      <div class="rot">Pontos de Vida</div>
      <div class="val">${pv}<span style="font-size:16px;color:var(--suave)">/${pvMaximo(p)}</span></div>
      <div class="obs">${emCrise ? 'em crise' : 'crise em ' + crise(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Pontos de Mana</div>
      <div class="val">${p.atual.pm ?? pmMaximo(p)}<span style="font-size:16px;color:var(--suave)">/${pmMaximo(p)}</span></div>
      <div class="obs">nível + 5 × Vontade</div>
    </div>
    <div class="derivado">
      <div class="rot">Defesa</div>
      <div class="val">${defesa(p)}</div>
      <div class="obs">mágica ${defesaMagica(p)}</div>
    </div>
    <div class="derivado">
      <div class="rot">Nível</div>
      <div class="val">${nivelTotal(p)}</div>
      <div class="obs">${p.atual.pi ?? piMaximo(p)}/${piMaximo(p)} inventário</div>
    </div>
  </div>`;
}

function campo(rotulo, chave, valor, tipo){
  return `<div><label for="c-${chave}">${rotulo}</label>
    <input id="c-${chave}" data-perfil="${chave}" type="${tipo||'text'}" value="${esc(valor)}"></div>`;
}

function abaPerfil(p){
  return `<div class="cartao">
    <div class="grade g2">
      ${campo('Nome','nome',p.perfil.nome)}
      ${campo('Identidade','identidade',p.perfil.identidade)}
      ${campo('Tema','tema',p.perfil.tema)}
      ${campo('Origem','origem',p.perfil.origem)}
      ${campo('Pronomes','pronomes',p.perfil.pronomes)}
      <div><label for="c-fabula">Pontos de Fabula</label>
        <input id="c-fabula" data-num="pontosFabula" type="number" min="0" value="${p.pontosFabula}"></div>
    </div>
    <div style="margin-top:14px">
      <label for="c-aparencia">Aparência</label>
      <textarea id="c-aparencia" data-perfil="aparencia" rows="3">${esc(p.perfil.aparencia)}</textarea>
    </div>
    <div style="margin-top:14px">
      <label for="c-anotacoes">Anotações</label>
      <textarea id="c-anotacoes" data-campo="anotacoes" rows="5">${esc(p.anotacoes)}</textarea>
    </div>
  </div>`;
}

function abaAtributos(p){
  const perfil = PERFIS.find(x => x.id === p.perfilAtributos);
  const escolhidos = ATRIBUTOS.map(a => p.atributos[a.id]).sort((a,b) => b-a);
  const esperados = perfil ? [...perfil.dados].sort((a,b) => b-a) : null;
  const perfilBate = esperados && escolhidos.every((v,i) => v === esperados[i]);

  const total = nivelTotal(p);
  const usadas = p.classes.filter(c => c.classeId).length;

  return `<div class="cartao">
    <h2 style="font-size:18px">Atributos</h2>
    <p class="mini" style="margin:6px 0 16px">
      O <strong>dado básico</strong> é o que você escolhe. O <strong>dado atual</strong>
      já desconta as condições ativas, e é ele que vale para Defesa.
    </p>

    <div style="max-width:320px;margin-bottom:16px">
      <label for="c-perfilatr">Perfil de distribuição</label>
      <select id="c-perfilatr">
        ${PERFIS.map(x => `<option value="${x.id}" ${x.id===p.perfilAtributos?'selected':''}>
          ${x.nome} — ${x.dados.map(d=>'d'+d).join(', ')}</option>`).join('')}
      </select>
    </div>

    <div class="grade g4">
      ${ATRIBUTOS.map(a => {
        const base = p.atributos[a.id], agora = dadoAtual(p, a.id);
        return `<div>
          <label for="c-atr-${a.id}">${a.nome}</label>
          <select id="c-atr-${a.id}" data-atributo="${a.id}">
            ${ESCALA.map(d => `<option value="${d}" ${d===base?'selected':''}>d${d}</option>`).join('')}
          </select>
          <p class="mini" style="margin-top:6px">
            ${agora !== base ? `atual <strong style="color:var(--alerta)">d${agora}</strong> · ` : ''}${a.sobre}
          </p>
        </div>`;
      }).join('')}
    </div>

    ${perfilBate
      ? `<p class="ok">Os dados batem com o perfil ${perfil.nome}.</p>`
      : `<div class="aviso">Os dados escolhidos não batem com o perfil
         <strong>${perfil ? perfil.nome : '—'}</strong>
         (${perfil ? perfil.dados.map(d=>'d'+d).join(', ') : ''}).
         Troque o perfil ou ajuste os dados.</div>`}
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Classes</h2>
    <p class="mini" style="margin:6px 0 16px">
      Na criação são <strong>duas ou três classes</strong> e <strong>cinco níveis</strong>
      distribuídos entre elas.
    </p>
    ${p.classes.map((c,i) => `
      <div class="classe-linha">
        <div>
          <label for="c-cl-${i}">${i+1}ª classe</label>
          <select id="c-cl-${i}" data-classe="${i}">
            <option value="">— nenhuma —</option>
            ${CLASSES.map(x => `<option value="${x.id}" ${x.id===c.classeId?'selected':''}>${x.nome}</option>`).join('')}
          </select>
        </div>
        <div>
          <label for="c-nv-${i}">Nível</label>
          <input id="c-nv-${i}" data-nivel="${i}" type="number" min="0" max="10" value="${c.nivel||0}">
        </div>
        <button data-remover-classe="${i}" ${p.classes.length<=2?'disabled':''}>Tirar</button>
      </div>`).join('')}
    <button id="btAddClasse" ${p.classes.length>=7?'disabled':''}>+ Outra classe</button>

    ${total === NIVEL_INICIAL && usadas >= 2
      ? `<p class="ok">Nível ${total}, ${usadas} classes — pronto para começar.</p>`
      : `<div class="aviso">Somando ${total} ${total===1?'nível':'níveis'} em ${usadas}
         ${usadas===1?'classe':'classes'}. Um personagem novo começa com
         <strong>${NIVEL_INICIAL} níveis</strong> em <strong>2 ou 3 classes</strong>.
         Se este é um personagem avançado, pode ignorar.</div>`}
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Benefícios das classes</h2>
    <p class="mini" style="margin:6px 0 16px">
      PV, PM, PI e o que suas classes deixam equipar somam automaticamente,
      um por classe em que você tem ao menos 1 nível — e se duas classes
      derem o mesmo benefício, ele acumula (pág. 176).
    </p>
    <div class="grade g3">
      <div class="derivado"><div class="rot">PV de classe</div>
        <div class="val" style="font-size:22px">+${beneficiosDeClasse(p,'pv')}</div></div>
      <div class="derivado"><div class="rot">PM de classe</div>
        <div class="val" style="font-size:22px">+${beneficiosDeClasse(p,'pm')}</div></div>
      <div class="derivado"><div class="rot">PI de classe</div>
        <div class="val" style="font-size:22px">+${beneficiosDeClasse(p,'pi')}</div></div>
    </div>
    ${textosDeEquipamento(p).length ? `<p class="ok">Pode equipar: ${textosDeEquipamento(p).join('; ')}.</p>` : ''}

    ${escolhasDeBeneficioPendentes(p).map(b => {
      const nomeClasse = CLASSES.find(x => x.id === b.classeId)?.nome || b.classeId;
      const atual = p.escolhasBeneficio[b.classeId] || b.opcoes[0];
      return `<div style="margin-top:14px">
        <label for="c-escolha-${b.classeId}">${nomeClasse}: PV ou PM (+${b.valor}, à sua escolha)</label>
        <select id="c-escolha-${b.classeId}" data-escolha-beneficio="${b.classeId}" style="max-width:200px">
          <option value="pv" ${atual==='pv'?'selected':''}>PV máximos</option>
          <option value="pm" ${atual==='pm'?'selected':''}>PM máximos</option>
        </select>
      </div>`;
    }).join('')}

    <h2 style="font-size:18px;margin-top:22px">Equipamento</h2>
    <p class="mini" style="margin:6px 0 16px">
      Armadura e mão secundária (escudo ou segunda arma) — itens marciais
      🔒 pedem uma classe que ainda não está na ficha, e não podem ser
      equipados enquanto isso.
    </p>
    <div class="grade g3">
      <div><label for="c-eq-armadura">Armadura</label>
        <select id="c-eq-armadura" data-equip="armadura">${opcoesArmadura(p)}</select></div>
      <div><label for="c-eq-maopri">Mão principal</label>
        <select id="c-eq-maopri" data-equip="maoPrincipal">${opcoesMaoPrincipal(p)}</select></div>
      <div><label for="c-eq-maosec">Mão secundária</label>
        <select id="c-eq-maosec" data-equip="maoSecundaria" ${armaPrincipalEquipada(p).maos===2?'disabled':''}>${opcoesMaoSecundaria(p)}</select></div>
    </div>
    <p class="mini" style="margin-top:10px">
      Defesa <strong>${defesa(p)}</strong> · Defesa Mágica <strong>${defesaMagica(p)}</strong>
      · Iniciativa <strong>${iniciativa(p)>=0?'+':''}${iniciativa(p)}</strong>
      (com condições e outros bônus já somados)
    </p>
    <p class="mini" style="margin-top:4px">
      ${textoArma('Mão principal', armaPrincipalEquipada(p))}
      ${armaSecundariaEquipada(p) ? '<br>' + textoArma('Mão secundária', armaSecundariaEquipada(p)) : ''}
    </p>
    ${notaLutaComDuasArmas(p)}

    <h2 style="font-size:18px;margin-top:22px">Outros bônus</h2>
    <p class="mini" style="margin:6px 0 16px">
      O que a ficha ainda não calcula sozinha: acessórios (pág. 126) e
      poderes que somam direto em Defesa, Defesa Mágica ou Iniciativa.
    </p>
    <div class="grade g3">
      ${[['defesa','Defesa'],['defesaMagica','Defesa mágica'],['iniciativa','Iniciativa']].map(([k,r]) =>
        `<div><label for="c-b-${k}">${r}</label>
         <input id="c-b-${k}" data-bonus="${k}" type="number" value="${p.bonus[k]||0}"></div>`).join('')}
    </div>
  </div>`;
}

function opcoesArmadura(p){
  const liberados = tiposMarciaisLiberados(p);
  const atualId = p.equipamento?.armaduraId || 'sem-armadura';
  return ARMADURAS_BASICAS.map(a => {
    const bloqueada = a.marcial && !liberados.has('armadura');
    return `<option value="${a.id}" ${a.id===atualId?'selected':''} ${bloqueada?'disabled':''}>${a.nome}${a.marcial?' (marcial)':''}${bloqueada?' 🔒':''}</option>`;
  }).join('');
}

function opcoesMaoPrincipal(p){
  const liberados = tiposMarciaisLiberados(p);
  const atualId = p.equipamento?.maoPrincipalId || 'ataque-desarmado';
  return ARMAS_BASICAS.map(a => {
    const tipoNecessario = a.alcance === 'corpo a corpo' ? 'arma corpo a corpo' : 'arma à distância';
    const bloqueada = a.marcial && !liberados.has(tipoNecessario);
    return `<option value="${a.id}" ${a.id===atualId?'selected':''} ${bloqueada?'disabled':''}>${a.nome}${a.maos===2?' (duas mãos)':''}${a.marcial?' (marcial)':''}${bloqueada?' 🔒':''}</option>`;
  }).join('');
}

function opcoesMaoSecundaria(p){
  if(armaPrincipalEquipada(p).maos === 2){
    return `<option value="">— ocupada pela arma de duas mãos —</option>`;
  }
  const liberados = tiposMarciaisLiberados(p);
  const atualId = p.equipamento?.maoSecundariaId || '';
  return `<option value="" ${atualId===''?'selected':''}>— nenhuma —</option>
    <optgroup label="Armas (uma mão)">
      ${ARMAS_BASICAS.filter(a => a.maos === 1).map(a => {
        const tipoNecessario = a.alcance === 'corpo a corpo' ? 'arma corpo a corpo' : 'arma à distância';
        const bloqueada = a.marcial && !liberados.has(tipoNecessario);
        return `<option value="${a.id}" ${a.id===atualId?'selected':''} ${bloqueada?'disabled':''}>${a.nome}${a.marcial?' (marcial)':''}${bloqueada?' 🔒':''}</option>`;
      }).join('')}
    </optgroup>
    <optgroup label="Escudos">
      ${ESCUDOS_BASICOS.map(e => {
        const bloqueada = e.marcial && !liberados.has('escudo');
        return `<option value="${e.id}" ${e.id===atualId?'selected':''} ${bloqueada?'disabled':''}>${e.nome}${e.marcial?' (marcial)':''}${bloqueada?' 🔒':''}</option>`;
      }).join('')}
    </optgroup>`;
}

function textoArma(rotulo, arma){
  return `<strong>${rotulo}:</strong> ${arma.nome} — Precisão ${textoPrecisao(arma)} · Dano ${textoDano(arma)}${arma.obs ? ` (${arma.obs})` : ''}`;
}

// Luta com duas armas (pág. 69): exige uma arma em cada mão, da mesma
// Categoria (ex: duas espadas) — a heroica Ambidestro derruba essa exigência
// de categoria igual.
function notaLutaComDuasArmas(p){
  const principal = armaPrincipalEquipada(p);
  const secundaria = armaSecundariaEquipada(p);
  if(principal.id === 'ataque-desarmado' || !secundaria) return '';
  const mesmaCategoria = principal.categoria === secundaria.categoria;
  const ambidestro = (p.heroicas || []).includes('ambidestro');
  if(!mesmaCategoria && !ambidestro) return '';
  return `<p class="mini" style="margin-top:6px">
    <strong>Luta com duas armas</strong> disponível na ação Ataque${ambidestro && !mesmaCategoria ? ' (por causa de Ambidestro, mesmo com categorias diferentes)' : ''}: ataque com as duas armas, em qualquer ordem, no mesmo alvo ou em alvos diferentes — mas os dois ataques perdem a propriedade multi (e não podem ganhar) e, no cálculo do dano de cada um, a Rolagem Alta (RA) sempre conta como 0.
  </p>`;
}

function abaRecursos(p){
  const linha = (chave, rotulo, maximo) => `
    <div>
      <label for="c-a-${chave}">${rotulo}</label>
      <div class="linha">
        <input id="c-a-${chave}" data-atualrec="${chave}" type="number" min="0" max="${maximo}"
               value="${p.atual[chave] ?? maximo}">
        <span class="mini" style="white-space:nowrap">de ${maximo}</span>
      </div>
    </div>`;

  return `<div class="cartao">
    <h2 style="font-size:18px">Agora</h2>
    <div class="grade g3" style="margin-top:14px">
      ${linha('pv','Pontos de Vida', pvMaximo(p))}
      ${linha('pm','Pontos de Mana', pmMaximo(p))}
      ${linha('pi','Pontos de Inventário', piMaximo(p))}
    </div>
    <div class="linha" style="margin-top:14px">
      <button id="btDescanso" class="destaque">Descanso completo</button>
      <span class="mini">Enche PV, PM e PI, e limpa as condições.</span>
    </div>

    <h2 style="font-size:18px;margin-top:22px">Sofrer dano</h2>
    <p class="mini" style="margin:6px 0 12px">
      Digite o dano bruto e o tipo — a Afinidade abaixo já entra na conta.
    </p>
    <div class="linha" style="flex-wrap:wrap;gap:10px">
      <input id="c-dano-valor" type="number" min="0" value="0" style="max-width:90px">
      <select id="c-dano-tipo">
        ${TIPOS_DANO.map(t => `<option value="${t.id}">${t.nome}</option>`).join('')}
      </select>
      <button id="btAplicarDano">Aplicar em PV</button>
      <span class="mini" id="dano-previa">${resultadoDeDano(p, 0, TIPOS_DANO[0].id).texto}</span>
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Afinidades</h2>
    <p class="mini" style="margin:6px 0 14px">
      O quanto cada tipo de dano machuca você. Imune vale mais que Vulnerável
      ou Resistente juntos; Absorve vale mais que tudo — em vez de perder PV,
      recupera.
    </p>
    <div class="grade g3">
      ${TIPOS_DANO.map(t => `<div><label for="c-af-${t.id}">${t.nome}</label>
        <select id="c-af-${t.id}" data-afinidade="${t.id}">
          ${AFINIDADES_NIVEIS.map(n => `<option value="${n.id}" ${((p.afinidades||{})[t.id]||'normal')===n.id?'selected':''}>${n.nome}</option>`).join('')}
        </select></div>`).join('')}
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Condições</h2>
    <p class="mini" style="margin:6px 0 14px">
      Cada condição reduz um passo de dado. Elas se acumulam, e nenhum
      Atributo desce abaixo de d6.
    </p>
    <div class="condicoes">
      ${CONDICOES.map(c => `<label>
        <input type="checkbox" data-condicao="${c.id}" ${p.condicoes.includes(c.id)?'checked':''}>
        ${c.nome} <span class="mini">(${c.reduz.map(r =>
          ATRIBUTOS.find(a=>a.id===r).abrev).join(' e ')})</span>
      </label>`).join('')}
    </div>
  </div>

  <div class="cartao">
    <h2 style="font-size:18px">Zênites</h2>
    <div style="max-width:220px;margin-top:12px">
      <input data-num="zenites" type="number" min="0" value="${p.zenites}">
    </div>
  </div>`;
}

/*
  Quantas vezes o poder `poderId` daquela classe já foi escolhido — o NP dele.
*/
function npDoPoder(p, classeId, poderId){
  return (p.poder.escolhas[classeId] || {})[poderId] || 0;
}

// Total de poderes já escolhidos numa classe, somando o NP de todos eles.
function poderesUsadosNaClasse(p, classeId){
  const mapa = p.poder.escolhas[classeId] || {};
  return Object.values(mapa).reduce((soma, n) => soma + n, 0);
}

function abaPoderes(p){
  const classesComNivel = p.classes.filter(c => c.classeId && c.nivel > 0);

  if(!classesComNivel.length){
    return `<div class="cartao"><p class="mini">
      Escolha uma classe com pelo menos 1 nível na aba <strong>Atributos e
      Classes</strong> para ver os poderes dela aqui.</p></div>`;
  }

  return classesComNivel.map(c => {
    const def = PODERES_CLASSE[c.classeId];
    const nomeClasse = CLASSES.find(x => x.id === c.classeId)?.nome || c.classeId;

    if(!def){
      // Não deveria acontecer — as 15 classes do Livro Básico têm poderes
      // cadastrados. Se aparecer, é uma classe nova sem entrada em
      // PODERES_CLASSE.
      return `<div class="cartao">
        <h2 style="font-size:18px">${nomeClasse}</h2>
        <div class="aviso">Esta classe ainda não tem os poderes cadastrados
        na ficha. Anote-os nas <strong>Anotações</strong>, na aba Perfil.</div>
      </div>`;
    }

    const usados = poderesUsadosNaClasse(p, c.classeId);
    const restam = c.nivel - usados;

    return `<div class="cartao" data-classe-poderes="${c.classeId}">
      <div class="flex" style="display:flex;justify-content:space-between;align-items:baseline">
        <h2 style="font-size:18px">${nomeClasse}</h2>
        <span class="mini">${usados} de ${c.nivel} ${c.nivel===1?'poder escolhido':'poderes escolhidos'}</span>
      </div>

      ${restam !== 0 ? `<div class="aviso">
          ${restam > 0
            ? `Faltam ${restam} ${restam===1?'poder':'poderes'} para escolher — cada nível dá um.`
            : `${Math.abs(restam)} ${Math.abs(restam)===1?'poder a mais do que':'poderes a mais do que'} o nível permite.`}
        </div>` : `<p class="ok">Todos os poderes desta classe já foram escolhidos.</p>`}

      ${def.map(poder => {
        const np = npDoPoder(p, c.classeId, poder.id);
        return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--borda)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <p class="mini" style="color:var(--texto);font-size:14px">
              <strong>${poder.nome}</strong>${poder.max > 1 ? ` <span style="color:var(--suave)">(até ${poder.max}×)</span>` : ''}
            </p>
            <div class="linha" style="width:auto">
              <button data-poder-menos="${c.classeId}|${poder.id}" ${np<=0?'disabled':''} aria-label="Diminuir">−</button>
              <span style="min-width:2ch;text-align:center">${np}</span>
              <button data-poder-mais="${c.classeId}|${poder.id}" ${np>=poder.max?'disabled':''} aria-label="Aumentar">+</button>
            </div>
          </div>
          <p class="mini" style="margin-top:4px">${poder.descricao}</p>

          ${poder.id === 'vincular-invocar' && np > 0 ? blocoArcano(p) : ''}
          ${LISTAS_DE_FEITICO[c.classeId]?.poderId === poder.id && np > 0 ? blocoFeiticos(p, c.classeId, np) : ''}
          ${poder.id === 'imitacao-magica' && np > 0 ? `<p class="mini" style="margin-top:8px;padding:8px;border:1px solid var(--borda);border-radius:8px">
            Sem lista fixa: os feitiços de Quimerista vêm de observar criaturas fera, monstro ou planta em jogo. Anote nas <strong>Anotações</strong> quais você já aprendeu (limite de ${np + 2}).
          </p>` : ''}
          ${poder.id === 'invocacao' && np > 0 ? blocoManaciais() : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('') + blocoRituais(p) + blocoProjeto(p);
}

function blocoArcano(p){
  const vinculado = p.poder.arcanoVinculado;
  return `<div style="margin-top:10px;padding:10px;border:1px solid var(--borda);border-radius:8px">
    <label for="c-arcano">Arcano vinculado</label>
    <select id="c-arcano" data-arcano-vinculado>
      <option value="">— escolher —</option>
      ${ARCANOS_DEF.map(a => `<option value="${a.id}" ${a.id===vinculado?'selected':''}>${a.nome}</option>`).join('')}
    </select>
    ${vinculado ? (() => {
      const a = ARCANOS_DEF.find(x => x.id === vinculado);
      return `<p class="mini" style="margin-top:8px"><strong>Fundir:</strong> ${a.fundir}</p>
        ${a.dispensar ? `<p class="mini" style="margin-top:4px"><strong>Dispensar:</strong> ${a.dispensar}</p>` : ''}`;
    })() : ''}
  </div>`;
}

// Monta a linha de "ficha técnica" de um item de catálogo só com os campos
// que ele realmente tem — feitiço tem PM/alvo/duração, dança só duração,
// dom tem "evento", terioforma e magissemente não têm nenhum desses.
function fichaTecnica(item){
  const partes = [];
  if(item.pm) partes.push(`${item.pm} PM`);
  if(item.alvo) partes.push(item.alvo);
  if(item.duracao) partes.push(item.duracao);
  if(item.evento) partes.push(item.evento);
  return partes.length ? `${partes.join(' · ')}<br>` : '';
}

function blocoFeiticos(p, classeId, np){
  const entrada = LISTAS_DE_FEITICO[classeId];
  const lista = entrada.lista;
  // Simbolismo dá dois símbolos por compra; os outros dão um.
  const vagas = np * (entrada.porCompra || 1);
  const escolhidos = p.poder.feiticos[classeId] || [];
  return `<div style="margin-top:10px;padding:10px;border:1px solid var(--borda);border-radius:8px">
    <p class="mini">${entrada.rotulo} (${escolhidos.filter(Boolean).length} de ${vagas}):</p>
    <div class="grade g2" style="margin-top:8px">
      ${Array.from({length: vagas}).map((_, i) => `
        <select data-feitico="${classeId}|${i}">
          <option value="">— escolher —</option>
          ${lista.map(f => `<option value="${f.id}" ${escolhidos[i]===f.id?'selected':''}>${f.nome}${f.ofensivo?' (ofensivo)':''}</option>`).join('')}
        </select>`).join('')}
    </div>
    ${escolhidos.filter(Boolean).map(id => {
      const f = lista.find(x => x.id === id);
      return f ? `<p class="mini" style="margin-top:8px">
        <strong>${f.nome}</strong> — ${fichaTecnica(f)}${f.descricao}</p>` : '';
    }).join('')}
  </div>`;
}

// Mananciais do Invocador: referência estática, não é uma escolha do
// jogador — em cada cena é o mestre que decide quais dois mananciais estão
// presentes (pág. 155 do Atlas Natural Fantasy).
function blocoManaciais(){
  return `<div style="margin-top:10px;padding:10px;border:1px solid var(--borda);border-radius:8px">
    <p class="mini">Mananciais e invocações — o mestre escolhe dois por cena:</p>
    ${MANANCIAIS_DEF.map(m => `
      <p class="mini" style="margin-top:10px"><strong>${m.nome}</strong></p>
      <ul style="margin:4px 0 0 18px;padding:0">
        ${m.invocacoes.map(i => `<li class="mini">${i.nome} <span style="color:var(--suave)">(${i.tipo})</span> — ${i.descricao}</li>`).join('')}
      </ul>`).join('')}
  </div>`;
}

// Quais disciplinas de ritual o personagem já destravou, olhando o NP de
// cada poder que dá acesso (RITUAL_ACESSOS). Pode haver mais de um acesso
// pra mesma disciplina (ex: dois personagens diferentes chegando em
// ritualismo por caminhos diferentes não acontece na mesma ficha, mas duas
// classes na mesma ficha podem — aí juntamos as restrições).
function acessosRituais(p){
  const porDisciplina = {};
  RITUAL_ACESSOS.forEach(a => {
    if(npDoPoder(p, a.classeId, a.poderId) > 0){
      const atual = porDisciplina[a.disciplina] || (porDisciplina[a.disciplina] = {disciplina:a.disciplina, restricoes:[]});
      if(a.restricao) atual.restricoes.push(a.restricao);
    }
  });
  return Object.values(porDisciplina);
}

function blocoRituais(p){
  const acessos = acessosRituais(p);
  if(!acessos.length) return '';
  return `<div class="cartao">
    <h2 style="font-size:18px">Rituais</h2>
    <p class="mini" style="margin-top:6px">
      Nunca causam dano direto, condições, ganho/perda de PV, PM, PI, Pontos
      de Fabula ou Pontos de Ultima, nem repetem o efeito de um poder ou
      feitiço existente. Falhar no teste de Magia distorce o efeito de forma
      catastrófica, a critério do mestre. Um ingrediente raro sacrificado
      reduz o custo em PM à metade (uma vez por ritual).
    </p>
    ${acessos.map(a => blocoRitualDisciplina(p, a)).join('')}
  </div>`;
}

function blocoRitualDisciplina(p, acesso){
  const {disciplina, restricoes} = acesso;
  const info = RITUAL_DISCIPLINAS[disciplina];
  const estado = p.rituais[disciplina] || {potencia:'menor', area:'individual'};
  const pot = RITUAL_POTENCIAS.find(x => x.id === estado.potencia) || RITUAL_POTENCIAS[0];
  const are = RITUAL_AREAS.find(x => x.id === estado.area) || RITUAL_AREAS[0];
  return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--borda)">
    <p class="mini" style="color:var(--texto);font-size:14px">
      <strong>${info.nome}</strong> — teste de Magia com ${info.teste}
    </p>
    ${restricoes.length ? `<p class="mini" style="margin-top:2px">${restricoes.join('; ')}</p>` : ''}
    <div class="grade g2" style="margin-top:8px">
      <div><label for="c-ritpot-${disciplina}">Potência</label>
        <select id="c-ritpot-${disciplina}" data-ritual-potencia="${disciplina}">
          ${RITUAL_POTENCIAS.map(x => `<option value="${x.id}" ${x.id===estado.potencia?'selected':''}>${x.nome}</option>`).join('')}
        </select></div>
      <div><label for="c-ritarea-${disciplina}">Área</label>
        <select id="c-ritarea-${disciplina}" data-ritual-area="${disciplina}">
          ${RITUAL_AREAS.map(x => `<option value="${x.id}" ${x.id===estado.area?'selected':''}>${x.nome}</option>`).join('')}
        </select></div>
    </div>
    <p class="mini" style="margin-top:8px">
      Custo: <strong>${pot.pm * are.mult} PM</strong> · ND <strong>${pot.nd}</strong>
      · em conflito, relógio de <strong>${pot.secoes}</strong> seções.
    </p>
  </div>`;
}

// Projeto do Inventor: qualquer personagem com nível em Inventor pode
// começar um (não exige comprar um poder específico, ao contrário de
// Rituais). Calculadora igual: potência × área × uso vira custo em zênites
// e progresso necessário (um por 100z, mínimo 1).
function temNivelEm(p, classeId){
  return p.classes.some(c => c.classeId === classeId && c.nivel > 0);
}

function blocoProjeto(p){
  if(!temNivelEm(p, 'inventor')) return '';
  const estado = p.projeto || {potencia:'menor', area:'individual', uso:'consumivel', defeito:false};
  const pot = PROJETO_POTENCIAS.find(x => x.id === estado.potencia) || PROJETO_POTENCIAS[0];
  const are = PROJETO_AREAS.find(x => x.id === estado.area) || PROJETO_AREAS[0];
  const uso = PROJETO_USOS.find(x => x.id === estado.uso) || PROJETO_USOS[0];
  const bruto = pot.custo * are.mult * uso.mult;
  const custoFinal = estado.defeito ? Math.round(bruto * 0.75) : bruto;
  const progresso = Math.max(1, Math.ceil(custoFinal / 100));
  const valores = valoresDeProjetoPorNivel(p);

  return `<div class="cartao">
    <h2 style="font-size:18px">Projeto</h2>
    <p class="mini" style="margin:6px 0 14px">
      Uma invenção sob medida — não serve pra fabricar equipamento comum,
      é pra soluções que não existiam antes (uma aeronave, um golem, uma
      poção do amor). Escolha potência, área e se é de um uso só ou
      permanente; o mestre pode pedir um ingrediente raro em potências
      média ou mais alta, além do custo.
    </p>
    <div class="grade g3">
      <div><label for="c-projpot">Potência</label>
        <select id="c-projpot" data-projeto="potencia">
          ${PROJETO_POTENCIAS.map(x => `<option value="${x.id}" ${x.id===estado.potencia?'selected':''}>${x.nome}</option>`).join('')}
        </select></div>
      <div><label for="c-projarea">Área</label>
        <select id="c-projarea" data-projeto="area">
          ${PROJETO_AREAS.map(x => `<option value="${x.id}" ${x.id===estado.area?'selected':''}>${x.nome}</option>`).join('')}
        </select></div>
      <div><label for="c-projuso">Uso</label>
        <select id="c-projuso" data-projeto="uso">
          ${PROJETO_USOS.map(x => `<option value="${x.id}" ${x.id===estado.uso?'selected':''}>${x.nome}</option>`).join('')}
        </select></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;text-transform:none;letter-spacing:normal;font-size:13px;color:var(--texto)">
      <input type="checkbox" style="width:auto" data-projeto-defeito ${estado.defeito?'checked':''}>
      Negociar um defeito terrível com o mestre (reduz o custo em 25%)
    </label>
    <p class="mini" style="margin-top:10px">
      Custo: <strong>${custoFinal} zênites</strong> · Progresso necessário: <strong>${progresso}</strong>
      (+1 por PJ que trabalhar no dia, +1 a mais se tiver nível em Inventor)
    </p>
    <p class="mini" style="margin-top:10px">
      <strong>Dano/cura desta potência:</strong> ${pot.dano}${pot.dano!=='Não disponível' ? ` (${{'Menor':valores.menor,'Maior':valores.maior,'Massivo':valores.massivo}[pot.dano]} no seu nível)` : ''}
      · <strong>Proteção:</strong> ${pot.protecao}
    </p>
  </div>`;
}

function abaHeroico(p){
  const dominadas = classesDominadas(p);
  const escolhidas = p.heroicas || [];
  const maximo = dominadas.length;

  if(!maximo){
    return `<div class="cartao"><p class="mini">
      Habilidades Heroicas exigem ter dominado uma classe — levado ela ao
      <strong>nível 10</strong> — na aba <strong>Atributos e Classes</strong>.
      Cada classe dominada dá direito a escolher uma.</p></div>`;
  }

  return `<div class="cartao">
    <div class="flex" style="display:flex;justify-content:space-between;align-items:baseline">
      <h2 style="font-size:18px">Habilidades Heroicas</h2>
      <span class="mini">${escolhidas.length} de ${maximo} escolhidas</span>
    </div>
    <p class="mini" style="margin:6px 0 16px">
      Uma por classe dominada (nível 10+): ${dominadas.map(id => CLASSES.find(x=>x.id===id)?.nome || id).join(', ')}.
      As com 🔒 pedem dominar outra classe (e às vezes um poder específico dela).
    </p>
    ${HABILIDADES_HEROICAS.map(h => {
      const disponivel = heroicaDisponivel(p, h);
      const marcada = escolhidas.includes(h.id);
      const travada = !disponivel && !marcada;
      const cheio = escolhidas.length >= maximo && !marcada;
      return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--borda)">
        <label style="display:flex;align-items:baseline;gap:8px;text-transform:none;letter-spacing:normal;font-size:14px;color:var(--texto)">
          <input type="checkbox" style="width:auto" data-heroica="${h.id}" ${marcada?'checked':''} ${(travada||cheio)?'disabled':''}>
          <span><strong>${h.nome}</strong>${h.classes ? ` <span class="mini">(${h.classes.map(c=>CLASSES.find(x=>x.id===c)?.nome||c).join(' ou ')})</span>` : ''}${travada?' 🔒':''}</span>
        </label>
        <p class="mini" style="margin:4px 0 0 26px">${h.texto}</p>
      </div>`;
    }).join('')}
  </div>`;
}

            <option value="">— escolher —</option>
            ${estado.rolagem.map((v,i) => `<option value="roll:${i}" ${estado.efeitoEscolha===`roll:${i}`?'selected':''}>${v} — ${textoEfeitoPorValor(v)}</option>`).join('')}
            ${ALQUIMIA_EFEITO_SEMPRE.map(e => `<option value="sempre:${e.id}" ${estado.efeitoEscolha===`sempre:${e.id}`?'selected':''}>Sempre disponível — ${e.texto}</option>`).join('')}
