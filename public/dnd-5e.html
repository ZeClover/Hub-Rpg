<title>Ficha — D&amp;D 5ª Edição</title>
<style>
/* Mesma paleta do Hub RPG: fundo escuro em tom quente, destaque em âmbar. */
:root{
  --fundo:#0b0a08; --superficie:#15120d; --superficie-alta:#1e1a13;
  --borda:#2c2519; --texto:#f3ede2; --suave:#a1937d;
  --ambar:#e0a234; --ambar-forte:#f5bf5c; --alerta:#9c3746;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0}
a{color:var(--ambar-forte)}

.barra{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; padding:10px 16px;
  background:var(--superficie); border-bottom:1px solid var(--borda);
}
.marca{font-family:Georgia,serif; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ambar)}
.cresce{flex:1}

button,select,input,textarea{font:inherit; color:var(--texto)}
button{
  background:transparent; border:1px solid var(--borda); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:border-color .15s,color .15s,transform .12s;
}
button:hover{border-color:var(--suave)}
button:not(:disabled):active{transform:scale(.95)}
button.destaque{border-color:rgba(224,162,52,.4); background:rgba(224,162,52,.1); color:var(--ambar-forte)}
button.destaque:hover{background:rgba(224,162,52,.2)}
button.perigo{border-color:rgba(156,55,70,.5); color:var(--alerta)}
input,select,textarea{
  background:var(--superficie-alta); border:1px solid var(--borda);
  border-radius:8px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:rgba(224,162,52,.6)}
textarea{resize:vertical}
label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--suave); margin-bottom:5px; font-family:Georgia,serif}

main{max-width:960px; margin:0 auto; padding:20px 16px 80px}
.abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.abas button[aria-current="true"]{border-color:rgba(224,162,52,.5); color:var(--ambar-forte)}

.cartao{background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:18px; margin-bottom:14px;
  transition:box-shadow .18s ease, transform .18s ease}
.cartao:hover{box-shadow:0 4px 16px rgba(0,0,0,.35); transform:translateY(-2px)}
.grade{display:grid; gap:14px}
@media(min-width:640px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(6,1fr)} }

.derivado{text-align:center; background:var(--superficie-alta);
  border:1px solid var(--borda); border-radius:10px; padding:12px 8px}
.derivado .rot{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--suave)}
.derivado .val{font-family:Georgia,serif; font-size:28px; color:var(--ambar-forte); margin-top:4px}
.derivado .obs{font-size:11px; color:var(--suave); margin-top:2px}
.derivado.risco .val{color:var(--alerta)}

.linha{display:flex; align-items:center; gap:10px}
.aviso{border:1px solid rgba(156,55,70,.5); background:rgba(156,55,70,.1);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-top:10px}
.ok{color:var(--suave); font-size:13px; margin-top:10px}

.tabela{width:100%; border-collapse:collapse; font-size:13px}
.tabela th{text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--suave); padding:6px 8px; border-bottom:1px solid var(--borda)}
.tabela td{padding:6px 8px; border-bottom:1px solid var(--borda)}
.tabela tr:last-child td{border-bottom:none}
.pericia-linha{display:flex; align-items:center; gap:10px; padding:5px 0}
.pericia-linha input[type=checkbox]{width:auto; accent-color:var(--ambar)}
.pericia-nome{flex:1}
.pericia-total{font-family:Georgia,serif; color:var(--ambar-forte); min-width:34px; text-align:right}

.linha-lista{border:1px solid var(--borda); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--superficie-alta)}
.linha-lista .topo{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.condicoes{display:flex; flex-wrap:wrap; gap:8px}
.condicoes label{display:flex; align-items:center; gap:7px; text-transform:none;
  letter-spacing:0; font-family:inherit; font-size:14px; color:var(--texto);
  border:1px solid var(--borda); border-radius:999px; padding:6px 12px;
  margin:0; cursor:pointer}
.condicoes input{width:auto; accent-color:var(--alerta)}
.condicoes label:has(input:checked){border-color:rgba(156,55,70,.6); color:var(--alerta)}
.vazio{color:var(--suave); text-align:center; padding:50px 20px}
.mini{font-size:12px; color:var(--suave)}
.trilha{color:var(--ambar-forte); font-family:Georgia,serif}

@keyframes fadeSlideIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
#app.entra{animation:fadeSlideIn .32s ease-out}

   Este é o CHASSI do sistema (decisão #17 do Hub: cada sistema de regras é
   um módulo próprio, respondendo às mesmas sete perguntas de
   ARQUITETURA.md). D&D é o sistema mais denso já trazido pro Hub — esta
   primeira fatia cobre: atributos e testes, as 9 raças do Livro do
   Jogador, 4 classes-base (Guerreiro, Ladino, Clérigo, Mago) até o 3º
   nível, antecedentes, equipamento (armas/armaduras), combate, condições
   e conjuração (regra, sem catálogo de magias ainda). As 8 classes
   restantes (Bárbaro, Bardo, Bruxo, Druida, Feiticeiro, Monge, Paladino,
   Patrulheiro) e o catálogo de magias ficam para fatias futuras — mesmo
   ritmo que o Fabula Ultima e o SAO cresceram, classe por classe (decisão
   #26: uma fatia por vez).

   Fonte das regras: PDFs da biblioteca do Zé no Google Drive — Livro do
   Jogador e Regras Básicas dos Jogadores, edição brasileira (Devir/Galápagos,
   tradução da 5ª edição 2014). Conteúdo comercial da Wizards of the Coast:
   este arquivo codifica só MECÂNICA (números, fórmulas, proficiências,
   efeitos resumidos) — nunca texto, arte ou descrição do livro (mesma regra
   já seguida com o Fabula Ultima).

   Automação é o requisito central desta ficha: escolher Raça e Classe
   preenche bônus de atributo, proficiências e traços sozinho; PV, CA,
   iniciativa, perícias e ataques são sempre calculados a partir da
   ficha — nunca digitados à mão (mesmo espírito do botão "Recalcular" do

   Arquivo único, salvando no navegador (localStorage) OU na conta do Hub

   =========================================================================== */

function raca(id){ return RACAS.find(r => r.id === id) || null; }
function subraca(r, subracaId){ return r ? (r.subracas||[]).find(s => s.id === subracaId) || null : null; }
function classe(id){ return CLASSES.find(c => c.id === id) || null; }
function antecedente(nome){ return ANTECEDENTES.find(a => a.nome === nome) || null; }
function pericia(id){ return PERICIAS.find(p => p.id === id) || null; }
function arma(nome){ return ARMAS.find(a => a.nome === nome) || null; }
function armadura(nome){ return ARMADURAS.find(a => a.nome === nome) || null; }

/* --- Cálculos ------------------------------------------------------------- */

// Valor final de um atributo = base + bônus racial (raça + subraça).
function bonusRacial(p, atributoId){
  const r = raca(p.perfil.racaId);
  const s = subraca(r, p.perfil.subracaId);
  let total = 0;
  if(r) for(const b of r.bonusAtributo) if(b.atributo === atributoId) total += b.valor;
  if(s) for(const b of s.bonusAtributo) if(b.atributo === atributoId) total += b.valor;
  return total;
}
function valorAtributo(p, atributoId){ return (p.atributos[atributoId] ?? 10) + bonusRacial(p, atributoId); }
function modFinal(p, atributoId){ return modAtributo(valorAtributo(p, atributoId)); }

function nivel(p){ return Math.max(1, Math.min(20, p.nivel || 1)); }
function prof(p){ return bonusProficiencia(nivel(p)); }

function dadoDeVidaNumero(dado){ return Number(String(dado||'d8').replace(/\D/g,'')) || 8; }
function pvMaximoSugerido(p){
  const c = classe(p.perfil.classeId);
  if(!c) return 8 + modFinal(p,'constituicao');
  const dado = dadoDeVidaNumero(c.dadoDeVida);
  const mediaPorNivel = Math.floor(dado/2) + 1; // média oficial do dado (arredondada pra cima)
  const primeiroNivel = dado + modFinal(p,'constituicao');
  const demaisNiveis = (nivel(p) - 1) * (mediaPorNivel + modFinal(p,'constituicao'));
  return Math.max(1, primeiroNivel + demaisNiveis);
}
function pvMaximo(p){ return p.atual.pvMaximoManual ?? pvMaximoSugerido(p); }
function pvAtual(p){ return Math.max(0, Math.min(pvMaximo(p), p.atual.pv ?? pvMaximo(p))); }

function ehProficienteArma(p, armaObj){
  const c = classe(p.perfil.classeId);
  if(!c || !armaObj) return false;
  const geral = armaObj.categoria.startsWith('simples') ? 'Simples' : 'Marciais';
  return c.proficienciaArmas.includes(geral);
}
function modAtaqueArma(p, armaObj){
  if(!armaObj) return 0;
  const distancia = armaObj.categoria.endsWith('distancia');
  const acuidade = (armaObj.propriedades||[]).includes('acuidade');
  const modFor = modFinal(p,'forca'), modDes = modFinal(p,'destreza');
  const modBase = distancia ? modDes : (acuidade ? Math.max(modFor, modDes) : modFor);
  return modBase + (ehProficienteArma(p, armaObj) ? prof(p) : 0);
}
function modDanoArma(p, armaObj){
  if(!armaObj) return 0;
  const distancia = armaObj.categoria.endsWith('distancia');
  const acuidade = (armaObj.propriedades||[]).includes('acuidade');
  const modFor = modFinal(p,'forca'), modDes = modFinal(p,'destreza');
  return distancia ? modDes : (acuidade ? Math.max(modFor, modDes) : modFor);
}

// CA base sem armadura: 10 + Destreza. Com armadura, a categoria decide o
// teto de Destreza que entra na conta (leve: sem teto; média: até +2;
// pesada: não soma Destreza) — mesma regra do Apêndice de Equipamento.
function caBase(p){
  const arm = armadura(p.equipamento.armaduraId);
  const modDes = modFinal(p,'destreza');
  let base;
  if(!arm){ base = 10 + modDes; }
  else if(!arm.permiteDestreza){ base = arm.caBase; } // pesada: sem bônus de Destreza
  else if(arm.tetoDestreza != null){ base = arm.caBase + Math.min(arm.tetoDestreza, modDes); } // média: teto
  else { base = arm.caBase + modDes; } // leve: sem teto
  if(p.equipamento.escudo) base += 2;
  return base;
}
function ca(p){ return p.atual.caManual ?? caBase(p); }

function iniciativa(p){ return modFinal(p,'destreza'); }
function percepcaoPassiva(p){ return 10 + totalPericia(p, 'percepcao'); }

function ehSalvamentoProficiente(p, atributoId){
  const c = classe(p.perfil.classeId);
  return !!(c && c.salvamentosProficientes.includes(atributoId));
}
function totalSalvamento(p, atributoId){
  return modFinal(p, atributoId) + (ehSalvamentoProficiente(p, atributoId) ? prof(p) : 0);
}

// Perícias concedidas automaticamente pelo Antecedente entram sempre —
// o jogador só escolhe as da Classe, até o limite dela (periciasDisponiveis.escolha).
function periciasDoAntecedente(p){
  const a = antecedente(p.perfil.antecedente);
  return a ? a.periciasConcedidas : [];
}
function ehPericiaProficiente(p, periciaId){
  return p.periciasProficientes.includes(periciaId) || periciasDoAntecedente(p).some(nome => {
    const per = PERICIAS.find(x => x.nome === nome);
    return per && per.id === periciaId;
  });
}
function totalPericia(p, periciaId){
  const per = pericia(periciaId);
  if(!per) return 0;
  return modFinal(p, per.atributo) + (ehPericiaProficiente(p, periciaId) ? prof(p) : 0);
}
function limitePericiasClasse(p){
  const c = classe(p.perfil.classeId);
  return c ? c.periciasDisponiveis.escolha : 0;
}

function novoPersonagem(nome){
  return {
    id: uid(), criadoEm: Date.now(), atualizadoEm: Date.now(),
    perfil: {
      nome: nome || 'Novo Aventureiro',
      racaId: '', subracaId: '', classeId: '', antecedente: '',
      aparencia: '', historia: '',
    },
    nivel: 1,
    atributos: {forca:10, destreza:10, constituicao:10, inteligencia:10, sabedoria:10, carisma:10},
    periciasProficientes: [],
    // atual: overrides manuais (Recalcular apaga o override e volta pra
    // fórmula) e o que realmente muda durante o jogo (PV corrente, PV temp).
    atual: {pv: null, pvTemp: 0, pvMaximoManual: null, caManual: null},
    morte: {sucessos: 0, falhas: 0},
    equipamento: {
      armaduraId: '', escudo: false,
      armasEquipadas: [], // [{id, nome}] — nome referencia ARMAS ou é livre
      mochila: [], // [{id, nome, quantidade}]
      po: 0,
    },
    conjuracao: {
      atributo: '', // preenchido pela classe ao escolher
      truques: [], magiasPreparadas: [], // [{id, nome, nivel}]
      espacosGastos: {}, // {"1": 0, "2": 0, ...}
    },
    condicoesAtivas: [],
    inspiracao: false,
    notas: '',
  };
}

/* --- Armazenamento -----------------------------------------------------

   Presente na URL (?id=...), a ficha vive na conta do Hub em vez do
   navegador — mesmo mecanismo do Fabula Ultima, SAO, Kaizoku no Sho e
   Thrylikí Chelóna (decisão #40).
------------------------------------------------------------------------- */

const MODO_HUB = new URLSearchParams(location.search).get('id');
const CHAVE = 'dnd5e_fichas';
let falhouAoSalvar = false;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    return cru ? JSON.parse(cru) : [];
  }catch(e){ console.error('Não consegui ler as fichas salvas', e); return []; }
}

let debounceHub = null;
function salvarNoHub(){
  clearTimeout(debounceHub);
  debounceHub = setTimeout(async () => {
    const p = atual(); if(!p) return;
    // Resumo genérico pro Hub de Mestre ler sem saber a fórmula deste
    // sistema (decisão #46) — espelhado a cada salvamento.
    p.resumoVida = {atual: pvAtual(p), maxima: pvMaximo(p), rotulo: 'PV'};
    try{
      const resposta = await fetch(`/api/personagens/${MODO_HUB}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dados: p}),
      });
      if(!resposta.ok) throw new Error('resposta ' + resposta.status);
      if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
    }catch(e){
      console.error('Falha ao salvar no Hub', e);
      if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
    }
  }, 500);
}

function salvar(){
  if(MODO_HUB){ salvarNoHub(); return; }
  try{
    localStorage.setItem(CHAVE, JSON.stringify(estado.fichas));
    if(falhouAoSalvar){ falhouAoSalvar = false; render(); }
  }catch(e){
    console.error('Falha ao salvar', e);
    if(!falhouAoSalvar){ falhouAoSalvar = true; render(); }
  }
}

const estado = {
  fichas: MODO_HUB ? [] : carregar(),
  atualId: null,
  aba: 'status',
  carregandoHub: !!MODO_HUB,
  erroHub: null,
  ehDono: false,
  compartilhado: false,
};
if(!MODO_HUB && estado.fichas.length) estado.atualId = estado.fichas[0].id;

const atual = () => estado.fichas.find(f => f.id === estado.atualId) || null;

async function iniciarModoHub(){
  try{
    const resposta = await fetch(`/api/personagens/${MODO_HUB}`);
    if(!resposta.ok){ estado.erroHub = 'nao-encontrado'; return; }
    const {personagem} = await resposta.json();
    const dados = personagem.dados;
    const p = (dados && dados.perfil) ? dados : novoPersonagem();
    p.id = MODO_HUB;
    estado.fichas = [p];
    estado.atualId = p.id;
    estado.ehDono = !!personagem.ehDono;
    estado.compartilhado = !!personagem.compartilhado;
  }catch(e){
    console.error('Falha ao carregar do Hub', e);
    estado.erroHub = 'nao-encontrado';
  }finally{
    estado.carregandoHub = false;
    render();
  }
}

function alternarCompartilhado(valor){
  estado.compartilhado = valor;
  render();
  fetch(`/api/personagens/${MODO_HUB}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({compartilhado: valor}),
  }).catch(e => console.error('Falha ao mudar compartilhamento', e));
}

function mudar(mudanca){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  salvar(); render();
}

let debounce = null;
function mudarSemRedesenhar(mudanca, elemento){
  if(MODO_HUB && !estado.ehDono) return;
  const p = atual(); if(!p) return;
  mudanca(p);
  p.atualizadoEm = Date.now();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    salvar();
    if(elemento && elemento.dataset.perfil === 'nome') desenharBarra();
  }, 300);
}

/* --- Desenho da tela ---------------------------------------------------- */

const ABAS = [
  {id:'status',      nome:'Status'},
  {id:'pericias',    nome:'Perícias'},
  {id:'combate',     nome:'Combate'},
  {id:'conjuracao',  nome:'Conjuração'},
  {id:'equipamento', nome:'Equipamento'},
  {id:'notas',       nome:'Notas'},
];

let ultimaChaveTela = null;

function render(){
  desenharBarra();
  const app = document.getElementById('app');

  if(MODO_HUB && estado.carregandoHub){
    app.innerHTML = `<div class="vazio"><h2>Carregando…</h2></div>`;
    return;
  }
  if(MODO_HUB && estado.erroHub === 'nao-encontrado'){
    app.innerHTML = `<div class="vazio">
      <h2>Ficha não encontrada</h2>
      <p class="mini">Ela pode ter sido apagada, ou não é sua.
      <a href="/fichas" style="color:var(--ambar)">Voltar para Fichas</a></p></div>`;
    return;
  }

  const p = atual();
  if(!p){
    app.innerHTML = `<div class="vazio">
      <h2>Nenhum personagem ainda</h2>
      <p class="mini">Clique em "+ Novo" para criar a primeira ficha,
      ou importe um arquivo que você tenha exportado antes.</p></div>`;
    return;
  }

  const somenteLeitura = MODO_HUB && !estado.ehDono;
  const alerta = somenteLeitura
    ? `<div class="ok">Modo leitura — você está vendo a ficha de
       <strong>${esc(p.perfil.nome)}</strong>. Só quem é dono edita.</div>`
    : falhouAoSalvar
      ? (MODO_HUB
        ? `<div class="aviso"><strong>Não consegui salvar no Hub.</strong>
           Confira sua internet — se cair, exporte para não perder o que você
           preencheu.</div>`
        : `<div class="aviso"><strong>Não consegui salvar no navegador.</strong>
           Pode ser aba anônima ou armazenamento cheio. Exporte agora para não
           perder o que você preencheu.</div>`) : '';

  app.innerHTML = alerta
    + `<div class="abas">` + ABAS.map(a =>
        `<button data-aba="${a.id}" aria-current="${a.id===estado.aba}">${a.nome}</button>`
      ).join('') + `</div>`
    + painelDerivados(p)
    + ({status:abaStatus, pericias:abaPericias, combate:abaCombate, conjuracao:abaConjuracao, equipamento:abaEquipamento, notas:abaNotas}[estado.aba])(p);

  const chaveTela = `aba:${estado.aba}`;
  app.classList.remove('entra');
  if(chaveTela !== ultimaChaveTela){
    void app.offsetWidth;
    app.classList.add('entra');
  }
  ultimaChaveTela = chaveTela;

  ligarEventos();

  if(somenteLeitura){
    app.querySelectorAll('input, select, textarea, button:not([data-aba])')
      .forEach(el => el.disabled = true);
  }
}

function desenharBarra(){
  if(MODO_HUB){
    document.getElementById('seletor').hidden = true;
    document.getElementById('btNovo').hidden = true;
    document.getElementById('btExcluir').hidden = true;
    document.getElementById('linkFichas').hidden = false;

    const labelCompartilhar = document.getElementById('labelCompartilhar');
    labelCompartilhar.style.display = estado.ehDono ? 'flex' : 'none';
    document.getElementById('chkCompartilhar').checked = estado.compartilhado;
    document.getElementById('btImportar').hidden = !estado.ehDono;
    return;
  }
  const sel = document.getElementById('seletor');
  sel.innerHTML = estado.fichas.length
    ? estado.fichas.map(f =>
        `<option value="${f.id}" ${f.id===estado.atualId?'selected':''}>${esc(f.perfil.nome)}</option>`
      ).join('')
    : `<option>— sem personagens —</option>`;
}

function painelDerivados(p){
  const pv = pvAtual(p);
  const max = pvMaximo(p);
  const emRisco = pv <= Math.floor(max/2) && pv > 0;
  const morto = pv <= 0;
  return `<div class="grade g5" style="margin-bottom:14px">
    <div class="derivado ${emRisco||morto?'risco':''}">
      <div class="rot">Pontos de Vida</div>

function ligarEventos(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-aba]').forEach(b =>
    b.onclick = () => { estado.aba = b.dataset.aba; render(); });

  app.querySelectorAll('[data-perfil]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => { p.perfil[el.dataset.perfil] = el.value; }, el));

  app.querySelectorAll('[data-perfil-select]').forEach(el =>
    el.onchange = () => mudar(p => { p.perfil[el.dataset.perfilSelect] = el.value; }));

  const selRaca = app.querySelector('#c-raca');
  if(selRaca) selRaca.onchange = () => mudar(p => { p.perfil.racaId = selRaca.value; p.perfil.subracaId = ''; });
  const selSubraca = app.querySelector('#c-subraca');
  if(selSubraca) selSubraca.onchange = () => mudar(p => { p.perfil.subracaId = selSubraca.value; });
  const selClasse = app.querySelector('#c-classe');
  if(selClasse) selClasse.onchange = () => mudar(p => {
    p.perfil.classeId = selClasse.value;
    p.periciasProficientes = [];
    const c = classe(selClasse.value);
    if(c && c.conjuracao) p.conjuracao.atributo = c.conjuracao.atributo;
  });
  const selAntecedente = app.querySelector('#c-antecedente');
  if(selAntecedente) selAntecedente.onchange = () => mudar(p => { p.perfil.antecedente = selAntecedente.value; });

  app.querySelectorAll('[data-atributo]').forEach(el =>
    el.onchange = () => mudar(p => p.atributos[el.dataset.atributo] = Math.max(1, Math.min(30, Number(el.value) || 10))));

  const numNivel = app.querySelector('#c-nivel');
  if(numNivel) numNivel.onchange = () => mudar(p => p.nivel = Math.max(1, Math.min(20, Number(numNivel.value) || 1)));

  app.querySelectorAll('[data-pericia-check]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.periciaCheck;
      const jaTem = p.periciasProficientes.includes(id);
      if(jaTem){ p.periciasProficientes = p.periciasProficientes.filter(x => x !== id); }
      else if(p.periciasProficientes.length < limitePericiasClasse(p)){ p.periciasProficientes = [...p.periciasProficientes, id]; }
    }));

  const btPvRecalcular = app.querySelector('#btPvRecalcular');
  if(btPvRecalcular) btPvRecalcular.onclick = () => mudar(p => { p.atual.pvMaximoManual = null; p.atual.pv = pvMaximoSugerido(p); });
  const numPvMax = app.querySelector('#c-pv-max');
  if(numPvMax) numPvMax.onchange = () => mudar(p => p.atual.pvMaximoManual = Math.max(1, Number(numPvMax.value) || 1));
  const numPvAtual = app.querySelector('#c-pv-atual');
  if(numPvAtual) numPvAtual.onchange = () => mudar(p => p.atual.pv = Math.max(0, Math.min(pvMaximo(p), Number(numPvAtual.value) || 0)));
  const numPvTemp = app.querySelector('#c-pv-temp');
  if(numPvTemp) numPvTemp.onchange = () => mudar(p => p.atual.pvTemp = Math.max(0, Number(numPvTemp.value) || 0));

  const btCaRecalcular = app.querySelector('#btCaRecalcular');
  if(btCaRecalcular) btCaRecalcular.onclick = () => mudar(p => { p.atual.caManual = null; });
  const numCa = app.querySelector('#c-ca-manual');
  if(numCa) numCa.onchange = () => mudar(p => p.atual.caManual = Number(numCa.value) || null);

  const selArmadura = app.querySelector('#c-armadura');
  if(selArmadura) selArmadura.onchange = () => mudar(p => p.equipamento.armaduraId = selArmadura.value);
  const chkEscudo = app.querySelector('#c-escudo');
  if(chkEscudo) chkEscudo.onchange = () => mudar(p => p.equipamento.escudo = chkEscudo.checked);

  const btAddArma = app.querySelector('#btAddArma');
  if(btAddArma) btAddArma.onclick = () => mudar(p => p.equipamento.armasEquipadas.push({id: uid(), nome: ARMAS[0] ? ARMAS[0].nome : ''}));
  app.querySelectorAll('[data-arma-select]').forEach(el =>
    el.onchange = () => mudar(p => {
      const item = p.equipamento.armasEquipadas.find(a => a.id === el.dataset.armaSelect);
      if(item) item.nome = el.value;
    }));
  app.querySelectorAll('[data-arma-remover]').forEach(b =>
    b.onclick = () => mudar(p => { p.equipamento.armasEquipadas = p.equipamento.armasEquipadas.filter(a => a.id !== b.dataset.armaRemover); }));

  const btAddItem = app.querySelector('#btAddItem');
  if(btAddItem) btAddItem.onclick = () => mudar(p => p.equipamento.mochila.push({id: uid(), nome:'', quantidade:1}));
  app.querySelectorAll('[data-item-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [id, chave] = el.dataset.itemCampo.split('|');
      const item = p.equipamento.mochila.find(i => i.id === id);
      if(item) item[chave] = chave === 'quantidade' ? (Number(el.value)||0) : el.value;
    }, el));
  app.querySelectorAll('[data-item-remover]').forEach(b =>
    b.onclick = () => mudar(p => { p.equipamento.mochila = p.equipamento.mochila.filter(i => i.id !== b.dataset.itemRemover); }));

  const numPo = app.querySelector('#c-po');
  if(numPo) numPo.onchange = () => mudar(p => p.equipamento.po = Math.max(0, Number(numPo.value) || 0));

  const btAddMagia = app.querySelector('#btAddMagia');
  if(btAddMagia) btAddMagia.onclick = () => mudar(p => p.conjuracao.magiasPreparadas.push({id: uid(), nome:'', nivel:1}));
  app.querySelectorAll('[data-magia-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      const [id, chave] = el.dataset.magiaCampo.split('|');
      const m = p.conjuracao.magiasPreparadas.find(x => x.id === id);
      if(m) m[chave] = chave === 'nivel' ? (Number(el.value)||0) : el.value;
    }, el));
  app.querySelectorAll('[data-magia-remover]').forEach(b =>
    b.onclick = () => mudar(p => { p.conjuracao.magiasPreparadas = p.conjuracao.magiasPreparadas.filter(m => m.id !== b.dataset.magiaRemover); }));
  app.querySelectorAll('[data-truque-campo]').forEach(el =>
    el.oninput = () => mudarSemRedesenhar(p => {
      p.conjuracao.truques[Number(el.dataset.truqueCampo)] = el.value;
    }, el));
  const btAddTruque = app.querySelector('#btAddTruque');
  if(btAddTruque) btAddTruque.onclick = () => mudar(p => p.conjuracao.truques.push(''));
  app.querySelectorAll('[data-espaco]').forEach(el =>
    el.onchange = () => mudar(p => { p.conjuracao.espacosGastos[el.dataset.espaco] = Math.max(0, Number(el.value)||0); }));

  app.querySelectorAll('[data-condicao]').forEach(el =>
    el.onchange = () => mudar(p => {
      const id = el.dataset.condicao;
      p.condicoesAtivas = el.checked ? [...p.condicoesAtivas, id] : p.condicoesAtivas.filter(c => c !== id);
    }));

  const chkInspiracao = app.querySelector('#c-inspiracao');
  if(chkInspiracao) chkInspiracao.onchange = () => mudar(p => p.inspiracao = chkInspiracao.checked);

  app.querySelectorAll('[data-morte]').forEach(el =>
    el.onchange = () => mudar(p => { p.morte[el.dataset.morte] = Math.max(0, Math.min(3, Number(el.value)||0)); }));

  const taNotas = app.querySelector('#c-notas');
  if(taNotas) taNotas.oninput = () => mudarSemRedesenhar(p => p.notas = taNotas.value, taNotas);
}

/* --- Barra: novo / seletor / exportar / importar / excluir -------------- */

document.getElementById('seletor').onchange = e => { estado.atualId = e.target.value; estado.aba = 'status'; render(); };
document.getElementById('btNovo').onclick = () => {
  const p = novoPersonagem();
  estado.fichas.push(p);
  estado.atualId = p.id;
  estado.aba = 'status';
  salvar(); render();
};
document.getElementById('btExcluir').onclick = () => {
  const p = atual(); if(!p) return;
  if(!confirm(`Excluir "${p.perfil.nome}"? Não tem como desfazer.`)) return;
  estado.fichas = estado.fichas.filter(f => f.id !== p.id);
  estado.atualId = estado.fichas[0]?.id || null;
  salvar(); render();
};
document.getElementById('btExportar').onclick = () => {
  const p = atual(); if(!p) return;
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(p.perfil.nome||'personagem').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('btImportar').onclick = () => document.getElementById('arquivo').click();
document.getElementById('arquivo').onchange = e => {
  const arq = e.target.files[0]; if(!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const lido = JSON.parse(leitor.result);
      if(MODO_HUB){
        lido.id = MODO_HUB;
        estado.fichas = [lido];
        estado.atualId = MODO_HUB;
      }else{
        lido.id = uid();
        estado.fichas.push(lido);
        estado.atualId = lido.id;
      }
      salvar(); render();
    }catch(err){ alert('Arquivo inválido.'); console.error(err); }
  };
  leitor.readAsText(arq);
  e.target.value = '';
};
document.getElementById('chkCompartilhar').onchange = e => alternarCompartilhado(e.target.checked);

render();
if(MODO_HUB) iniciarModoHub();
</script>
</body>
</html>
